&lt;h1&gt;Polynomial Function (Complete) &amp;mdash; Must-Remember Rules&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;Part A (pp. 1&amp;ndash;16) followed by Part B: Part 1 (pp. 110&amp;ndash;136) &amp;middot; 74 items &amp;middot; page numbers are the notebook&#x27;s own&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;button onclick=&quot;window.print()&quot;&gt;Print / Save as PDF&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;part&quot;&gt;Part A: Polynomial Function &lt;span&gt;&amp;mdash; quadratics, location of roots, graph methods (notebook pp. 1&amp;ndash;16)&lt;/span&gt;&lt;/div&gt;
&lt;section&gt;&lt;h2&gt;1. Condition for linear factors &lt;span class=&quot;pg&quot;&gt;pp. 1-3&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{ax^2+2hxy+by^2+2gx+2fy+c\ \text{resolves into two linear factors iff}}\quad abc+2fgh-af^2-bg^2-ch^2=0\quad(\text{cloud; valid for all cases, even }a=0,\ b=0)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Method: as a quadratic in }x,\ x=\tfrac{-(hy+g)\pm\sqrt{(h^2-ab)y^2+(2gh-2af)y+g^2-ac}}{a};\ \text{for a linear equation this must be a perfect square, i.e. its }D=0\Rightarrow a\,\Delta=0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Real straight lines need }h^2-ab\ge0\ (\text{imaginary lines cannot be drawn in a plane});\ \ \text{the product of two linear equations represents two straight lines}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{To factorise: solve as a quadratic in one variable; e.g. }2x^2+3xy+y^2+2y+3x+1:\ y=\tfrac{-(3x+2)\pm x}{2}\Rightarrow(x+y+1)(2x+y+1)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;2. Real values: “for every real x there is a real y” &lt;span class=&quot;pg&quot;&gt;pp. 2-4&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Read the equation as a quadratic in }y\ (\text{with }x\in\mathbb R)\text{ and need }D\ge0\text{ for all }x;\ \ \text{e.g. }D=(x+17)^2\ge0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Range of }y\text{: make a quadratic in }x\text{ and use }D\ge0;\ \ x^2+16y^2-3x+2=0\Rightarrow-\tfrac18\le y\le\tfrac18,\ \ 1\le x\le2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Sum of two non-negative terms }=\tfrac14\text{ (e.g. }(x-\tfrac32)^2+16y^2=\tfrac14)\Rightarrow\text{each term}\le\tfrac14\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;3. Location of roots of f(x)=ax²+bx+c &lt;span class=&quot;pg&quot;&gt;pp. 4-7&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Both roots}&gt;k:\ \ D\ge0,\ \ -\tfrac b{2a}&gt;k,\ \ af(k)&gt;0\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Both roots}\le k:\ \ D\ge0,\ \ -\tfrac b{2a}\le k,\ \ af(k)\ge0\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Roots on either side of }k:\ \ af(k)&lt;0\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;11&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{One root}&gt;k_2\text{ and the other}&lt;k_1\ (k_2&gt;k_1):\ \ af(k_1)&lt;0,\ \ af(k_2)&lt;0\quad(\text{cloud});\ \ D&gt;0\text{ is not a necessary condition}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;12&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Exactly one root in }(k_1,k_2):\ \ f(k_1)f(k_2)&lt;0;\ \ \text{check }f(k_1)f(k_2)=0\text{ separately}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;13&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Both roots in }(k_1,k_2):\ \ D&gt;0\ (\text{or}\ \ge0),\ f(k_1)&gt;0,\ f(k_2)&gt;0\ (a&gt;0),\ k_1&lt;-\tfrac b{2a}&lt;k_2\ \ (\text{e.g. roots in }(-6,1))\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;14&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f(x)=k\text{ on a cubic with local max }2\text{ and local min }1:\ 3\text{ distinct roots }k\in(1,2);\ 2\text{ distinct }k\in\{1,2\};\ 1\text{ root }k\in(-\infty,1)\cup(2,\infty)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;4. Roots with a sign condition, “for all” and “at least one” &lt;span class=&quot;pg&quot;&gt;pp. 9-13&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;15&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{At least one positive root: }f(0)&lt;0\ \cup\ \{f(0)\ge0,\ -\tfrac b{2a}&gt;0,\ D\ge0\}\ (\text{all cases covered});\ \ \text{e.g. }a\in(-\infty,-1]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;16&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Graph method: }\text{isolate the parameter, }a=g(x)\text{ (e.g. }-a=\tfrac{x^2-2x+5}{2x+1}),\ \text{find the range of }g\text{ on the required domain using }g&#x27;(x)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;17&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle m&gt;g(x)\ \forall x\in D\ \Rightarrow\ m&gt;\max g;\qquad m&gt;g(x)\text{ for at least one }x\in D\ \Rightarrow\ m&gt;\inf g\ (\text{open if not attained})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;18&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle mx^2-4x+3m+1&gt;0\ \forall x&gt;0\Rightarrow m\in(1,\infty);\ \ \text{for at least one }x&gt;0\Rightarrow m\in(-\tfrac13,\infty)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;19&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Exponential in disguise: }4^x-a\,2^x-a+3\le0\text{ at least one }x\ \to\ t=2^x&gt;0,\ f(t)\le0\text{ for some }t&gt;0;\ \text{draw the graph for }t&gt;0\text{ only}\quad(\text{tip})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;20&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Take the union of all admissible graphs/cases (e.g. cases (a) and (b) on p. 13)}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;5. Repeated roots &lt;span class=&quot;pg&quot;&gt;p. 10&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;21&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f(x)=(x-\alpha)^2g(x)\ \Rightarrow\ f(\alpha)=0=f&#x27;(\alpha);\ \ f(x)=(x-\alpha)^3g(x)\Rightarrow f(\alpha)=f&#x27;(\alpha)=f&#x27;&#x27;(\alpha)=0\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;22&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f(x)=(x-\alpha)^n g(x)\Rightarrow f(\alpha)=f&#x27;(\alpha)=\cdots=f^{(n-1)}(\alpha)=0;\ \ \text{the converse is true}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;6. Integral and rational roots; symmetric functions &lt;span class=&quot;pg&quot;&gt;pp. 14-16&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;23&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Integral roots: }D\text{ must be a perfect square of an integer; use }D=k^2\Rightarrow(k-p)(k+p)=\text{constant}\text{ (factor pairs)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;24&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Three methods for integral roots: }D=k^2;\ \ \text{isolate }a=x-\tfrac1{x-1}\text{ and need }x-1=\pm1;\ \ \alpha+\beta,\ \alpha\beta\text{ integers}\Rightarrow(\alpha-1)(\beta-1)=-1\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;25&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Rational root }\tfrac pq\ (q\ne0):\ ap^2+bpq+cq^2=0;\ \ a,b,c\text{ odd}\Rightarrow\text{no rational roots (consider parity of }p,q)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;26&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Odd }a,b,c:\ D=b^2-4ac=\text{odd}-\text{even}=\text{odd};\ \ \text{if }D\text{ were }(2m+1)^2\text{ the product }(m_2-m_4)(m_2+m_4+1)\text{ is even}=\text{odd, contradiction}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;27&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Symmetric function of the roots: }f(\alpha,\beta)=f(\beta,\alpha)\quad(\text{e.g. }\alpha+\beta,\ \alpha\beta,\ \alpha^2+\beta^2)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;28&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{If }\alpha&lt;-n,\ \beta&gt;n:\ f(n)&lt;0\text{ and }f(-n)&lt;0\ \Rightarrow\ 1+\tfrac c{an^2}+\tfrac1n\left|\tfrac ba\right|&lt;0\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;div class=&quot;part&quot;&gt;Part B: Polynomial Function (Part 1) &lt;span&gt;&amp;mdash; basics, Vieta, complex numbers, common roots, ranges (notebook pp. 110&amp;ndash;136)&lt;/span&gt;&lt;/div&gt;
&lt;section&gt;&lt;h2&gt;1. Polynomial basics &lt;span class=&quot;pg&quot;&gt;pp. 110-111&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;29&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f(x)=a_nx^n+a_{n-1}x^{n-1}+\cdots+a_1x+a_0,\ \ a_i\in\mathbb R,\ \ a_n\ne0\ \text{(polynomial of degree }n;\ x\text{ has only whole-number powers)}\quad(\text{circled})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;30&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a_n=\text{leading coefficient};\ a_0=\text{constant/absolute term};\ \text{monic: }a_n=1;\ \text{degree }0\text{ constant},\ 1\text{ linear},\ 2\text{ quadratic},\ 3\text{ cubic},\ 4\text{ biquadratic}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;31&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle n!=1\cdot2\cdot3\cdots n=n\,(n-1)!,\ n\in\mathbb N;\qquad0!=1\quad(\text{circled})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;32&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a_0=f(0),\ \ a_1=f&#x27;(0),\ \ a_2=\tfrac{f&#x27;&#x27;(0)}{2},\ \ a_3=\tfrac{f&#x27;&#x27;&#x27;(0)}{6}\ \ \Rightarrow\ \ \text{coefficient of }x^r:\ a_r=\dfrac{f^{(r)}(0)}{r!}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;2. Quadratic function and its graph &lt;span class=&quot;pg&quot;&gt;pp. 111-112&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;33&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle y=ax^2+bx+c=a\left(x+\tfrac b{2a}\right)^2-\tfrac D{4a},\ \ D=b^2-4ac\ (\text{discriminant})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;34&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Vertex }\left(-\tfrac b{2a},-\tfrac D{4a}\right);\ \ a&gt;0\text{ upward (U)},\ \ a&lt;0\text{ downward}\ (\cap);\ \ \text{shift of origin gives }Y=aX^2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;35&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Axis of the parabola }x=-\tfrac b{2a};\quad f\!\left(-\tfrac b{2a}+x\right)=f\!\left(-\tfrac b{2a}-x\right)\quad(\text{circled})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;36&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Example }f(x)=3-4x-7x^2:\ \text{vertex }\left(-\tfrac27,\tfrac{25}7\right),\ \text{roots }-1,\tfrac37,\ R_f=\left(-\infty,\tfrac{25}7\right],\ D_f=\mathbb R\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;3. Roots and Vieta’s theorem &lt;span class=&quot;pg&quot;&gt;pp. 113-115&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;37&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Zeros of }f:\ \text{values of }x\text{ with }f(x)=0\ (\text{graph cuts the }x\text{-axis});\quad x=\dfrac{-b\pm\sqrt D}{2a}\quad(\text{circled})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;38&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \alpha+\beta=-\tfrac ba,\qquad\alpha\beta=\tfrac ca,\qquad|\alpha-\beta|=\tfrac{\sqrt D}{|a|}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;39&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (x-\alpha),(x-\beta)\text{ are factors (only for polynomials)};\ \ ax^2+bx+c=a(x-\alpha)(x-\beta)\ \text{— identity}\quad(\text{circled})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;40&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{A degree-}n\text{ polynomial has }n\text{ roots (real or imaginary)};\ \ f(x)=a_n(x-\alpha_1)(x-\alpha_2)\cdots(x-\alpha_n)\ \text{— identity}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;41&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Vieta: }\sum\alpha_i=-\tfrac{a_{n-1}}{a_n},\ \ \sum\alpha_i\alpha_j=\tfrac{a_{n-2}}{a_n},\ \ \sum\alpha_i\alpha_j\alpha_k=-\tfrac{a_{n-3}}{a_n},\ \ \prod\alpha_i=(-1)^n\tfrac{a_0}{a_n}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;42&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle ax^3+bx^2+cx+d=0:\ \ \sum\alpha=-\tfrac ba,\ \ \sum\alpha\beta=\tfrac ca,\ \ \alpha\beta\gamma=-\tfrac da;\qquad\text{roots of }f(x)=g(x)\text{ are the points where the graphs meet}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;4. Nature of roots and conjugate pairs &lt;span class=&quot;pg&quot;&gt;pp. 115, 118-119&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;43&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle D&lt;0:\ \text{roots imaginary};\ \ D=0:\ \text{equal, real};\ \ D&gt;0:\ \text{two unequal real roots}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;44&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a,b,c\in\mathbb Q:\ \text{rational roots iff }D\text{ is a perfect square of a rational number}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;45&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Irrational roots (rational coefficients) come as a conjugate pair }a\pm\sqrt b;\ \ \text{imaginary roots (real coefficients, any degree) come as }a\pm ib\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;46&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle D&lt;0:\ \alpha,\beta=\dfrac{-b\pm i\sqrt{-D}}{2a};\quad\text{e.g. }x^2+2x+2=0\Rightarrow x=-1\pm i\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;5. Complex numbers: basics &lt;span class=&quot;pg&quot;&gt;pp. 116-117&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;47&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle z=a+ib,\ a,b\in\mathbb R,\ i=\sqrt{-1}\ (\text{iota}),\ i^2=-1;\ \ a=\operatorname{Re}(z),\ b=\operatorname{Im}(z);\ \ \text{all numbers (real, imaginary) are complex}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Purely real: }b=0;\ \ \text{purely imaginary: }a=0;\ \ \text{imaginary: }b\ne0;\ \ 0\text{ is purely real and purely imaginary but not imaginary};\ \text{all non-zero purely imaginary numbers are imaginary}\quad(\text{clouds})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;49&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (x_1+iy_1)+(x_2+iy_2)=(x_1+x_2)+i(y_1+y_2);\ \ (x_1+iy_1)(x_2+iy_2)=(x_1x_2-y_1y_2)+i(y_1x_2+x_1y_2)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;50&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Conjugate: }z=a+ib,\ \bar z=a-ib;\quad\dfrac{x_1+iy_1}{x_2+iy_2}=\dfrac{(x_1+iy_1)(x_2-iy_2)}{x_2^2+y_2^2}\ \ (\text{multiply by the conjugate of the denominator})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;51&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sqrt{ab}=\sqrt a\sqrt b\ \text{ if at least one of }a,b\text{ is non-negative};\ \ \sqrt{-4}=\sqrt{-1}\sqrt4=2i;\ \ \sqrt{(-1)^2}\ne\sqrt{-1}\sqrt{-1}\quad(\text{Remember})\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;6. Sign of a quadratic &lt;span class=&quot;pg&quot;&gt;pp. 118-120&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;52&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f(x)&gt;0\ \forall x\Rightarrow a&gt;0,D&lt;0;\quad f(x)\ge0\ \forall x\Rightarrow a&gt;0,D\le0;\quad f(x)&lt;0\ \forall x\Rightarrow a&lt;0,D&lt;0;\quad f(x)\le0\ \forall x\Rightarrow a&lt;0,D\le0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;53&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{For }a&lt;0\text{ with roots }\alpha&lt;0&lt;\beta,\ |\beta|&gt;|\alpha|:\ b&gt;0,\ c&gt;0\ (\text{from }-\tfrac b{2a}&gt;0\text{ or }f&#x27;(0)&gt;0),\ \alpha+\beta&gt;0,\ \alpha\beta&lt;0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;54&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{No real roots }\Rightarrow\ c(a+b+c)&gt;0,\ \ a(a-b+c)&gt;0,\ \ a(a+2b+4c)&gt;0,\ \ (a+c)^2&gt;b^2\quad(\text{i.e. }f(0)f(1)&gt;0,\ af(-1)&gt;0,\ af(\tfrac12)&gt;0,\ f(1)f(-1)&gt;0)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;7. Identities and more roots than the degree &lt;span class=&quot;pg&quot;&gt;pp. 122-123&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;55&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle ax^2+bx+c=0\text{ has more than 2 roots}\Rightarrow a=b=c=0\ (\text{possible only when it is an identity})\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;56&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a_nx^n+\cdots+a_0=0\text{ has more than }n\text{ roots}\Rightarrow a_n=a_{n-1}=\cdots=a_1=a_0=0\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;57&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{An identity of degree 2 satisfied by }x=a,b,c\ (\text{3 values})\text{ holds for all }x\in\mathbb R\ \ (\text{e.g. Lagrange-type equations})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;58&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f(x)=ax^2+bx+c&gt;0\ \forall x\Rightarrow g=f+f&#x27;+f&#x27;&#x27;&gt;0\ \forall x\ \ (D_g=(b^2-4ac)-4a^2&lt;0)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;8. Common roots &lt;span class=&quot;pg&quot;&gt;pp. 124-126&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;59&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{One common root: }(c_1a_2-c_2a_1)^2=(b_1c_2-b_2c_1)(a_1b_2-a_2b_1)\ \ \left(\tfrac{b_1c_2-b_2c_1}{c_1a_2-c_2a_1}=\tfrac{c_1a_2-c_2a_1}{a_1b_2-a_2b_1}\right)\quad(\text{cloud; by cross-multiplication})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;60&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Both roots common: }\dfrac{a_1}{a_2}=\dfrac{b_1}{b_2}=\dfrac{c_1}{c_2}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;61&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Real-coefficient quadratics sharing an imaginary root share both (conjugate pair), so they are identical}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;62&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Two quadratics that are both factors of a cubic have a common root (a cubic has only 3 roots)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;63&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle x^2+bx+c=0\text{ and }x^2+cx+b=0\ (b\ne c):\ \text{common root }x=1,\ b+c=-1;\ \text{the common roots satisfy }x^2+x+bc=0\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;9. Range of a rational function &lt;span class=&quot;pg&quot;&gt;pp. 127-133&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;64&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Method 1: }y=\tfrac{f(x)}{g(x)}\Rightarrow\text{quadratic in }x\text{ with coefficient }(y-1)x^2+\cdots;\ \text{need }D\ge0\ (x\in\mathbb R);\ \text{test the excluded }y\text{ (e.g. }y=1)\text{ separately}\quad(\text{best method})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;65&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Method 2: }\tfrac{x^2-3x+4}{x^2+3x+4}=1-\tfrac{6x}{x^2+3x+4}\text{ and bound }x+\tfrac4x;\ \ \textbf{Method 3: }\text{use }f&#x27;(x),\ \text{limits at }\pm\infty\text{ and the graph}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;66&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Example ranges: }\tfrac{x^2-3x+4}{x^2+3x+4}\in\left[\tfrac17,7\right];\ \ \tfrac{x^2+2x-11}{2(x-3)}\in(-\infty,2]\cup[6,\infty);\ \ \tfrac{(x+1)(x-2)}{x(x+3)}\in\mathbb R\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;67&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Any value of }y\text{ is attained by at most 2 values of }x\text{ for a quadratic over quadratic}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;68&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Range given, find the parameter: }D\ge0\ \forall y\in\mathbb R\ (\text{no need for the }y\ne\tfrac a5\text{ case});\ \text{reject values giving a common factor in numerator and denominator (e.g. }a=2,-12)\Rightarrow a\in(-12,2)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;10. Symmetric functions of the roots of a cubic &lt;span class=&quot;pg&quot;&gt;pp. 134-136&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;69&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle x^3-px^2+qx-r=0:\ \ \sum\alpha=p,\ \ \sum\alpha\beta=q,\ \ \alpha\beta\gamma=r;\qquad\sum\alpha^2=p^2-2q\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;70&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sum\alpha^3=(\sum\alpha)\left(\sum\alpha^2-\sum\alpha\beta\right)+3\alpha\beta\gamma=p^3-3pq+3r\quad(\text{or via }\alpha^3=p\alpha^2-q\alpha+r)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;71&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \prod(\alpha-2)=-f(2)=-(8-4p+2q-r);\quad\prod(\alpha+2)=-f(-2)=8+4p+2q+r;\quad f(x)=(x-\alpha)(x-\beta)(x-\gamma)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;72&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f=f_1f_2\cdots f_n\ \Rightarrow\ \dfrac{f&#x27;}{f}=\dfrac{f_1&#x27;}{f_1}+\dfrac{f_2&#x27;}{f_2}+\cdots+\dfrac{f_n&#x27;}{f_n}\ ;\ \ \text{so }\dfrac{f&#x27;(x)}{f(x)}=\sum\dfrac1{x-\alpha}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;73&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sum\dfrac1{\alpha+1}=\dfrac{3+2p+q}{1+p+q+r}\ \ (\text{put }x=-1);\quad\text{equation with roots }\tfrac1{\alpha+1}:\ \text{put }y=\tfrac1{x+1},\ x=\tfrac{1-y}y\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;74&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sum\dfrac{\alpha^2+4\alpha+7}{\alpha^2-3\alpha+2}=3+19\sum\dfrac1{\alpha-2}-12\sum\dfrac1{\alpha-1}\ \ (\text{split into partial fractions, then use }f&#x27;/f)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;div class=&quot;notes&quot;&gt;&lt;b&gt;Things in the handwritten notes that I read differently (please check against the originals):&lt;/b&gt;&lt;p style=&quot;margin:8px 0 2px&quot;&gt;&lt;b&gt;Part A&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;p. 2, Q1: the last line shows y = (−x−1)(−2x−1); the two values are y = −x−1 and y = −2x−1, so the factors are (x+y+1)(2x+y+1).&lt;/li&gt;&lt;li&gt;p. 2, Q2: “for real roots D &amp;gt; 0” should be D ≥ 0 (D = (x+17)² can be 0).&lt;/li&gt;&lt;li&gt;p. 7, Q1: the first line of f(3) has −(a−1)3; it should be +3(a−1). The final 10a² + 12a + 6 is correct.&lt;/li&gt;&lt;li&gt;p. 7, Q2: f(−6) = 81 − 12k (not 69 − 12k) and f(1) = 2k + 4 (not 2k + 7). The final answer k ∈ (6, 27/4) is right (27/4 = 81/12).&lt;/li&gt;&lt;li&gt;p. 11: “(3m − 4)(m − 1) &amp;gt; 0” should be (3m + 4)(m − 1) &amp;gt; 0, with roots −4/3 and 1 (as in the answer shown).&lt;/li&gt;&lt;li&gt;p. 13, Q3 is left unfinished. Using a ≥ (t²+3)/(t+1), t &amp;gt; 0, the least value is 2 at t = 1, so a ∈ [2, ∞); I used this.&lt;/li&gt;&lt;li&gt;p. 15, M-1: the factor-pair line shows a = 0 and a = 1; only a = 1 gives integral roots (M-2 and M-3 also give a = 1).&lt;/li&gt;&lt;/ul&gt;&lt;p style=&quot;margin:8px 0 2px&quot;&gt;&lt;b&gt;Part B (Part 1)&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;p. 125, Q1: x = −2 gives k = 7/4. The other root x = 1/2 also gives a common root, with k = −11/8; I used both values.&lt;/li&gt;&lt;li&gt;p. 125, Q2: I read the answer as a = −4, b = 5 (imaginary roots are conjugates, so the two equations are identical).&lt;/li&gt;&lt;li&gt;p. 128: the last line shows the range [1/7, 6]; it should be [1/7, 7] (1 − (−6) = 7), as the other methods on pp. 127 and 129 give.&lt;/li&gt;&lt;li&gt;p. 135-136: f′(x)/f(x) is written 1/(x+α) + 1/(x+β) + 1/(x+γ); for f(x) = x³ − px² + qx − r it should be 1/(x−α) + 1/(x−β) + 1/(x−γ). The value Σ1/(α+1) = (3+2p+q)/(1+p+q+r) you wrote is correct.&lt;/li&gt;&lt;li&gt;p. 136, last line: Σ1/(α−2) = −f′(2)/f(2), so the result should be 3 − 19·f′(2)/f(2) + 12·f′(1)/f(1) (the signs of the two terms are different in the note).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>

  const rows = secs.map(s=&gt;{ const ids=Qs.map((q,i)=&gt;q.sec===s?i:-1).filter(i=&gt;i&gt;=0); const a=ids.filter(answered).length, mk=ids.filter(i=&gt;R[i].mark).length; return `&lt;tr&gt;&lt;td&gt;${s}&lt;/td&gt;&lt;td&gt;${ids.length}&lt;/td&gt;&lt;td&gt;${a}&lt;/td&gt;&lt;td&gt;${ids.length-a}&lt;/td&gt;&lt;td&gt;${mk}&lt;/td&gt;&lt;/tr&gt;`; }).join(&#x27;&#x27;);
  const d=document.createElement(&#x27;div&#x27;); d.className=&#x27;modal&#x27;; d.innerHTML=`&lt;div class=&quot;box&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Submit test?&lt;/h3&gt;
  &lt;table class=&quot;sm&quot;&gt;&lt;tr&gt;&lt;th&gt;Section&lt;/th&gt;&lt;th&gt;Questions&lt;/th&gt;&lt;th&gt;Answered&lt;/th&gt;&lt;th&gt;Not answered&lt;/th&gt;&lt;th&gt;Marked&lt;/th&gt;&lt;/tr&gt;${rows}&lt;/table&gt;
  &lt;p style=&quot;font-size:14px&quot;&gt;Time left: &lt;b&gt;${fmt(left)}&lt;/b&gt;. You cannot change answers after submitting.&lt;/p&gt;
  &lt;div style=&quot;display:flex;gap:10px;justify-content:flex-end&quot;&gt;&lt;button class=&quot;b&quot; id=&quot;no&quot;&gt;Go back&lt;/button&gt;&lt;button class=&quot;b g&quot; id=&quot;yes&quot;&gt;Yes, submit&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
  document.body.appendChild(d); $(&#x27;#no&#x27;).onclick=()=&gt;d.remove(); $(&#x27;#yes&#x27;).onclick=()=&gt;{ d.remove(); submit(false); };
}
function correct(i){ const q=Qs[i],r=R[i]; if(!answered(i)) return null; if(q.kind===&#x27;mcq&#x27;) return r.sel===q.ans; const v=parseFloat(r.num); return isFinite(v) &amp;&amp; Math.abs(v-q.ans) &lt;= 0.01; }
function submit(auto){
  window.__active=false;
  clearInterval(tick); R[cur].t += (Date.now()-qStart)/1000;
  const used = total-left;
  const per = {}; let score=0, max=0, cor=0, wr=0, sk=0;
  Qs.forEach((q,i)=&gt;{ const S=SEC[q.sec]; per[q.sec]=per[q.sec]||{n:0,c:0,w:0,s:0,sc:0,mx:0,t:0}; const p=per[q.sec]; p.n++; p.mx+=S.pos; max+=S.pos; p.t+=R[i].t;
    const c=correct(i); if(c===null){p.s++;sk++;} else if(c){p.c++;cor++;p.sc+=S.pos;score+=S.pos;} else {p.w++;wr++;p.sc-=S.neg;score-=S.neg;} });
  const attempted=cor+wr;
  const weak = {}; Qs.forEach((q,i)=&gt;{ if(correct(i)!==true){ (weak[q.tag]=weak[q.tag]||[]).push(i+1); } });
  let h = `&lt;header&gt;&lt;h1&gt;Result &amp;middot; Polynomial Function (Complete) Recall Test${name?&#x27; &amp;middot; &#x27;+name:&#x27;&#x27;}&lt;/h1&gt;&lt;div class=&quot;noprint&quot;&gt;&lt;button class=&quot;b&quot; onclick=&quot;window.print()&quot;&gt;Print / Save PDF&lt;/button&gt; &lt;button class=&quot;b&quot; onclick=&quot;location.reload()&quot;&gt;Take again&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;res&quot;&gt;`;
  h += `&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Score&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${score} / ${max}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Accuracy&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${attempted?Math.round(100*cor/attempted):0}%&lt;/div&gt;&lt;div style=&quot;font-size:12px&quot;&gt;${cor} correct of ${attempted} attempted&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Correct / Wrong / Skipped&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;&lt;span style=&quot;color:var(--green)&quot;&gt;${cor}&lt;/span&gt; / &lt;span style=&quot;color:var(--red)&quot;&gt;${wr}&lt;/span&gt; / &lt;span style=&quot;color:var(--amber)&quot;&gt;${sk}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Time used&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${fmt(used)}&lt;/div&gt;${auto?&#x27;&lt;div style=&quot;font-size:12px&quot;&gt;auto-submitted&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;`;
  h += `&lt;table class=&quot;sm&quot;&gt;&lt;tr&gt;&lt;th&gt;Section&lt;/th&gt;&lt;th&gt;Questions&lt;/th&gt;&lt;th&gt;Correct&lt;/th&gt;&lt;th&gt;Wrong&lt;/th&gt;&lt;th&gt;Skipped&lt;/th&gt;&lt;th&gt;Marks&lt;/th&gt;&lt;th&gt;Avg time / Q&lt;/th&gt;&lt;/tr&gt;${Object.keys(per).map(s=&gt;{const p=per[s];return `&lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;${s}. ${SEC[s].name}&lt;/td&gt;&lt;td&gt;${p.n}&lt;/td&gt;&lt;td&gt;${p.c}&lt;/td&gt;&lt;td&gt;${p.w}&lt;/td&gt;&lt;td&gt;${p.s}&lt;/td&gt;&lt;td&gt;${p.sc} / ${p.mx}&lt;/td&gt;&lt;td&gt;${Math.round(p.t/p.n)} s&lt;/td&gt;&lt;/tr&gt;`}).join(&#x27;&#x27;)}&lt;/table&gt;`;
  const wk=Object.keys(weak);
  h += `&lt;h3&gt;Formulas / topics to revise&lt;/h3&gt;` + (wk.length ? `&lt;div&gt;${wk.map(t=&gt;`&lt;span class=&quot;tagpill&quot;&gt;${t} &lt;small&gt;(Q ${weak[t].join(&#x27;, &#x27;)})&lt;/small&gt;&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;` : `&lt;p&gt;Nothing &amp;mdash; every question was correct. Excellent recall!&lt;/p&gt;`);
  h += `&lt;h3&gt;Question-wise review&lt;/h3&gt;&lt;div class=&quot;filters&quot;&gt;&lt;span class=&quot;chip on&quot; data-f=&quot;all&quot;&gt;All&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;bad&quot;&gt;Wrong&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;skip&quot;&gt;Skipped&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;ok&quot;&gt;Correct&lt;/span&gt;&lt;/div&gt;&lt;div id=&quot;rl&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
  $(&#x27;#app&#x27;).innerHTML=h;
  const paint = f =&gt; {
    $(&#x27;#rl&#x27;).innerHTML = Qs.map((q,i)=&gt;{ const c=correct(i); const cls=c===null?&#x27;skip&#x27;:c?&#x27;ok&#x27;:&#x27;bad&#x27;; if(f!==&#x27;all&#x27;&amp;&amp;f!==cls) return &#x27;&#x27;;
      const yours = c===null?&#x27;&lt;i&gt;not answered&lt;/i&gt;&#x27; : q.kind===&#x27;mcq&#x27; ? `${&#x27;ABCD&#x27;[R[i].sel]}. ${M(q.opts[R[i].sel])}` : R[i].num;
      const right = q.kind===&#x27;mcq&#x27; ? `${&#x27;ABCD&#x27;[q.ans]}. ${M(q.opts[q.ans])}` : q.ans;
      return `&lt;div class=&quot;rq ${cls}&quot;&gt;&lt;div class=&quot;meta&quot;&gt;Q${i+1} &amp;middot; Section ${q.sec} &amp;middot; ${q.tag} &amp;middot; time ${Math.round(R[i].t)} s &amp;middot; ${c===null?&#x27;Skipped&#x27;:c?&#x27;Correct&#x27;:&#x27;Wrong&#x27;}&lt;/div&gt;&lt;div class=&quot;stem&quot; style=&quot;font-size:17px;margin-bottom:6px&quot;&gt;${M(q.stem)}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Your answer:&lt;/b&gt; ${yours}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Correct answer:&lt;/b&gt; ${right}&lt;/div&gt;&lt;div class=&quot;exp&quot;&gt;${M(q.exp)}&lt;/div&gt;&lt;/div&gt;`; }).join(&#x27;&#x27;);
    typeset($(&#x27;#rl&#x27;));
  };
  paint(&#x27;all&#x27;);
  document.querySelectorAll(&#x27;.chip&#x27;).forEach(c=&gt;c.onclick=()=&gt;{ document.querySelectorAll(&#x27;.chip&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;)); c.classList.add(&#x27;on&#x27;); paint(c.dataset.f); });
  window.scrollTo(0,0);
}
startScreen();
&lt;/script&gt;

<div id="lock" hidden><div><h3>Test in progress</h3><p>You cannot open the Rules Sheet while the Recall Test is running. Please <b>submit the test first</b>, then open the Rules Sheet.</p><button id="ok">Back to test</button></div></div>
<script>
function active(){try{return !!document.getElementById('f2').contentWindow.__active}catch(e){return false}}
function show(n){
  if(n===1&&active()){document.getElementById('lock').hidden=false;return}
  for(const i of [1,2]){document.getElementById('f'+i).hidden=i!==n;document.getElementById('b'+i).className=i===n?'on':''}
}
b1.onclick=()=>show(1);b2.onclick=()=>show(2);
ok.onclick=()=>{document.getElementById('lock').hidden=true};
</script></body></html>
