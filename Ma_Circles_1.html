&lt;h1&gt;Circles &amp;mdash; Must-Remember Sheet&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;Every formula, concept and technique from the class notes, with the figures redrawn &amp;middot; 149 points and 30 figures in 17 topics &amp;middot; page references are the PDF page numbers of the class note (pp. 1&amp;ndash;40)&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;button onclick=&quot;window.print()&quot;&gt;Print / Save as PDF&lt;/button&gt;&lt;/div&gt;
&lt;section&gt;&lt;h2&gt;1. Circle: standard and general form &lt;span class=&quot;pg&quot;&gt;p. 1-2&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Definition.&lt;/b&gt; A circle is the locus of a point moving in a plane so that its distance from a fixed point (the centre) is constant (the radius).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 255 255&quot; style=&quot;width:100%;max-width:255px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;127.6&quot; cy=&quot;127.6&quot; r=&quot;96.8&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;127.6&quot; y1=&quot;127.6&quot; x2=&quot;201.8&quot; y2=&quot;65.4&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;127.6&quot; cy=&quot;127.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;127.6&quot; y=&quot;147.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;(α, β)&lt;/text&gt;&lt;circle cx=&quot;201.8&quot; cy=&quot;65.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;235.8&quot; y=&quot;63.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P(x, y)&lt;/text&gt;&lt;text x=&quot;158.7&quot; y=&quot;92.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;r&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Circle with centre (α, β) and radius r; P(x, y) is any point on it.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (x-\alpha)^2+(y-\beta)^2=r^2\qquad\text{(centre-radius form)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle x^2+y^2-2\alpha x-2\beta y+(\alpha^2+\beta^2-r^2)=0\qquad\text{(expanded)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle x^2+y^2+2gx+2fy+c=0\qquad\text{(general form)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{centre}=(-g,\,-f),\qquad \text{radius}=\sqrt{g^2+f^2-c}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle g^2+f^2-c&amp;lt;0\Rightarrow\text{imaginary circle};\qquad g^2+f^2-c=0\Rightarrow\text{point circle (radius 0)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle ax^2+by^2+2hxy+2gx+2fy+c=0\ \text{represents a circle}\iff a=b\ (\neq0)\ \text{and}\ h=0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Technique:&lt;/b&gt; to read off centre and radius, make the coefficients of \(x^2,y^2\) equal to 1 (divide through), then take half the coefficient of \(x\) and \(y\) with the sign changed.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;2. Locus problems that give a circle &lt;span class=&quot;pg&quot;&gt;p. 1-2&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Apollonius circle.&lt;/b&gt; Given two points A, B, the locus of P with \(\dfrac{PA}{PB}=\lambda\) (constant) is a circle when \(\lambda&gt;0,\ \lambda\neq1\); for \(\lambda=1\) it is the perpendicular bisector of AB (PA = PB).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 300 239&quot; style=&quot;width:100%;max-width:300px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;186.2&quot; cy=&quot;106.4&quot; r=&quot;76.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;22.8&quot; y1=&quot;106.4&quot; x2=&quot;273.6&quot; y2=&quot;106.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;160.2&quot; y1=&quot;35.0&quot; x2=&quot;34.2&quot; y2=&quot;106.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;160.2&quot; y1=&quot;35.0&quot; x2=&quot;148.2&quot; y2=&quot;106.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;160.2&quot; y1=&quot;35.0&quot; x2=&quot;110.2&quot; y2=&quot;106.4&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;160.2&quot; y1=&quot;35.0&quot; x2=&quot;262.2&quot; y2=&quot;106.4&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;155.6,41.5 162.2,46.1 166.8,39.6&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;34.2&quot; cy=&quot;106.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;34.2&quot; y=&quot;126.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;circle cx=&quot;148.2&quot; cy=&quot;106.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;148.2&quot; y=&quot;126.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;circle cx=&quot;110.2&quot; cy=&quot;106.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;110.2&quot; y=&quot;126.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P₁&lt;/text&gt;&lt;circle cx=&quot;262.2&quot; cy=&quot;106.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;268.2&quot; y=&quot;126.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P₂&lt;/text&gt;&lt;circle cx=&quot;160.2&quot; cy=&quot;35.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;158.2&quot; y=&quot;30.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;text x=&quot;186.2&quot; y=&quot;212.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;PA : PB = λ&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;A, B fixed; P₁, P₂ divide AB internally and externally in the ratio λ; the circle has P₁P₂ as a diameter.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;NCERT proof:&lt;/b&gt; take \(A(-a,0),\ B(a,0)\). \(PA^2=\lambda^2PB^2\) gives \((x+a)^2+y^2=\lambda^2\big[(x-a)^2+y^2\big]\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;11&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle x^2(\lambda^2-1)+y^2(\lambda^2-1)-2a(\lambda^2+1)x+a^2(\lambda^2-1)=0\quad(\lambda\neq1)\ \Rightarrow\ \text{coefficients of }x^2,y^2\text{ equal, no }xy\Rightarrow\text{circle}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;12&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Alternate (geometric) proof:&lt;/b&gt; the ratio \(\lambda\) divides AB internally at \(P_1\) and externally at \(P_2\) (two fixed points of the locus). Since \(\dfrac{AP}{PB}=\dfrac{AP_1}{P_1B}\), \(PP_1\) bisects \(\angle APB\); likewise \(PP_2\) is the external bisector. The two bisectors are perpendicular, so \(\angle P_1PP_2=90^\circ\) &amp;rArr; &lt;b&gt;the locus is the circle with \(P_1P_2\) as diameter&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;13&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Sum of squares of distances.&lt;/b&gt; A, B fixed; locus of P with \(PA^2+PB^2=c\) (constant). Let D be the midpoint of AB (fixed).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 213 213&quot; style=&quot;width:100%;max-width:213px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;106.4&quot; cy=&quot;106.4&quot; r=&quot;87.4&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;30.4&quot; y1=&quot;106.4&quot; x2=&quot;182.4&quot; y2=&quot;106.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;143.3&quot; y1=&quot;27.2&quot; x2=&quot;30.4&quot; y2=&quot;106.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;143.3&quot; y1=&quot;27.2&quot; x2=&quot;182.4&quot; y2=&quot;106.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;143.3&quot; y1=&quot;27.2&quot; x2=&quot;106.4&quot; y2=&quot;106.4&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;30.4&quot; cy=&quot;106.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;26.4&quot; y=&quot;126.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;circle cx=&quot;182.4&quot; cy=&quot;106.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;186.4&quot; y=&quot;126.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;circle cx=&quot;106.4&quot; cy=&quot;106.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;106.4&quot; y=&quot;126.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;circle cx=&quot;143.3&quot; cy=&quot;27.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;143.3&quot; y=&quot;22.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;line x1=&quot;68.4&quot; y1=&quot;101.4&quot; x2=&quot;68.4&quot; y2=&quot;111.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;144.4&quot; y1=&quot;101.4&quot; x2=&quot;144.4&quot; y2=&quot;111.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;D = midpoint of AB; PD is the median of triangle PAB.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;14&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle PD^2=\dfrac{2(PA^2+PB^2)-AB^2}{4}\quad(\text{median formula})=\dfrac{2c-AB^2}{4}\ \text{(constant)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;15&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Locus is a circle with centre }D\text{ (midpoint of }AB),\quad \text{radius}=\sqrt{\dfrac{2c-AB^2}{4}}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;16&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Key point:&lt;/b&gt; D is fixed, so PD is constant. Whether the circle is real depends on \(c\) (need \(2c\ge AB^2\)).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;3. Intercepts and chord cut by a line &lt;span class=&quot;pg&quot;&gt;p. 3&lt;/span&gt;&lt;/h2&gt;

stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;3 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;149.6&quot; cy=&quot;142.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;151.6&quot; y=&quot;136.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;(−g, −f)&lt;/text&gt;&lt;text x=&quot;58.4&quot; y=&quot;243.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;240.8&quot; y=&quot;243.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;35.6&quot; y=&quot;218.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;text x=&quot;35.6&quot; y=&quot;83.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;159.6&quot; y=&quot;191.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#6b7a8d&quot; text-anchor=&quot;middle&quot;&gt;|f|&lt;/text&gt;&lt;text x=&quot;98.6&quot; y=&quot;137.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#6b7a8d&quot; text-anchor=&quot;middle&quot;&gt;|g|&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Circle \(x^2+y^2+2gx+2fy+c=0\): AB is the x-intercept (on the x-axis), CD the y-intercept.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;17&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{x-intercept }AB=2\sqrt{g^2-c},\qquad \text{y-intercept }CD=2\sqrt{f^2-c}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;18&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof:&lt;/b&gt; the perpendicular from the centre \((-g,-f)\) to the x-axis has length \(|f|\), so half the chord is \(\sqrt{(g^2+f^2-c)-f^2}=\sqrt{g^2-c}\). Same with \(g\) and \(f\) swapped for the y-axis.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;19&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Circle touches the x-axis}\iff g^2=c;\qquad\text{touches the y-axis}\iff f^2=c;\qquad\text{misses an axis}\iff g^2&amp;lt;c\ (\text{or }f^2&amp;lt;c)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 236 236&quot; style=&quot;width:100%;max-width:236px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;117.8&quot; cy=&quot;117.8&quot; r=&quot;91.2&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;10.1&quot; y1=&quot;108.5&quot; x2=&quot;194.3&quot; y2=&quot;41.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;28.0&quot; y1=&quot;102.0&quot; x2=&quot;176.4&quot; y2=&quot;47.9&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;2.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;117.8&quot; y1=&quot;117.8&quot; x2=&quot;102.2&quot; y2=&quot;75.0&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;104.9,82.5 112.5,79.7 109.7,72.2&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;line x1=&quot;117.8&quot; y1=&quot;117.8&quot; x2=&quot;176.4&quot; y2=&quot;47.9&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;117.8&quot; cy=&quot;117.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;107.8&quot; y=&quot;133.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;O&lt;/text&gt;&lt;circle cx=&quot;102.2&quot; cy=&quot;75.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;90.2&quot; y=&quot;75.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;circle cx=&quot;28.0&quot; cy=&quot;102.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;18.0&quot; y=&quot;98.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;R&lt;/text&gt;&lt;circle cx=&quot;176.4&quot; cy=&quot;47.9&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;186.4&quot; y=&quot;43.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;S&lt;/text&gt;&lt;text x=&quot;101.0&quot; y=&quot;98.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;p&lt;/text&gt;&lt;text x=&quot;157.1&quot; y=&quot;96.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#6b7a8d&quot; text-anchor=&quot;middle&quot;&gt;r&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Line \(lx+my+n=0\) cuts the circle at R, S; p = distance of the centre from the line.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;20&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Chord cut off by the line}=2\sqrt{r^2-p^2},\qquad p=\dfrac{|l(-g)+m(-f)+n|}{\sqrt{l^2+m^2}}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;21&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Technique:&lt;/b&gt; get \(OP\) (= p, the perpendicular distance from the centre to the line) and the radius r, then use Pythagoras in the right triangle formed with half the chord.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;4. Equation of a circle: standard techniques &lt;span class=&quot;pg&quot;&gt;pp. 3-4&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;22&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(i) Centre on a given line and through two points \(A,B\):&lt;/b&gt; Method 1 &amp;mdash; write the perpendicular bisector of AB; its intersection with the given line is the centre; \(r\) = distance centre&amp;ndash;A. Method 2 &amp;mdash; take \(x^2+y^2+2gx+2fy+c=0\); use A, B to get two equations, and the centre \((-g,-f)\) satisfying the line gives the third.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;23&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(ii) Centre \((x_1,y_1)\) and touching a line:&lt;/b&gt; radius = perpendicular distance from the centre to the line, \(r=\dfrac{|ax_1+by_1+c|}{\sqrt{a^2+b^2}}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;24&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(iii) Passing through the extremities of the diameters of given circles:&lt;/b&gt; if the required circle (centre \((\alpha,\beta)\), radius \(r\)) passes through the ends of a diameter of a circle with centre \(C_i\) and radius \(r_i\), then (Pythagoras on half-diameter \(r_i\) and the line from \((\alpha,\beta)\) to the centre) \(r^2=|(\alpha,\beta)-C_i|^2+r_i^2\). Equate the three expressions in pairs to get two linear equations for \(\alpha,\beta\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 274 274&quot; style=&quot;width:100%;max-width:274px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;136.8&quot; cy=&quot;136.8&quot; r=&quot;83.6&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;58.2&quot; y1=&quot;165.4&quot; x2=&quot;215.4&quot; y2=&quot;108.2&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;115.2&quot; y1=&quot;56.0&quot; x2=&quot;58.2&quot; y2=&quot;165.4&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;115.2&quot; y1=&quot;56.0&quot; x2=&quot;215.4&quot; y2=&quot;108.2&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;111.5,63.1 118.6,66.8 122.3,59.7&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;58.2&quot; cy=&quot;165.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;52.2&quot; y=&quot;187.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A(x₁, y₁)&lt;/text&gt;&lt;circle cx=&quot;215.4&quot; cy=&quot;108.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;247.4&quot; y=&quot;108.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B(x₂, y₂)&lt;/text&gt;&lt;circle cx=&quot;115.2&quot; cy=&quot;56.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;115.2&quot; y=&quot;50.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P(x, y)&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Diameter AB; any point P on the circle sees AB at 90°.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;25&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Diametric form&lt;/b&gt; (circle on the segment joining \(A(x_1,y_1),B(x_2,y_2)\) as diameter): angle in a semicircle = 90&amp;deg;, so slopes multiply to \(-1\):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;26&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{y-y_1}{x-x_1}\cdot\dfrac{y-y_2}{x-x_2}=-1\ \Longrightarrow\ (x-x_1)(x-x_2)+(y-y_1)(y-y_2)=0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;27&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Touching an axis at a given distance from the origin and cutting an intercept on the other axis:&lt;/b&gt; there are &lt;b&gt;4 possible circles&lt;/b&gt; (centres in each quadrant, \(r\) from Pythagoras with half the intercept).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;28&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Circle through the origin cutting equal chords of length 1 on the lines \(y=\pm x\):&lt;/b&gt; the chord ends are \((\pm\tfrac1{\sqrt2},\pm\tfrac1{\sqrt2})\); take the diametric form with the two chord ends (the angle at the origin between \(y=x\) and \(y=-x\) is 90&amp;deg;); there are 4 such circles.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;5. Point and circle: position, tangent length, power, distances &lt;span class=&quot;pg&quot;&gt;pp. 5-6&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 259 234&quot; style=&quot;width:100%;max-width:259px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;108.0&quot; cy=&quot;90.0&quot; r=&quot;64.8&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;108.0&quot; y1=&quot;90.0&quot; x2=&quot;215.7&quot; y2=&quot;39.8&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;3 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;108.0&quot; cy=&quot;90.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;100.0&quot; y=&quot;108.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;circle cx=&quot;215.7&quot; cy=&quot;39.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;225.7&quot; y=&quot;37.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;circle cx=&quot;83.1&quot; cy=&quot;75.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;77.1&quot; y=&quot;71.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;Q&lt;/text&gt;&lt;circle cx=&quot;85.8&quot; cy=&quot;150.9&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;81.8&quot; y=&quot;170.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;E&lt;/text&gt;&lt;text x=&quot;129.6&quot; y=&quot;184.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;P outside :  S₁ &gt; 0&lt;/text&gt;&lt;text x=&quot;129.6&quot; y=&quot;200.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;Q inside :  S₁ &lt; 0&lt;/text&gt;&lt;text x=&quot;129.6&quot; y=&quot;216.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;E on circle :  S₁ = 0&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Position of a point with respect to a circle.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;29&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Notation:&lt;/b&gt; \(S=x^2+y^2+2gx+2fy+c\). Putting \((\alpha,\beta)\) into \(S\) gives \(S_1=\alpha^2+\beta^2+2g\alpha+2f\beta+c\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;30&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{P outside}\iff PC&gt;r\iff PC^2-r^2&gt;0\iff S_1&gt;0;\qquad \text{P inside}\iff S_1&amp;lt;0;\qquad\text{on the circle}\iff S_1=0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;31&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof:&lt;/b&gt; \(PC^2-r^2=(\alpha+g)^2+(\beta+f)^2-(g^2+f^2-c)=\alpha^2+\beta^2+2g\alpha+2f\beta+c\).&lt;/span&gt;&lt;/div&gt;

troke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;3 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;108.2&quot; y1=&quot;83.9&quot; x2=&quot;56.2&quot; y2=&quot;135.9&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;108.2&quot; cy=&quot;83.9&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;132.2&quot; y=&quot;81.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;(h, k)&lt;/text&gt;&lt;text x=&quot;56.2&quot; y=&quot;154.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;160.2&quot; y=&quot;154.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;31.6&quot; y=&quot;119.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;text x=&quot;31.6&quot; y=&quot;56.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;108.2&quot; y=&quot;165.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;2a&lt;/text&gt;&lt;text x=&quot;19.6&quot; y=&quot;87.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;2b&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Rod AB (length 2a) on the x-axis, CD (length 2b) on the y-axis; the circle through A, B, C, D has centre (h, k).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;40&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r^2=h^2+b^2=a^2+k^2\ \Longrightarrow\ \text{locus: }x^2-y^2=a^2-b^2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;41&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Angle at \((x_3,y_3)\) subtended by the segment joining \((x_1,y_1),(x_2,y_2)\) is obtuse&lt;/b&gt; &amp;hArr; the point lies &lt;b&gt;inside the circle on that segment as diameter&lt;/b&gt;:&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;42&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (x_3-x_1)(x_3-x_2)+(y_3-y_1)(y_3-y_2)&amp;lt;0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;43&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Region bounded by a circle and a line:&lt;/b&gt; combine the conditions &amp;mdash; &amp;lsquo;inside the circle&amp;rsquo; \(S_1&amp;lt;0\) and the correct side of the line. (Example: \((a,a+1)\) inside \(x^2+y^2=4\) and above \(x+y=2\) gives \(a\in\big(\tfrac12,\tfrac{\sqrt7-1}2\big)\).)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;44&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Orthocentre of a triangle inscribed in the unit circle:&lt;/b&gt; the circumcentre is \(O(0,0)\) and \(G=\Big(\dfrac{\sum\cos\theta_i}3,\dfrac{\sum\sin\theta_i}3\Big)\). Since H, G, O are collinear with \(HG:GO=2:1\) (section formula):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;45&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle H=\dfrac{3G-2O}{3-2}=\big(\cos\theta_1+\cos\theta_2+\cos\theta_3,\ \sin\theta_1+\sin\theta_2+\sin\theta_3\big)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;46&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Locus of the centroid of \(\triangle PAB\)&lt;/b&gt; where P moves on the circle with centre \(C(\alpha,\beta)\), radius \(r\), and \(A(\alpha,0),B(0,\beta)\) are the feet of the perpendiculars from C on the axes:&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;47&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle x_P=3h-\alpha,\ y_P=3k-\beta\ \Rightarrow\ \Big(x-\tfrac{2\alpha}3\Big)^2+\Big(y-\tfrac{2\beta}3\Big)^2=\Big(\tfrac r3\Big)^2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Method 2 (similar triangles):&lt;/b&gt; the centroid G&amp;#8242; of the fixed triangle \(ABC\) is known and \(GG&#x27;=\dfrac{PC}3=\dfrac r3\); so the locus is a circle with centre \(G&#x27;=\big(\tfrac{2\alpha}3,\tfrac{2\beta}3\big)\) and radius \(\tfrac r3\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;7. Line and circle &lt;span class=&quot;pg&quot;&gt;p. 10&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;div class=&quot;figrow&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 157 170&quot; style=&quot;width:100%;max-width:157px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;67.2&quot; cy=&quot;70.4&quot; r=&quot;44.8&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;89.6&quot; y1=&quot;121.6&quot; x2=&quot;89.6&quot; y2=&quot;16.0&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;67.2&quot; y1=&quot;70.4&quot; x2=&quot;89.6&quot; y2=&quot;70.4&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;83.6,70.4 83.6,64.4 89.6,64.4&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;67.2&quot; cy=&quot;70.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;59.2&quot; y=&quot;86.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;text x=&quot;78.4&quot; y=&quot;66.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;p&lt;/text&gt;&lt;text x=&quot;76.8&quot; y=&quot;147.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;p &lt; r : secant&lt;/text&gt;&lt;/svg&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 157 170&quot; style=&quot;width:100%;max-width:157px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;67.2&quot; cy=&quot;70.4&quot; r=&quot;44.8&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;112.0&quot; y1=&quot;121.6&quot; x2=&quot;112.0&quot; y2=&quot;16.0&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;67.2&quot; y1=&quot;70.4&quot; x2=&quot;112.0&quot; y2=&quot;70.4&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;106.0,70.4 106.0,64.4 112.0,64.4&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;67.2&quot; cy=&quot;70.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;59.2&quot; y=&quot;86.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;text x=&quot;89.6&quot; y=&quot;66.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;p&lt;/text&gt;&lt;text x=&quot;76.8&quot; y=&quot;147.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;p = r : tangent&lt;/text&gt;&lt;/svg&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 157 170&quot; style=&quot;width:100%;max-width:157px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;67.2&quot; cy=&quot;70.4&quot; r=&quot;44.8&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;134.4&quot; y1=&quot;121.6&quot; x2=&quot;134.4&quot; y2=&quot;16.0&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;67.2&quot; y1=&quot;70.4&quot; x2=&quot;134.4&quot; y2=&quot;70.4&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;128.4,70.4 128.4,64.4 134.4,64.4&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;67.2&quot; cy=&quot;70.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;59.2&quot; y=&quot;86.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;text x=&quot;100.8&quot; y=&quot;66.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;p&lt;/text&gt;&lt;text x=&quot;76.8&quot; y=&quot;147.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;p &gt; r : no contact&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;p = perpendicular distance of the centre from the line \(lx+my+n=0\).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;49&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle p&amp;lt;r\Rightarrow\text{secant (2 points)};\qquad p=r\Rightarrow\text{tangent};\qquad p&gt;r\Rightarrow\text{neither (no common point)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;50&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Method 2:&lt;/b&gt; substitute \(x\) (or \(y\)) from the line into the circle to get a quadratic; its discriminant decides: \(D&gt;0\) intersect at two points, \(D=0\) tangent, \(D&amp;lt;0\) no common point.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;51&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Condition for tangency (shortcut):}\ \ \dfrac{|l(-g)+m(-f)+n|}{\sqrt{l^2+m^2}}=\sqrt{g^2+f^2-c}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;8. Tangent and normal at a point &lt;span class=&quot;pg&quot;&gt;pp. 10-11&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 204 235&quot; style=&quot;width:100%;max-width:204px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;91.8&quot; cy=&quot;119.0&quot; r=&quot;68.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;187.6&quot; y1=&quot;95.8&quot; x2=&quot;64.0&quot; y2=&quot;24.4&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;91.8&quot; y1=&quot;119.0&quot; x2=&quot;125.8&quot; y2=&quot;60.1&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;121.8,67.0 114.9,63.0 118.9,56.1&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;91.8&quot; cy=&quot;119.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;91.8&quot; y=&quot;139.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C(−g, −f)&lt;/text&gt;&lt;circle cx=&quot;125.8&quot; cy=&quot;60.1&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;161.8&quot; y=&quot;78.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P(α, β)&lt;/text&gt;&lt;text x=&quot;91.8&quot; y=&quot;223.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;tangent at P :  T = 0&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Tangent at P(α, β) is perpendicular to the radius CP.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;52&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Slope method:&lt;/b&gt; slope of \(CP=\dfrac{\beta+f}{\alpha+g}\), so the tangent has slope \(-\dfrac{\alpha+g}{\beta+f}\):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;53&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle y-\beta=-\Big(\dfrac{\alpha+g}{\beta+f}\Big)(x-\alpha)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;54&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Simplify using \(\alpha^2+\beta^2+2g\alpha+2f\beta+c=0\) (P on the circle):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;55&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle T:\ \ x\alpha+y\beta+g(x+\alpha)+f(y+\beta)+c=0\qquad\text{(tangent at }(\alpha,\beta)\text{ on the circle)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;56&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Replacement (halving) rule &amp;#9733;&lt;/b&gt; &amp;mdash; tangent at \((\alpha,\beta)\) on &lt;b&gt;any second-degree curve&lt;/b&gt; \(ax^2+2hxy+by^2+2gx+2fy+c=0\): replace&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;57&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle x^2\to x\alpha,\quad y^2\to y\beta,\quad x\to\dfrac{x+\alpha}2,\quad y\to\dfrac{y+\beta}2,\quad xy\to\dfrac{x\beta+y\alpha}2,\quad c\to c\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;58&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;For the circle this gives \(T=0\) above (the \(2g x\to g(x+\alpha)\), \(2fy\to f(y+\beta)\)).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;59&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Normal at \((\alpha,\beta)\)&lt;/b&gt; (the line through the centre and P; &lt;i&gt;no need to memorise&lt;/i&gt;):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;60&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle y-\beta=\Big(\dfrac{\beta+f}{\alpha+g}\Big)(x-\alpha)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;9. Chord with a given midpoint &lt;span class=&quot;pg&quot;&gt;p. 11&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 190 218&quot; style=&quot;width:100%;max-width:190px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;95.2&quot; cy=&quot;95.2&quot; r=&quot;74.8&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;158.0&quot; y1=&quot;135.9&quot; x2=&quot;91.3&quot; y2=&quot;20.5&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;2.2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;95.2&quot; y1=&quot;95.2&quot; x2=&quot;124.6&quot; y2=&quot;78.2&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;117.7,82.2 113.7,75.3 120.6,71.3&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;95.2&quot; cy=&quot;95.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;89.2&quot; y=&quot;117.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C(−g, −f)&lt;/text&gt;&lt;circle cx=&quot;124.6&quot; cy=&quot;78.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;160.6&quot; y=&quot;76.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;M(α, β)&lt;/text&gt;&lt;text x=&quot;95.2&quot; y=&quot;200.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;chord with midpoint M :  T = S₁&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Chord whose midpoint is M(α, β); CM is perpendicular to the chord.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;61&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;The chord is perpendicular to \(CM\) (slope of \(CM=\dfrac{\beta+f}{\alpha+g}\)) and passes through M:&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;62&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle y-\beta=-\Big(\dfrac{\alpha+g}{\beta+f}\Big)(x-\alpha)\ \Longrightarrow\ T=S_1,\ \text{ i.e. }\ x\alpha+y\beta+g(x+\alpha)+f(y+\beta)+c=\alpha^2+\beta^2+2g\alpha+2f\beta+c\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;63&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Remember: chord with midpoint \((\alpha,\beta)\) is \(T=S_1\).&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;64&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Chord through \((\alpha,\beta)\) at the maximum distance from the centre = shortest chord through \((\alpha,\beta)\)&lt;/b&gt;: this is the chord with \((\alpha,\beta)\) as its midpoint, \(T=S_1\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;10. Chord of contact, pair of tangents, pole and polar, director circle &lt;span class=&quot;pg&quot;&gt;pp. 12-14&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 258 214&quot; style=&quot;width:100%;max-width:258px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;81.6&quot; cy=&quot;95.2&quot; r=&quot;54.4&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;224.4&quot; y1=&quot;54.4&quot; x2=&quot;86.9&quot; y2=&quot;41.1&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;224.4&quot; y1=&quot;54.4&quot; x2=&quot;114.7&quot; y2=&quot;138.4&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;86.9&quot; y1=&quot;41.1&quot; x2=&quot;114.7&quot; y2=&quot;138.4&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;2.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;81.6&quot; y1=&quot;95.2&quot; x2=&quot;224.4&quot; y2=&quot;54.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;3 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;224.4&quot; cy=&quot;54.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;228.4&quot; y=&quot;48.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P(α, β)&lt;/text&gt;&lt;circle cx=&quot;86.9&quot; cy=&quot;41.1&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;82.9&quot; y=&quot;35.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A(x₁, y₁)&lt;/text&gt;&lt;circle cx=&quot;114.7&quot; cy=&quot;138.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;124.7&quot; y=&quot;158.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B(x₂, y₂)&lt;/text&gt;&lt;circle cx=&quot;81.6&quot; cy=&quot;95.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;73.6&quot; y=&quot;113.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;text x=&quot;125.8&quot; y=&quot;188.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;chord of contact AB :  T = 0&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Tangents from P touch the circle at A and B; AB is the chord of contact.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;65&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Chord of contact (COC)&lt;/b&gt; of an external point \(P(\alpha,\beta)\): tangents at \(A(x_1,y_1),B(x_2,y_2)\) both pass through P, so \(\alpha x_1+\beta y_1+g(\alpha+x_1)+f(\beta+y_1)+c=0\) and the same for B. Hence A and B both lie on&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;66&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{COC}:\ \ T=0,\quad\text{i.e. }\ \alpha x+\beta y+g(x+\alpha)+f(y+\beta)+c=0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;67&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Pair of tangents&lt;/b&gt; from \(P(\alpha,\beta)\). Take \(R(h,k)\) on a tangent \(PQ\) (Q = point of contact). Similar triangles with the chord of contact give \(\dfrac{QR}{PQ}=\dfrac{\text{dist}(R,AB)}{\text{dist}(P,AB)}\). Here \(QR=\sqrt{S(R)}\) (R lies on the tangent at Q), \(PQ=\sqrt{S_1}\), and the distances are in the ratio \(|T(R)|:T(P)=|T(R)|:S_1\). So \(\dfrac{\sqrt{S(R)}}{\sqrt{S_1}}=\dfrac{|T(R)|}{S_1}\); squaring and replacing \(R\) by \((x,y)\):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;68&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \boxed{\ T^2=SS_1\ }\qquad\text{(combined equation of the pair of tangents from }(\alpha,\beta))\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;69&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;i.e. \((x^2+y^2+2gx+2fy+c)(\alpha^2+\beta^2+2g\alpha+2f\beta+c)=\big(\alpha x+\beta y+g(x+\alpha)+f(y+\beta)+c\big)^2\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 219 273&quot; style=&quot;width:100%;max-width:219px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;70.5&quot; cy=&quot;154.5&quot; r=&quot;48.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;106.7&quot; y1=&quot;221.5&quot; x2=&quot;74.9&quot; y2=&quot;78.5&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;178.5&quot; y1=&quot;130.5&quot; x2=&quot;22.5&quot; y2=&quot;154.2&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;116.2&quot; y1=&quot;140.0&quot; x2=&quot;24.2&quot; y2=&quot;-150.1&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;22.5&quot; y1=&quot;154.2&quot; x2=&quot;24.2&quot; y2=&quot;-150.1&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;178.5&quot; cy=&quot;130.5&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;188.5&quot; y=&quot;134.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;circle cx=&quot;116.2&quot; cy=&quot;140.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;110.2&quot; y=&quot;158.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;X&lt;/text&gt;&lt;circle cx=&quot;22.5&quot; cy=&quot;154.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;10.5&quot; y=&quot;158.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;Y&lt;/text&gt;&lt;circle cx=&quot;24.2&quot; cy=&quot;-150.1&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;32.2&quot; y=&quot;-154.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;Q&lt;/text&gt;&lt;circle cx=&quot;70.5&quot; cy=&quot;154.5&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;64.5&quot; y=&quot;172.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;text x=&quot;109.5&quot; y=&quot;258.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;polar of P :  T = 0&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;P and its polar (the chord of contact when P is outside); Q = intersection of the tangents at the ends of the chord XY through P lies on the polar.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;70&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Pole and polar.&lt;/b&gt; P may be inside or outside. Draw chords through P; the locus of the intersection of tangents at the ends of these chords is the &lt;b&gt;polar&lt;/b&gt; of P. Proof: if the chord of contact of \(Q(h,k)\) is \(xh+yk+g(x+h)+f(y+k)+c=0\) and it passes through \((\alpha,\beta)\), then \(\alpha h+\beta k+g(\alpha+h)+f(\beta+k)+c=0\); so \((h,k)\) lies on&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;71&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Polar of }(\alpha,\beta):\ \ T=0\ \text{ (same form as COC);}\qquad P\text{ is the \textbf{pole} of this line.}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 218 179&quot; style=&quot;width:100%;max-width:218px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;89.6&quot; cy=&quot;89.6&quot; r=&quot;48.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;89.6&quot; cy=&quot;89.6&quot; r=&quot;67.9&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;5 3&quot;/&gt;&lt;line x1=&quot;153.4&quot; y1=&quot;66.4&quot; x2=&quot;133.1&quot; y2=&quot;109.9&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;153.4&quot; y1=&quot;66.4&quot; x2=&quot;109.9&quot; y2=&quot;46.1&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;89.6&quot; y1=&quot;89.6&quot; x2=&quot;133.1&quot; y2=&quot;109.9&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;89.6&quot; y1=&quot;89.6&quot; x2=&quot;109.9&quot; y2=&quot;46.1&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;89.6&quot; y1=&quot;89.6&quot; x2=&quot;153.4&quot; y2=&quot;66.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;3 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;150.0,73.6 142.8,70.3 146.1,63.0&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;89.6&quot; cy=&quot;89.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;81.6&quot; y=&quot;107.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;circle cx=&quot;153.4&quot; cy=&quot;66.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;183.4&quot; y=&quot;66.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P(h, k)&lt;/text&gt;&lt;text x=&quot;102.4&quot; y=&quot;101.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#6b7a8d&quot; text-anchor=&quot;middle&quot;&gt;r&lt;/text&gt;&lt;text x=&quot;125.5&quot; y=&quot;102.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;r√2&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Tangents from P are perpendicular: CT₁PT₂ is a square, so CP = r√2.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;72&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Director circle:&lt;/b&gt; the locus of points from which the two tangents to a given circle are &lt;b&gt;perpendicular&lt;/b&gt;. \(CP=r\sqrt2\) (a square with side r):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;73&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (x+g)^2+(y+f)^2=2(g^2+f^2-c)\qquad(\text{centre }C,\ \text{radius }r\sqrt2)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;11. Techniques for tangent problems &lt;span class=&quot;pg&quot;&gt;pp. 14-22&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;74&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Tangent of given slope / tangent condition (two methods):&lt;/b&gt; (1) substitute \(x\) from the line into the circle and put \(D=0\); (2) &lt;b&gt;perpendicular distance from the centre = radius&lt;/b&gt; (usually shorter).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;75&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Line \(lx+my+1=0\) touches a fixed circle when a relation in \(l,m\) is given&lt;/b&gt; (e.g. \(4l^2-5m^2+6l+1=0\)): write the tangency condition \(\dfrac{|l\alpha+m\beta+1|}{\sqrt{l^2+m^2}}=r\), square, and compare, or manipulate the given relation: \((4l^2-5m^2+6l+1)+5(l^2+m^2)=5(l^2+m^2)\Rightarrow(3l+1)^2=5(l^2+m^2)\), so \(\dfrac{|3l+1|}{\sqrt{l^2+m^2}}=\sqrt5\): the line touches the circle with centre \((3,0)\), radius \(\sqrt5\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;76&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Tangents perpendicular to a given line&lt;/b&gt; (e.g. \(\perp 3x-4y-7=0\), slope of tangents \(-\tfrac43\)): write \(y=-\tfrac43x+c\) i.e. \(4x+3y-3c=0\) and use distance from centre = radius to get two values of \(c\) (the \(\pm\) in \(|\ldots|=r\)).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;77&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Tangents from an external point&lt;/b&gt; \((x_1,y_1)\) to a circle: (1) \(T^2=SS_1\); (2) angle method: \(\theta\) = inclination of \(CP\) (\(\tan\theta\) = slope of \(CP\)), \(\alpha\) = angle between \(CP\) and each tangent, \(\tan\alpha=\dfrac{r}{\sqrt{S_1}}\); the tangent slopes are \(\tan(\theta\pm\alpha)\) (an infinite value means a vertical tangent \(x=x_1\)). Example: circle \(x^2+y^2-6x+4y-3=0\), P(7, 4): \(\tan\theta=\tfrac32,\ \tan\alpha=\tfrac46\), slopes \(\infty\) and \(\tfrac5{12}\); (3) line through the point with slope \(m\) and distance from the centre = r.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;78&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Intersection of tangents at the ends of a chord subtending angle \(\theta\) at the centre&lt;/b&gt; (points \(a\cos\alpha,a\sin\alpha\) and \(a\cos\beta,a\sin\beta\), \(|\alpha-\beta|=\theta\)): the intersection is at distance \(\dfrac{a}{\cos(\theta/2)}\) from the centre; for \(|\alpha-\beta|=\tfrac{2\pi}3\) the locus is the circle \(x^2+y^2=(2a)^2\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;79&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Intersection of tangents at the points where a line meets the circle:&lt;/b&gt; the point is the pole of the line; the chord of contact is that line. (Example: \(x^2+y^2=8\), line \(x+2y=4\): compare \(\alpha x+\beta y=8\) with \(x+2y=4\): \((\alpha,\beta)=(2,4)\).)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;80&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Chord subtending a right angle at a point&lt;/b&gt; (e.g. at the origin): &lt;b&gt;homogenise&lt;/b&gt; the circle with the chord&#x27;s line \(lx+my=1\) (or \(\ hx+ky=h^2+k^2\ \)), \(\Rightarrow\) joined lines OA, OB; right angle &amp;hArr; &lt;b&gt;coefficient of \(x^2\) + coefficient of \(y^2\) = 0&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;81&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Locus of the midpoint of a chord subtending a right angle at a given point \(P(a,b)\):&lt;/b&gt; M = midpoint; \(PM=MA=MB\) (circumcentre of the right triangle) so \(CM^2+PM^2=r^2\):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;82&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (h+g)^2+(k+f)^2+(h-a)^2+(k-b)^2=g^2+f^2-c\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;83&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Locus of the foot of the perpendicular from the origin on a chord subtending a right angle at the origin&lt;/b&gt; (foot \((h,k)\), chord \(hx+ky=h^2+k^2\)): homogenising and the right-angle condition give&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;84&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle 2(h^2+k^2)+2gh+2fk+c=0\ \Longrightarrow\ 2(x^2+y^2)+2gx+2fy+c=0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;85&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Chord of contact from a point of one circle to a concentric circle:&lt;/b&gt; if the COC of tangents from a point on \(x^2+y^2=a^2\) to \(x^2+y^2=b^2\) touches \(x^2+y^2=c^2\), then (similar triangles \(ABO\sim BCO\)) \(\dfrac bc=\dfrac ab\), i.e. &lt;b&gt;\(a,b,c\) are in G.P.&lt;/b&gt; (\(b^2=ac\)). Method 2: COC is \(x\alpha+y\beta=b^2\); distance from the centre = \(\dfrac{b^2}{a}=c\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;86&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Tangents drawn from every point of a line to a circle:&lt;/b&gt; the chords of contact pass through a &lt;b&gt;fixed point&lt;/b&gt; (the pole of the line). Method: the COC of \(P(\alpha,\beta)\) is the polar; if the line is \(2x+y=4\) and the circle \(x^2+y^2=1\): comparing \(x\alpha+y\beta=1\) with \(2x+y=4\) gives the fixed point \(\big(\tfrac12,\tfrac14\big)\). Locus of the midpoint of the COC: the COC with midpoint \((h,k)\) is \(hx+ky=h^2+k^2\) (this is \(T=S_1\)); it passes through the fixed point &amp;rArr; \(\ x^2+y^2=\tfrac x2+\tfrac y4\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;87&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Chords from a point on the circle divided by an axis in a given ratio&lt;/b&gt; (e.g. chords from \((a,b)\) on \(x^2+y^2-ax-by=0\) divided by the x-axis in the ratio 2 : 1): find the far end \(Q(x_1,y_1)\) using the section formula (the x-axis point has y-coordinate 0 &amp;rArr; \(y_1=-\tfrac b2\)); put Q in the circle: \(x^2-ax+\tfrac{3b^2}4=0\); &lt;b&gt;two distinct chords &amp;hArr; discriminant \(&gt;0\)&lt;/b&gt; &amp;rArr; \(a^2&gt;3b^2\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;88&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Tangents from two points on the x-axis equidistant from \((\lambda,0)\)&lt;/b&gt; (points \((\lambda\pm\alpha,0)\)) to \(x^2+y^2=a^2\), meeting at \(P(h,k)\): put \(y=0\) in \(T^2=SS_1\); the roots are the two x-coordinates, so (sum of roots) \(2\lambda=-\dfrac{2a^2h}{k^2-a^2}\) &amp;rArr; &lt;b&gt;locus \(\lambda y^2=a^2(\lambda-x)\)&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;89&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Length of tangent from any point of \(x^2+y^2+2gx+2fy+\lambda=0\) to the concentric circle \(x^2+y^2+2gx+2fy+\mu=0\):&lt;/b&gt; \(S_1=\mu-\lambda\) for any point of the first circle, so the length is \(\sqrt{\mu-\lambda}\) (equivalently \(l^2=R^2-r^2\) where the chord of the larger circle touches the smaller).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;90&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Condition that the power of \(P(2,5)\) is negative and the circle misses both axes&lt;/b&gt; (example \(x^2+y^2-8x-12y+p=0\)): \(S_1&amp;lt;0\Rightarrow p&amp;lt;47\); centre \((4,6)\), \(r^2=52-p\); misses both axes &amp;hArr; \(r&amp;lt;\) the smaller of the two distances \(4,6\) &amp;rArr; \(r^2&amp;lt;16\Rightarrow p&gt;36\); so \(36&amp;lt;p&amp;lt;47\). (Axes: \(g^2-c&amp;lt;0\) misses the x-axis, \(=0\) touches, \(&gt;0\) cuts.)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;91&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Chord AB of \(x^2+y^2=a^2\) with ends \(A(a\cos\alpha,a\sin\alpha),\ B(a\cos\beta,a\sin\beta)\):&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;92&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle AB:\ \ x\cos\dfrac{\alpha+\beta}2+y\sin\dfrac{\alpha+\beta}2=a\cos\dfrac{\alpha-\beta}2\qquad(\text{normal form; slope }=-\cot\dfrac{\alpha+\beta}2)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;93&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle AB\text{ passes through }(d,0)\ \Longrightarrow\ \tan\dfrac\alpha2\tan\dfrac\beta2=\dfrac{d-a}{d+a}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;94&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Two chords AB, CD meeting the x-axis at \((d,0)\) and \((-d,0)\)&lt;/b&gt; (equidistant from the origin): replace \(d\) by \(-d\); \(\tan\tfrac\gamma2\tan\tfrac\delta2=\dfrac{d+a}{d-a}\), so the product of all four is &lt;b&gt;1&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;12. Family of circles &lt;span class=&quot;pg&quot;&gt;pp. 23-26&lt;/span&gt;&lt;/h2&gt;

&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;97&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;A, B satisfy this for every \(\lambda\); the only circle missed is \(S_2=0\) itself.&lt;/span&gt;&lt;/div&gt;

t;middle&quot;&gt;L&lt;/text&gt;&lt;text x=&quot;61.5&quot; y=&quot;153.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;S + λL = 0&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Circles through the intersection of the circle S = 0 and the line L = 0.&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;100&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle S+\lambda L=0\qquad(\lambda\in\mathbb R)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;101&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Through two given points \((x_1,y_1),(x_2,y_2)\):&lt;/b&gt; one circle = diametric circle \(S=(x-x_1)(x-x_2)+(y-y_1)(y-y_2)=0\); one line = the line through the two points, \(L=(y_1-y_2)(x-x_1)-(y-y_1)(x_1-x_2)=0\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;102&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle S+\lambda L=0\qquad(\lambda\in\mathbb R)\)&lt;/span&gt;&lt;/div&gt;

ot; y=&quot;123.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;L₂&lt;/text&gt;&lt;text x=&quot;118.8&quot; y=&quot;58.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;L₃&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Triangle with sides \(L_1=0,L_2=0,L_3=0\) &amp;mdash; circumcircle.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;106&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Idea &amp;mdash; circumcircle of a triangle whose three sides are given:&lt;/b&gt; Method 1: get the vertices and find the circle through them. &lt;b&gt;Method 2:&lt;/b&gt; a second-degree curve through A, B, C is \(\ L_1L_2+\lambda L_2L_3+\mu L_3L_1=0\). To be a circle: &lt;b&gt;coefficient of \(x^2\) = coefficient of \(y^2\) and coefficient of \(xy\) = 0&lt;/b&gt; &amp;rArr; two equations in \(\lambda,\mu\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;107&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Idea &amp;mdash; four lines (sides of a quadrilateral) \(L_1,L_2,L_3,L_4\):&lt;/b&gt; \(\ L_1L_3+\lambda L_2L_4=0\) (second degree through the four vertices). Put coeff. of \(x^2\) = coeff. of \(y^2\) and coeff. of \(xy=0\) to find \(\lambda\); if such a \(\lambda\) exists the quadrilateral is cyclic.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;108&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Example &amp;mdash; circle touching \(2x-y=4\) at \((1,-2)\):&lt;/b&gt; \((x-1)^2+(y+2)^2+\lambda(2x-y-4)=0\). Through \((3,4)\): \(4+36-2\lambda=0\Rightarrow\lambda=20\). With radius 5: expand, centre \(=(1-\lambda,-2+\tfrac\lambda2)\), \(r^2=\tfrac54\lambda^2\), so \(\lambda=\pm2\sqrt5\) (two circles, on either side of the line).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;109&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Example &amp;mdash; circle on the chord \(x\cos\alpha+y\sin\alpha=p\) of \(x^2+y^2=a^2\) as diameter:&lt;/b&gt; \((x^2+y^2-a^2)+\lambda(x\cos\alpha+y\sin\alpha-p)=0\). Method 1: centre \((p\cos\alpha,p\sin\alpha)\) (foot of the perpendicular from O), radius \(\sqrt{a^2-p^2}\). Method 2: centre \(\big(-\tfrac{\lambda\cos\alpha}2,-\tfrac{\lambda\sin\alpha}2\big)\) lies on the chord (it is a diameter) &amp;rArr; \(\lambda=-2p\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;110&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Example &amp;mdash; circle through the origin and the points of contact of the tangents from the origin to \(x^2+y^2-11x+13y+17=0\):&lt;/b&gt; Method 1: circumcircle of \(\triangle AOB\) = the circle on OC as diameter, \(x\big(x-\tfrac{11}2\big)+y\big(y+\tfrac{13}2\big)=0\). Method 2: COC from the origin is \(-\tfrac{11}2x+\tfrac{13}2y+17=0\); \(S+\lambda L=0\) with \(L=11x-13y-34\), put \((0,0)\): \(\lambda=\tfrac12\).&lt;/span&gt;&lt;/div&gt;
