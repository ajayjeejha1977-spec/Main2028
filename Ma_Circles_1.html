-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C₂&lt;/text&gt;&lt;circle cx=&quot;333.6&quot; cy=&quot;69.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;341.6&quot; y=&quot;87.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;circle cx=&quot;157.6&quot; cy=&quot;69.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;157.6&quot; y=&quot;87.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;Q&lt;/text&gt;&lt;text x=&quot;273.6&quot; y=&quot;28.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;direct (external)&lt;/text&gt;&lt;text x=&quot;201.6&quot; y=&quot;124.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;transverse (internal)&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Separate circles: direct (external) tangents meet at P; transverse (internal) tangents meet at Q.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;113&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Direct (external) common tangents&lt;/b&gt; meet at P on the line of centres, dividing \(C_1C_2\) &lt;b&gt;externally&lt;/b&gt; in the ratio \(r_1:r_2\): \(\dfrac{PC_1}{PC_2}=\dfrac{r_1}{r_2}\). Find \(P(x_P,y_P)\) by the section formula (external).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;114&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;To find the tangent:&lt;/b&gt; Method 1: \(y-y_P=m(x-x_P)\); distance from \(C_1\) = \(r_1\) gives \(m\). Method 2: \(\tan\alpha=\dfrac{r_2}{C_2P}\), \(\theta=\) slope angle of \(C_1C_2\); then \(m=\tan(\theta\pm\alpha)\) (an infinite slope means a vertical tangent \(x=x_P\)).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;115&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Length of the direct common tangent}=\sqrt{d^2-(r_1-r_2)^2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;116&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Also (Method 1 of the notes) from P: the segment of the common tangent between the touching points equals \(\big|\sqrt{S_1(P)}-\sqrt{S_2(P)}\big|\) (tangent lengths from P to the two circles).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;117&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Transverse (internal) common tangents&lt;/b&gt; meet at Q dividing \(C_1C_2\) &lt;b&gt;internally&lt;/b&gt; in the ratio \(r_1:r_2\): \(\dfrac{C_1Q}{C_2Q}=\dfrac{r_1}{r_2}\). Slope of the tangents \(m=\tan(\theta\pm\alpha)\) (here \(\alpha\) is the angle of the tangent with the line of centres, \(\tan\alpha=\dfrac{r_1}{\sqrt{S_1(Q)}}\)), or \(y-y_Q=m(x-x_Q)\) with \(\perp\) distance from \(C_1\) = \(r_1\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;118&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Length of the transverse common tangent}=\sqrt{d^2-(r_1+r_2)^2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;119&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Touching externally:&lt;/b&gt; the transverse tangent at the point of contact is \(S_1-S_2=0\) (the common tangent, which is also the radical axis). &lt;b&gt;Touching internally:&lt;/b&gt; there is only one common tangent, \(S_1-S_2=0\). &lt;b&gt;Intersecting:&lt;/b&gt; only the two direct tangents; \(S_1-S_2=0\) is the common chord, &lt;i&gt;not&lt;/i&gt; a tangent. &lt;b&gt;One inside the other:&lt;/b&gt; no common tangent.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;120&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Worked example&lt;/b&gt; (\(x^2+y^2=1\), \((x-1)^2+(y-3)^2=4\)): \(C_1(0,0),r_1=1;\ C_2(1,3),r_2=2\); \(d=\sqrt{10}&gt;3\), so 4 tangents. External centre \(P=\big(\tfrac{2(0)-1(1)}{2-1},\tfrac{2(0)-1(3)}{2-1}\big)=(-1,-3)\); tangent length from P \(=\sqrt{S_1}=3\); \(\tan\theta=3,\ \tan\alpha=\tfrac13\): slopes \(\tan(\theta\pm\alpha)=\infty\) and \(\tfrac43\): &lt;b&gt;\(x=-1\)&lt;/b&gt; and &lt;b&gt;\(y+3=\tfrac43(x+1)\)&lt;/b&gt;. Internal centre \(Q=\big(\tfrac13,1\big)\); \(\sqrt{S_2(Q)}=\tfrac23\), \(\tan\beta=\tfrac{r_2}{2/3}=3\)...: slopes \(0\) and \(-\tfrac34\): &lt;b&gt;\(y=1\)&lt;/b&gt; and &lt;b&gt;\(y-1=-\tfrac34(x-\tfrac13)\)&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;14. Radical axis &lt;span class=&quot;pg&quot;&gt;pp. 31-32&lt;/span&gt;&lt;/h2&gt;

&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;123&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;The RA is a straight line&lt;/b&gt; (the \(x^2+y^2\) terms cancel). With &lt;b&gt;both circles&#x27; coefficients of \(x^2,y^2\) equal to 1&lt;/b&gt; (made so first!).&lt;/span&gt;&lt;/div&gt;

italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C₁&lt;/text&gt;&lt;circle cx=&quot;200.6&quot; cy=&quot;98.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;206.6&quot; y=&quot;116.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C₂&lt;/text&gt;&lt;circle cx=&quot;88.8&quot; cy=&quot;45.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;80.8&quot; y=&quot;43.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;circle cx=&quot;206.6&quot; cy=&quot;68.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;214.6&quot; y=&quot;66.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;circle cx=&quot;147.7&quot; cy=&quot;56.9&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;137.7&quot; y=&quot;52.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;O&lt;/text&gt;&lt;text x=&quot;161.7&quot; y=&quot;161.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;bold&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;RA&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;The radical axis RA is perpendicular to \(C_1C_2\) and bisects the direct common tangent AB (OA = OB).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;124&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Properties (Note):&lt;/b&gt; (1) RA is &lt;b&gt;perpendicular to the line joining the centres&lt;/b&gt;. (2) RA is &lt;b&gt;closer to the centre of the smaller circle&lt;/b&gt;: from a point P of the RA, \(C_1P^2=L^2+r_1^2\) and \(C_2P^2=L^2+r_2^2\) (same tangent length L), so \(r_1&gt;r_2\Rightarrow C_1P&gt;C_2P\). (3) &lt;b&gt;A direct common tangent is bisected by the RA&lt;/b&gt;: \(OA=OB\) (equal tangent lengths from O). (4) &lt;b&gt;The RA is not defined for concentric circles&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;125&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Cases:&lt;/b&gt; intersecting circles &amp;rArr; RA = &lt;b&gt;common chord&lt;/b&gt; (tangent length 0 at the two intersection points); touching circles (externally or internally) &amp;rArr; RA = &lt;b&gt;common tangent at the point of contact&lt;/b&gt;; non-intersecting circles &amp;rArr; RA lies &lt;b&gt;outside&lt;/b&gt; both circles; concentric circles &amp;rArr; RA does not exist (no finite RA).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;15. Radical centre and coaxial system &lt;span class=&quot;pg&quot;&gt;pp. 33-34&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 246 228&quot; style=&quot;width:100%;max-width:246px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;69.0&quot; cy=&quot;165.0&quot; r=&quot;45.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;circle cx=&quot;189.0&quot; cy=&quot;165.0&quot; r=&quot;36.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;circle cx=&quot;129.0&quot; cy=&quot;60.0&quot; r=&quot;39.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;line x1=&quot;132.0&quot; y1=&quot;192.0&quot; x2=&quot;132.0&quot; y2=&quot;66.0&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;186.7&quot; y1=&quot;160.2&quot; x2=&quot;77.3&quot; y2=&quot;97.7&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;186.7&quot; y1=&quot;97.7&quot; x2=&quot;77.3&quot; y2=&quot;160.2&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;69.0&quot; cy=&quot;165.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;69.0&quot; y=&quot;185.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;S₁&lt;/text&gt;&lt;circle cx=&quot;189.0&quot; cy=&quot;165.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;189.0&quot; y=&quot;185.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;S₂&lt;/text&gt;&lt;circle cx=&quot;129.0&quot; cy=&quot;60.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;129.0&quot; y=&quot;56.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;S₃&lt;/text&gt;&lt;circle cx=&quot;132.0&quot; cy=&quot;129.0&quot; r=&quot;2.6&quot; fill=&quot;#c2410c&quot;/&gt;&lt;text x=&quot;142.0&quot; y=&quot;127.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;R&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Three circles: the three radical axes meet at the radical centre R.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;126&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Radical centre of three circles:&lt;/b&gt; the radical axes of three circles taken pairwise are &lt;b&gt;concurrent&lt;/b&gt;; the point of concurrence is the &lt;b&gt;radical centre&lt;/b&gt;. (From \(S_1-S_2=0,\ S_2-S_3=0\), adding gives \(S_3-S_1=0\).)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;127&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \begin{vmatrix}2(g_1-g_2)&amp;2(f_1-f_2)&amp;c_1-c_2\\ 2(g_2-g_3)&amp;2(f_2-f_3)&amp;c_2-c_3\\ 2(g_3-g_1)&amp;2(f_3-f_1)&amp;c_3-c_1\end{vmatrix}=0\qquad(R_1\to R_1+R_2+R_3\ \text{gives a zero row})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;128&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Tangents drawn from the radical centre to the three circles are equal.&lt;/b&gt; If the three &lt;b&gt;centres are collinear&lt;/b&gt;, the three radical axes are parallel (concurrent at infinity) and there is no finite radical centre.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;129&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Coaxial system of circles:&lt;/b&gt; a set of circles (at least 3) is &lt;b&gt;coaxial&lt;/b&gt; if every pair has the &lt;b&gt;same radical axis&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;130&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Types: (a) circles through two common points A, B (RA = common chord AB); (b) non-intersecting circles with a common RA (including the limiting points); any two members of the family have the same RA.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;16. Radical-axis techniques and standard results &lt;span class=&quot;pg&quot;&gt;pp. 34-38&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;131&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;A circle \(S\) bisects the circumference of circle \(S&#x27;\):&lt;/b&gt; the common chord of S and S&#x27; is a &lt;b&gt;diameter of S&#x27;&lt;/b&gt; (passes through the centre of S&#x27;).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;132&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle 2g&#x27;(g-g&#x27;)+2f&#x27;(f-f&#x27;)=c-c&#x27;\qquad\big(S:x^2+y^2+2gx+2fy+c=0,\ \ S&#x27;:x^2+y^2+2g&#x27;x+2f&#x27;y+c&#x27;=0\big)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;133&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof:&lt;/b&gt; common chord \(S-S&#x27;=0\): \(2(g-g&#x27;)x+2(f-f&#x27;)y+c-c&#x27;=0\) passes through \((-g&#x27;,-f&#x27;)\) &amp;rArr; \(-2g&#x27;(g-g&#x27;)-2f&#x27;(f-f&#x27;)+c-c&#x27;=0\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 260 250&quot; style=&quot;width:100%;max-width:260px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;88.4&quot; cy=&quot;104.0&quot; r=&quot;52.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;circle cx=&quot;153.4&quot; cy=&quot;143.0&quot; r=&quot;91.9&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;line x1=&quot;15.6&quot; y1=&quot;150.8&quot; x2=&quot;156.0&quot; y2=&quot;10.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;130.8&quot; y1=&quot;33.4&quot; x2=&quot;46.0&quot; y2=&quot;174.6&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;88.4&quot; cy=&quot;78.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;98.4&quot; y=&quot;76.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;O&lt;/text&gt;&lt;circle cx=&quot;88.4&quot; cy=&quot;104.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;112.4&quot; y=&quot;108.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;10&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;(0, −1)&lt;/text&gt;&lt;text x=&quot;150.8&quot; y=&quot;24.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;10.5&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#6b7a8d&quot; text-anchor=&quot;middle&quot;&gt;x − y = 0&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Circle S₂ bisecting the circumference of S₁ and touching x − y = 0 at the origin: its common chord with S₁ is a diameter of S₁.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;134&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Circle bisecting the circumference of S&#x27; and touching a line at a given point:&lt;/b&gt; take the family (point circle at the touching point) + \(\lambda\)(line); the common chord with \(S&#x27;\) must pass through the centre of S&#x27; &amp;rArr; find \(\lambda\). (Example: \(x^2+y^2+2y-3=0\), touching \(x-y=0\) at the origin: \(x^2+y^2+\lambda(x-y)=0\); common chord \(\lambda x-(\lambda+2)y+3=0\) through \((0,-1)\) &amp;rArr; \(\lambda=-5\).) Method 2: the centre lies on \(x+y=0\) (perpendicular to the tangent at the origin), say \((a,-a)\), and \(R^2=2a^2\); since S&amp;#8242; has a diameter as a chord of the new circle, \(R^2=\)(distance between centres)\(^2+r&#x27;^2\) \(=a^2+(a-1)^2+4\), so \(a=\tfrac52\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;135&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Tangents drawn at the points where two circles meet:&lt;/b&gt; the common chord is the RA; the pole of that chord with respect to the first circle is the point of intersection of the tangents. (Example: tangents to \(x^2+y^2=12\) at the points where it is met by \(x^2+y^2-5x+3y-2=0\): common chord \(5x-3y-10=0\), compare with \(\alpha x+\beta y=12\): \((\alpha,\beta)=\big(6,-\tfrac{18}5\big)\).)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;136&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Two circles touch &amp;hArr; the RA is a common tangent:&lt;/b&gt; e.g. \(x^2+y^2+2ax+c^2=0\) and \(x^2+y^2+2by+c^2=0\): centres \((-a,0),(0,-b)\), radii \(\sqrt{a^2-c^2},\sqrt{b^2-c^2}\); RA \(ax-by=0\) is tangent to the first: \(\dfrac{a^2}{\sqrt{a^2+b^2}}=\sqrt{a^2-c^2}\) &amp;rArr; &lt;b&gt;\(\dfrac1{a^2}+\dfrac1{b^2}=\dfrac1{c^2}\)&lt;/b&gt;. (This avoids splitting into internal/external contact.)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;137&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Locus of the centre of a circle bisecting the circumferences of two given circles:&lt;/b&gt; the common chord of each given circle with the moving circle passes through the given circle&#x27;s centre; equate \(R^2=h^2+k^2+r_1^2=(h-x_2)^2+(k-y_2)^2+r_2^2\) (Pythagoras with half-diameter): the locus is the &lt;b&gt;radical axis&lt;/b&gt; of the two given circles. (Example: \(x^2+y^2=4\) and \(x^2+y^2-2x+6y+1=0\): locus \(2x-6y=15\).)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;138&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Four points concyclic from two chords:&lt;/b&gt; if \(lx+my+n=0\) cuts \(S_1\) at A, B and \(px+qy+r=0\) cuts \(S_2\) at C, D with A, B, C, D concyclic, then AB, CD and the RA of \(S_1,S_2\) are the three radical axes of three circles &amp;rArr; concurrent:&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;139&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \begin{vmatrix}2(g_1-g_2)&amp;2(f_1-f_2)&amp;c_1-c_2\\ l&amp;m&amp;n\\ p&amp;q&amp;r\end{vmatrix}=0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 312 221&quot; style=&quot;width:100%;max-width:312px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;148.8,67.2 76.8,163.2 244.8,163.2&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;circle cx=&quot;112.8&quot; cy=&quot;115.2&quot; r=&quot;60.0&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;circle cx=&quot;196.8&quot; cy=&quot;115.2&quot; r=&quot;67.9&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;line x1=&quot;148.8&quot; y1=&quot;67.2&quot; x2=&quot;148.8&quot; y2=&quot;163.2&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;148.8,156.2 155.8,156.2 155.8,163.2&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;148.8&quot; cy=&quot;67.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;148.8&quot; y=&quot;61.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;circle cx=&quot;76.8&quot; cy=&quot;163.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;68.8&quot; y=&quot;181.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;circle cx=&quot;244.8&quot; cy=&quot;163.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;252.8&quot; y=&quot;181.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;circle cx=&quot;148.8&quot; cy=&quot;163.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;148.8&quot; y=&quot;182.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;circle cx=&quot;148.8&quot; cy=&quot;91.2&quot; r=&quot;2.6&quot; fill=&quot;#c2410c&quot;/&gt;&lt;text x=&quot;158.8&quot; y=&quot;91.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;H&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Circles on the sides AB, AC as diameters pass through the foot D of the altitude from A; AD is their radical axis.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;140&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Radical centre of the three circles described on the sides of a triangle as diameters = the orthocentre.&lt;/b&gt; The circles on AB and AC both pass through D (foot of the altitude from A, since \(\angle ADB=\angle ADC=90^\circ\)), so their RA is AD \(\perp BC\); similarly the other two RAs are the other altitudes &amp;rArr; concurrent at the orthocentre.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;17. Angle between two curves and orthogonal circles &lt;span class=&quot;pg&quot;&gt;pp. 39-40&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 201 173&quot; style=&quot;width:100%;max-width:201px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;74.8&quot; cy=&quot;98.6&quot; r=&quot;54.4&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;circle cx=&quot;136.0&quot; cy=&quot;98.6&quot; r=&quot;44.2&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;line x1=&quot;137.4&quot; y1=&quot;84.7&quot; x2=&quot;89.8&quot; y2=&quot;36.2&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;142.9&quot; y1=&quot;43.3&quot; x2=&quot;84.3&quot; y2=&quot;77.7&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;path d=&quot;M126.2,73.3 A18,18 0 0 0 129.1,51.4&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;141.4&quot; y=&quot;69.2&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;13&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;/text&gt;&lt;circle cx=&quot;113.6&quot; cy=&quot;60.5&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;115.6&quot; y=&quot;54.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;circle cx=&quot;74.8&quot; cy=&quot;98.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;68.8&quot; y=&quot;116.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C₁&lt;/text&gt;&lt;circle cx=&quot;136.0&quot; cy=&quot;98.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;142.0&quot; y=&quot;116.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C₂&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Angle θ between two curves at P = angle between their tangents at P.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;141&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Angle between two curves&lt;/b&gt; = angle between their tangents (or normals) at the point of intersection P. Technique: find P; get the slopes \(m_1,m_2\) from the tangent equation of each curve (replacement rule); then&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;142&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan\theta=\left|\dfrac{m_1-m_2}{1+m_1m_2}\right|\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;143&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Orthogonal curves:&lt;/b&gt; the tangents at the point of intersection are perpendicular, \(m_1m_2=-1\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;144&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cos\theta=\left|\dfrac{(g_1^2+f_1^2-c_1)+(g_2^2+f_2^2-c_2)-(g_1-g_2)^2-(f_1-f_2)^2}{2\sqrt{g_1^2+f_1^2-c_1}\ \sqrt{g_2^2+f_2^2-c_2}}\right|=\dfrac{|\,r_1^2+r_2^2-d^2\,|}{2r_1r_2}\quad(\text{angle between two circles})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;145&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof:&lt;/b&gt; in triangle \(PC_1C_2\) (sides \(r_1,r_2,d\)) the cosine rule gives \(\cos\angle C_1PC_2=\dfrac{r_1^2+r_2^2-d^2}{2r_1r_2}\); the angle between the tangents equals this angle (or its supplement) since the radii are perpendicular to the tangents.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 210 158&quot; style=&quot;width:100%;max-width:210px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;79.2&quot; cy=&quot;79.2&quot; r=&quot;57.6&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;149.1&quot; cy=&quot;79.2&quot; r=&quot;39.6&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;79.2&quot; y1=&quot;79.2&quot; x2=&quot;126.7&quot; y2=&quot;46.6&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;149.1&quot; y1=&quot;79.2&quot; x2=&quot;126.7&quot; y2=&quot;46.6&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;79.2&quot; y1=&quot;79.2&quot; x2=&quot;149.1&quot; y2=&quot;79.2&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;3 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;120.1,51.1 124.6,57.7 131.2,53.2&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;79.2&quot; cy=&quot;79.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;73.2&quot; y=&quot;97.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C₁&lt;/text&gt;&lt;circle cx=&quot;149.1&quot; cy=&quot;79.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;155.1&quot; y=&quot;97.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C₂&lt;/text&gt;&lt;circle cx=&quot;126.7&quot; cy=&quot;46.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;126.7&quot; y=&quot;41.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;text x=&quot;92.9&quot; y=&quot;62.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;r₁&lt;/text&gt;&lt;text x=&quot;147.9&quot; y=&quot;62.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;r₂&lt;/text&gt;&lt;text x=&quot;114.1&quot; y=&quot;97.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;d&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Orthogonal circles: radii to P are perpendicular, so \(r_1^2+r_2^2=d^2\).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;146&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Two circles are orthogonal&lt;/b&gt; (\(\cos\theta=0\), \(\angle C_1PC_2=90^\circ\)): \(PC_1^2+PC_2^2=C_1C_2^2\), i.e. \(r_1^2+r_2^2=d^2\):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;147&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle 2(g_1g_2+f_1f_2)=c_1+c_2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;148&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Note (1):&lt;/b&gt; the &lt;b&gt;centre of a circle orthogonal to two given circles lies on their radical axis&lt;/b&gt;. Proof: \(2gg_1+2ff_1=c+c_1\), \(2gg_2+2ff_2=c+c_2\); subtracting, \(2g(g_1-g_2)+2f(f_1-f_2)=c_1-c_2\) &amp;mdash; i.e. \((-g,-f)\) satisfies \(S_1-S_2=0\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;149&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Circle orthogonal to three circles:&lt;/b&gt; its centre is the &lt;b&gt;radical centre&lt;/b&gt; of the three (solve any two RAs); its &lt;b&gt;radius is the length of the tangent from the radical centre to any one of the circles&lt;/b&gt; (\(r^2=S_1(R)\)).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;&lt;div class=&quot;notes&quot;&gt;&lt;b&gt;Small slips in the handwritten notes (as I read them) &amp;mdash; the sheet uses the corrected forms:&lt;/b&gt;&lt;ul&gt;&lt;li&gt;p.4 (example ii): the working shows 20/13; \(|20-36-10|=26\), so the radius is 26/13 = 2 and the circle is \((x-4)^2+(y-3)^2=4\).&lt;/li&gt;&lt;li&gt;p.4 (example iii): the second linear equation is written \(-6\alpha-9\beta+36=0\); expanding gives \(6\alpha+8\beta-36=0\). With \(2\alpha-4\beta+8=0\) this gives centre \((2,3)\), \(r^2=17\).&lt;/li&gt;&lt;li&gt;p.7 (circle through the origin cutting unit intercepts on \(y^2-x^2=0\)): the first attempt (centre (1/2, 1/2)) is crossed out; the four circles have centres \((\pm\tfrac1{\sqrt2},0),(0,\pm\tfrac1{\sqrt2})\) and radius \(\tfrac1{\sqrt2}\).&lt;/li&gt;&lt;li&gt;p.11: for the chord with a given midpoint the notes first write the slope as \(-\tfrac{\alpha+g}{\beta+f}\); the sheet uses the same (CM is perpendicular to the chord).&lt;/li&gt;&lt;li&gt;p.12 (pair of tangents): the ratio QR/PQ = RS/RT is only partly written; the sheet spells out the steps that lead to \(T^2=SS_1\) (p.13).&lt;/li&gt;&lt;li&gt;p.37 (example 5, method 2): the notes write \((\alpha+1)^2\) for the distance of the centres; with the centre \((\alpha,-\alpha)\) and the other centre \((0,-1)\) it is \((\alpha-1)^2\).&lt;/li&gt;&lt;li&gt;p.17 (example: tangent length from a point on one circle to a concentric circle): the working shows \(\sqrt{\lambda^2-\mu^2}\); the correct value is \(\sqrt{\mu-\lambda}\) (power \(=\mu-\lambda\)).&lt;/li&gt;&lt;li&gt;p.35 (circle bisecting circumference): the notes write \(2f(f-f&#x27;)\) once; it is \(2f&#x27;(f-f&#x27;)\).&lt;/li&gt;&lt;li&gt;p.37 (example 5): the notes get \(\lambda=-9\); \(\lambda+2+3=0\) gives \(\lambda=-5\), the circle \(x^2+y^2-5x+5y=0\).&lt;/li&gt;&lt;li&gt;p.31 (radical axis): \(2(f_1-f_2)\) is written with \(x\) instead of \(y\); it is the coefficient of \(y\).&lt;/li&gt;&lt;li&gt;p.28: the transverse-tangent length is \(\sqrt{C_1C_2^2-(r_1+r_2)^2}\) (the notes&#x27; sign inside the root is clear); the direct tangent has \((r_1-r_2)^2\).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;

.legend span i{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:5px;color:#fff;font-style:normal;margin-right:5px;font-size:12px}
.secsum{font-size:13px;color:#46566a;margin:4px 0 6px}
.start{max-width:760px;margin:26px auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px 28px}
.start h2{margin-top:0;color:var(--blue)}
.start label.m{display:block;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0;cursor:pointer}
.start label.m:has(input:checked){border-color:var(--blue2);background:#e7f1fd}
.start input[type=text]{padding:8px 10px;font-size:16px;border:1px solid var(--line);border-radius:5px;width:260px}
.start ul{line-height:1.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
.modal .box{background:#fff;border-radius:8px;padding:20px 24px;max-width:480px;width:92%}
table.sm{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
table.sm th,table.sm td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.sm th{background:#f1f5fa}
.res{max-width:1000px;margin:14px auto;padding:0 12px 40px}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.card{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card .v{font-size:26px;font-weight:700;color:var(--blue)}
.rq{background:#fff;border:1px solid var(--line);border-left:6px solid var(--grey);border-radius:6px;padding:12px 16px;margin:10px 0}
.rq.ok{border-left-color:var(--green)} .rq.bad{border-left-color:var(--red)} .rq.skip{border-left-color:var(--amber)}
.rq .meta{font-size:12.5px;color:#5a6a7e;margin-bottom:4px}
.rq .ans{font-size:15px;margin:6px 0}
.rq .exp{background:#f4f8fd;border-radius:5px;padding:8px 10px;font-size:15px;margin-top:6px;overflow-x:auto}
.filters{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.chip{padding:6px 12px;border:1px solid var(--blue2);border-radius:20px;cursor:pointer;font-size:14px;color:var(--blue);background:#fff}
.chip.on{background:var(--blue2);color:#fff}
.tagpill{display:inline-block;background:#fff3d6;border:1px solid #efd48a;border-radius:14px;padding:3px 10px;margin:3px;font-size:13.5px}
@media (max-width:860px){.wrap{flex-direction:column}.side{width:100%;position:static}}
@media print{header,.filters,.noprint{display:none!important}.rq{break-inside:avoid}}

uation \\(x^2+y^2+2gx+2fy+c=0\\) represents&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle a pair of lines\\)&quot;, &quot;\\(\\displaystyle an imaginary circle (no real points)\\)&quot;, &quot;\\(\\displaystyle a point circle\\)&quot;, &quot;\\(\\displaystyle a real circle of negative radius\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;\\(r^2&amp;lt;0\\), so no real point satisfies it.&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.1 Point circle&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;When \\(g^2+f^2-c=0\\) the equation represents&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle a pair of coincident lines\\)&quot;, &quot;\\(\\displaystyle a point circle (radius 0, the single point (−g, −f))\\)&quot;, &quot;\\(\\displaystyle a unit circle\\)&quot;, &quot;\\(\\displaystyle an imaginary circle\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;\\(r=0\\): the only real solution is the centre \\((-g,-f)\\).&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.2 Second degree = circle&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle ax^2+by^2+2hxy+2gx+2fy+c=0\\ \\text{is a circle iff}\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle a=b\\ \\text{and}\\ h\\neq0\\)&quot;, &quot;\\(\\displaystyle a=b\\ (\\neq0)\\ \\text{and}\\ h=0\\)&quot;, &quot;\\(\\displaystyle h^2=ab\\)&quot;, &quot;\\(\\displaystyle a+b=0\\ \\text{and}\\ h=0\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;\\(\\displaystyle \\text{Equal coefficients of }x^2,y^2\\text{ and no }xy\\text{ term.}\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.1 Apollonius&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;For fixed A, B the locus of P with \\(PA/PB=\\lambda\\) (\\(\\lambda&gt;0\\)) is a circle when&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle λ is an integer\\)&quot;, &quot;\\(\\displaystyle λ = 1 only\\)&quot;, &quot;\\(\\displaystyle λ ≠ 1 (for λ = 1 it is the perpendicular bisector of AB)\\)&quot;, &quot;\\(\\displaystyle λ &gt; 1 only\\)&quot;], &quot;ans&quot;: 2, &quot;exp&quot;: &quot;\\(\\lambda=1\\) gives \\(PA=PB\\): a straight line.&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.1 Apollonius (NCERT)&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle A(-a,0),\\ B(a,0),\\ PA=\\lambda PB\\ \\Rightarrow\\ \\text{the locus is}\\ x^2(\\lambda^2-1)+y^2(\\lambda^2-1)+\\Box\\,x+a^2(\\lambda^2-1)=0,\\ \\text{where }\\Box=\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle -2a(\\lambda^2+1)\\)&quot;, &quot;\\(\\displaystyle -2a(\\lambda^2-1)\\)&quot;, &quot;\\(\\displaystyle -2a\\lambda^2\\)&quot;, &quot;\\(\\displaystyle 2a(\\lambda^2+1)\\)&quot;], &quot;ans&quot;: 0, &quot;exp&quot;: &quot;\\(\\displaystyle (x+a)^2+y^2=\\lambda^2\\big[(x-a)^2+y^2\\big]\\ \\text{moved to one side: coefficient of }x\\text{ is }-2a(\\lambda^2+1).\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.2 Apollonius (alternate)&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;In the geometric proof, \\(P_1\\) and \\(P_2\\) divide AB in the ratio \\(\\lambda\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle both internally; PP₁ and PP₂ are medians\\)&quot;, &quot;\\(\\displaystyle both externally; PP₁ and PP₂ are altitudes\\)&quot;, &quot;\\(\\displaystyle internally and externally; PP₁ and PP₂ are the internal and external bisectors of ∠APB\\)&quot;, &quot;\\(\\displaystyle internally and externally; PP₁ and PP₂ are parallel\\)&quot;], &quot;ans&quot;: 2, &quot;exp&quot;: &quot;The angle-bisector theorem gives the equal ratio for both bisectors, and the two bisectors are perpendicular.&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.2 Apollonius (alternate)&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;The Apollonius circle is the circle&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle with AB as a diameter\\)&quot;, &quot;\\(\\displaystyle with P₁P₂ as a diameter (angle in a semicircle = 90°)\\)&quot;, &quot;\\(\\displaystyle with centre B and radius AB\\)&quot;, &quot;\\(\\displaystyle through A and B with centre on AB\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;\\(\\angle P_1PP_2=90^\\circ\\) because internal and external bisectors are perpendicular.&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.2 Locus PA²+PB²=c&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle D=\\text{midpoint of }AB:\\ PD^2=\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle \\dfrac{2(PA^2+PB^2)-AB^2}{4}\\)&quot;, &quot;\\(\\displaystyle \\dfrac{2(PA^2+PB^2)+AB^2}{4}\\)&quot;, &quot;\\(\\displaystyle \\dfrac{PA^2+PB^2-AB^2}{2}\\)&quot;, &quot;\\(\\displaystyle \\dfrac{2(PA^2-PB^2)-AB^2}{4}\\)&quot;], &quot;ans&quot;: 0, &quot;exp&quot;: &quot;\\(\\displaystyle \\text{Median (Apollonius) formula.}\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.2 Locus PA²+PB²=c&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle PA^2+PB^2=c\\ \\text{(A, B fixed): the locus is a circle of radius}\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle \\sqrt{\\dfrac{2c-AB^2}{4}}\\)&quot;, &quot;\\(\\displaystyle \\sqrt{\\dfrac{c-AB^2}{2}}\\)&quot;, &quot;\\(\\displaystyle \\dfrac{2c-AB^2}{4}\\)&quot;, &quot;\\(\\displaystyle \\sqrt{\\dfrac{2c+AB^2}{4}}\\)&quot;], &quot;ans&quot;: 0, &quot;exp&quot;: &quot;\\(\\displaystyle PD^2=\\dfrac{2c-AB^2}{4},\\ D\\text{ fixed.}\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.2 Locus PA²+PB²=c&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;The centre of the locus of P with PA² + PB² = c is&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle the foot of the perpendicular from P\\)&quot;, &quot;\\(\\displaystyle the centroid of PAB\\)&quot;, &quot;\\(\\displaystyle A or B\\)&quot;, &quot;\\(\\displaystyle the midpoint of AB\\)&quot;], &quot;ans&quot;: 3, &quot;exp&quot;: &quot;PD is constant where D is the midpoint of AB.&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.3 Intercepts&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle \\text{x-intercept of }x^2+y^2+2gx+2fy+c=0\\ \\text{is}\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle 2\\sqrt{g^2-c}\\)&quot;, &quot;\\(\\displaystyle \\sqrt{g^2-c}\\)&quot;, &quot;\\(\\displaystyle 2\\sqrt{f^2-c}\\)&quot;, &quot;\\(\\displaystyle 2\\sqrt{g^2+f^2-c}\\)&quot;], &quot;ans&quot;: 0, &quot;exp&quot;: &quot;\\(\\displaystyle \\text{Put }y=0:\\ x^2+2gx+c=0,\\ \\text{roots differ by }2\\sqrt{g^2-c}.\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.3 Intercepts&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle \\text{y-intercept of }x^2+y^2+2gx+2fy+c=0\\ \\text{is}\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle 2\\sqrt{g^2-c}\\)&quot;, &quot;\\(\\displaystyle 2\\sqrt{f^2-c}\\)&quot;, &quot;\\(\\displaystyle 2\\sqrt{g^2+f^2-c}\\)&quot;, &quot;\\(\\displaystyle 2\\sqrt{f^2+c}\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;\\(\\displaystyle \\text{Put }x=0:\\ y^2+2fy+c=0.\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.3 Intercepts&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle \\text{Circle }x^2+y^2+2gx+2fy+c=0\\ \\text{touches the x-axis iff}\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle f^2=c\\)&quot;, &quot;\\(\\displaystyle g^2=c\\)&quot;, &quot;\\(\\displaystyle g^2+f^2=c\\)&quot;, &quot;\\(\\displaystyle g=f\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;\\(\\displaystyle \\text{Equal roots of }x^2+2gx+c=0.\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.3 Intercepts&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle \\text{Circle }x^2+y^2+2gx+2fy+c=0\\ \\text{touches the y-axis iff}\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle f^2+g^2=c\\)&quot;, &quot;\\(\\displaystyle f=c\\)&quot;, &quot;\\(\\displaystyle f^2=c\\)&quot;, &quot;\\(\\displaystyle g^2=c\\)&quot;], &quot;ans&quot;: 2, &quot;exp&quot;: &quot;\\(\\displaystyle \\text{Equal roots of }y^2+2fy+c=0.\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.3 Intercepts&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;If \\(g^2-c&amp;lt;0\\), the circle \\(x^2+y^2+2gx+2fy+c=0\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle touches the x-axis\\)&quot;, &quot;\\(\\displaystyle does not meet the x-axis\\)&quot;, &quot;\\(\\displaystyle does not meet the y-axis\\)&quot;, &quot;\\(\\displaystyle cuts the x-axis at two points\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;The quadratic \\(x^2+2gx+c=0\\) has no real root.&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.3 Chord length&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle \\text{A line at distance }p\\text{ from the centre cuts a chord of length}\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle 2(r-p)\\)&quot;, &quot;\\(\\displaystyle 2\\sqrt{r^2-p^2}\\)&quot;, &quot;\\(\\displaystyle \\sqrt{r^2-p^2}\\)&quot;, &quot;\\(\\displaystyle 2\\sqrt{r^2+p^2}\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;\\(\\displaystyle \\text{Half the chord, }p\\text{ and }r\\text{ form a right triangle.}\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.3 Chord length&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle p=\\dfrac{|l(-g)+m(-f)+n|}{\\sqrt{l^2+m^2}}\\ \\text{is the distance from the centre to the line}\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle lx+my+n=0\\)&quot;, &quot;\\(\\displaystyle x^2+y^2=0\\)&quot;, &quot;\\(\\displaystyle lx+my=n^2\\)&quot;, &quot;\\(\\displaystyle lx-my+n=0\\)&quot;], &quot;ans&quot;: 0, &quot;exp&quot;: &quot;\\(\\displaystyle \\text{Distance from }(-g,-f)\ function answered(i){ const q=Qs[i],r=R[i]; return q.kind===&#x27;mcq&#x27; ? r.sel!==null : r.num.trim()!==&#x27;&#x27;; }
function status(i){ const r=R[i]; if(!r.vis) return &#x27;&#x27;; const a=answered(i); if(r.mark) return a?&#x27;am&#x27;:&#x27;mk&#x27;; return a?&#x27;an&#x27;:&#x27;na&#x27;; }
function renderExam(){
  const secs = [...new Set(Qs.map(q=&gt;q.sec))];

  &lt;div class=&quot;wrap&quot;&gt;

      &lt;div class=&quot;qhead&quot; id=&quot;qh&quot;&gt;&lt;/div&gt;

        &lt;span&gt;&lt;i style=&quot;background:var(--green)&quot;&gt;&amp;nbsp;&lt;/i&gt;Answered&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--purple)&quot;&gt;&amp;nbsp;&lt;/i&gt;Marked&lt;/span&gt;

    &lt;/div&gt;
  &lt;/div&gt;`;
  document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.onclick=()=&gt;{ const i=Qs.findIndex(q=&gt;q.sec===t.dataset.s); go(i); });
  $(&#x27;#sn&#x27;).onclick=()=&gt;{ nextAfter(); };

function nextAfter(){ if(cur&lt;Qs.length-1) go(cur+1); else { paintQ(); paintPal(); } }
function go(i, first){
  if(!first){ R[cur].t += (Date.now()-qStart)/1000; }
  cur=i; qStart=Date.now(); R[cur].vis=true; secActive=Qs[cur].sec; paintQ(); paintPal();
}
function paintQ(){
  const q=Qs[cur], r=R[cur], S=SEC[q.sec];
  const idxInSec = Qs.filter(x=&gt;x.sec===q.sec).indexOf(q)+1, nSec = Qs.filter(x=&gt;x.sec===q.sec).length;
  document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.classList.toggle(&#x27;on&#x27;,t.dataset.s===q.sec));
  $(&#x27;#qh&#x27;).innerHTML = `&lt;span&gt;&lt;b&gt;Question ${cur+1}&lt;/b&gt; of ${Qs.length} &amp;nbsp;|&amp;nbsp; ${q.sec}${idxInSec}/${nSec}&lt;/span&gt;&lt;span&gt;Marks: &lt;b style=&quot;color:var(--green)&quot;&gt;+${S.pos}&lt;/b&gt; / &lt;b style=&quot;color:var(--red)&quot;&gt;&amp;minus;${S.neg}&lt;/b&gt;&lt;/span&gt;`;
  let h = `&lt;div class=&quot;stem&quot;&gt;${M(q.stem)}&lt;/div&gt;`;
  if(q.kind===&#x27;mcq&#x27;){
    h += q.opts.map((o,k)=&gt;`&lt;div class=&quot;opt ${r.sel===k?&#x27;sel&#x27;:&#x27;&#x27;}&quot; data-k=&quot;${k}&quot;&gt;&lt;span class=&quot;L&quot;&gt;${&#x27;ABCD&#x27;[k]}.&lt;/span&gt;&lt;span&gt;${M(o)}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  } else {
    h += `&lt;div class=&quot;numbox&quot;&gt;&lt;div&gt;&lt;input class=&quot;numin&quot; id=&quot;ni&quot; value=&quot;${r.num}&quot; inputmode=&quot;decimal&quot; placeholder=&quot;Enter answer&quot;&gt;&lt;div style=&quot;font-size:12px;color:#667;margin-top:4px&quot;&gt;Type the numerical value (e.g. 16 or 0.5)&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;keys&quot;&gt;${[&#x27;7&#x27;,&#x27;8&#x27;,&#x27;9&#x27;,&#x27;4&#x27;,&#x27;5&#x27;,&#x27;6&#x27;,&#x27;1&#x27;,&#x27;2&#x27;,&#x27;3&#x27;,&#x27;0&#x27;,&#x27;.&#x27;,&#x27;-&#x27;].map(k=&gt;`&lt;button data-k=&quot;${k}&quot;&gt;${k}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;button data-k=&quot;bk&quot; style=&quot;grid-column:span 2&quot;&gt;&amp;larr; Backspace&lt;/button&gt;&lt;button data-k=&quot;cl&quot;&gt;Clear&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
  }
  $(&#x27;#qb&#x27;).innerHTML = h;
  if(q.kind===&#x27;mcq&#x27;) document.querySelectorAll(&#x27;.opt&#x27;).forEach(o=&gt;o.onclick=()=&gt;{ r.sel=(r.sel===+o.dataset.k)?null:+o.dataset.k; paintQ(); paintPal(); });
  else {
    const ni=$(&#x27;#ni&#x27;); ni.oninput=()=&gt;{ r.num=ni.value; paintPal(); };
    document.querySelectorAll(&#x27;.keys button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{ const k=b.dataset.k; if(k===&#x27;bk&#x27;) r.num=r.num.slice(0,-1); else if(k===&#x27;cl&#x27;) r.num=&#x27;&#x27;; else r.num+=k; ni.value=r.num; paintPal(); });
  }
  $(&#x27;#pv&#x27;).disabled = cur===0; $(&#x27;#nx&#x27;).disabled = cur===Qs.length-1;
  typeset($(&#x27;#qb&#x27;));
}
function paintPal(){
  const secs=[...new Set(Qs.map(q=&gt;q.sec))];
  $(&#x27;#ss&#x27;).innerHTML = secs.map(s=&gt;{ const ids=Qs.map((q,i)=&gt;q.sec===s?i:-1).filter(i=&gt;i&gt;=0); return `&lt;b&gt;${s}&lt;/b&gt;: ${ids.filter(answered).length}/${ids.length} answered`; }).join(&#x27; &amp;middot; &#x27;);
  const ids = Qs.map((q,i)=&gt;i).filter(i=&gt;Qs[i].sec===secActive);
  let n=0, base = Qs.findIndex(q=&gt;q.sec===secActive);
  $(&#x27;#pal&#x27;).innerHTML = ids.map((i,j)=&gt;`&lt;button class=&quot;${status(i)} ${i===cur?&#x27;cur&#x27;:&#x27;&#x27;}&quot; data-i=&quot;${i}&quot;&gt;${j+1}&lt;/button&gt;`).join(&#x27;&#x27;);
  document.querySelectorAll(&#x27;#pal button&#x27;).forEach(b=&gt;b.onclick=()=&gt;go(+b.dataset.i));
}
function confirmSubmit(){
  const secs=[...new Set(Qs.map(q=&gt;q.sec))];
  const rows = secs.map(s=&gt;{ const ids=Qs.map((q,i)=&gt;q.sec===s?i:-1).filter(i=&gt;i&gt;=0); const a=ids.filter(answered).length, mk=ids.filter(i=&gt;R[i].mark).length; return `&lt;tr&gt;&lt;td&gt;${s}&lt;/td&gt;&lt;td&gt;${ids.length}&lt;/td&gt;&lt;td&gt;${a}&lt;/td&gt;&lt;td&gt;${ids.length-a}&lt;/td&gt;&lt;td&gt;${mk}&lt;/td&gt;&lt;/tr&gt;`; }).join(&#x27;&#x27;);
  const d=document.createElement(&#x27;div&#x27;); d.className=&#x27;modal&#x27;; d.innerHTML=`&lt;div class=&quot;box&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Submit test?&lt;/h3&gt;
  &lt;table class=&quot;sm&quot;&gt;&lt;tr&gt;&lt;th&gt;Section&lt;/th&gt;&lt;th&gt;Questions&lt;/th&gt;&lt;th&gt;Answered&lt;/th&gt;&lt;th&gt;Not answered&lt;/th&gt;&lt;th&gt;Marked&lt;/th&gt;&lt;/tr&gt;${rows}&lt;/table&gt;
  &lt;p style=&quot;font-size:14px&quot;&gt;Time left: &lt;b&gt;${fmt(left)}&lt;/b&gt;. You cannot change answers after submitting.&lt;/p&gt;
  &lt;div style=&quot;display:flex;gap:10px;justify-content:flex-end&quot;&gt;&lt;button class=&quot;b&quot; id=&quot;no&quot;&gt;Go back&lt;/button&gt;&lt;button class=&quot;b g&quot; id=&quot;yes&quot;&gt;Yes, submit&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
  document.body.appendChild(d); $(&#x27;#no&#x27;).onclick=()=&gt;d.remove(); $(&#x27;#yes&#x27;).onclick=()=&gt;{ d.remove(); submit(false); };
}
function correct(i){ const q=Qs[i],r=R[i]; if(!answered(i)) return null; if(q.kind===&#x27;mcq&#x27;) return r.sel===q.ans; const v=parseFloat(r.num); return isFinite(v) &amp;&amp; Math.abs(v-q.ans) &lt;= 0.01; }
function submit(auto){
  window.__active=false;
  clearInterval(tick); R[cur].t += (Date.now()-qStart)/1000;
  const used = total-left;
  const per = {}; let score=0, max=0, cor=0, wr=0, sk=0;
  Qs.forEach((q,i)=&gt;{ const S=SEC[q.sec]; per[q.sec]=per[q.sec]||{n:0,c:0,w:0,s:0,sc:0,mx:0,t:0}; const p=per[q.sec]; p.n++; p.mx+=S.pos; max+=S.pos; p.t+=R[i].t;
    const c=correct(i); if(c===null){p.s++;sk++;} else if(c){p.c++;cor++;p.sc+=S.pos;score+=S.pos;} else {p.w++;wr++;p.sc-=S.neg;score-=S.neg;} });
  const attempted=cor+wr;
  const weak = {}; Qs.forEach((q,i)=&gt;{ if(correct(i)!==true){ (weak[q.tag]=weak[q.tag]||[]).push(i+1); } });
  let h = `&lt;header&gt;&lt;h1&gt;Result &amp;middot; Circles Recall Test${name?&#x27; &amp;middot; &#x27;+name:&#x27;&#x27;}&lt;/h1&gt;&lt;div class=&quot;noprint&quot;&gt;&lt;button class=&quot;b&quot; onclick=&quot;window.print()&quot;&gt;Print / Save PDF&lt;/button&gt; &lt;button class=&quot;b&quot; onclick=&quot;location.reload()&quot;&gt;Take again&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;res&quot;&gt;`;
  h += `&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Score&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${score} / ${max}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Accuracy&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${attempted?Math.round(100*cor/attempted):0}%&lt;/div&gt;&lt;div style=&quot;font-size:12px&quot;&gt;${cor} correct of ${attempted} attempted&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Correct / Wrong / Skipped&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;&lt;span style=&quot;color:var(--green)&quot;&gt;${cor}&lt;/span&gt; / &lt;span style=&quot;color:var(--red)&quot;&gt;${wr}&lt;/span&gt; / &lt;span style=&quot;color:var(--amber)&quot;&gt;${sk}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Time used&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${fmt(used)}&lt;/div&gt;${auto?&#x27;&lt;div style=&quot;font-size:12px&quot;&gt;auto-submitted&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;`;
  h += `&lt;table class=&quot;sm&quot;&gt;&lt;tr&gt;&lt;th&gt;Section&lt;/th&gt;&lt;th&gt;Questions&lt;/th&gt;&lt;th&gt;Correct&lt;/th&gt;&lt;th&gt;Wrong&lt;/th&gt;&lt;th&gt;Skipped&lt;/th&gt;&lt;th&gt;Marks&lt;/th&gt;&lt;th&gt;Avg time / Q&lt;/th&gt;&lt;/tr&gt;${Object.keys(per).map(s=&gt;{const p=per[s];return `&lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;${s}. ${SEC[s].name}&lt;/td&gt;&lt;td&gt;${p.n}&lt;/td&gt;&lt;td&gt;${p.c}&lt;/td&gt;&lt;td&gt;${p.w}&lt;/td&gt;&lt;td&gt;${p.s}&lt;/td&gt;&lt;td&gt;${p.sc} / ${p.mx}&lt;/td&gt;&lt;td&gt;${Math.round(p.t/p.n)} s&lt;/td&gt;&lt;/tr&gt;`}).join(&#x27;&#x27;)}&lt;/table&gt;`;
  const wk=Object.keys(weak);
  h += `&lt;h3&gt;Formulas / topics to revise&lt;/h3&gt;` + (wk.length ? `&lt;div&gt;${wk.map(t=&gt;`&lt;span class=&quot;tagpill&quot;&gt;${t} &lt;small&gt;(Q ${weak[t].join(&#x27;, &#x27;)})&lt;/small&gt;&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;` : `&lt;p&gt;Nothing &amp;mdash; every question was correct. Excellent recall!&lt;/p&gt;`);
  h += `&lt;h3&gt;Question-wise review&lt;/h3&gt;&lt;div class=&quot;filters&quot;&gt;&lt;span class=&quot;chip on&quot; data-f=&quot;all&quot;&gt;All&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;bad&quot;&gt;Wrong&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;skip&quot;&gt;Skipped&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;ok&quot;&gt;Correct&lt;/span&gt;&lt;/div&gt;&lt;div id=&quot;rl&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
  $(&#x27;#app&#x27;).innerHTML=h;
  const paint = f =&gt; {
    $(&#x27;#rl&#x27;).innerHTML = Qs.map((q,i)=&gt;{ const c=correct(i); const cls=c===null?&#x27;skip&#x27;:c?&#x27;ok&#x27;:&#x27;bad&#x27;; if(f!==&#x27;all&#x27;&amp;&amp;f!==cls) return &#x27;&#x27;;
      const yours = c===null?&#x27;&lt;i&gt;not answered&lt;/i&gt;&#x27; : q.kind===&#x27;mcq&#x27; ? `${&#x27;ABCD&#x27;[R[i].sel]}. ${M(q.opts[R[i].sel])}` : R[i].num;
      const right = q.kind===&#x27;mcq&#x27; ? `${&#x27;ABCD&#x27;[q.ans]}. ${M(q.opts[q.ans])}` : q.ans;
      return `&lt;div class=&quot;rq ${cls}&quot;&gt;&lt;div class=&quot;meta&quot;&gt;Q${i+1} &amp;middot; Section ${q.sec} &amp;middot; ${q.tag} &amp;middot; time ${Math.round(R[i].t)} s &amp;middot; ${c===null?&#x27;Skipped&#x27;:c?&#x27;Correct&#x27;:&#x27;Wrong&#x27;}&lt;/div&gt;&lt;div class=&quot;stem&quot; style=&quot;font-size:17px;margin-bottom:6px&quot;&gt;${M(q.stem)}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Your answer:&lt;/b&gt; ${yours}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Correct answer:&lt;/b&gt; ${right}&lt;/div&gt;&lt;div class=&quot;exp&quot;&gt;${M(q.exp)}&lt;/div&gt;&lt;/div&gt;`; }).join(&#x27;&#x27;);
    typeset($(&#x27;#rl&#x27;));
  };
  paint(&#x27;all&#x27;);
  document.querySelectorAll(&#x27;.chip&#x27;).forEach(c=&gt;c.onclick=()=&gt;{ document.querySelectorAll(&#x27;.chip&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;)); c.classList.add(&#x27;on&#x27;); paint(c.dataset.f); });
  window.scrollTo(0,0);
}
startScreen();
