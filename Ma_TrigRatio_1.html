&lt;h1&gt;Trigonometry &amp;mdash; Must-Remember Identities&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;Everything circled / cloud-boxed or starred in the class notes (VG Sir, JEE Advanced, 22 Apr &amp;ndash; 18 May 2026) &amp;middot; 80 identities &amp;middot; page references are the notebook&#x27;s own page numbers&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;button onclick=&quot;window.print()&quot;&gt;Print / Save as PDF&lt;/button&gt;&lt;/div&gt;

&lt;section&gt;&lt;h2&gt;1. Angles, quadrants, standard values &lt;span class=&quot;pg&quot;&gt;pp. 25-26&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{\pi}{2}=90^\circ,\quad \dfrac{\pi}{3}=60^\circ,\quad \dfrac{\pi}{4}=45^\circ,\quad \dfrac{\pi}{6}=30^\circ\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \pi\ \text{rad}=180^\circ;\qquad \text{arc}=r\theta\ \ (\theta\text{ in radians})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{ASTC: All (I), Sin (II), Tan (III), Cos (IV) are positive}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \theta:\ 0^\circ\to90^\circ\ \Rightarrow\ \sin\uparrow\ [0,1],\ \cos\downarrow\ [1,0],\ \tan\uparrow\ [0,\infty)\ \ (\tan90^\circ\text{ undefined})\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;2. Graphs, special values, general solutions &lt;span class=&quot;pg&quot;&gt;pp. 27-28&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin x=0\iff x=n\pi;\quad \cos x=0\iff x=(2n+1)\tfrac\pi2;\quad \tan x=0\iff x=n\pi\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin\!\left(2n\pi+\tfrac\pi2\right)=1,\quad \sin\!\left(2n\pi+\tfrac{3\pi}{2}\right)=-1,\quad \cos(2n\pi)=1,\quad \cos\big((2n+1)\pi\big)=-1\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan\!\left((2n+1)\tfrac\pi2\right)\ \text{is not defined}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin\theta=\sin\alpha\Rightarrow\theta=n\pi+(-1)^n\alpha\ \ (\text{i.e. }2n\pi+\alpha\text{ or }(2n+1)\pi-\alpha)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cos\theta=\cos\alpha\Rightarrow\theta=2n\pi\pm\alpha\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan\theta=\tan\alpha\Rightarrow\theta=n\pi+\alpha\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;11&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin,\cos:\ \text{domain }\mathbb R,\ \text{range }[-1,1];\qquad \tan:\ \text{domain }\mathbb R\setminus\{(2n+1)\tfrac\pi2\},\ \text{range }\mathbb R\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;3. Compound angles &lt;span class=&quot;pg&quot;&gt;p. 30&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;12&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin(A\pm B)=\sin A\cos B\pm\cos A\sin B\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;13&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cos(A\pm B)=\cos A\cos B\mp\sin A\sin B\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;14&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin(-\theta)=-\sin\theta,\quad\cos(-\theta)=\cos\theta,\quad\tan(-\theta)=-\tan\theta\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;4. Reduction formulas and the nπ/2 ± θ trick &lt;span class=&quot;pg&quot;&gt;pp. 31-32&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;15&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin(\tfrac\pi2-\theta)=\cos\theta,\ \ \cos(\tfrac\pi2-\theta)=\sin\theta,\ \ \tan(\tfrac\pi2-\theta)=\cot\theta\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;16&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin(\tfrac\pi2+\theta)=\cos\theta,\ \ \cos(\tfrac\pi2+\theta)=-\sin\theta,\ \ \tan(\tfrac\pi2+\theta)=-\cot\theta\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;17&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin(\pi-\theta)=\sin\theta,\ \ \cos(\pi-\theta)=-\cos\theta,\ \ \tan(\pi-\theta)=-\tan\theta\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;18&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin(\pi+\theta)=-\sin\theta,\ \ \cos(\pi+\theta)=-\cos\theta,\ \ \tan(\pi+\theta)=\tan\theta\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;19&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin(\tfrac{3\pi}2-\theta)=-\cos\theta,\ \ \cos(\tfrac{3\pi}2-\theta)=-\sin\theta,\ \ \tan(\tfrac{3\pi}2-\theta)=\cot\theta\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;20&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin(\tfrac{3\pi}2+\theta)=-\cos\theta,\ \ \cos(\tfrac{3\pi}2+\theta)=\sin\theta,\ \ \tan(\tfrac{3\pi}2+\theta)=-\cot\theta\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;21&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin(2\pi-\theta)=-\sin\theta,\ \ \cos(2\pi-\theta)=\cos\theta,\ \ \tan(2\pi-\theta)=-\tan\theta;\ \ \ (2\pi+\theta)\text{ : no change}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;22&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Trick for }\tfrac{n\pi}{2}\pm\theta:\ n\text{ odd}\Rightarrow\sin\leftrightarrow\cos,\ \tan\leftrightarrow\cot;\ \ n\text{ even}\Rightarrow\text{no change. Put the sign of the original function in that quadrant.}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;23&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Large angles: subtract multiples of }360^\circ\ (\text{e.g. }\sin1099^\circ=\sin19^\circ)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;5. tan / cot compound and square formulas &lt;span class=&quot;pg&quot;&gt;p. 33&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;24&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin(A+B)\sin(A-B)=\sin^2A-\sin^2B=\cos^2B-\cos^2A\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;25&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cos(A+B)\cos(A-B)=\cos^2A-\sin^2B\quad(\text{power 2 on sin/cos}\Rightarrow\text{think of this})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;26&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin^2A+\sin^2B=1-(\cos^2A-\sin^2B)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;27&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan(A+B)=\dfrac{\tan A+\tan B}{1-\tan A\tan B},\qquad \tan(A-B)=\dfrac{\tan A-\tan B}{1+\tan A\tan B}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;28&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cot(A+B)=\dfrac{\cot A\cot B-1}{\cot A+\cot B},\qquad \cot(A-B)=\dfrac{\cot A\cot B+1}{\cot B-\cot A}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;6. Special angles &lt;span class=&quot;pg&quot;&gt;pp. 34, 46, 50&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;29&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin15^\circ=\cos75^\circ=\dfrac{\sqrt3-1}{2\sqrt2},\qquad \sin75^\circ=\cos15^\circ=\dfrac{\sqrt3+1}{2\sqrt2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;30&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan15^\circ=\cot75^\circ=\dfrac{\sqrt3-1}{\sqrt3+1}=2-\sqrt3,\qquad \tan75^\circ=\cot15^\circ=2+\sqrt3\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;31&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan22.5^\circ=\cot67.5^\circ=\sqrt2-1,\qquad \cot22.5^\circ=\tan67.5^\circ=\sqrt2+1\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;32&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin18^\circ=\cos72^\circ=\dfrac{\sqrt5-1}{4},\qquad \cos36^\circ=\sin54^\circ=\dfrac{\sqrt5+1}{4}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;7. Sums of tan / cot as a single fraction &lt;span class=&quot;pg&quot;&gt;p. 34&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;33&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan A+\tan B=\dfrac{\sin(A+B)}{\cos A\cos B},\qquad \tan A-\tan B=\dfrac{\sin(A-B)}{\cos A\cos B}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;34&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cot A+\cot B=\dfrac{\sin(A+B)}{\sin A\sin B},\qquad \cot A-\cot B=\dfrac{\sin(B-A)}{\sin A\sin B}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;8. Product ↔ sum &lt;span class=&quot;pg&quot;&gt;p. 37&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;35&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle 2\sin A\cos B=\sin(A+B)+\sin(A-B)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;36&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle 2\cos A\cos B=\cos(A+B)+\cos(A-B)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;37&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle 2\sin A\sin B=\cos(A-B)-\cos(A+B)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;38&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin C+\sin D=2\sin\tfrac{C+D}{2}\cos\tfrac{C-D}{2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;39&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin C-\sin D=2\cos\tfrac{C+D}{2}\sin\tfrac{C-D}{2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;40&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cos C+\cos D=2\cos\tfrac{C+D}{2}\cos\tfrac{C-D}{2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;41&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cos C-\cos D=-2\sin\tfrac{C+D}{2}\sin\tfrac{C-D}{2}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;9. Double and triple angles &lt;span class=&quot;pg&quot;&gt;pp. 41-42&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;42&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin2A=2\sin A\cos A=\dfrac{2\tan A}{1+\tan^2A}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;43&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cos2A=\cos^2A-\sin^2A=1-2\sin^2A=2\cos^2A-1=\dfrac{1-\tan^2A}{1+\tan^2A}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;44&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan2A=\dfrac{2\tan A}{1-\tan^2A}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;45&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle 1+\cos2A=2\cos^2A,\quad 1-\cos2A=2\sin^2A,\quad 1+\sin2A=(\sin A+\cos A)^2,\quad 1-\sin2A=(\sin A-\cos A)^2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;46&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin3A=3\sin A-4\sin^3A,\qquad \cos3A=4\cos^3A-3\cos A,\qquad \tan3A=\dfrac{3\tan A-\tan^3A}{1-3\tan^2A}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;47&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cot A-\tan A=2\cot2A\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan(A+B)-\tan A-\tan B=\tan(A+B)\tan A\tan B\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;49&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Homogeneous equation (cloud, p. 41): }\text{combined power of }\alpha,\beta\text{ is the same in every term; divide by }\beta^2\text{ and put }t=\tfrac\alpha\beta:\ \ 2\alpha^2+\alpha\beta-\beta^2=0\ \to\ 2t^2+t-1=0\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;10. tan of a sum of many angles &lt;span class=&quot;pg&quot;&gt;pp. 42-43&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;50&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan(\theta_1+\dots+\theta_n)=\dfrac{S_1-S_3+S_5-\cdots}{1-S_2+S_4-\cdots},\quad S_k=\text{sum of products of }\tan\theta_i\text{ taken }k\text{ at a time}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;51&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan(A+B+C)=\dfrac{\tan A+\tan B+\tan C-\tan A\tan B\tan C}{1-(\tan A\tan B+\tan B\tan C+\tan C\tan A)}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;11. Triple-product identities and power sums &lt;span class=&quot;pg&quot;&gt;p. 46&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;52&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin\theta\sin(60^\circ-\theta)\sin(60^\circ+\theta)=\dfrac{\sin3\theta}{4}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;53&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cos\theta\cos(60^\circ-\theta)\cos(60^\circ+\theta)=\dfrac{\cos3\theta}{4}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;54&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan\theta\tan(60^\circ-\theta)\tan(60^\circ+\theta)=\tan3\theta\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;55&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cos\theta\cos2\theta\cos4\theta\cdots\cos2^{n-1}\theta=\dfrac{\sin2^n\theta}{2^n\sin\theta}\quad(\star)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;56&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin^4\theta+\cos^4\theta=1-\tfrac12\sin^22\theta,\qquad \sin^6\theta+\cos^6\theta=1-\tfrac34\sin^22\theta\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;12. Conditional identities (A + B + C = π) &lt;span class=&quot;pg&quot;&gt;pp. 52-54&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;57&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin2A+\sin2B+\sin2C=4\sin A\sin B\sin C\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;58&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin^2A+\sin^2B+\sin^2C=2+2\cos A\cos B\cos C\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;59&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin\tfrac A2+\sin\tfrac B2+\sin\tfrac C2-1=4\sin\tfrac{\pi-A}{4}\sin\tfrac{\pi-B}{4}\sin\tfrac{\pi-C}{4}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;60&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan A+\tan B+\tan C=\tan A\tan B\tan C\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;61&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cot A\cot B+\cot B\cot C+\cot C\cot A=1\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;62&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan\tfrac A2\tan\tfrac B2+\tan\tfrac B2\tan\tfrac C2+\tan\tfrac C2\tan\tfrac A2=1\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;63&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cot\tfrac A2+\cot\tfrac B2+\cot\tfrac C2=\cot\tfrac A2\cot\tfrac B2\cot\tfrac C2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;64&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Converse }(\star):\ \tan A+\tan B+\tan C=\tan A\tan B\tan C\Rightarrow A+B+C=n\pi\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;13. Series of sines and cosines (angles in A.P.) &lt;span class=&quot;pg&quot;&gt;pp. 55-57&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;65&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin\alpha+\sin(\alpha+\beta)+\dots+\sin(\alpha+(n-1)\beta)=\dfrac{\sin\frac{n\beta}2\ \sin\frac{2\alpha+(n-1)\beta}{2}}{\sin\frac\beta2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;66&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cos\alpha+\cos(\alpha+\beta)+\dots+\cos(\alpha+(n-1)\beta)=\dfrac{\sin\frac{n\beta}2\ \cos\frac{2\alpha+(n-1)\beta}{2}}{\sin\frac\beta2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;67&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{In words: }\dfrac{\sin\big(\frac{(\text{no. of terms})(\text{diff})}{2}\big)\ \sin\big(\frac{\text{first}+\text{last angle}}{2}\big)}{\sin(\text{diff}/2)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;68&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Alternating series }(\star,\ \text{p. 57): }\sin\theta-\sin2\theta+\sin3\theta-\cdots=\sin\theta+\sin(\pi+2\theta)+\sin(2\pi+3\theta)+\cdots,\ \text{ common difference }\pi+\theta\ \text{ in the series formula}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;14. Telescoping tricks &lt;span class=&quot;pg&quot;&gt;pp. 58-60&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;69&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan\tfrac{x}{2^r}\sec\tfrac{x}{2^{r-1}}=\tan\tfrac{x}{2^{r-1}}-\tan\tfrac{x}{2^r}\ \Rightarrow\ \sum_{r=1}^{n}=\tan x-\tan\tfrac{x}{2^n}\quad(\star)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;70&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \operatorname{cosec}\theta=\cot\tfrac\theta2-\cot\theta\ \Rightarrow\ \sum_{r=1}^{n}\operatorname{cosec}(2^{r-1}x)=\cot\tfrac x2-\cot(2^{n-1}x)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;71&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin\theta\sec3\theta=\tfrac12(\tan3\theta-\tan\theta)\ \Rightarrow\ \sum_{r=1}^{n}\sin(3^{r-1}x)\sec(3^rx)=\tfrac12(\tan3^nx-\tan x)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;15. Triangle ABC: maxima and minima &lt;span class=&quot;pg&quot;&gt;pp. 60-63&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;72&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cot^2A+\cot^2B+\cot^2C\ \ge\ \cot A\cot B+\cot B\cot C+\cot C\cot A=1\quad(\text{min }1)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;73&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cot A+\cot B+\cot C\ \ge\ \sqrt3\quad(\text{min at }A=B=C=60^\circ)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;74&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin\tfrac A2\sin\tfrac B2\sin\tfrac C2\le\tfrac18,\qquad \cos A\cos B\cos C\le\tfrac18,\qquad \cos A+\cos B+\cos C\le\tfrac32\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;&lt;h2&gt;16. Range of trigonometric functions &lt;span class=&quot;pg&quot;&gt;pp. 63-69&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;75&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a\sin x+b\cos x=\sqrt{a^2+b^2}\,\sin(x+\varphi)\ \Rightarrow\ \text{range }[-\sqrt{a^2+b^2},\ \sqrt{a^2+b^2}]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;76&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle x+\tfrac1x\ge2\ (x&gt;0,\ \text{equality at }x=1);\qquad x+\tfrac1x\le-2\ (x&lt;0,\ \text{equality at }x=-1)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;77&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{A number and its reciprocal }\Rightarrow\text{ make a perfect square, e.g. }4\tan^2x+\cot^2x=(2\tan x-\cot x)^2+4\ge4\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;78&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Always check that equality is actually attainable (e.g. }\sin^2x=2\text{ is impossible).}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;79&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{If a continuous function takes values }a\text{ and }b,\text{ it takes every value in }[a,b]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;80&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle x^2+y^2=r^2,\ a^2+b^2=s^2\ \Rightarrow\ |ax+by|\le rs\ \ (\text{trig substitution or }(ax+by)^2+(bx-ay)^2=(a^2+b^2)(x^2+y^2))\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;div class=&quot;notes&quot;&gt;&lt;b&gt;Small slips in the handwritten notes (as I read them) &amp;mdash; the sheet above uses the corrected forms:&lt;/b&gt;
&lt;ul&gt;
&lt;li&gt;p. 28: for tan &amp;theta; = tan &amp;alpha; the note gives &lt;b&gt;&amp;theta; = n&amp;pi; &amp;plusmn; &amp;alpha;&lt;/b&gt;; the correct general solution is &lt;b&gt;n&amp;pi; + &amp;alpha;&lt;/b&gt; (the &amp;plusmn; belongs to cos).&lt;/li&gt;
&lt;li&gt;p. 31: &lt;i&gt;sin(&amp;pi;/2 + &amp;theta;)&lt;/i&gt; reads as sin&amp;theta;; the correct value is &lt;b&gt;cos&amp;theta;&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;p. 37: the fourth compound-angle line reads &lt;i&gt;cos(A+B) = cosAcosB + sinAcosB&lt;/i&gt;; it should be &lt;b&gt;cos(A&amp;minus;B) = cosAcosB + sinAsinB&lt;/b&gt;. The boxed line &amp;ldquo;cosD + cosC = &amp;minus;2 sin sin&amp;rdquo; should read &lt;b&gt;cosC &amp;minus; cosD = &amp;minus;2 sin&amp;frac12;(C+D) sin&amp;frac12;(C&amp;minus;D)&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;p. 38 (Ex. 5): the denominator comes out as cos 6&amp;alpha;, not cos 12&amp;alpha;; with &amp;alpha; = &amp;pi;/19 the ratio is exactly &lt;b&gt;&amp;minus;1&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;p. 40: the working for sin&amp;pi;/7 sin3&amp;pi;/7 sin5&amp;pi;/7 is left unfinished; the value is &lt;b&gt;&amp;radic;7/8&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;p. 41: in the homogeneous-equation example the middle term is written 3(&amp;alpha;&amp;beta;/&amp;beta;&amp;sup2;); dividing 2&amp;alpha;&amp;sup2; + &amp;alpha;&amp;beta; &amp;minus; &amp;beta;&amp;sup2; = 0 by &amp;beta;&amp;sup2; gives &lt;b&gt;2t&amp;sup2; + t &amp;minus; 1 = 0&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;p. 44 Q(i): 8sin&amp;sup3;40&amp;deg; &amp;minus; 6sin40&amp;deg; = &amp;minus;2 sin120&amp;deg; = &lt;b&gt;&amp;minus;&amp;radic;3&lt;/b&gt; (the note shows +&amp;radic;3; the sign slips because 4sin&amp;sup3;A &amp;minus; 3sinA = &amp;minus;sin3A).&lt;/li&gt;
&lt;li&gt;p. 63: y&lt;sub&gt;max&lt;/sub&gt; = &amp;radic;(a&amp;sup2;+b&amp;sup2;) (the note has &amp;radic;(a+b&amp;sup2;)).&lt;/li&gt;
&lt;li&gt;p. 64: range of 4tan x cos x is the open interval &lt;b&gt;(&amp;minus;4, 4)&lt;/b&gt;, because sin x &amp;ne; &amp;plusmn;1 there (the bracket on the page looks closed at &amp;minus;4).&lt;/li&gt;
&lt;li&gt;p. 66: the working for cos2x + 3sin x does not reproduce 1 &amp;minus; 2sin&amp;sup2;x + 3sin x (the &amp;minus;&amp;frac12;[&amp;hellip;] step drops the factor 2) and stops without a range; the correct range is &lt;b&gt;[&amp;minus;4, 17/8]&lt;/b&gt;.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

        &lt;button class=&quot;b&quot; id=&quot;nx&quot;&gt;Next &amp;raquo;&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;secsum&quot; id=&quot;ss&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;pal&quot; id=&quot;pal&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;legend&quot;&gt;
        &lt;span&gt;&lt;i style=&quot;background:var(--grey)&quot;&gt;&amp;nbsp;&lt;/i&gt;Not visited&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--red)&quot;&gt;&amp;nbsp;&lt;/i&gt;Not answered&lt;/span&gt;
        &lt;span&gt;&lt;i style=&quot;background:var(--green)&quot;&gt;&amp;nbsp;&lt;/i&gt;Answered&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:var(--purple)&quot;&gt;&amp;nbsp;&lt;/i&gt;Marked&lt;/span&gt;
      &lt;/div&gt;
      &lt;p style=&quot;text-align:center;margin:14px 0 4px&quot;&gt;&lt;button class=&quot;b g&quot; id=&quot;sub&quot; style=&quot;width:100%;padding:11px&quot;&gt;Submit Test&lt;/button&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;`;
  document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.onclick=()=&gt;{ const i=Qs.findIndex(q=&gt;q.sec===t.dataset.s); go(i); });
  $(&#x27;#sn&#x27;).onclick=()=&gt;{ nextAfter(); };
  $(&#x27;#mn&#x27;).onclick=()=&gt;{ R[cur].mark=true; nextAfter(true); };
  $(&#x27;#cl&#x27;).onclick=()=&gt;{ R[cur].sel=null; R[cur].num=&#x27;&#x27;; paintQ(); paintPal(); };
  $(&#x27;#pv&#x27;).onclick=()=&gt;go(Math.max(0,cur-1));
  $(&#x27;#nx&#x27;).onclick=()=&gt;go(Math.min(Qs.length-1,cur+1));
  $(&#x27;#sub&#x27;).onclick=confirmSubmit;
}
function nextAfter(){ if(cur&lt;Qs.length-1) go(cur+1); else { paintQ(); paintPal(); } }
function go(i, first){
  if(!first){ R[cur].t += (Date.now()-qStart)/1000; }
  cur=i; qStart=Date.now(); R[cur].vis=true; secActive=Qs[cur].sec; paintQ(); paintPal();
}
function paintQ(){
  const q=Qs[cur], r=R[cur], S=SEC[q.sec];
  const idxInSec = Qs.filter(x=&gt;x.sec===q.sec).indexOf(q)+1, nSec = Qs.filter(x=&gt;x.sec===q.sec).length;
  document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.classList.toggle(&#x27;on&#x27;,t.dataset.s===q.sec));
  $(&#x27;#qh&#x27;).innerHTML = `&lt;span&gt;&lt;b&gt;Question ${cur+1}&lt;/b&gt; of ${Qs.length} &amp;nbsp;|&amp;nbsp; ${q.sec}${idxInSec}/${nSec}&lt;/span&gt;&lt;span&gt;Marks: &lt;b style=&quot;color:var(--green)&quot;&gt;+${S.pos}&lt;/b&gt; / &lt;b style=&quot;color:var(--red)&quot;&gt;&amp;minus;${S.neg}&lt;/b&gt;&lt;/span&gt;`;
  let h = `&lt;div class=&quot;stem&quot;&gt;${M(q.stem)}&lt;/div&gt;`;
  if(q.kind===&#x27;mcq&#x27;){
    h += q.opts.map((o,k)=&gt;`&lt;div class=&quot;opt ${r.sel===k?&#x27;sel&#x27;:&#x27;&#x27;}&quot; data-k=&quot;${k}&quot;&gt;&lt;span class=&quot;L&quot;&gt;${&#x27;ABCD&#x27;[k]}.&lt;/span&gt;&lt;span&gt;${M(o)}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  } else {
    h += `&lt;div class=&quot;numbox&quot;&gt;&lt;div&gt;&lt;input class=&quot;numin&quot; id=&quot;ni&quot; value=&quot;${r.num}&quot; inputmode=&quot;decimal&quot; placeholder=&quot;Enter answer&quot;&gt;&lt;div style=&quot;font-size:12px;color:#667;margin-top:4px&quot;&gt;Type the numerical value (e.g. 16 or 0.5)&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;keys&quot;&gt;${[&#x27;7&#x27;,&#x27;8&#x27;,&#x27;9&#x27;,&#x27;4&#x27;,&#x27;5&#x27;,&#x27;6&#x27;,&#x27;1&#x27;,&#x27;2&#x27;,&#x27;3&#x27;,&#x27;0&#x27;,&#x27;.&#x27;,&#x27;-&#x27;].map(k=&gt;`&lt;button data-k=&quot;${k}&quot;&gt;${k}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;button data-k=&quot;bk&quot; style=&quot;grid-column:span 2&quot;&gt;&amp;larr; Backspace&lt;/button&gt;&lt;button data-k=&quot;cl&quot;&gt;Clear&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
  }
  $(&#x27;#qb&#x27;).innerHTML = h;
  if(q.kind===&#x27;mcq&#x27;) document.querySelectorAll(&#x27;.opt&#x27;).forEach(o=&gt;o.onclick=()=&gt;{ r.sel=(r.sel===+o.dataset.k)?null:+o.dataset.k; paintQ(); paintPal(); });
  else {
    const ni=$(&#x27;#ni&#x27;); ni.oninput=()=&gt;{ r.num=ni.value; paintPal(); };
    document.querySelectorAll(&#x27;.keys button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{ const k=b.dataset.k; if(k===&#x27;bk&#x27;) r.num=r.num.slice(0,-1); else if(k===&#x27;cl&#x27;) r.num=&#x27;&#x27;; else r.num+=k; ni.value=r.num; paintPal(); });
  }
  $(&#x27;#pv&#x27;).disabled = cur===0; $(&#x27;#nx&#x27;).disabled = cur===Qs.length-1;
  typeset($(&#x27;#qb&#x27;));
}
function paintPal(){
  const secs=[...new Set(Qs.map(q=&gt;q.sec))];
  $(&#x27;#ss&#x27;).innerHTML = secs.map(s=&gt;{ const ids=Qs.map((q,i)=&gt;q.sec===s?i:-1).filter(i=&gt;i&gt;=0); return `&lt;b&gt;${s}&lt;/b&gt;: ${ids.filter(answered).length}/${ids.length} answered`; }).join(&#x27; &amp;middot; &#x27;);
  const ids = Qs.map((q,i)=&gt;i).filter(i=&gt;Qs[i].sec===secActive);
  let n=0, base = Qs.findIndex(q=&gt;q.sec===secActive);
  $(&#x27;#pal&#x27;).innerHTML = ids.map((i,j)=&gt;`&lt;button class=&quot;${status(i)} ${i===cur?&#x27;cur&#x27;:&#x27;&#x27;}&quot; data-i=&quot;${i}&quot;&gt;${j+1}&lt;/button&gt;`).join(&#x27;&#x27;);
  document.querySelectorAll(&#x27;#pal button&#x27;).forEach(b=&gt;b.onclick=()=&gt;go(+b.dataset.i));
}
function confirmSubmit(){
  const secs=[...new Set(Qs.map(q=&gt;q.sec))];
  const rows = secs.map(s=&gt;{ const ids=Qs.map((q,i)=&gt;q.sec===s?i:-1).filter(i=&gt;i&gt;=0); const a=ids.filter(answered).length, mk=ids.filter(i=&gt;R[i].mark).length; return `&lt;tr&gt;&lt;td&gt;${s}&lt;/td&gt;&lt;td&gt;${ids.length}&lt;/td&gt;&lt;td&gt;${a}&lt;/td&gt;&lt;td&gt;${ids.length-a}&lt;/td&gt;&lt;td&gt;${mk}&lt;/td&gt;&lt;/tr&gt;`; }).join(&#x27;&#x27;);
  const d=document.createElement(&#x27;div&#x27;); d.className=&#x27;modal&#x27;; d.innerHTML=`&lt;div class=&quot;box&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Submit test?&lt;/h3&gt;
  &lt;table class=&quot;sm&quot;&gt;&lt;tr&gt;&lt;th&gt;Section&lt;/th&gt;&lt;th&gt;Questions&lt;/th&gt;&lt;th&gt;Answered&lt;/th&gt;&lt;th&gt;Not answered&lt;/th&gt;&lt;th&gt;Marked&lt;/th&gt;&lt;/tr&gt;${rows}&lt;/table&gt;
  &lt;p style=&quot;font-size:14px&quot;&gt;Time left: &lt;b&gt;${fmt(left)}&lt;/b&gt;. You cannot change answers after submitting.&lt;/p&gt;
  &lt;div style=&quot;display:flex;gap:10px;justify-content:flex-end&quot;&gt;&lt;button class=&quot;b&quot; id=&quot;no&quot;&gt;Go back&lt;/button&gt;&lt;button class=&quot;b g&quot; id=&quot;yes&quot;&gt;Yes, submit&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
  document.body.appendChild(d); $(&#x27;#no&#x27;).onclick=()=&gt;d.remove(); $(&#x27;#yes&#x27;).onclick=()=&gt;{ d.remove(); submit(false); };
}
function correct(i){ const q=Qs[i],r=R[i]; if(!answered(i)) return null; if(q.kind===&#x27;mcq&#x27;) return r.sel===q.ans; const v=parseFloat(r.num); return isFinite(v) &amp;&amp; Math.abs(v-q.ans) &lt;= 0.01; }
function submit(auto){
  window.__active=false;
  clearInterval(tick); R[cur].t += (Date.now()-qStart)/1000;
  const used = total-left;
  const per = {}; let score=0, max=0, cor=0, wr=0, sk=0;
  Qs.forEach((q,i)=&gt;{ const S=SEC[q.sec]; per[q.sec]=per[q.sec]||{n:0,c:0,w:0,s:0,sc:0,mx:0,t:0}; const p=per[q.sec]; p.n++; p.mx+=S.pos; max+=S.pos; p.t+=R[i].t;
    const c=correct(i); if(c===null){p.s++;sk++;} else if(c){p.c++;cor++;p.sc+=S.pos;score+=S.pos;} else {p.w++;wr++;p.sc-=S.neg;score-=S.neg;} });
  const attempted=cor+wr;
  const weak = {}; Qs.forEach((q,i)=&gt;{ if(correct(i)!==true){ (weak[q.tag]=weak[q.tag]||[]).push(i+1); } });
  let h = `&lt;header&gt;&lt;h1&gt;Result &amp;middot; Trigonometry Recall Test${name?&#x27; &amp;middot; &#x27;+name:&#x27;&#x27;}&lt;/h1&gt;&lt;div class=&quot;noprint&quot;&gt;&lt;button class=&quot;b&quot; onclick=&quot;window.print()&quot;&gt;Print / Save PDF&lt;/button&gt; &lt;button class=&quot;b&quot; onclick=&quot;location.reload()&quot;&gt;Take again&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;res&quot;&gt;`;
  h += `&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Score&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${score} / ${max}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Accuracy&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${attempted?Math.round(100*cor/attempted):0}%&lt;/div&gt;&lt;div style=&quot;font-size:12px&quot;&gt;${cor} correct of ${attempted} attempted&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Correct / Wrong / Skipped&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;&lt;span style=&quot;color:var(--green)&quot;&gt;${cor}&lt;/span&gt; / &lt;span style=&quot;color:var(--red)&quot;&gt;${wr}&lt;/span&gt; / &lt;span style=&quot;color:var(--amber)&quot;&gt;${sk}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Time used&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${fmt(used)}&lt;/div&gt;${auto?&#x27;&lt;div style=&quot;font-size:12px&quot;&gt;auto-submitted&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;`;
  h += `&lt;table class=&quot;sm&quot;&gt;&lt;tr&gt;&lt;th&gt;Section&lt;/th&gt;&lt;th&gt;Questions&lt;/th&gt;&lt;th&gt;Correct&lt;/th&gt;&lt;th&gt;Wrong&lt;/th&gt;&lt;th&gt;Skipped&lt;/th&gt;&lt;th&gt;Marks&lt;/th&gt;&lt;th&gt;Avg time / Q&lt;/th&gt;&lt;/tr&gt;${Object.keys(per).map(s=&gt;{const p=per[s];return `&lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;${s}. ${SEC[s].name}&lt;/td&gt;&lt;td&gt;${p.n}&lt;/td&gt;&lt;td&gt;${p.c}&lt;/td&gt;&lt;td&gt;${p.w}&lt;/td&gt;&lt;td&gt;${p.s}&lt;/td&gt;&lt;td&gt;${p.sc} / ${p.mx}&lt;/td&gt;&lt;td&gt;${Math.round(p.t/p.n)} s&lt;/td&gt;&lt;/tr&gt;`}).join(&#x27;&#x27;)}&lt;/table&gt;`;
  const wk=Object.keys(weak);
  h += `&lt;h3&gt;Formulas / topics to revise&lt;/h3&gt;` + (wk.length ? `&lt;div&gt;${wk.map(t=&gt;`&lt;span class=&quot;tagpill&quot;&gt;${t} &lt;small&gt;(Q ${weak[t].join(&#x27;, &#x27;)})&lt;/small&gt;&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;` : `&lt;p&gt;Nothing &amp;mdash; every question was correct. Excellent recall!&lt;/p&gt;`);
  h += `&lt;h3&gt;Question-wise review&lt;/h3&gt;&lt;div class=&quot;filters&quot;&gt;&lt;span class=&quot;chip on&quot; data-f=&quot;all&quot;&gt;All&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;bad&quot;&gt;Wrong&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;skip&quot;&gt;Skipped&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;ok&quot;&gt;Correct&lt;/span&gt;&lt;/div&gt;&lt;div id=&quot;rl&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
  $(&#x27;#app&#x27;).innerHTML=h;
  const paint = f =&gt; {
    $(&#x27;#rl&#x27;).innerHTML = Qs.map((q,i)=&gt;{ const c=correct(i); const cls=c===null?&#x27;skip&#x27;:c?&#x27;ok&#x27;:&#x27;bad&#x27;; if(f!==&#x27;all&#x27;&amp;&amp;f!==cls) return &#x27;&#x27;;
      const yours = c===null?&#x27;&lt;i&gt;not answered&lt;/i&gt;&#x27; : q.kind===&#x27;mcq&#x27; ? `${&#x27;ABCD&#x27;[R[i].sel]}. ${M(q.opts[R[i].sel])}` : R[i].num;
      const right = q.kind===&#x27;mcq&#x27; ? `${&#x27;ABCD&#x27;[q.ans]}. ${M(q.opts[q.ans])}` : q.ans;
      return `&lt;div class=&quot;rq ${cls}&quot;&gt;&lt;div class=&quot;meta&quot;&gt;Q${i+1} &amp;middot; Section ${q.sec} &amp;middot; ${q.tag} &amp;middot; time ${Math.round(R[i].t)} s &amp;middot; ${c===null?&#x27;Skipped&#x27;:c?&#x27;Correct&#x27;:&#x27;Wrong&#x27;}&lt;/div&gt;&lt;div class=&quot;stem&quot; style=&quot;font-size:17px;margin-bottom:6px&quot;&gt;${M(q.stem)}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Your answer:&lt;/b&gt; ${yours}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Correct answer:&lt;/b&gt; ${right}&lt;/div&gt;&lt;div class=&quot;exp&quot;&gt;${M(q.exp)}&lt;/div&gt;&lt;/div&gt;`; }).join(&#x27;&#x27;);
    typeset($(&#x27;#rl&#x27;));
  };
  paint(&#x27;all&#x27;);
  document.querySelectorAll(&#x27;.chip&#x27;).forEach(c=&gt;c.onclick=()=&gt;{ document.querySelectorAll(&#x27;.chip&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;)); c.classList.add(&#x27;on&#x27;); paint(c.dataset.f); });
  window.scrollTo(0,0);
}
startScreen();
&lt;/script&gt;
