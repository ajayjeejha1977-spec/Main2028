<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigonometry Recall CBT - VG Sir Notes</title>

window.MathJax = { tex: { inlineMath: [['\\(', '\\)']] }, options: { skipHtmlTags: ['script','noscript','style','textarea'] } };

<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
:root{--blue:#1a4f8b;--blue2:#2a6fb5;--ink:#1d2733;--line:#cfd8e3;--bg:#eef2f7;--green:#2e9e4f;--red:#d9453d;--purple:#7a4bb8;--grey:#b9c3cf;--amber:#e0a100}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:16px}
header{background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600}
.timer{background:#fff;color:var(--blue);font-weight:700;padding:4px 12px;border-radius:4px;font-variant-numeric:tabular-nums;font-size:18px}
.timer.low{color:var(--red)}
.wrap{display:flex;gap:12px;padding:12px;align-items:flex-start}
.main{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:6px}
.side{width:290px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;position:sticky;top:8px}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:9px 14px;cursor:pointer;font-size:14px;border-right:1px solid var(--line);background:#f6f8fb}
.tab.on{background:var(--blue2);color:#fff;font-weight:600}
.qhead{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;color:#46566a;flex-wrap:wrap;gap:6px}
.qhead b{color:var(--ink)}
.qbody{padding:18px 20px;min-height:260px}
.stem{font-size:19px;line-height:1.9;margin-bottom:16px;overflow-x:auto}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin:8px 0;cursor:pointer;font-size:18px;overflow-x:auto}
.opt:hover{background:#f3f8ff}
.opt.sel{border-color:var(--blue2);background:#e7f1fd}
.opt .L{font-weight:700;min-width:22px;color:var(--blue)}
.numbox{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.numin{font-size:22px;padding:8px 10px;width:210px;border:2px solid var(--blue2);border-radius:6px;text-align:right}
.keys{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
.keys button{height:44px;font-size:18px;border:1px solid var(--line);background:#f6f8fb;border-radius:5px;cursor:pointer}
.keys button:hover{background:#e7f1fd}
.bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;background:#fafbfd}
button.b{padding:9px 14px;border:1px solid var(--blue2);background:#fff;color:var(--blue);border-radius:5px;cursor:pointer;font-size:14px;font-weight:600}
button.b.p{background:var(--blue2);color:#fff}
button.b.g{background:var(--green);border-color:var(--green);color:#fff}
button.b.r{background:var(--red);border-color:var(--red);color:#fff}
button.b:disabled{opacity:.45;cursor:default}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0;max-height:46vh;overflow:auto;padding:2px}
.pal button{height:38px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;background:var(--grey);position:relative}
.pal button.na{background:var(--red)} .pal button.an{background:var(--green)} .pal button.mk{background:var(--purple)} .pal button.am{background:var(--purple)}
.pal button.am::after{content:"";position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;background:#5ee07e;border:1px solid #fff}
.pal button.cur{outline:3px solid var(--amber)}
.legend{font-size:12.5px;display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;margin-top:6px}
.legend span i{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:5px;color:#fff;font-style:normal;margin-right:5px;font-size:12px}
.secsum{font-size:13px;color:#46566a;margin:4px 0 6px}
.start{max-width:760px;margin:26px auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px 28px}
.start h2{margin-top:0;color:var(--blue)}
.start label.m{display:block;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0;cursor:pointer}
.start label.m:has(input:checked){border-color:var(--blue2);background:#e7f1fd}
.start input[type=text]{padding:8px 10px;font-size:16px;border:1px solid var(--line);border-radius:5px;width:260px}
.start ul{line-height:1.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
.modal .box{background:#fff;border-radius:8px;padding:20px 24px;max-width:480px;width:92%}
table.sm{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
table.sm th,table.sm td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.sm th{background:#f1f5fa}
.res{max-width:1000px;margin:14px auto;padding:0 12px 40px}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.card{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card .v{font-size:26px;font-weight:700;color:var(--blue)}
.rq{background:#fff;border:1px solid var(--line);border-left:6px solid var(--grey);border-radius:6px;padding:12px 16px;margin:10px 0}
.rq.ok{border-left-color:var(--green)} .rq.bad{border-left-color:var(--red)} .rq.skip{border-left-color:var(--amber)}
.rq .meta{font-size:12.5px;color:#5a6a7e;margin-bottom:4px}
.rq .ans{font-size:15px;margin:6px 0}
.rq .exp{background:#f4f8fd;border-radius:5px;padding:8px 10px;font-size:15px;margin-top:6px;overflow-x:auto}
.filters{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.chip{padding:6px 12px;border:1px solid var(--blue2);border-radius:20px;cursor:pointer;font-size:14px;color:var(--blue);background:#fff}
.chip.on{background:var(--blue2);color:#fff}
.tagpill{display:inline-block;background:#fff3d6;border:1px solid #efd48a;border-radius:14px;padding:3px 10px;margin:3px;font-size:13.5px}
@media (max-width:860px){.wrap{flex-direction:column}.side{width:100%;position:static}}
@media print{header,.filters,.noprint{display:none!important}.rq{break-inside:avoid}}
</style>
</head>

const DATA = [{"sec":"A","tag":"p.30 Compound angles","kind":"mcq","stem":"\\sin(A-B)=","opts":["\\sin A\\cos B+\\cos A\\sin B","\\cos A\\sin B-\\sin A\\cos B","\\sin A\\cos B-\\cos A\\sin B","\\cos A\\cos B+\\sin A\\sin B"],"ans":2,"exp":"\\sin(A-B)=\\sin A\\cos B-\\cos A\\sin B"},{"sec":"A","tag":"p.30 Compound angles","kind":"mcq","stem":"\\cos(A+B)=","opts":["\\cos A\\cos B-\\sin A\\sin B","\\sin A\\cos B+\\cos A\\sin B","\\cos A\\cos B+\\sin A\\sin B","\\sin A\\sin B-\\cos A\\cos B"],"ans":0,"exp":"\\cos(A+B)=\\cos A\\cos B-\\sin A\\sin B\\ \\text{ (cos: signs flip).}"},{"sec":"A","tag":"p.30 Compound angles","kind":"mcq","stem":"\\cos(A-B)=","opts":["\\sin A\\cos B-\\cos A\\sin B","\\sin A\\sin B-\\cos A\\cos B","\\cos A\\cos B+\\sin A\\sin B","\\cos A\\cos B-\\sin A\\sin B"],"ans":2,"exp":"\\cos(A-B)=\\cos A\\cos B+\\sin A\\sin B"},{"sec":"A","tag":"p.33 tan & cot compound","kind":"mcq","stem":"\\tan(A-B)=","opts":["\\dfrac{\\tan A-\\tan B}{1-\\tan A\\tan B}","\\dfrac{\\tan B-\\tan A}{1+\\tan A\\tan B}","\\dfrac{\\tan A-\\tan B}{1+\\tan A\\tan B}","\\dfrac{\\tan A+\\tan B}{1-\\tan A\\tan B}"],"ans":2,"exp":"\\tan(A-B)=\\dfrac{\\tan A-\\tan B}{1+\\tan A\\tan B}\\ \\text{ (numerator sign follows the angle sign, denominator is opposite).}"},{"sec":"A","tag":"p.33 tan & cot compound","kind":"mcq","stem":"\\cot(A+B)=","opts":["\\dfrac{\\cot A+\\cot B}{\\cot A\\cot B-1}","\\dfrac{\\cot A\\cot B-1}{\\cot B-\\cot A}","\\dfrac{\\cot A\\cot B+1}{\\cot A+\\cot B}","\\dfrac{\\cot A\\cot B-1}{\\cot A+\\cot B}"],"ans":3,"exp":"\\cot(A+B)=\\dfrac{\\cot A\\cot B-1}{\\cot A+\\cot B}\\ \\text{ (derive using tan = 1/cot).}"},{"sec":"A","tag":"p.33 tan & cot compound","kind":"mcq","stem":"\\cot(A-B)=","opts":["\\dfrac{\\cot A\\cot B+1}{\\cot A+\\cot B}","\\dfrac{\\cot A\\cot B+1}{\\cot A-\\cot B}","\\dfrac{\\cot A\\cot B+1}{\\cot B-\\cot A}","\\dfrac{\\cot A\\cot B-1}{\\cot B-\\cot A}"],"ans":2,"exp":"\\cot(A-B)=\\dfrac{\\cot A\\cot B+1}{\\cot B-\\cot A}\\ \\text{ - note the denominator is cot B minus cot A.}"},{"sec":"A","tag":"p.33 Square formulas","kind":"mcq","stem":"\\sin(A+B)\\sin(A-B)=","opts":["\\sin^2A-\\sin^2B","\\cos^2A-\\cos^2B","\\sin^2A-\\cos^2B","\\sin^2A+\\sin^2B"],"ans":0,"exp":"\\sin(A+B)\\sin(A-B)=\\sin^2A-\\sin^2B=\\cos^2B-\\cos^2A"},{"sec":"A","tag":"p.33 Square formulas","kind":"mcq","stem":"\\cos(A+B)\\cos(A-B)=","opts":["\\cos^2A+\\sin^2B","\\cos^2A-\\sin^2B","\\sin^2A-\\cos^2B","\\cos^2A-\\cos^2B"],"ans":1,"exp":"\\cos(A+B)\\cos(A-B)=\\cos^2A-\\sin^2B\\ \\text{. Whenever you see a power 2 on sin or cos, think of this.}"},{"sec":"A","tag":"p.34 tan/cot sums","kind":"mcq","stem":"\\tan A+\\tan B=","opts":["\\dfrac{\\sin(A-B)}{\\cos A\\cos B}","\\dfrac{\\sin(A+B)}{\\cos A\\cos B}","\\dfrac{\\sin(A+B)}{\\sin A\\sin B}","\\dfrac{\\cos(A+B)}{\\cos A\\cos B}"],"ans":1,"exp":"\\tan A+\\tan B=\\dfrac{\\sin(A+B)}{\\cos A\\cos B}"},{"sec":"A","tag":"p.34 tan/cot sums","kind":"mcq","stem":"\\tan A-\\tan B=","opts":["\\dfrac{\\sin(B-A)}{\\cos A\\cos B}","\\dfrac{\\sin(A+B)}{\\cos A\\cos B}","\\dfrac{\\sin(A-B)}{\\sin A\\sin B}","\\dfrac{\\sin(A-B)}{\\cos A\\cos B}"],"ans":3,"exp":"\\tan A-\\tan B=\\dfrac{\\sin(A-B)}{\\cos A\\cos B}"},{"sec":"A","tag":"p.34 tan/cot sums","kind":"mcq","stem":"\\cot A+\\cot B=","opts":["\\dfrac{\\sin(A+B)}{\\sin A\\sin B}","\\dfrac{\\sin(A-B)}{\\sin A\\sin B}","\\dfrac{\\cos(A+B)}{\\sin A\\sin B}","\\dfrac{\\sin(A+B)}{\\cos A\\cos B}"],"ans":0,"exp":"\\cot A+\\cot B=\\dfrac{\\sin(A+B)}{\\sin A\\sin B}"},{"sec":"A","tag":"p.34 tan/cot sums","kind":"mcq","stem":"\\cot A-\\cot B=","opts":["\\dfrac{\\sin(A-B)}{\\sin A\\sin B}","\\dfrac{\\sin(B-A)}{\\cos A\\cos B}","\\dfrac{\\sin(A+B)}{\\sin A\\sin B}","\\dfrac{\\sin(B-A)}{\\sin A\\sin B}"],"ans":3,"exp":"\\cot A-\\cot B=\\dfrac{\\sin(B-A)}{\\sin A\\sin B}\\ \\text{ - careful: B-A, not A-B.}"},{"sec":"A","tag":"p.34 Special angles (15 deg, 75 deg)","kind":"mcq","stem":"\\sin 15^\\circ=","opts":["\\dfrac{\\sqrt3-1}{2\\sqrt2}","\\dfrac{\\sqrt3+1}{2\\sqrt2}","\\dfrac{\\sqrt3-1}{2}","\\dfrac{\\sqrt3+1}{4}"],"ans":0,"exp":"\\sin15^\\circ=\\sin(45^\\circ-30^\\circ)=\\dfrac{\\sqrt3-1}{2\\sqrt2}=\\cos75^\\circ"},{"sec":"A","tag":"p.34 Special angles (15 deg, 75 deg)","kind":"mcq","stem":"\\sin 75^\\circ=\\cos15^\\circ=","opts":["\\dfrac{\\sqrt3-1}{4}","\\dfrac{\\sqrt3+1}{2\\sqrt2}","\\dfrac{\\sqrt3-1}{2\\sqrt2}","\\dfrac{\\sqrt3+1}{2}"],"ans":1,"exp":"\\sin75^\\circ=\\cos15^\\circ=\\dfrac{\\sqrt3+1}{2\\sqrt2}"},{"sec":"A","tag":"p.34 Special angles (15 deg, 75 deg)","kind":"mcq","stem":"\\tan 15^\\circ=\\cot75^\\circ=","opts":["\\dfrac{1}{2+\\sqrt3}+1","\\sqrt3-1","2-\\sqrt3","2+\\sqrt3"],"ans":2,"exp":"\\tan15^\\circ=\\dfrac{\\sqrt3-1}{\\sqrt3+1}=2-\\sqrt3=\\cot75^\\circ"},{"sec":"A","tag":"p.34 Special angles (15 deg, 75 deg)","kind":"mcq","stem":"\\tan 75^\\circ=\\cot15^\\circ=","opts":["\\sqrt3+1","2+\\sqrt3","2-\\sqrt3","\\dfrac{\\sqrt3}{2}+1"],"ans":1,"exp":"\\tan75^\\circ=2+\\sqrt3=\\cot15^\\circ"},{"sec":"A","tag":"p.46 tan 22.5 deg","kind":"mcq","stem":"\\tan 22.5^\\circ=\\tan\\dfrac{\\pi}{8}=","opts":["1-\\dfrac{1}{\\sqrt2}","\\sqrt2+1","\\sqrt2-1","\\dfrac{\\sqrt2-1}{2}"],"ans":2,"exp":"\\tan22.5^\\circ=\\sqrt2-1=\\cot67.5^\\circ;\\ \\ \\cot22.5^\\circ=\\sqrt2+1"},{"sec":"A","tag":"p.37 Product into sum","kind":"mcq","stem":"2\\sin A\\cos B=","opts":["\\cos(A-B)-\\cos(A+B)","\\cos(A+B)+\\cos(A-B)","\\sin(A+B)-\\sin(A-B)","\\sin(A+B)+\\sin(A-B)"],"ans":3,"exp":"2\\sin A\\cos B=\\sin(A+B)+\\sin(A-B)"},{"sec":"A","tag":"p.37 Product into sum","kind":"mcq","stem":"2\\cos A\\cos B=","opts":["\\cos(A+B)+\\cos(A-B)","\\sin(A+B)+\\sin(A-B)","\\cos(A-B)-\\cos(A+B)","\\cos(A+B)-\\cos(A-B)"],"ans":0,"exp":"2\\cos A\\cos B=\\cos(A+B)+\\cos(A-B)"},{"sec":"A","tag":"p.37 Product into sum","kind":"mcq","stem":"2\\sin A\\sin B=","opts":["\\sin(A+B)-\\sin(A-B)","\\cos(A-B)-\\cos(A+B)","\\cos(A+B)+\\cos(A-B)","\\cos(A+B)-\\cos(A-B)"],"ans":1,"exp":"2\\sin A\\sin B=\\cos(A-B)-\\cos(A+B)"},{"sec":"A","tag":"p.37 Sum into product","kind":"mcq","stem":"\\sin C+\\sin D=","opts":["2\\sin\\dfrac{C+D}{2}\\sin\\dfrac{C-D}{2}","2\\cos\\dfrac{C+D}{2}\\cos\\dfrac{C-D}{2}","2\\cos\\dfrac{C+D}{2}\\sin\\dfrac{C-D}{2}","2\\sin\\dfrac{C+D}{2}\\cos\\dfrac{C-D}{2}"],"ans":3,"exp":"\\sin C+\\sin D=2\\sin\\dfrac{C+D}{2}\\cos\\dfrac{C-D}{2}"},{"sec":"A","tag":"p.37 Sum into product","kind":"mcq","stem":"\\cos C+\\cos D=","opts":["2\\sin\\dfrac{C+D}{2}\\cos\\dfrac{C-D}{2}","2\\cos\\dfrac{C+D}{2}\\sin\\dfrac{C-D}{2}","2\\cos\\dfrac{C+D}{2}\\cos\\dfrac{C-D}{2}","-2\\sin\\dfrac{C+D}{2}\\sin\\dfrac{C-D}{2}"],"ans":2,"exp":"\\cos C+\\cos D=2\\cos\\dfrac{C+D}{2}\\cos\\dfrac{C-D}{2}"},{"sec":"A","tag":"p.37 Sum into product","kind":"mcq","stem":"\\cos C-\\cos D=","opts":["-2\\cos\\dfrac{C+D}{2}\\cos\\dfrac{C-D}{2}","2\\cos\\dfrac{C+D}{2}\\sin\\dfrac{C-D}{2}","2\\sin\\dfrac{C+D}{2}\\sin\\dfrac{C-D}{2}","-2\\sin\\dfrac{C+D}{2}\\sin\\dfrac{C-D}{2}"],"ans":3,"exp":"\\cos C-\\cos D=-2\\sin\\dfrac{C+D}{2}\\sin\\dfrac{C-D}{2}\\ \\text{ (the one with the minus sign).}"},{"sec":"A","tag":"p.37 Sum into product","kind":"mcq","stem":"\\sin C-\\sin D=","opts":["-2\\cos\\dfrac{C+D}{2}\\sin\\dfrac{C-D}{2}","2\\sin\\dfrac{C+D}{2}\\sin\\dfrac{C-D}{2}","2\\sin\\dfrac{C+D}{2}\\cos\\dfrac{C-D}{2}","2\\cos\\dfrac{C+D}{2}\\sin\\dfrac{C-D}{2}"],"ans":3,"exp":"\\sin C-\\sin D=2\\cos\\dfrac{C+D}{2}\\sin\\dfrac{C-D}{2}"},{"sec":"A","tag":"p.41-42 Multiple angles","kind":"mcq","stem":"\\sin2A=","opts":["\\dfrac{1+\\tan^2A}{2\\tan A}","\\dfrac{2\\tan A}{1-\\tan^2A}","\\dfrac{2\\tan A}{1+\\tan^2A}","\\dfrac{1-\\tan^2A}{1+\\tan^2A}"],"ans":2,"exp":"\\sin2A=2\\sin A\\cos A=\\dfrac{2\\tan A}{1+\\tan^2A}"},{"sec":"A","tag":"p.41-42 Multiple angles","kind":"mcq","stem":"\\cos2A=","opts":["\\dfrac{2\\tan A}{1+\\tan^2A}","\\dfrac{1-\\tan^2A}{1+\\tan^2A}","1-2\\cos^2A","\\dfrac{1+\\tan^2A}{1-\\tan^2A}"],"ans":1,"exp":"\\cos2A=\\cos^2A-\\sin^2A=1-2\\sin^2A=2\\cos^2A-1=\\dfrac{1-\\tan^2A}{1+\\tan^2A}"},{"sec":"A","tag":"p.41-42 Multiple angles","kind":"mc rac{1}{\\sin6^\\circ\\sin42^\\circ\\sin66^\\circ\\sin78^\\circ}=\\ ?","ans":16,"exp":"\\sin6^\\circ\\sin42^\\circ\\sin66^\\circ\\sin78^\\circ=\\cos84^\\circ\\cos48^\\circ\\cos24^\\circ\\cos12^\\circ=\\tfrac1{16}"},{"sec":"C","tag":"p.50 (ii)","kind":"num","stem":"16\\,\\sin\\dfrac\\pi5\\sin\\dfrac{2\\pi}5\\sin\\dfrac{3\\pi}5\\sin\\dfrac{4\\pi}5=\\ ?","ans":5,"exp":"\\text{Product }=\\sin^2\\tfrac\\pi5\\sin^2\\tfrac{2\\pi}5=\\tfrac5{16}"},{"sec":"C","tag":"p.47 (i)","kind":"num","stem":"8\\cos\\dfrac\\pi7\\cos\\dfrac{2\\pi}7\\cos\\dfrac{3\\pi}7=\\ ?","ans":1,"exp":"\\cos\\tfrac{3\\pi}{7}=-\\cos\\tfrac{4\\pi}{7}\\Rightarrow-\\dfrac{\\sin(8\\pi/7)}{8\\sin(\\pi/7)}=\\tfrac18"},{"sec":"C","tag":"p.67 Min value","kind":"num","stem":"\\text{Minimum value of }8\\sec^2x+18\\operatorname{cosec}^2x=\\ ?","ans":50,"exp":"26+8\\tan^2x+18\\cot^2x=26+2(2\\tan x-3\\cot x)^2+24\\ge50"},{"sec":"C","tag":"p.69 Cauchy","kind":"num","stem":"x^2+y^2=4,\\ a^2+b^2=8.\\ \\text{Find the maximum value of }(ax+by)^2.","ans":32,"exp":"(ax+by)^2\\le(a^2+b^2)(x^2+y^2)=32"},{"sec":"C","tag":"p.39 Q6","kind":"num","stem":"4\\left[\\cos^273^\\circ+\\cos^247^\\circ+\\cos73^\\circ\\cos47^\\circ\\right]=\\ ?","ans":3,"exp":"\\text{The bracket equals }\\tfrac34"},{"sec":"C","tag":"p.34 Special angles","kind":"num","stem":"\\tan75^\\circ+\\tan15^\\circ=\\ ?","ans":4,"exp":"(2+\\sqrt3)+(2-\\sqrt3)=4"},{"sec":"C","tag":"p.47 (iii)","kind":"num","stem":"2\\left(\\sin^4\\dfrac\\pi{16}+\\sin^4\\dfrac{3\\pi}{16}+\\sin^4\\dfrac{5\\pi}{16}+\\sin^4\\dfrac{7\\pi}{16}\\right)=\\ ?","ans":3,"exp":"\\text{The sum of the four fourth-powers is }\\tfrac32"}];
const SEC = {A:{name:'Formula Recall',budget:60,pos:4,neg:1}, B:{name:'Class Problems (MCQ)',budget:150,pos:4,neg:1}, C:{name:'Class Problems (Numerical)',budget:180,pos:4,neg:0}};
const $ = s => document.querySelector(s);
const M = s => '\\(' + s + '\\)';
function typeset(el,n){ n=n||0; if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise(el?[el]:undefined).catch(()=>{}); } else if(n<40){ setTimeout(()=>typeset(el,n+1),400); } else if(!window.__mjWarn){ window.__mjWarn=1; alert('Formula rendering (MathJax) could not load. Please connect to the internet and reload this page.'); } }
const fmt = s => { s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); };

let Qs=[], R=[], cur=0, secActive='A', total=0, left=0, tick=null, qStart=0, name='', mode='full';

function startScreen(){
  const cnt = k => DATA.filter(q=>q.sec===k).length;
  const mins = ks => Math.round(DATA.filter(q=>ks.includes(q.sec)).reduce((s,q)=>s+SEC[q.sec].budget,0)/60);
  $('#app').innerHTML = `
  <header><h1>Trigonometry Recall Test &middot; from VG Sir's class notes (Apr&ndash;May 2026)</h1></header>
  <div class="start">
    <h2>Trigonometry &mdash; Formula Recall &amp; Class Problems</h2>
    <p><b>Name:</b> <input type="text" id="nm" placeholder="Candidate name"></p>
    <p><b>Choose test:</b></p>
    <label class="m"><input type="radio" name="md" value="full" checked> <b>Full test</b> &mdash; ${DATA.length} questions &middot; ${mins(['A','B','C'])} min</label>
    <label class="m"><input type="radio" name="md" value="A"> <b>Part 1: Formula Recall only</b> (the circled / boxed identities) &mdash; ${cnt('A')} questions &middot; ${mins(['A'])} min</label>
    <label class="m"><input type="radio" name="md" value="BC"> <b>Part 2: Class Problems only</b> &mdash; ${cnt('B')} MCQ + ${cnt('C')} numerical &middot; ${mins(['B','C'])} min</label>
    <ul>
      <li>Section A &amp; B: single correct, <b>+4</b> correct, <b>&minus;1</b> wrong, 0 if unanswered.</li>
      <li>Section C: type a number (tolerance &plusmn;0.01), <b>+4</b> correct, no negative marking.</li>
      <li>Timer auto-submits. You can mark questions for review and jump through the palette.</li>
      <li>After submitting you get a per-question review with the page reference in the notebook, and a <b>"formulas to revise"</b> list built from your wrong / skipped answers.</li>
      <li>Needs internet once for MathJax (formula rendering).</li>
    </ul>
    <button class="b p" id="go" style="font-size:16px;padding:11px 26px">Start Test</button>
  </div>`;
  $('#go').onclick = () => {
    name = $('#nm').value.trim(); mode = document.querySelector('input[name=md]:checked').value;
    const keep = mode==='full'?['A','B','C']:mode==='A'?['A']:['B','C'];
    Qs = DATA.filter(q=>keep.includes(q.sec));
    R = Qs.map(()=>({sel:null,num:'',vis:false,mark:false,t:0}));
    total = Qs.reduce((s,q)=>s+SEC[q.sec].budget,0); left = total; cur = 0; secActive = Qs[0].sec;
    renderExam(); go(0, true);
    qStart = Date.now();
    tick = setInterval(()=>{ left--; paintTimer(); if(left<=0) submit(true); },1000);
  };
}
function paintTimer(){ const t=$('#tm'); if(!t) return; t.textContent=fmt(left); t.classList.toggle('low',left<300); }
function answered(i){ const q=Qs[i],r=R[i]; return q.kind==='mcq' ? r.sel!==null : r.num.trim()!==''; }
function status(i){ const r=R[i]; if(!r.vis) return ''; const a=answered(i); if(r.mark) return a?'am':'mk'; return a?'an':'na'; }
function renderExam(){
  const secs = [...new Set(Qs.map(q=>q.sec))];
  $('#app').innerHTML = `
  <header><h1>Trigonometry Recall Test${name?' &middot; '+name:''}</h1><div>Time left: <span class="timer" id="tm">${fmt(left)}</span></div></header>
  <div class="wrap">
    <div class="main">
      <div class="tabs" id="tabs">${secs.map(s=>`<div class="tab" data-s="${s}">${s}. ${SEC[s].name}</div>`).join('')}</div>
      <div class="qhead" id="qh"></div>
      <div class="qbody" id="qb"></div>
      <div class="bar">
        <button class="b p" id="sn">Save &amp; Next</button>
        <button class="b" id="mn" style="color:var(--purple);border-color:var(--purple)">Mark for Review &amp; Next</button>
        <button class="b" id="cl">Clear Response</button>
        <span style="flex:1"></span>
        <button class="b" id="pv">&laquo; Back</button>
        <button class="b" id="nx">Next &raquo;</button>
      </div>
    </div>
    <div class="side">
      <div class="secsum" id="ss"></div>
      <div class="pal" id="pal"></div>
      <div class="legend">
        <span><i style="background:var(--grey)">&nbsp;</i>Not visited</span><span><i style="background:var(--red)">&nbsp;</i>Not answered</span>
        <span><i style="background:var(--green)">&nbsp;</i>Answered</span><span><i style="background:var(--purple)">&nbsp;</i>Marked</span>
      </div>
      <p style="text-align:center;margin:14px 0 4px"><button class="b g" id="sub" style="width:100%;padding:11px">Submit Test</button></p>
    </div>
  </div>`;
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ const i=Qs.findIndex(q=>q.sec===t.dataset.s); go(i); });
  $('#sn').onclick=()=>{ nextAfter(); };
  $('#mn').onclick=()=>{ R[cur].mark=true; nextAfter(true); };
  $('#cl').onclick=()=>{ R[cur].sel=null; R[cur].num=''; paintQ(); paintPal(); };
  $('#pv').onclick=()=>go(Math.max(0,cur-1));
  $('#nx').onclick=()=>go(Math.min(Qs.length-1,cur+1));
  $('#sub').onclick=confirmSubmit;
}
function nextAfter(){ if(cur<Qs.length-1) go(cur+1); else { paintQ(); paintPal(); } }
function go(i, first){
  if(!first){ R[cur].t += (Date.now()-qStart)/1000; }
  cur=i; qStart=Date.now(); R[cur].vis=true; secActive=Qs[cur].sec; paintQ(); paintPal();
}
function paintQ(){
  const q=Qs[cur], r=R[cur], S=SEC[q.sec];
  const idxInSec = Qs.filter(x=>x.sec===q.sec).indexOf(q)+1, nSec = Qs.filter(x=>x.sec===q.sec).length;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.s===q.sec));
  $('#qh').innerHTML = `<span><b>Question ${cur+1}</b> of ${Qs.length} &nbsp;|&nbsp; ${q.sec}${idxInSec}/${nSec}</span><span>Marks: <b style="color:var(--green)">+${S.pos}</b> / <b style="color:var(--red)">&minus;${S.neg}</b></span>`;
  let h = `<div class="stem">${M(q.stem)}</div>`;
  if(q.kind==='mcq'){
    h += q.opts.map((o,k)=>`<div class="opt ${r.sel===k?'sel':''}" data-k="${k}"><span class="L">${'ABCD'[k]}.</span><span>${M(o)}</span></div>`).join('');
  } else {
    h += `<div class="numbox"><div><input class="numin" id="ni" value="${r.num}" inputmode="decimal" placeholder="Enter answer"><div style="font-size:12px;color:#667;margin-top:4px">Type the numerical value (e.g. 16 or 0.5)</div></div>
    <div class="keys">${['7','8','9','4','5','6','1','2','3','0','.','-'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}<button data-k="bk" style="grid-column:span 2">&larr; Backspace</button><button data-k="cl">Clear</button></div></div>`;
  }
  $('#qb').innerHTML = h;
  if(q.kind==='mcq') document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ r.sel=(r.sel===+o.dataset.k)?null:+o.dataset.k; paintQ(); paintPal(); });
  else {
    const ni=$('#ni'); ni.oninput=()=>{ r.num=ni.value; paintPal(); };
    document.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(k==='bk') r.num=r.num.slice(0,-1); else if(k==='cl') r.num=''; else r.num+=k; ni.value=r.num; paintPal(); });
  }
  $('#pv').disabled = cur===0; $('#nx').disabled = cur===Qs.length-1;
  typeset($('#qb'));
}
function paintPal(){
  const secs=[...new Set(Qs.map(q=>q.sec))];
  $('#ss').innerHTML = secs.map(s=>{ const ids=Qs.map((q,i)=>q.sec===s?i:-1).filter(i=>i>=0); return `<b>${s}</b>: ${ids.filter(answered).length}/${ids.length} answered`; }).join(' &middot; ');
  const ids = Qs.map((q,i)=>i).filter(i=>Qs[i].sec===secActive);
  let n=0, base = Qs.findIndex(q=>q.sec===secActive);
  $('#pal').innerHTML = ids.map((i,j)=>`<button class="${status(i)} ${i===cur?'cur':''}" data-i="${i}">${j+1}</button>`).join('');
  document.querySelectorAll('#pal button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function confirmSubmit(){
  const secs=[...new Set(Qs.map(q=>q.sec))];
  const rows = secs.map(s=>{ const ids=Qs.map((q,i)=>q.sec===s?i:-1).filter(i=>i>=0); const a=ids.filter(answered).length, mk=ids.filter(i=>R[i].mark).length; return `<tr><td>${s}</td><td>${ids.length}</td><td>${a}</td><td>${ids.length-a}</td><td>${mk}</td></tr>`; }).join('');
  const d=document.createElement('div'); d.className='modal'; d.innerHTML=`<div class="box"><h3 style="margin-top:0">Submit test?</h3>
  <table class="sm"><tr><th>Section</th><th>Questions</th><th>Answered</th><th>Not answered</th><th>Marked</th></tr>${rows}</table>
  <p style="font-size:14px">Time left: <b>${fmt(left)}</b>. You cannot change answers after submitting.</p>
  <div style="display:flex;gap:10px;justify-content:flex-end"><button class="b" id="no">Go back</button><button class="b g" id="yes">Yes, submit</button></div></div>`;
  document.body.appendChild(d); $('#no').onclick=()=>d.remove(); $('#yes').onclick=()=>{ d.remove(); submit(false); };
}
function correct(i){ const q=Qs[i],r=R[i]; if(!answered(i)) return null; if(q.kind==='mcq') return r.sel===q.ans; const v=parseFloat(r.num); return isFinite(v) && Math.abs(v-q.ans) <= 0.01; }
function submit(auto){
  clearInterval(tick); R[cur].t += (Date.now()-qStart)/1000;
  const used = total-left;
  const per = {}; let score=0, max=0, cor=0, wr=0, sk=0;
  Qs.forEach((q,i)=>{ const S=SEC[q.sec]; per[q.sec]=per[q.sec]||{n:0,c:0,w:0,s:0,sc:0,mx:0,t:0}; const p=per[q.sec]; p.n++; p.mx+=S.pos; max+=S.pos; p.t+=R[i].t;
    const c=correct(i); if(c===null){p.s++;sk++;} else if(c){p.c++;cor++;p.sc+=S.pos;score+=S.pos;} else {p.w++;wr++;p.sc-=S.neg;score-=S.neg;} });
  const attempted=cor+wr;
  const weak = {}; Qs.forEach((q,i)=>{ if(correct(i)!==true){ (weak[q.tag]=weak[q.tag]||[]).push(i+1); } });
  let h = `<header><h1>Result &middot; Trigonometry Recall Test${name?' &middot; '+name:''}</h1><div class="noprint"><button class="b" onclick="window.print()">Print / Save PDF</button> <button class="b" onclick="location.reload()">Take again</button></div></header><div class="res">`;
  h += `<div class="cards"><div class="card"><div>Score</div><div class="v">${score} / ${max}</div></div><div class="card"><div>Accuracy</div><div class="v">${attempted?Math.round(100*cor/attempted):0}%</div><div style="font-size:12px">${cor} correct of ${attempted} attempted</div></div><div class="card"><div>Correct / Wrong / Skipped</div><div class="v"><span style="color:var(--green)">${cor}</span> / <span style="color:var(--red)">${wr}</span> / <span style="color:var(--amber)">${sk}</span></div></div><div class="card"><div>Time used</div><div class="v">${fmt(used)}</div>${auto?'<div style="font-size:12px">auto-submitted</div>':''}</div></div>`;
  h += `<table class="sm"><tr><th>Section</th><th>Questions</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Marks</th><th>Avg time / Q</th></tr>${Object.keys(per).map(s=>{const p=per[s];return `<tr><td style="text-align:left">${s}. ${SEC[s].name}</td><td>${p.n}</td><td>${p.c}</td><td>${p.w}</td><td>${p.s}</td><td>${p.sc} / ${p.mx}</td><td>${Math.round(p.t/p.n)} s</td></tr>`}).join('')}</table>`;
  const wk=Object.keys(weak);
  h += `<h3>Formulas / topics to revise</h3>` + (wk.length ? `<div>${wk.map(t=>`<span class="tagpill">${t} <small>(Q ${weak[t].join(', ')})</small></span>`).join('')}</div>` : `<p>Nothing &mdash; every question was correct. Excellent recall!</p>`);
  h += `<h3>Question-wise review</h3><div class="filters"><span class="chip on" data-f="all">All</span><span class="chip" data-f="bad">Wrong</span><span class="chip" data-f="skip">Skipped</span><span class="chip" data-f="ok">Correct</span></div><div id="rl"></div></div>`;
  $('#app').innerHTML=h;
  const paint = f => {
    $('#rl').innerHTML = Qs.map((q,i)=>{ const c=correct(i); const cls=c===null?'skip':c?'ok':'bad'; if(f!=='all'&&f!==cls) return '';
      const yours = c===null?'<i>not answered</i>' : q.kind==='mcq' ? `${'ABCD'[R[i].sel]}. ${M(q.opts[R[i].sel])}` : R[i].num;
      const right = q.kind==='mcq' ? `${'ABCD'[q.ans]}. ${M(q.opts[q.ans])}` : q.ans;
      return `<div class="rq ${cls}"><div class="meta">Q${i+1} &middot; Section ${q.sec} &middot; ${q.tag} &middot; time ${Math.round(R[i].t)} s &middot; ${c===null?'Skipped':c?'Correct':'Wrong'}</div><div class="stem" style="font-size:17px;margin-bottom:6px">${M(q.stem)}</div><div class="ans"><b>Your answer:</b> ${yours}</div><div class="ans"><b>Correct answer:</b> ${right}</div><div class="exp">${M(q.exp)}</div></div>`; }).join('');
    typeset($('#rl'));
  };
  paint('all');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on'); paint(c.dataset.f); });
  window.scrollTo(0,0);
}
startScreen();
</script>
