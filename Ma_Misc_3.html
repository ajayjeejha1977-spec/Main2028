ot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;n&lt;/text&gt;&lt;path d=&quot;M100.3,49.2 A26,26 0 0 0 114.4,52.4&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;105.0&quot; y=&quot;66.5&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;14&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;α&lt;/text&gt;&lt;path d=&quot;M114.4,52.4 A26,26 0 0 0 130.9,45.1&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;127.3&quot; y=&quot;64.3&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;14&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;β&lt;/text&gt;&lt;path d=&quot;M121.2,164.8 A20,20 0 0 1 142.4,184.8&quot; fill=&quot;none&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;143.0&quot; y=&quot;168.0&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;14&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;m-n theorem set-up.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;50&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (m+n)\cot\theta=m\cot\alpha-n\cot\beta\;=\;n\cot B-m\cot C\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;51&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof:&lt;/b&gt; sine rule in \(\triangle ABD\) and \(\triangle ADC\): \(\dfrac{BD}{\sin\alpha}=\dfrac{AD}{\sin(\theta-\alpha)}\), \(\dfrac{CD}{\sin\beta}=\dfrac{AD}{\sin(\theta+\beta)}\); divide, expand and use \(\sin(\theta\pm x)\) to get \(\dfrac mn=(\cot\theta+\cot\beta)(\cot\alpha-\cot\theta)^{-1}\). The second form follows from the exterior-angle relations \(\alpha=\theta-B\), \(\beta=\pi-\theta-C\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;52&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Use (median \(\perp\) to a side):&lt;/b&gt; the median from C is \(\perp\) to AC. Put \(m=n=1\), \(\theta=90^\circ+A\): \((1+1)\cot(90^\circ+A)=\cot90^\circ-\cot(C-90^\circ)\Rightarrow\) &lt;b&gt;\(2\tan A+\tan C=0\)&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 400 180&quot; style=&quot;width:100%;max-width:330px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;376.2,156.2 24.2,24.2 200.2,156.2&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;389.1&quot; y=&quot;166.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;10.9&quot; y=&quot;24.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;195.8&quot; y=&quot;174.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;line x1=&quot;200.2&quot; y1=&quot;156.2&quot; x2=&quot;200.2&quot; y2=&quot;90.2&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;209.2,156.2 209.2,147.2 200.2,147.2&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;200.2&quot; cy=&quot;90.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;200.2&quot; y=&quot;109.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;line x1=&quot;288.3&quot; y1=&quot;128.6&quot; x2=&quot;291.8&quot; y2=&quot;119.2&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;284.6&quot; y1=&quot;127.2&quot; x2=&quot;288.1&quot; y2=&quot;117.8&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;112.3&quot; y1=&quot;62.6&quot; x2=&quot;115.8&quot; y2=&quot;53.2&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;108.6&quot; y1=&quot;61.2&quot; x2=&quot;112.1&quot; y2=&quot;51.8&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Median CD ⊥ CA (D is the midpoint of AB).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;53&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;M-2 (similar triangles):&lt;/b&gt; drop \(BE\perp AC\) produced; \(BE=2CD\), \(\tan A=\dfrac{CD}{AC}\), \(\tan C=\tan(\pi-C)\) with sign &amp;rArr; same result.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;9. Median and centroid &lt;span class=&quot;pg&quot;&gt;p. 84&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 281 225&quot; style=&quot;width:100%;max-width:281px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;98.9,25.3 25.3,200.1 255.3,200.1&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;95.7&quot; y=&quot;16.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;13.2&quot; y=&quot;212.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;268.1&quot; y=&quot;210.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;line x1=&quot;98.9&quot; y1=&quot;25.3&quot; x2=&quot;140.3&quot; y2=&quot;200.1&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;25.3&quot; y1=&quot;200.1&quot; x2=&quot;177.1&quot; y2=&quot;112.7&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;255.3&quot; y1=&quot;200.1&quot; x2=&quot;62.1&quot; y2=&quot;112.7&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;126.5&quot; cy=&quot;141.8&quot; r=&quot;3.4&quot; fill=&quot;#c2410c&quot;/&gt;&lt;text x=&quot;143.3&quot; y=&quot;217.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;188.4&quot; y=&quot;111.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;E&lt;/text&gt;&lt;text x=&quot;50.3&quot; y=&quot;112.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;F&lt;/text&gt;&lt;text x=&quot;126.5&quot; y=&quot;159.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;G&lt;/text&gt;&lt;line x1=&quot;82.8&quot; y1=&quot;195.1&quot; x2=&quot;82.8&quot; y2=&quot;205.1&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;line x1=&quot;197.8&quot; y1=&quot;195.1&quot; x2=&quot;197.8&quot; y2=&quot;205.1&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;102.7&quot; y=&quot;87.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;2&lt;/text&gt;&lt;text x=&quot;124.4&quot; y=&quot;175.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;1&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Medians meet at the centroid G, with AG : GD = 2 : 1.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;54&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle G=\text{centroid}:\quad\dfrac{AG}{GD}=\dfrac21\qquad(\text{same for the other medians})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;55&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle [GBC]=[GCA]=[GAB]=\tfrac13[ABC]\quad(\text{similar triangles: }\tfrac{h_1}{h}=\tfrac{GD}{AD}=\tfrac13)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;56&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle AD^2=\dfrac{2(b^2+c^2)-a^2}{4},\qquad BE^2=\dfrac{2(c^2+a^2)-b^2}{4},\qquad CF^2=\dfrac{2(a^2+b^2)-c^2}{4}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;57&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof (cosine rule in \(\triangle ABD\)):&lt;/b&gt; \(AD^2=\left(\tfrac a2\right)^2+c^2-2\cdot\tfrac a2\cdot c\cos B=\tfrac{a^2}{4}+c^2-\tfrac12(a^2+c^2-b^2)\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;58&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Vector proof:&lt;/b&gt; \(\vec{AD}=\dfrac{\vec b+\vec c}{2}\) (A at the origin): \(AD^2=\tfrac14\big(b^2+c^2+2bc\cos A\big)=\tfrac14\big(b^2+c^2+b^2+c^2-a^2\big)=\dfrac{2(b^2+c^2)-a^2}{4}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;59&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Medians \(BB_1\) and \(CC_1\) perpendicular:&lt;/b&gt; in \(\triangle BGC\) (right angle at G): \(\big(\tfrac23BB_1\big)^2+\big(\tfrac23CC_1\big)^2=a^2\Rightarrow b^2+c^2=5a^2\), hence &lt;b&gt;\(\cos A=\dfrac{b^2+c^2-a^2}{2bc}=\dfrac{2a^2}{bc}\)&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;10. Angle bisector &lt;span class=&quot;pg&quot;&gt;pp. 85-87&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;60&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Internal and external bisectors&lt;/b&gt; of an angle are &amp;perp; to each other. Properties hold for both.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;61&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(1)&lt;/b&gt; Any point on a bisector is &lt;b&gt;equidistant&lt;/b&gt; from the two lines (use it in geometry/coordinate problems).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;62&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(2)&lt;/b&gt; The &lt;b&gt;image&lt;/b&gt; of a point on one line in the bisector lies on the other line.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;63&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(3) Angle-bisector theorem:&lt;/b&gt; the bisector of \(\angle A\) divides the opposite side BC in the ratio of the sides containing the angle.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 325 112&quot; style=&quot;width:100%;max-width:325px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;175.5,19.8 161.1,91.8 305.1,91.8&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;163.6&quot; y=&quot;17.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;148.6&quot; y=&quot;103.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;317.6&quot; y=&quot;103.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;line x1=&quot;161.1&quot; y1=&quot;91.8&quot; x2=&quot;19.8&quot; y2=&quot;91.8&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;175.5&quot; y1=&quot;19.8&quot; x2=&quot;208.8&quot; y2=&quot;91.8&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;204.9&quot; y1=&quot;6.2&quot; x2=&quot;19.8&quot; y2=&quot;91.8&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;208.8&quot; cy=&quot;91.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;19.8&quot; cy=&quot;91.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;214.2&quot; y=&quot;108.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;8.0&quot; y=&quot;102.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;E&lt;/text&gt;&lt;path d=&quot;M171.2,41.4 A22,22 0 0 0 184.7,39.8&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;179.1&quot; y=&quot;55.6&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;13&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;/text&gt;&lt;path d=&quot;M186.4,43.4 A26,26 0 0 0 198.2,32.4&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;199.3&quot; y=&quot;50.4&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;13&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Internal bisector AD and external bisector AE of ∠A.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;64&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{BD}{DC}=\dfrac{AB}{AC}\ \ (\text{internal}),\qquad\dfrac{BE}{CE}=\dfrac{AB}{AC}\ \ (\text{external})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;65&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof:&lt;/b&gt; draw \(CG\parallel DA\) meeting BA produced at G &amp;rArr; \(\triangle BDA\sim\triangle BCG\Rightarrow\dfrac{BD}{DC}=\dfrac{AB}{AG}\); the marked angles are equal so \(AG=AC\). (It can also be proved with the sine rule.)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;66&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Length of the internal bisector&lt;/b&gt; (vector method with A at the origin, \(D=\dfrac{b\vec b+c\vec c}{b+c}\) &amp;rArr; \(AD^2=\dfrac{b^2c^2+c^2b^2+2b^2c^2\cos A}{(b+c)^2}=\dfrac{2b^2c^2(2\cos^2\frac A2)}{(b+c)^2}\)):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;67&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle l_A=\dfrac{2bc}{b+c}\cos\dfrac A2,\qquad l_B=\dfrac{2ca}{c+a}\cos\dfrac B2,\qquad l_C=\dfrac{2ab}{a+b}\cos\dfrac C2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;68&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle |AE|=\left|\dfrac{b\vec b-c\vec c}{b-c}\right|=\dfrac{2bc\sin\frac A2}{|b-c|}\qquad(\text{external bisector})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;69&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Note:&lt;/b&gt; geometry/coordinate technique &amp;mdash; the distance of a point on a bisector from the two sides is equal.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;11. Circumcircle &lt;span class=&quot;pg&quot;&gt;p. 87&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;70&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{a}{\sin A}=\dfrac b{\sin B}=\dfrac c{\sin C}=2R,\qquad \Delta=\dfrac{abc}{4R}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;71&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Feet of the perpendiculars from the circumcentre O to the sides&lt;/b&gt; BC, CA, AB are D, E, F (these are the midpoints). \(\triangle DEF\) has sides \(\tfrac a2,\tfrac b2,\tfrac c2\) and angles A, B, C (it is similar to \(\triangle ABC\)). Since BE is also the median of \(\triangle FED\) &amp;mdash; same median, same centroid &amp;mdash; &lt;b&gt;the centroid of DEF = centroid of ABC&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;12. Incircle &lt;span class=&quot;pg&quot;&gt;pp. 88-89&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;72&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;I = intersection of the angle bisectors; it is equidistant from the three sides, so it is the centre of the incircle (radius r).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 327 235&quot; style=&quot;width:100%;max-width:327px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;112.7,25.3 25.3,209.3 301.3,209.3&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;110.2&quot; y=&quot;16.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;13.5&quot; y=&quot;221.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;314.3&quot; y=&quot;219.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;circle cx=&quot;133.4&quot; cy=&quot;141.0&quot; r=&quot;68.3&quot; fill=&quot;none&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;line x1=&quot;133.4&quot; y1=&quot;141.0&quot; x2=&quot;112.7&quot; y2=&quot;25.3&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;133.4&quot; y1=&quot;141.0&quot; x2=&quot;25.3&quot; y2=&quot;209.3&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;133.4&quot; y1=&quot;141.0&quot; x2=&quot;301.3&quot; y2=&quot;209.3&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;133.4&quot; y1=&quot;141.0&quot; x2=&quot;133.4&quot; y2=&quot;209.3&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;133.4&quot; cy=&quot;141.0&quot; r=&quot;3&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;135.5&quot; y=&quot;157.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;I&lt;/text&gt;&lt;circle cx=&quot;133.4&quot; cy=&quot;209.3&quot; r=&quot;2.4&quot; fill=&quot;#1b7a45&quot;/&gt;&lt;circle cx=&quot;181.1&quot; cy=&quot;92.1&quot; r=&quot;2.4&quot; fill=&quot;#1b7a45&quot;/&gt;&lt;circle cx=&quot;71.7&quot; cy=&quot;111.6&quot; r=&quot;2.4&quot; fill=&quot;#1b7a45&quot;/&gt;&lt;polyline points=&quot;133.4,200.3 142.4,200.3 142.4,209.3&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;text x=&quot;141.4&quot; y=&quot;179.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;r&lt;/text&gt;&lt;text x=&quot;70.2&quot; y=&quot;70.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;s−a&lt;/text&gt;&lt;text x=&quot;168.9&quot; y=&quot;60.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;s−a&lt;/text&gt;&lt;text x=&quot;79.4&quot; y=&quot;230.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;s−b&lt;/text&gt;&lt;text x=&quot;217.4&quot; y=&quot;230.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;s−c&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Incircle: the tangent lengths from the vertices are s−a, s−b, s−c.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;73&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \Delta=\Delta_{AIB}+\Delta_{BIC}+\Delta_{CIA}=\tfrac12r(a+b+c)=rs\ \Rightarrow\ r=\dfrac{\Delta}{s}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;74&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Tangent lengths: }L=r\cot\dfrac A2=s-a,\quad M=s-b,\quad N=s-c\qquad\Big(r\cot\tfrac A2=\tfrac{r\,s(s-a)}{\Delta}=s-a\Big)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;75&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r=(s-a)\tan\dfrac A2=(s-b)\tan\dfrac B2=(s-c)\tan\dfrac C2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;76&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r=4R\sin\dfrac A2\sin\dfrac B2\sin\dfrac C2\qquad\big[a=BD+DC=r\cot\tfrac B2+r\cot\tfrac C2\big]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;77&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin\dfrac A2\sin\dfrac B2\sin\dfrac C2\le\dfrac18\ \Rightarrow\ \dfrac rR\le\dfrac12\quad(\text{equality for the equilateral triangle})\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;13. Excircles and excentral points &lt;span class=&quot;pg&quot;&gt;pp. 89-92&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;78&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Excircle opposite A: touches BC and the extensions of AB and AC; centre \(I_1\) lies on the internal bisector of A and the external bisectors of B and C. Radii \(r_1,r_2,r_3\) (opposite A, B, C). \(I_1I_2I_3\) is the &lt;b&gt;excentral triangle&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 372 484&quot; style=&quot;width:100%;max-width:330px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;185.9&quot; cy=&quot;298.1&quot; r=&quot;167.2&quot; fill=&quot;none&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.6&quot;/&gt;&lt;polygon points=&quot;147.8,18.7 86.6,130.9 256.6,130.9&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;144.0&quot; y=&quot;10.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;74.1&quot; y=&quot;142.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;269.3&quot; y=&quot;141.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;line x1=&quot;86.6&quot; y1=&quot;130.9&quot; x2=&quot;29.3&quot; y2=&quot;235.9&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;256.6&quot; y1=&quot;130.9&quot; x2=&quot;320.1&quot; y2=&quot;196.3&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;147.8&quot; y1=&quot;18.7&quot; x2=&quot;185.9&quot; y2=&quot;298.1&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;185.9&quot; y1=&quot;298.1&quot; x2=&quot;185.9&quot; y2=&quot;130.9&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;185.9&quot; y1=&quot;298.1&quot; x2=&quot;39.1&quot; y2=&quot;218.0&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;185.9&quot; y1=&quot;298.1&quot; x2=&quot;305.9&quot; y2=&quot;181.7&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;185.9&quot; cy=&quot;298.1&quot; r=&quot;3&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;187.6&quot; y=&quot;316.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;I&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;28.6&quot; y=&quot;217.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;314.5&quot; y=&quot;178.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;F&lt;/text&gt;&lt;text x=&quot;195.9&quot; y=&quot;218.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;r&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;69.5&quot; y=&quot;118.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;AD = s&lt;/text&gt;&lt;text x=&quot;250.9&quot; y=&quot;100.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;AF = s&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Excircle opposite A: AD = AF = s (tangent from A), radius r₁.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;79&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Area split:&lt;/b&gt; \(\Delta_{ABC}=\Delta_{AI_1B}+\Delta_{AI_1C}-\Delta_{BI_1C}=\tfrac12r_1(c+b-a)=r_1(s-a)\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;80&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r_1=\dfrac{\Delta}{s-a},\qquad r_2=\dfrac{\Delta}{s-b},\qquad r_3=\dfrac{\Delta}{s-c}\quad(\text{radius opposite }a\text{ uses }s-a)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;81&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Tangent from a vertex to the opposite excircle:&lt;/b&gt; \(2AD=AD+AF=(AB+BE)+(CE+AC)=2s\) &amp;rArr; &lt;b&gt;from A: \(s\)&lt;/b&gt;; from B: \(s-c\); from C: \(s-b\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;82&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r_1=s\tan\dfrac A2,\qquad r_2=s\tan\dfrac B2,\qquad r_3=s\tan\dfrac C2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;83&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r_1=4R\sin\dfrac A2\cos\dfrac B2\cos\dfrac C2,\quad r_2=4R\sin\dfrac B2\cos\dfrac C2\cos\dfrac A2,\quad r_3=4R\sin\dfrac C2\cos\dfrac A2\cos\dfrac B2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;84&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Derivation:&lt;/b&gt; \(a=2R\sin A=BD+DC=r_1\big(\tan\tfrac B2+\tan\tfrac C2\big)=\dfrac{r_1\sin\frac{B+C}2}{\cos\frac B2\cos\frac C2}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;85&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Standard identities (all from the formulas above):&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;86&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r\,r_1r_2r_3=\Delta^2\qquad\Big[r_1r_2r_3=\tfrac{\Delta^3}{(s-a)(s-b)(s-c)}=s\Delta,\ \ r=\tfrac\Delta s\Big]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;87&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r_2r_3+r_3r_1+r_1r_2=s^2\qquad\big[s^2\textstyle\sum\tan\frac A2\tan\frac B2=s^2\times1\big]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;88&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac1{r_1}+\dfrac1{r_2}+\dfrac1{r_3}=\dfrac1r\qquad\Big[\tfrac{(s-a)+(s-b)+(s-c)}{\Delta}=\tfrac{s}{\Delta}\Big]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;89&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r_1+r_2+r_3-r=4R\ \ (\text{i.e. }r_1+r_2+r_3=4R+r)\qquad\big[\textstyle4R(\sum\sin\frac A2\cos\frac B2\cos\frac C2-\prod\sin\frac A2)=4R\sin\frac{A+B+C}2=4R\big]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;90&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{r_1}{bc}+\dfrac{r_2}{ca}+\dfrac{r_3}{ab}=\dfrac1r-\dfrac1{2R}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;14. Orthocentre &lt;span class=&quot;pg&quot;&gt;p. 93&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 243 243&quot; style=&quot;width:100%;max-width:243px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;121.6&quot; cy=&quot;121.6&quot; r=&quot;101.8&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot;/&gt;&lt;polygon points=&quot;103.6,21.4 28.0,161.8 215.2,161.8&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;101.2&quot; y=&quot;12.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;15.2&quot; y=&quot;172.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;228.1&quot; y=&quot;172.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;line x1=&quot;103.6&quot; y1=&quot;21.4&quot; x2=&quot;103.6&quot; y2=&quot;161.8&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;28.0&quot; y1=&quot;161.8&quot; x2=&quot;142.8&quot; y2=&quot;70.6&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;215.2&quot; y1=&quot;161.8&quot; x2=&quot;70.1&quot; y2=&quot;83.7&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;103.6&quot; y1=&quot;161.8&quot; x2=&quot;103.6&quot; y2=&quot;221.9&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;28.0&quot; y1=&quot;161.8&quot; x2=&quot;103.6&quot; y2=&quot;221.9&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;2 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;215.2&quot; y1=&quot;161.8&quot; x2=&quot;103.6&quot; y2=&quot;221.9&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;2 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;103.6&quot; cy=&quot;101.7&quot; r=&quot;3.4&quot; fill=&quot;#c2410c&quot;/&gt;&lt;circle cx=&quot;103.6&quot; cy=&quot;221.9&quot; r=&quot;3&quot; fill=&quot;#c2410c&quot;/&gt;&lt;text x=&quot;91.6&quot; y=&quot;106.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;H&lt;/text&gt;&lt;text x=&quot;101.2&quot; y=&quot;240.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;H&#x27;&lt;/text&gt;&lt;text x=&quot;103.6&quot; y=&quot;179.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;152.9&quot; y=&quot;67.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;E&lt;/text&gt;&lt;text x=&quot;58.7&quot; y=&quot;82.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;F&lt;/text&gt;&lt;polyline points=&quot;103.6,152.8 112.6,152.8 112.6,161.8&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Orthocentre H, feet D, E, F, and the image H′ of H in BC (it lies on the circumcircle).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;91&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle BH=\dfrac{BD}{\sin C}=\dfrac{c\cos B}{\sin C}=2R\cos B,\qquad HD=BD\cot C=\dfrac{c\cos B\cos C}{\sin C}=2R\cos B\cos C\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;92&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Distance of a vertex from the orthocentre:&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;93&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle AH=2R\cos A,\qquad BH=2R\cos B,\qquad CH=2R\cos C\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;94&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Distance of H from a side:&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;95&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle HD=2R\cos B\cos C,\qquad HE=2R\cos A\cos C,\qquad HF=2R\cos A\cos B\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;96&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Note:&lt;/b&gt; the image of the orthocentre in the sides of the triangle lies on the circumcircle of the triangle.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;15. Pedal triangle &lt;span class=&quot;pg&quot;&gt;pp. 94-95&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 290 230&quot; style=&quot;width:100%;max-width:290px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;121.9,25.3 25.3,204.7 264.5,204.7&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;121.9&quot; y=&quot;16.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;14.3&quot; y=&quot;218.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;276.8&quot; y=&quot;216.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;polygon points=&quot;121.9,204.7 171.9,88.2 79.1,104.9&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.8&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;line x1=&quot;121.9&quot; y1=&quot;25.3&quot; x2=&quot;121.9&quot; y2=&quot;204.7&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;25.3&quot; y1=&quot;204.7&quot; x2=&quot;171.9&quot; y2=&quot;88.2&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;264.5&quot; y1=&quot;204.7&quot; x2=&quot;79.1&quot; y2=&quot;104.9&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;121.9&quot; cy=&quot;127.9&quot; r=&quot;3&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;109.9&quot; y=&quot;132.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;H&lt;/text&gt;&lt;text x=&quot;121.9&quot; y=&quot;223.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;182.1&quot; y=&quot;85.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;E&lt;/text&gt;&lt;text x=&quot;67.6&quot; y=&quot;103.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;F&lt;/text&gt;&lt;path d=&quot;M114.8,188.2 A18,18 0 0 1 129.0,188.2&quot; fill=&quot;none&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;121.9&quot; y=&quot;180.7&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;10.5&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;π−2A&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Pedal triangle DEF (feet of the altitudes): ∠D = π−2A.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;97&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \angle D=\pi-2A,\qquad\angle E=\pi-2B,\qquad\angle F=\pi-2C\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;98&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Why:&lt;/b&gt; A, F, H, E (and the others) are concyclic; angle by the same chord = \(\tfrac\pi2-A\) at B and at C, so \(\angle EDF=\pi-2A\); DH bisects \(\angle D\), EH bisects \(\angle E\), &amp;hellip;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;99&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Note:&lt;/b&gt; the orthocentre H of \(\triangle ABC\) is the &lt;b&gt;incentre&lt;/b&gt; of its pedal triangle; A, B, C are the &lt;b&gt;excentres&lt;/b&gt; of the pedal triangle DEF (BC is the external bisector of the angle at D).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;100&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Sides:&lt;/b&gt; in \(\triangle BDF\) (circle on diameter BH): \(\dfrac{DF}{\sin B}=2R\cos B\) [BH \(=2R\cos B\) is the diameter].&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;101&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle DF=R\sin2B,\qquad DE=R\sin2C,\qquad FE=R\sin2A\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;102&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle 2R_{DEF}=\dfrac{EF}{\sin D}=\dfrac{R\sin2A}{\sin(\pi-2A)}=R\ \Rightarrow\ \text{circumradius of the pedal triangle}=\dfrac R2\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;16. Distance between orthocentre and circumcentre &lt;span class=&quot;pg&quot;&gt;pp. 95-96&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;103&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;In \(\triangle AHO\): \(AH=2R\cos A\), \(AO=R\), and \(\angle HAO=\theta=B-C\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;104&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle OH^2=AH^2+AO^2-2(AH)(AO)\cos\theta=4R^2\cos^2A+R^2-4R^2\cos A\cos(B-C)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;105&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle OH^2=R^2\big(1-8\cos A\cos B\cos C\big)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;106&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;[M-2: power of a point]&lt;/b&gt; the image \(H_1\) of H lies on the circumcircle; chord \(EF\) through H as well: \((AH)(HH_1)=(HE)(HF)=(R-OH)(R+OH)=R^2-OH^2\) with \(HH_1=2HD\) &amp;rArr; \(8R^2\cos A\cos B\cos C=R^2-OH^2\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;107&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle OH^2=9R^2-(a^2+b^2+c^2)\quad(\text{equivalent form})\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

uot; y1=&quot;127.5&quot; x2=&quot;127.9&quot; y2=&quot;41.9&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;83.3&quot; y1=&quot;127.5&quot; x2=&quot;36.2&quot; y2=&quot;45.9&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;127.9&quot; y1=&quot;41.9&quot; x2=&quot;36.2&quot; y2=&quot;45.9&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;127.9&quot; cy=&quot;41.9&quot; r=&quot;2.2&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;137.7&quot; y=&quot;40.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;circle cx=&quot;36.2&quot; cy=&quot;45.9&quot; r=&quot;2.2&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;25.8&quot; y=&quot;44.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;circle cx=&quot;83.3&quot; cy=&quot;127.5&quot; r=&quot;2.2&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;83.3&quot; y=&quot;144.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;path d=&quot;M103.3,127.5 A20,20 0 0 0 92.5,109.8&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;108.1&quot; y=&quot;117.5&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;13&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;/text&gt;&lt;path d=&quot;M46.2,63.2 A20,20 0 0 0 56.2,45.0&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;61.6&quot; y=&quot;64.8&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;13&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;Left: intersecting chords. Middle: secant-tangent. Right: alternate segment theorem.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;108&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (PA)(PB)=(PC)(PD)\qquad(\text{two chords through P, inside or outside})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;109&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (PA)(PB)=(PC)(PD)=PT^2\qquad(\text{secants and a tangent from an external point P})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;110&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Alternate segment theorem:&lt;/b&gt; the angle between a tangent and a chord equals the angle in the alternate segment (\(\angle A=\angle B\) in the notebook figure).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;111&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof:&lt;/b&gt; \(\triangle PAT\sim\triangle PTB\Rightarrow\dfrac{PT}{PB}=\dfrac{PA}{PT}\Rightarrow(PA)(PB)=PT^2\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;18. Excentral triangle &lt;span class=&quot;pg&quot;&gt;p. 97&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 240 242&quot; style=&quot;width:100%;max-width:240px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;123.3,218.4 217.0,23.4 23.4,31.8&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linejoin=&quot;round&quot; stroke-dasharray=&quot;5 3&quot;/&gt;&lt;polygon points=&quot;115.0,27.8 63.0,105.8 177.4,105.8&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;114.4&quot; y=&quot;18.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;50.7&quot; y=&quot;117.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;190.0&quot; y=&quot;116.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;line x1=&quot;115.0&quot; y1=&quot;27.8&quot; x2=&quot;123.3&quot; y2=&quot;218.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;63.0&quot; y1=&quot;105.8&quot; x2=&quot;217.0&quot; y2=&quot;23.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;177.4&quot; y1=&quot;105.8&quot; x2=&quot;23.4&quot; y2=&quot;31.8&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;217.0&quot; y1=&quot;23.4&quot; x2=&quot;115.0&quot; y2=&quot;27.8&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;23.4&quot; y1=&quot;31.8&quot; x2=&quot;115.0&quot; y2=&quot;27.8&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;23.4&quot; y1=&quot;31.8&quot; x2=&quot;63.0&quot; y2=&quot;105.8&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;217.0&quot; y1=&quot;23.4&quot; x2=&quot;177.4&quot; y2=&quot;105.8&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;117.1&quot; cy=&quot;76.9&quot; r=&quot;3&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;116.6&quot; y=&quot;69.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;I&lt;/text&gt;&lt;text x=&quot;123.9&quot; y=&quot;237.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;I&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;229.4&quot; y=&quot;21.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;I&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;2&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;10.8&quot; y=&quot;30.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;I&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;3&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Excentral triangle I₁I₂I₃; ABC is its pedal triangle and I is its orthocentre.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;112&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Key facts:&lt;/b&gt; A, B, C are the feet of the altitudes of \(\triangle I_1I_2I_3\) (each external bisector &amp;perp; internal bisector), so \(\triangle ABC\) is the &lt;b&gt;pedal triangle of \(\triangle I_1I_2I_3\)&lt;/b&gt;, and I is its &lt;b&gt;orthocentre&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;113&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \angle I_1=\dfrac\pi2-\dfrac A2,\qquad\angle I_2=\dfrac\pi2-\dfrac B2,\qquad\angle I_3=\dfrac\pi2-\dfrac C2\qquad(A=\pi-2I_1,\ \text{etc.})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;114&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle R_{I_1I_2I_3}=2R\qquad(\text{because the circumradius of a pedal triangle is half})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;115&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle I_1I_2=2(2R)\sin\angle I_3=4R\cos\dfrac C2,\qquad I_2I_3=4R\cos\dfrac A2,\qquad I_3I_1=4R\cos\dfrac B2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;116&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;M-2:&lt;/b&gt; \(I_1I_2=I_1C+I_2C=\dfrac{r_1}{\sin(\frac\pi2-\frac C2)}+\dfrac{r_2}{\sin(\frac\pi2-\frac C2)}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;117&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle II_1=2(2R)\cos\angle I_1=4R\sin\dfrac A2,\quad II_2=4R\sin\dfrac B2,\quad II_3=4R\sin\dfrac C2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;118&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Technique:&lt;/b&gt; to find \(II_1,II_2,II_3\) use that I is the orthocentre of \(\triangle I_1I_2I_3\) (distance of a vertex from the orthocentre = 2R&#x27; cos(angle), R&#x27; = 2R); or use \(\triangle BII_1\) with the known elements.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;&lt;div class=&quot;notes&quot;&gt;&lt;b&gt;Small slips in the handwritten notes (as I read them) &amp;mdash; the sheet uses the corrected forms:&lt;/b&gt;&lt;ul&gt;&lt;li&gt;p. 72 (vector proof of the sine rule): the note writes \(a^2=R^2+R^2+2(R\cdot R)\cos2A\); with \(\vec b\cdot\vec c=R^2\cos2A\) and \(|\vec b-\vec c|^2\) the sign is &lt;b&gt;&amp;minus;&lt;/b&gt;, which gives \(4R^2\sin^2A\) as the note concludes.&lt;/li&gt;&lt;li&gt;p. 76, problem 2: I read the statement as \(\dfrac{b^2-c^2}{a^2}=\dfrac{\sin(B-C)}{\sin(B+C)}\) (its M-2 line is \(\dfrac{\sin^2B-\sin^2C}{\sin^2A}\)).&lt;/li&gt;&lt;li&gt;p. 80: the first line of the problem reads \(2\cot\frac C2\); the working and result are \(2c\cot\frac C2\).&lt;/li&gt;&lt;li&gt;p. 91, (iv): the heading says \(r_1+r_2+r_3=4R\), but the working proves \(r_1+r_2+r_3-r=4R\) (the last term \(-\sin\frac A2\sin\frac B2\sin\frac C2\) is \(-r/4R\)); so \(r_1+r_2+r_3=4R+r\). The sheet and test use this form.&lt;/li&gt;&lt;li&gt;p. 90: the note proves \(r_1r_2r_3=\Delta^2\), but \(\tfrac\Delta{s-a}\cdot\tfrac\Delta{s-b}\cdot\tfrac\Delta{s-c}=s\Delta\), not \(\Delta^2\). The correct identity is \(r\,r_1r_2r_3=\Delta^2\) (13, 14, 15: \(4\cdot10.5\cdot12\cdot14=7056=84^2\)); the sheet and the test use this form.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;

.pal button{height:38px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;background:var(--grey);position:relative}
.pal button.na{background:var(--red)} .pal button.an{background:var(--green)} .pal button.mk{background:var(--purple)} .pal button.am{background:var(--purple)}
.pal button.am::after{content:&quot;&quot;;position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;background:#5ee07e;border:1px solid #fff}
.pal button.cur{outline:3px solid var(--amber)}
.legend{font-size:12.5px;display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;margin-top:6px}
.legend span i{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:5px;color:#fff;font-style:normal;margin-right:5px;font-size:12px}
.secsum{font-size:13px;color:#46566a;margin:4px 0 6px}
.start{max-width:760px;margin:26px auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px 28px}
.start h2{margin-top:0;color:var(--blue)}
.start label.m{display:block;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0;cursor:pointer}
.start label.m:has(input:checked){border-color:var(--blue2);background:#e7f1fd}
.start input[type=text]{padding:8px 10px;font-size:16px;border:1px solid var(--line);border-radius:5px;width:260px}
.start ul{line-height:1.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
.modal .box{background:#fff;border-radius:8px;padding:20px 24px;max-width:480px;width:92%}
table.sm{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
table.sm th,table.sm td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.sm th{background:#f1f5fa}
.res{max-width:1000px;margin:14px auto;padding:0 12px 40px}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.card{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card .v{font-size:26px;font-weight:700;color:var(--blue)}
.rq{background:#fff;border:1px solid var(--line);border-left:6px solid var(--grey);border-radius:6px;padding:12px 16px;margin:10px 0}
.rq.ok{border-left-color:var(--green)} .rq.bad{border-left-color:var(--red)} .rq.skip{border-left-color:var(--amber)}
.rq .meta{font-size:12.5px;color:#5a6a7e;margin-bottom:4px}
.rq .ans{font-size:15px;margin:6px 0}
.rq .exp{background:#f4f8fd;border-radius:5px;padding:8px 10px;font-size:15px;margin-top:6px;overflow-x:auto}
.filters{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.chip{padding:6px 12px;border:1px solid var(--blue2);border-radius:20px;cursor:pointer;font-size:14px;color:var(--blue);background:#fff}
.chip.on{background:var(--blue2);color:#fff}
.tagpill{display:inline-block;background:#fff3d6;border:1px solid #efd48a;border-radius:14px;padding:3px 10px;margin:3px;font-size:13.5px}
@media (max-width:860px){.wrap{flex-direction:column}.side{width:100%;position:static}}
@media print{header,.filters,.noprint{display:none!important}.rq{break-inside:avoid}}
svg{max-width:100%;height:auto}.figrow{display:flex;flex-wrap:wrap;gap:6px}.figrow svg{flex:1 1 140px;max-width:210px!important;margin:0!important}&lt;/style&gt;

  if(q.kind===&#x27;mcq&#x27;) document.querySelectorAll(&#x27;.opt&#x27;).forEach(o=&gt;o.onclick=()=&gt;{ r.sel=(r.sel===+o.dataset.k)?null:+o.dataset.k; paintQ(); paintPal(); });
  else {
    const ni=$(&#x27;#ni&#x27;); ni.oninput=()=&gt;{ r.num=ni.value; paintPal(); };
    document.querySelectorAll(&#x27;.keys button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{ const k=b.dataset.k; if(k===&#x27;bk&#x27;) r.num=r.num.slice(0,-1); else if(k===&#x27;cl&#x27;) r.num=&#x27;&#x27;; else r.num+=k; ni.value=r.num; paintPal(); });
  }
  $(&#x27;#pv&#x27;).disabled = cur===0; $(&#x27;#nx&#x27;).disabled = cur===Qs.length-1;
  typeset($(&#x27;#qb&#x27;));
}
function paintPal(){
  const secs=[...new Set(Qs.map(q=&gt;q.sec))];
  $(&#x27;#ss&#x27;).innerHTML = secs.map(s=&gt;{ const ids=Qs.map((q,i)=&gt;q.sec===s?i:-1).filter(i=&gt;i&gt;=0); return `&lt;b&gt;${s}&lt;/b&gt;: ${ids.filter(answered).length}/${ids.length} answered`; }).join(&#x27; &amp;middot; &#x27;);
  const ids = Qs.map((q,i)=&gt;i).filter(i=&gt;Qs[i].sec===secActive);
  let n=0, base = Qs.findIndex(q=&gt;q.sec===secActive);
  $(&#x27;#pal&#x27;).innerHTML = ids.map((i,j)=&gt;`&lt;button class=&quot;${status(i)} ${i===cur?&#x27;cur&#x27;:&#x27;&#x27;}&quot; data-i=&quot;${i}&quot;&gt;${j+1}&lt;/button&gt;`).join(&#x27;&#x27;);
  document.querySelectorAll(&#x27;#pal button&#x27;).forEach(b=&gt;b.onclick=()=&gt;go(+b.dataset.i));
}
function confirmSubmit(){
  const secs=[...new Set(Qs.map(q=&gt;q.sec))];
  const rows = secs.map(s=&gt;{ const ids=Qs.map((q,i)=&gt;q.sec===s?i:-1).filter(i=&gt;i&gt;=0); const a=ids.filter(answered).length, mk=ids.filter(i=&gt;R[i].mark).length; return `&lt;tr&gt;&lt;td&gt;${s}&lt;/td&gt;&lt;td&gt;${ids.length}&lt;/td&gt;&lt;td&gt;${a}&lt;/td&gt;&lt;td&gt;${ids.length-a}&lt;/td&gt;&lt;td&gt;${mk}&lt;/td&gt;&lt;/tr&gt;`; }).join(&#x27;&#x27;);
  const d=document.createElement(&#x27;div&#x27;); d.className=&#x27;modal&#x27;; d.innerHTML=`&lt;div class=&quot;box&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Submit test?&lt;/h3&gt;
  &lt;table class=&quot;sm&quot;&gt;&lt;tr&gt;&lt;th&gt;Section&lt;/th&gt;&lt;th&gt;Questions&lt;/th&gt;&lt;th&gt;Answered&lt;/th&gt;&lt;th&gt;Not answered&lt;/th&gt;&lt;th&gt;Marked&lt;/th&gt;&lt;/tr&gt;${rows}&lt;/table&gt;
  &lt;p style=&quot;font-size:14px&quot;&gt;Time left: &lt;b&gt;${fmt(left)}&lt;/b&gt;. You cannot change answers after submitting.&lt;/p&gt;
  &lt;div style=&quot;display:flex;gap:10px;justify-content:flex-end&quot;&gt;&lt;button class=&quot;b&quot; id=&quot;no&quot;&gt;Go back&lt;/button&gt;&lt;button class=&quot;b g&quot; id=&quot;yes&quot;&gt;Yes, submit&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
  document.body.appendChild(d); $(&#x27;#no&#x27;).onclick=()=&gt;d.remove(); $(&#x27;#yes&#x27;).onclick=()=&gt;{ d.remove(); submit(false); };
}
function correct(i){ const q=Qs[i],r=R[i]; if(!answered(i)) return null; if(q.kind===&#x27;mcq&#x27;) return r.sel===q.ans; const v=parseFloat(r.num); return isFinite(v) &amp;&amp; Math.abs(v-q.ans) &lt;= 0.01; }
function submit(auto){
  window.__active=false;
  clearInterval(tick); R[cur].t += (Date.now()-qStart)/1000;
  const used = total-left;
  const per = {}; let score=0, max=0, cor=0, wr=0, sk=0;
  Qs.forEach((q,i)=&gt;{ const S=SEC[q.sec]; per[q.sec]=per[q.sec]||{n:0,c:0,w:0,s:0,sc:0,mx:0,t:0}; const p=per[q.sec]; p.n++; p.mx+=S.pos; max+=S.pos; p.t+=R[i].t;
    const c=correct(i); if(c===null){p.s++;sk++;} else if(c){p.c++;cor++;p.sc+=S.pos;score+=S.pos;} else {p.w++;wr++;p.sc-=S.neg;score-=S.neg;} });
  const attempted=cor+wr;
  const weak = {}; Qs.forEach((q,i)=&gt;{ if(correct(i)!==true){ (weak[q.tag]=weak[q.tag]||[]).push(i+1); } });
  let h = `&lt;header&gt;&lt;h1&gt;Result &amp;middot; Properties of Triangles Recall Test${name?&#x27; &amp;middot; &#x27;+name:&#x27;&#x27;}&lt;/h1&gt;&lt;div class=&quot;noprint&quot;&gt;&lt;button class=&quot;b&quot; onclick=&quot;window.print()&quot;&gt;Print / Save PDF&lt;/button&gt; &lt;button class=&quot;b&quot; onclick=&quot;location.reload()&quot;&gt;Take again&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;res&quot;&gt;`;
  h += `&lt;div class=&quot;cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Score&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${score} / ${max}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Accuracy&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${attempted?Math.round(100*cor/attempted):0}%&lt;/div&gt;&lt;div style=&quot;font-size:12px&quot;&gt;${cor} correct of ${attempted} attempted&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Correct / Wrong / Skipped&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;&lt;span style=&quot;color:var(--green)&quot;&gt;${cor}&lt;/span&gt; / &lt;span style=&quot;color:var(--red)&quot;&gt;${wr}&lt;/span&gt; / &lt;span style=&quot;color:var(--amber)&quot;&gt;${sk}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div&gt;Time used&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${fmt(used)}&lt;/div&gt;${auto?&#x27;&lt;div style=&quot;font-size:12px&quot;&gt;auto-submitted&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;`;
  h += `&lt;table class=&quot;sm&quot;&gt;&lt;tr&gt;&lt;th&gt;Section&lt;/th&gt;&lt;th&gt;Questions&lt;/th&gt;&lt;th&gt;Correct&lt;/th&gt;&lt;th&gt;Wrong&lt;/th&gt;&lt;th&gt;Skipped&lt;/th&gt;&lt;th&gt;Marks&lt;/th&gt;&lt;th&gt;Avg time / Q&lt;/th&gt;&lt;/tr&gt;${Object.keys(per).map(s=&gt;{const p=per[s];return `&lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;${s}. ${SEC[s].name}&lt;/td&gt;&lt;td&gt;${p.n}&lt;/td&gt;&lt;td&gt;${p.c}&lt;/td&gt;&lt;td&gt;${p.w}&lt;/td&gt;&lt;td&gt;${p.s}&lt;/td&gt;&lt;td&gt;${p.sc} / ${p.mx}&lt;/td&gt;&lt;td&gt;${Math.round(p.t/p.n)} s&lt;/td&gt;&lt;/tr&gt;`}).join(&#x27;&#x27;)}&lt;/table&gt;`;
  const wk=Object.keys(weak);
  h += `&lt;h3&gt;Formulas / topics to revise&lt;/h3&gt;` + (wk.length ? `&lt;div&gt;${wk.map(t=&gt;`&lt;span class=&quot;tagpill&quot;&gt;${t} &lt;small&gt;(Q ${weak[t].join(&#x27;, &#x27;)})&lt;/small&gt;&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;` : `&lt;p&gt;Nothing &amp;mdash; every question was correct. Excellent recall!&lt;/p&gt;`);
  h += `&lt;h3&gt;Question-wise review&lt;/h3&gt;&lt;div class=&quot;filters&quot;&gt;&lt;span class=&quot;chip on&quot; data-f=&quot;all&quot;&gt;All&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;bad&quot;&gt;Wrong&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;skip&quot;&gt;Skipped&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;ok&quot;&gt;Correct&lt;/span&gt;&lt;/div&gt;&lt;div id=&quot;rl&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
  $(&#x27;#app&#x27;).innerHTML=h;
  const paint = f =&gt; {
    $(&#x27;#rl&#x27;).innerHTML = Qs.map((q,i)=&gt;{ const c=correct(i); const cls=c===null?&#x27;skip&#x27;:c?&#x27;ok&#x27;:&#x27;bad&#x27;; if(f!==&#x27;all&#x27;&amp;&amp;f!==cls) return &#x27;&#x27;;
      const yours = c===null?&#x27;&lt;i&gt;not answered&lt;/i&gt;&#x27; : q.kind===&#x27;mcq&#x27; ? `${&#x27;ABCD&#x27;[R[i].sel]}. ${M(q.opts[R[i].sel])}` : R[i].num;
      const right = q.kind===&#x27;mcq&#x27; ? `${&#x27;ABCD&#x27;[q.ans]}. ${M(q.opts[q.ans])}` : q.ans;
      return `&lt;div class=&quot;rq ${cls}&quot;&gt;&lt;div class=&quot;meta&quot;&gt;Q${i+1} &amp;middot; Section ${q.sec} &amp;middot; ${q.tag} &amp;middot; time ${Math.round(R[i].t)} s &amp;middot; ${c===null?&#x27;Skipped&#x27;:c?&#x27;Correct&#x27;:&#x27;Wrong&#x27;}&lt;/div&gt;&lt;div class=&quot;stem&quot; style=&quot;font-size:17px;margin-bottom:6px&quot;&gt;${M(q.stem)}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Your answer:&lt;/b&gt; ${yours}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Correct answer:&lt;/b&gt; ${right}&lt;/div&gt;&lt;div class=&quot;exp&quot;&gt;${M(q.exp)}&lt;/div&gt;&lt;/div&gt;`; }).join(&#x27;&#x27;);
    typeset($(&#x27;#rl&#x27;));
  };
  paint(&#x27;all&#x27;);
  document.querySelectorAll(&#x27;.chip&#x27;).forEach(c=&gt;c.onclick=()=&gt;{ document.querySelectorAll(&#x27;.chip&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;)); c.classList.add(&#x27;on&#x27;); paint(c.dataset.f); });
  window.scrollTo(0,0);
}
startScreen();
&lt;/script&gt;
