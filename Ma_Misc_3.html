&lt;h1&gt;Properties of Triangles &amp;mdash; Must-Remember Sheet&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;Every formula, concept and technique from the class notes, with the figures redrawn &amp;middot; 118 points and 19 figures in 18 topics &amp;middot; page references are the notebook&#x27;s own page numbers (pp. 70&amp;ndash;97)&lt;/div&gt;

&lt;section&gt;&lt;h2&gt;1. Sine rule &lt;span class=&quot;pg&quot;&gt;pp. 70-72&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Elements of a triangle:&lt;/b&gt; 3 sides, 3 angles. Standard notation: a = BC, b = CA, c = AB; angles A, B, C; s = (a+b+c)/2; R = circumradius, r = inradius, Δ = area.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{a}{\sin A}=\dfrac{b}{\sin B}=\dfrac{c}{\sin C}=2R\qquad(R=\text{circumradius of }\triangle ABC)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 272 272&quot; style=&quot;width:100%;max-width:272px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;136.0&quot; cy=&quot;136.0&quot; r=&quot;114.0&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;polygon points=&quot;124.0,22.6 32.0,182.6 240.0,182.6&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;122.5&quot; y=&quot;13.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;19.2&quot; y=&quot;193.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;252.8&quot; y=&quot;193.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;line x1=&quot;136.0&quot; y1=&quot;136.0&quot; x2=&quot;32.0&quot; y2=&quot;182.6&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;136.0&quot; cy=&quot;136.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;136.0&quot; y=&quot;129.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;O&lt;/text&gt;&lt;text x=&quot;78.0&quot; y=&quot;154.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;R&lt;/text&gt;&lt;text x=&quot;136.0&quot; y=&quot;173.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;a&lt;/text&gt;&lt;text x=&quot;193.3&quot; y=&quot;99.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;65.8&quot; y=&quot;100.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;c&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Sine rule: every side over the sine of its opposite angle equals the diameter 2R of the circumcircle.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a+b&gt;c\ \Rightarrow\ \sin A+\sin B&gt;\sin C\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Technique (proof of the sine rule):&lt;/b&gt; whenever you see a chord, &lt;b&gt;draw a &amp;perp; from the centre&lt;/b&gt; &amp;mdash; it bisects the chord, and the central angle is twice the inscribed angle.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Acute &amp;Delta;:&lt;/b&gt; circumcentre O is inside the triangle; O lies on the &amp;perp; bisector of every side, so it is equidistant from A, B, C &amp;rArr; O is the centre. \(\angle BOC=2\angle BAC\), so \(\angle BOD=A\), \(R\sin A=\tfrac a2\Rightarrow a=2R\sin A\Rightarrow 2R=\tfrac{a}{\sin A}\); similarly for b and c.&lt;/span&gt;&lt;/div&gt;

;circle cx=&quot;136.0&quot; cy=&quot;136.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;136.0&quot; cy=&quot;182.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;124.0&quot; y=&quot;141.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;O&lt;/text&gt;&lt;text x=&quot;136.0&quot; y=&quot;200.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;path d=&quot;M123.2,141.7 A14,14 0 0 0 148.8,141.7&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;156.0&quot; y=&quot;166.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;2A&lt;/text&gt;&lt;path d=&quot;M112.0,43.4 A24,24 0 0 0 138.1,42.1&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;125.9&quot; y=&quot;64.6&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;13&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;80.0&quot; y=&quot;208.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;a/2&lt;/text&gt;&lt;text x=&quot;75.0&quot; y=&quot;157.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;R&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Acute triangle: OD &amp;perp; BC, &amp;ang;BOC = 2A, BD = a/2.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Obtuse &amp;Delta; (A obtuse):&lt;/b&gt; circumcentre is &lt;u&gt;outside&lt;/u&gt;. \(\angle BDC=\pi-A\) (cyclic quadrilateral), \(\angle BOC=2(\pi-A)\), \(R\sin(\pi-A)=\tfrac a2\Rightarrow 2R\sin A=a\).&lt;/span&gt;&lt;/div&gt;

dth=&quot;1.3&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;142.5&quot; y1=&quot;142.5&quot; x2=&quot;142.5&quot; y2=&quot;262.9&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;142.5&quot; cy=&quot;142.5&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;142.5&quot; cy=&quot;262.9&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;142.5&quot; cy=&quot;75.3&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;142.5&quot; y=&quot;159.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;O&lt;/text&gt;&lt;text x=&quot;142.5&quot; y=&quot;281.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;142.5&quot; y=&quot;92.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;E&lt;/text&gt;&lt;polyline points=&quot;142.5,84.3 151.5,84.3 151.5,75.3&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;path d=&quot;M99.7,35.6 A18,18 0 0 0 131.2,31.8&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;117.6&quot; y=&quot;57.1&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;path d=&quot;M134.0,247.0 A18,18 0 0 1 150.9,247.0&quot; fill=&quot;none&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;142.5&quot; y=&quot;237.9&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;11&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;π−A&lt;/text&gt;&lt;path d=&quot;M128.3,133.0 A17,17 0 0 1 156.6,133.0&quot; fill=&quot;none&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;142.5&quot; y=&quot;114.5&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;11&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;2(π−A)&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Obtuse triangle: O lies outside; D is on the arc opposite A, &amp;ang;BOC = 2(π−A).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Right &amp;Delta; at A:&lt;/b&gt; the hypotenuse BC is a diameter: \(BC=2R=a\), \(2R\sin\tfrac\pi2=a\), i.e. \(2R\sin A=a\) again.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 244 244&quot; style=&quot;width:100%;max-width:244px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;122.0&quot; cy=&quot;122.0&quot; r=&quot;100.0&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;polygon points=&quot;66.0,39.2 22.0,122.0 222.0,122.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;58.2&quot; y=&quot;32.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;8.0&quot; y=&quot;127.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;236.0&quot; y=&quot;127.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;polyline points=&quot;61.8,47.1 69.7,51.3 73.9,43.4&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;122.0&quot; cy=&quot;122.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;122.0&quot; y=&quot;116.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;O&lt;/text&gt;&lt;text x=&quot;122.0&quot; y=&quot;152.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;a = BC = 2R&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Right angle at A &amp;rArr; BC is a diameter (angle in a semicircle).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Vector proof:&lt;/b&gt; take O as origin, \(|\vec b|=|\vec c|=R\), \(\vec b\cdot\vec c=R^2\cos2A\). Then \(a^2=|\vec b-\vec c|^2=|\vec b|^2-2\vec b\cdot\vec c+|\vec c|^2=2R^2-2R^2\cos2A=4R^2\sin^2A\Rightarrow a=2R\sin A\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;2. Vector basics and section formula &lt;span class=&quot;pg&quot;&gt;pp. 71-72&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle |\vec a|^2=\vec a\cdot\vec a\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle |\vec a+\vec b|^2=(\vec a+\vec b)\cdot(\vec a+\vec b)=|\vec a|^2+2\vec a\cdot\vec b+|\vec b|^2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;11&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle |\vec a-\vec b|^2=|\vec a|^2-2\vec a\cdot\vec b+|\vec b|^2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;12&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle |\vec a+\vec b+\vec c|^2=|\vec a|^2+|\vec b|^2+|\vec c|^2+2\vec a\cdot\vec b+2\vec b\cdot\vec c+2\vec c\cdot\vec a\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;13&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Section formula.&lt;/b&gt; Point A has position vector \(\vec a\), B has \(\vec b\). The point dividing AB in the ratio \(m:n\): &lt;b&gt;internally&lt;/b&gt; \(P=\dfrac{m\vec b+n\vec a}{m+n}\); &lt;b&gt;externally&lt;/b&gt; \(Q=\dfrac{m\vec b-n\vec a}{m-n}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 360 160&quot; style=&quot;width:100%;max-width:330px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;30.0&quot; y1=&quot;60.0&quot; x2=&quot;330.0&quot; y2=&quot;60.0&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;30.0&quot; cy=&quot;60.0&quot; r=&quot;4&quot; fill=&quot;#1a4f8b&quot;/&gt;&lt;text x=&quot;30.0&quot; y=&quot;46.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;circle cx=&quot;130.0&quot; cy=&quot;60.0&quot; r=&quot;4&quot; fill=&quot;#1a4f8b&quot;/&gt;&lt;text x=&quot;130.0&quot; y=&quot;46.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;circle cx=&quot;180.0&quot; cy=&quot;60.0&quot; r=&quot;4&quot; fill=&quot;#1a4f8b&quot;/&gt;&lt;text x=&quot;180.0&quot; y=&quot;46.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;circle cx=&quot;330.0&quot; cy=&quot;60.0&quot; r=&quot;4&quot; fill=&quot;#1a4f8b&quot;/&gt;&lt;text x=&quot;330.0&quot; y=&quot;46.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;Q&lt;/text&gt;&lt;text x=&quot;80.0&quot; y=&quot;82.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;m&lt;/text&gt;&lt;text x=&quot;155.0&quot; y=&quot;82.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;n&lt;/text&gt;&lt;line x1=&quot;180.0&quot; y1=&quot;87.5&quot; x2=&quot;330.0&quot; y2=&quot;87.5&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;text x=&quot;255.0&quot; y=&quot;107.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;n&lt;/text&gt;&lt;line x1=&quot;30.0&quot; y1=&quot;112.5&quot; x2=&quot;330.0&quot; y2=&quot;112.5&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;text x=&quot;180.0&quot; y=&quot;132.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;m&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;P divides AB internally and Q externally in the ratio m : n.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;14&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof idea:&lt;/b&gt; \(\widehat{AP}=\widehat{PB}\) (same unit vector) &amp;rArr; \(\dfrac{\vec p-\vec a}{|AP|}=\dfrac{\vec b-\vec p}{|PB|}\) &amp;rArr; \(\vec p-\vec a=\tfrac mn(\vec b-\vec p)\). For Q: \(\widehat{AQ}=\widehat{BQ}\), \(\dfrac{\vec q-\vec a}{|AQ|}=\dfrac{\vec q-\vec b}{|BQ|}\) with \(\dfrac{|AQ|}{|QB|}=\dfrac mn\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;3. Cosine rule and projection rule &lt;span class=&quot;pg&quot;&gt;pp. 72-73&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;15&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cos A=\dfrac{b^2+c^2-a^2}{2bc},\qquad \cos B=\dfrac{c^2+a^2-b^2}{2ca},\qquad \cos C=\dfrac{a^2+b^2-c^2}{2ab}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 293 206&quot; style=&quot;width:100%;max-width:293px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;93.6,26.4 26.4,180.0 266.4,180.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;87.3&quot; y=&quot;18.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;13.4&quot; y=&quot;190.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;279.4&quot; y=&quot;190.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;line x1=&quot;93.6&quot; y1=&quot;26.4&quot; x2=&quot;93.6&quot; y2=&quot;180.0&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;93.6,171.0 102.6,171.0 102.6,180.0&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;93.6&quot; cy=&quot;180.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;93.6&quot; y=&quot;198.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;47.8&quot; y=&quot;103.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;c&lt;/text&gt;&lt;text x=&quot;191.6&quot; y=&quot;102.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;60.0&quot; y=&quot;202.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;x&lt;/text&gt;&lt;text x=&quot;180.0&quot; y=&quot;202.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;a − x&lt;/text&gt;&lt;text x=&quot;84.6&quot; y=&quot;107.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#6b7a8d&quot; text-anchor=&quot;middle&quot;&gt;h&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Altitude AD = h splits BC into x and a − x.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;16&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof (altitude):&lt;/b&gt; \(AD^2=c^2-x^2=b^2-(a-x)^2\Rightarrow x=\dfrac{a^2+c^2-b^2}{2a}\); then \(\cos B=\dfrac xc=\dfrac{a^2+c^2-b^2}{2ac}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;17&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Vector proof:&lt;/b&gt; use the side vectors \(\vec c=\vec a+\vec b\) &amp;rArr; \(|\vec c|^2=|\vec a|^2+|\vec b|^2+2\vec a\cdot\vec b\), and the angle between \(\vec a,\vec b\) is \(\pi-C\), so \(c^2=a^2+b^2-2ab\cos C\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;18&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Projection rule&lt;/b&gt; (any side = sum of the projections of the other two sides on it):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;19&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a\cos B+b\cos A=c,\qquad b\cos C+c\cos B=a,\qquad a\cos C+c\cos A=b\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 293 206&quot; style=&quot;width:100%;max-width:293px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;122.4,26.4 26.4,180.0 266.4,180.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;119.3&quot; y=&quot;17.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;13.4&quot; y=&quot;190.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;279.4&quot; y=&quot;190.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;line x1=&quot;122.4&quot; y1=&quot;26.4&quot; x2=&quot;122.4&quot; y2=&quot;180.0&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;122.4,171.0 131.4,171.0 131.4,180.0&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;122.4&quot; cy=&quot;180.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;122.4&quot; y=&quot;198.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;62.3&quot; y=&quot;103.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;c&lt;/text&gt;&lt;text x=&quot;206.2&quot; y=&quot;102.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;74.4&quot; y=&quot;203.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;c cos B&lt;/text&gt;&lt;text x=&quot;194.4&quot; y=&quot;203.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;b cos C&lt;/text&gt;&lt;path d=&quot;M48.4,180.0 A22,22 0 0 0 38.1,161.3&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;54.4&quot; y=&quot;169.5&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;path d=&quot;M244.4,180.0 A22,22 0 0 1 251.4,164.0&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;237.0&quot; y=&quot;172.3&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Projections of c and b on BC are c cos B and b cos C, and they add up to a.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;20&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Vector proof:&lt;/b&gt; \(\vec v_3=\vec v_1+\vec v_2\) &amp;rArr; \(\vec v_3\cdot\vec v_3=\vec v_1\cdot\vec v_3+\vec v_2\cdot\vec v_3\), i.e. \(c^2=a\,c\cos B+b\,c\cos A\Rightarrow c=a\cos B+b\cos A\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;4. Napier&#x27;s analogy (tangent rule) &lt;span class=&quot;pg&quot;&gt;p. 74&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;21&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan\!\Big(\dfrac{B-C}{2}\Big)=\dfrac{b-c}{b+c}\cot\dfrac A2,\quad \tan\!\Big(\dfrac{C-A}{2}\Big)=\dfrac{c-a}{c+a}\cot\dfrac B2,\quad \tan\!\Big(\dfrac{A-B}{2}\Big)=\dfrac{a-b}{a+b}\cot\dfrac C2\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;22&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof:&lt;/b&gt; \(\dfrac{b-c}{b+c}=\dfrac{(\sin B-\sin C)2R}{(\sin B+\sin C)2R}=\dfrac{2\sin\frac{B-C}2\cos\frac{B+C}2}{2\sin\frac{B+C}2\cos\frac{B-C}2}=\tan\dfrac A2\tan\dfrac{B-C}2\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;23&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Use:&lt;/b&gt; when two sides and the included angle are known, Napier gives the other two angles directly (see the example b = &amp;radic;3, c = 1, A = 30&amp;deg;).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;5. Area of a triangle &lt;span class=&quot;pg&quot;&gt;p. 74&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 293 197&quot; style=&quot;width:100%;max-width:293px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;103.2,26.4 26.4,170.4 266.4,170.4&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;97.5&quot; y=&quot;18.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;13.4&quot; y=&quot;180.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;279.4&quot; y=&quot;180.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;line x1=&quot;103.2&quot; y1=&quot;26.4&quot; x2=&quot;103.2&quot; y2=&quot;170.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.4&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;103.2,161.4 112.2,161.4 112.2,170.4&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;text x=&quot;52.6&quot; y=&quot;99.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;c&lt;/text&gt;&lt;text x=&quot;146.4&quot; y=&quot;191.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;a&lt;/text&gt;&lt;text x=&quot;135.2&quot; y=&quot;102.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;c sin B&lt;/text&gt;&lt;path d=&quot;M48.4,170.4 A22,22 0 0 0 36.8,151.0&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;53.8&quot; y=&quot;158.9&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Height from A is c sin B, so Δ = ½ · a · c sin B.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;24&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \Delta=\tfrac12ac\sin B=\tfrac12ab\sin C=\tfrac12bc\sin A=\tfrac12\big|\overrightarrow{BC}\times\overrightarrow{BA}\big|\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;25&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \Delta=\tfrac12\,a^2\,\dfrac{\sin B\sin C}{\sin A}=\tfrac12\,b^2\,\dfrac{\sin C\sin A}{\sin B}=\tfrac12\,c^2\,\dfrac{\sin A\sin B}{\sin C}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;26&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \Delta=\dfrac{abc}{4R}\quad(\text{from }\tfrac12bc\sin A\text{ and }\sin A=\tfrac a{2R})\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;6. Half-angle formulas and Heron&#x27;s formula &lt;span class=&quot;pg&quot;&gt;p. 75&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;27&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Here \(s=\dfrac{a+b+c}{2}\) and \(\Delta\) is the area.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;28&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin\dfrac A2=\sqrt{\dfrac{(s-b)(s-c)}{bc}},\quad \sin\dfrac B2=\sqrt{\dfrac{(s-c)(s-a)}{ca}},\quad \sin\dfrac C2=\sqrt{\dfrac{(s-a)(s-b)}{ab}}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;29&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \cos\dfrac A2=\sqrt{\dfrac{s(s-a)}{bc}},\quad \cos\dfrac B2=\sqrt{\dfrac{s(s-b)}{ca}},\quad \cos\dfrac C2=\sqrt{\dfrac{s(s-c)}{ab}}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;30&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan\dfrac A2=\sqrt{\dfrac{(s-b)(s-c)}{s(s-a)}}=\dfrac{\Delta}{s(s-a)},\quad \tan\dfrac B2=\dfrac{\Delta}{s(s-b)},\quad \tan\dfrac C2=\dfrac{\Delta}{s(s-c)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;31&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \Delta=\sqrt{s(s-a)(s-b)(s-c)}\qquad(\text{Heron&#x27;s formula})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;32&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof of \(\sin\frac A2\):&lt;/b&gt; \(\sin\dfrac A2=\sqrt{\dfrac{1-\cos A}{2}}=\sqrt{\dfrac{a^2-(b-c)^2}{4bc}}=\sqrt{\dfrac{(a-b+c)(a+b-c)}{4bc}}=\sqrt{\dfrac{(2s-2b)(2s-2c)}{4bc}}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;33&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Heron&#x27;s derivation:&lt;/b&gt; \(\Delta=\tfrac12bc\sin A=bc\sin\dfrac A2\cos\dfrac A2\) &amp;rArr; substitute the two half-angle formulas.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;7. Techniques and standard results from the solved examples &lt;span class=&quot;pg&quot;&gt;pp. 76-82&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;34&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Side &amp;harr; angle conversion:&lt;/b&gt; replace \(a,b,c\) by \(2R\sin A,2R\sin B,2R\sin C\) (or divide by \(2R\)) to turn a side-identity into a trigonometric one, and back with the cosine rule.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;35&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Key identities used:&lt;/b&gt; \(\sin(B+C)=\sin A\), \(\ \sin(B+C)\sin(B-C)=\sin^2B-\sin^2C\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;36&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a\sin(B-C)+b\sin(C-A)+c\sin(A-B)=0\quad[\text{replace }a=2R\sin A,\ \sin A=\sin(B+C)]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;37&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{b^2-c^2}{a^2}=\dfrac{\sin^2B-\sin^2C}{\sin^2A}=\dfrac{\sin(B-C)}{\sin(B+C)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;38&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (b^2-c^2)\cot A+(c^2-a^2)\cot B+(a^2-b^2)\cot C=0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;39&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;AP test:&lt;/b&gt; to show \(a,b,c\) in AP prove \(a+c=2b\). Quick way: \(a\cos^2\tfrac C2+c\cos^2\tfrac A2=\tfrac{3b}2\) &amp;rArr; use \(\cos^2\tfrac C2=\tfrac{1+\cos C}2\) and the projection rule \(a\cos C+c\cos A=b\) &amp;rArr; \(a+b+c=3b\Rightarrow a+c=2b\). (The long way: half-angle formulas.)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;40&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a^2,b^2,c^2\text{ in AP}\iff\cot A,\cot B,\cot C\text{ in AP}\quad[\sin^2B-\sin^2A=\sin^2C-\sin^2B\Rightarrow\sin C\sin(B-A)=\sin A\sin(C-B)\Rightarrow\cot A-\cot B=\cot B-\cot C]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;41&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Solving a triangle (SAS):&lt;/b&gt; M-1 cosine rule for the third side; M-2 Napier&#x27;s analogy. Example \(b=\sqrt3,c=1,A=30^\circ\): \(a=1\), \(\tan\frac{B-C}2=1\), \(B=120^\circ,C=30^\circ\) (isosceles \(a=c=1\)).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;42&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Largest side &amp;rArr; largest angle:&lt;/b&gt; sides \(a,b,\sqrt{a^2+ab+b^2}\): \(\cos C=\dfrac{a^2+b^2-c^2}{2ab}=-\dfrac12\Rightarrow C=120^\circ\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;43&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Quartic in c:&lt;/b&gt; \(c^4-2(a^2+b^2)c^2+a^4+a^2b^2+b^4=0\) is a quadratic in \(c^2\): \(c^2=a^2+b^2\pm ab\Rightarrow\cos C=\mp\tfrac12\Rightarrow C=\tfrac\pi3\) or \(\tfrac{2\pi}3\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;44&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Condition with cosines:&lt;/b&gt; \(\tfrac{2\cos A}{a}+\tfrac{\cos B}{b}+\tfrac{2\cos C}{c}=\tfrac a{bc}+\tfrac b{ca}\): put \(\cos\) in terms of sides over \(abc\) &amp;rArr; \(b^2+c^2=a^2\Rightarrow A=\tfrac\pi2\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;45&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (a+b+c)\Big(\tan\dfrac A2+\tan\dfrac B2\Big)=2c\cot\dfrac C2\quad[\tan\tfrac A2+\tan\tfrac B2=\tfrac{\sin\frac C2}{\cos\frac A2\cos\frac B2},\ \text{then half-angle formulas}]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;46&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{\cot\frac A2+\cot\frac B2+\cot\frac C2}{\cot A+\cot B+\cot C}=\dfrac{(a+b+c)^2}{a^2+b^2+c^2}\quad[\cot\tfrac A2=\tfrac{s(s-a)}\Delta,\ \cot A=\tfrac{b^2+c^2-a^2}{4\Delta}]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;47&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;If a, b, c are in AP:&lt;/b&gt; (i) \(\cot\frac A2,\cot\frac B2,\cot\frac C2\) are in AP (since \(\cot\frac A2=\frac{s(s-a)}\Delta\) and \(a+c=2b\)); (ii) \(\cos A\cot\frac A2,\ \cos B\cot\frac B2,\ \cos C\cot\frac C2\) are in AP, using \(\cos A\cot\frac A2=\cot\frac A2-\sin A\) and \(\sin A,\sin B,\sin C\) in AP.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;\(\bigstar\) Altitude, angle bisector and median from A divide \(\angle A\) into 4 equal angles \(\theta\):&lt;/b&gt; in \(\triangle ABD\) and \(\triangle ACD\) use the sine rule so that BD, CD, AD appear: \(\dfrac{BD}{\sin3\theta}=\dfrac{AD}{\cos\theta}\), \(\dfrac{CD}{\sin\theta}=\dfrac{AD}{\cos3\theta}\) &amp;rArr; \(\dfrac{\sin\theta}{\sin3\theta}=\dfrac{\cos3\theta}{\cos\theta}\Rightarrow\sin2\theta=\sin6\theta\Rightarrow\sin2\theta\cos4\theta=0\). \(2\theta=\pi\) is impossible, so \(4\theta=\tfrac\pi2\): &lt;b&gt;\(\angle A=90^\circ\)&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;

t x=&quot;98.1&quot; y=&quot;56.4&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Altitude, bisector and median from A cut ∠A into four equal angles θ (the right angle at A case).&lt;/div&gt;&lt;/div&gt;

&lt;section&gt;&lt;h2&gt;8. m-n theorem &lt;span class=&quot;pg&quot;&gt;p. 83&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;49&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;D lies on BC with \(BD:DC=m:n\); \(\alpha=\angle BAD\), \(\beta=\angle DAC\), \(\theta=\angle ADC\).&lt;/span&gt;&lt;/div&gt;
