&lt;section&gt;&lt;h2&gt;1. Area of a quadrilateral &lt;span class=&quot;pg&quot;&gt;pp. 99-100&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 298 202&quot; style=&quot;width:100%;max-width:298px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;28.8,172.8 268.8,172.8 235.2,28.8 52.8,57.6&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;line x1=&quot;28.8&quot; y1=&quot;172.8&quot; x2=&quot;235.2&quot; y2=&quot;28.8&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;268.8&quot; y1=&quot;172.8&quot; x2=&quot;52.8&quot; y2=&quot;57.6&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;132.8&quot; cy=&quot;100.3&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;17.3&quot; y=&quot;185.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;281.2&quot; y=&quot;184.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;246.7&quot; y=&quot;25.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;text x=&quot;40.4&quot; y=&quot;56.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;132.8&quot; y=&quot;117.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;text x=&quot;151.6&quot; y=&quot;190.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;a&lt;/text&gt;&lt;text x=&quot;265.0&quot; y=&quot;105.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;146.5&quot; y=&quot;35.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;c&lt;/text&gt;&lt;text x=&quot;28.0&quot; y=&quot;122.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;d&lt;/text&gt;&lt;text x=&quot;72.8&quot; y=&quot;134.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;d&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;210.8&quot; y=&quot;136.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;d&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;2&lt;/tspan&gt;&lt;/text&gt;&lt;path d=&quot;M144.3,92.2 A14,14 0 0 1 145.1,106.8&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;157.7&quot; y=&quot;103.8&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Quadrilateral ABCD: sides a = AB, b = BC, c = CD, d = DA; diagonals d₁ = AC, d₂ = BD meet at P at angle θ.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Area}=\tfrac12\,\big|\vec d_1\times\vec d_2\big|=\tfrac12\,d_1d_2\sin\theta\qquad(\vec d_1,\vec d_2=\text{diagonal vectors})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof idea (4 triangles at P):&lt;/b&gt; area \(=\tfrac12\sin\theta\,[PA\cdot PB+PB\cdot PC+PC\cdot PD+PD\cdot PA]=\tfrac12\sin\theta\,(PB+PD)(PA+PC)=\tfrac12\,BD\cdot AC\sin\theta\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Vector proof:&lt;/b&gt; \(\triangle ABD+\triangle DBC=\tfrac12\overrightarrow{AB}\times\overrightarrow{DB}+\tfrac12\overrightarrow{DB}\times\overrightarrow{DC}\) &amp;rArr; combine to \(\tfrac12(\overrightarrow{AB}-\overrightarrow{CB})\times\overrightarrow{DB}=\tfrac12\overrightarrow{AC}\times\overrightarrow{DB}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;General quadrilateral (Bretschneider).&lt;/b&gt; Let \(s=\dfrac{a+b+c+d}2\) and \(A+C=2\alpha\) (a pair of opposite angles).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \Delta^2=(s-a)(s-b)(s-c)(s-d)-abcd\,\cos^2\alpha,\qquad \alpha=\dfrac{A+C}{2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof idea:&lt;/b&gt; \(\Delta=\tfrac12ad\sin A+\tfrac12bc\sin C\); also \(BD^2=a^2+d^2-2ad\cos A=b^2+c^2-2bc\cos C\). Square and add: \(16\Delta^2+(a^2+d^2-b^2-c^2)^2=4(ad+bc)^2-16abcd\cos^2\alpha\) (using \(\cos(A+C)=2\cos^2\alpha-1\)); then factorise the difference of squares into \(16(s-a)(s-b)(s-c)(s-d)\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Cyclic quadrilateral }(A+C=\pi,\ \cos\alpha=0):\qquad \Delta=\sqrt{(s-a)(s-b)(s-c)(s-d)}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;text x=&quot;13.5&quot; y=&quot;23.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;80.6&quot; y=&quot;17.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;a&lt;/text&gt;&lt;text x=&quot;106.4&quot; y=&quot;120.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;12.0&quot; y=&quot;69.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;h&lt;/text&gt;&lt;text x=&quot;176.0&quot; y=&quot;69.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;n&lt;/text&gt;&lt;text x=&quot;104.0&quot; y=&quot;158.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;Trapezium&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;Parallelogram (heights p₁, p₂ and angle θ), rhombus (diagonals ⟂), trapezium (parallel sides a, b, height h).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Parallelogram &amp;mdash; to prove (any one is enough):&lt;/b&gt; (i) one pair of opposite sides equal &lt;u&gt;and&lt;/u&gt; parallel; (ii) both pairs of opposite sides parallel (or both pairs equal); (iii) the diagonals bisect each other.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Parallelogram: area}=\text{base}\times\text{height}=\dfrac{p_1p_2}{\sin\theta}=p_1p_2\csc\theta\quad(p_1,p_2=\text{distances between the two pairs of parallel sides})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Rectangle:&lt;/b&gt; a parallelogram whose diagonals are equal, \(d_1=d_2\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;11&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Rhombus &amp;#9733;:&lt;/b&gt; (i) diagonals bisect each other at 90&amp;deg;; (ii) each diagonal bisects the angles at its ends; (iii) \(p_1=p_2\) (the two heights are equal).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;12&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Trapezium (parallel sides }a,\ b\text{, height }h):\qquad \text{area}=\tfrac12(a+b)\,h\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;13&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Isosceles trapezium &amp;#9733;:&lt;/b&gt; the two non-parallel sides are equal &amp;rArr; base angles equal (&amp;ang;A = &amp;ang;B), diagonals equal, and the trapezium is &lt;b&gt;cyclic&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;3. Ptolemy&#x27;s theorem (cyclic quadrilateral) &lt;span class=&quot;pg&quot;&gt;p. 101&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 232 232&quot; style=&quot;width:100%;max-width:232px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;116.0&quot; cy=&quot;116.0&quot; r=&quot;88.0&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;polygon points=&quot;61.8,185.3 166.5,188.1 199.7,88.8 83.0,34.4&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;line x1=&quot;61.8&quot; y1=&quot;185.3&quot; x2=&quot;199.7&quot; y2=&quot;88.8&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;166.5&quot; y1=&quot;188.1&quot; x2=&quot;83.0&quot; y2=&quot;34.4&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;61.8&quot; cy=&quot;185.3&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;53.2&quot; y=&quot;201.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;circle cx=&quot;166.5&quot; cy=&quot;188.1&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;174.5&quot; y=&quot;204.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;circle cx=&quot;199.7&quot; cy=&quot;88.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;213.0&quot; y=&quot;89.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;circle cx=&quot;83.0&quot; cy=&quot;34.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;77.8&quot; y=&quot;26.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;113.8&quot; y=&quot;203.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;a&lt;/text&gt;&lt;text x=&quot;194.5&quot; y=&quot;147.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;146.4&quot; y=&quot;55.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;c&lt;/text&gt;&lt;text x=&quot;60.5&quot; y=&quot;113.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;d&lt;/text&gt;&lt;text x=&quot;95.2&quot; y=&quot;155.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;d&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;160.5&quot; y=&quot;170.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;d&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;2&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Cyclic quadrilateral ABCD with a = AB, b = BC, c = CD, d = DA, d₁ = AC, d₂ = BD.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;14&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle d_1d_2=ac+bd\qquad(\text{product of diagonals}=\text{sum of products of opposite sides})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;15&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof:&lt;/b&gt; cosine rule on the diagonal \(AC\) in both triangles: \(d_1^2=a^2+b^2-2ab\cos B=c^2+d^2+2cd\cos B\) (since \(D=\pi-B\)). Multiply by \(cd\) and \(ab\) and add: \((ab+cd)\,d_1^2=cd(a^2+b^2)+ab(c^2+d^2)=(ac+bd)(ad+bc)\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;16&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle d_1=AC=\sqrt{\dfrac{(ac+bd)(ad+bc)}{ab+cd}},\qquad d_2=BD=\sqrt{\dfrac{(ac+bd)(ab+cd)}{ad+bc}}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;17&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Multiplying the two gives \(d_1^2d_2^2=(ac+bd)^2\), i.e. Ptolemy again.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;4. Section formula and harmonic conjugates &lt;span class=&quot;pg&quot;&gt;pp. 101-103&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 395 143&quot; style=&quot;width:100%;max-width:330px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;29.4&quot; y1=&quot;113.4&quot; x2=&quot;365.4&quot; y2=&quot;29.4&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;29.4&quot; cy=&quot;113.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;29.4&quot; y=&quot;104.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;circle cx=&quot;141.4&quot; cy=&quot;85.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;141.4&quot; y=&quot;76.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;circle cx=&quot;197.4&quot; cy=&quot;71.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;197.4&quot; y=&quot;62.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;circle cx=&quot;365.4&quot; cy=&quot;29.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;365.4&quot; y=&quot;20.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;Q&lt;/text&gt;&lt;text x=&quot;81.4&quot; y=&quot;85.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;m&lt;/text&gt;&lt;text x=&quot;167.4&quot; y=&quot;65.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;n&lt;/text&gt;&lt;text x=&quot;113.4&quot; y=&quot;96.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text x=&quot;279.4&quot; y=&quot;74.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;n&lt;/text&gt;&lt;text x=&quot;109.4&quot; y=&quot;122.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;m&lt;/text&gt;&lt;text x=&quot;289.8&quot; y=&quot;92.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;(AQ : QB = m : n)&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;P divides AB internally and Q externally in the ratio m : n (A = (x₁, y₁), B = (x₂, y₂)).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;18&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle P=\Big(\dfrac{mx_2+nx_1}{m+n},\ \dfrac{my_2+ny_1}{m+n}\Big)\qquad(AP:PB=m:n,\ \text{internal})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;19&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle Q=\Big(\dfrac{mx_2-nx_1}{m-n},\ \dfrac{my_2-ny_1}{m-n}\Big)\qquad(AQ:QB=m:n,\ \text{external})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;20&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof:&lt;/b&gt; drop perpendiculars and use similar triangles: \(\dfrac{y_2-y_P}{y_P-y_1}=\dfrac{x_2-x_P}{x_P-x_1}=\dfrac nm\), then solve for \(x_P,y_P\). External division = replace \(n\) by \(-n\). Midpoint: \(m=n=1\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;div class=&quot;figrow&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 317 97&quot; style=&quot;width:100%;max-width:317px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;26.4&quot; y1=&quot;48.4&quot; x2=&quot;290.4&quot; y2=&quot;48.4&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;26.4&quot; cy=&quot;48.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;26.4&quot; y=&quot;34.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;circle cx=&quot;114.4&quot; cy=&quot;48.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;114.4&quot; y=&quot;34.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;circle cx=&quot;158.4&quot; cy=&quot;48.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;158.4&quot; y=&quot;34.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;circle cx=&quot;290.4&quot; cy=&quot;48.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;290.4&quot; y=&quot;34.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;Q&lt;/text&gt;&lt;text x=&quot;70.4&quot; y=&quot;74.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;AP:PB = 2:1&lt;/text&gt;&lt;text x=&quot;224.4&quot; y=&quot;74.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;AQ:QB = 2:1&lt;/text&gt;&lt;/svg&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 326 150&quot; style=&quot;width:100%;max-width:326px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;30.8&quot; y1=&quot;118.8&quot; x2=&quot;294.8&quot; y2=&quot;118.8&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polygon points=&quot;206.8,30.8 30.8,118.8 162.8,118.8&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;line x1=&quot;206.8&quot; y1=&quot;30.8&quot; x2=&quot;118.8&quot; y2=&quot;118.8&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;206.8&quot; y1=&quot;30.8&quot; x2=&quot;294.8&quot; y2=&quot;118.8&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;201.1,36.5 206.8,42.1 212.5,36.5&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;206.8&quot; cy=&quot;30.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;206.8&quot; y=&quot;20.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;circle cx=&quot;30.8&quot; cy=&quot;118.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;18.8&quot; y=&quot;140.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;circle cx=&quot;162.8&quot; cy=&quot;118.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;162.8&quot; y=&quot;140.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;circle cx=&quot;118.8&quot; cy=&quot;118.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;118.8&quot; y=&quot;140.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;circle cx=&quot;294.8&quot; cy=&quot;118.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;294.8&quot; y=&quot;140.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;E&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;Left: P and Q divide AB internally and externally in the same ratio. Right: D, E = feet of the internal and external bisectors from A.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;21&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Harmonic conjugates.&lt;/b&gt; If \(\dfrac{AP}{PB}=\dfrac{AQ}{QB}\) (P internal, Q external), then &lt;b&gt;P and Q are harmonic conjugates with respect to A, B&lt;/b&gt;; symmetrically &lt;b&gt;A, B are harmonic conjugates with respect to P, Q&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;22&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle AP,\ AB,\ AQ\ \text{are in H.P.}\quad\Longleftrightarrow\quad \dfrac1{AP}+\dfrac1{AQ}=\dfrac2{AB}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;23&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof:&lt;/b&gt; \(\dfrac{AP}{PB}=\dfrac{AQ}{QB}\Rightarrow\dfrac{PB}{AP}=\dfrac{QB}{AQ}\); add 1 to both sides: \(\dfrac{AB}{AP}=\dfrac{AQ-AB+AQ}{AQ}\Rightarrow\dfrac{AB}{AP}=\dfrac{2AQ-AB}{AQ}\Rightarrow\dfrac1{AP}+\dfrac1{AQ}=\dfrac2{AB}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;24&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;In a triangle:&lt;/b&gt; the internal bisector (foot D) and the external bisector (foot E) of \(\angle A\) divide BC in the same ratio \(AB:AC\), so D and E are harmonic conjugates with respect to B, C, and \(BD,\ BC,\ BE\) are in H.P.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;5. Centres of similitude of two circles &lt;span class=&quot;pg&quot;&gt;p. 103&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 349 184&quot; style=&quot;width:100%;max-width:330px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;92.0&quot; r=&quot;48.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;circle cx=&quot;208.0&quot; cy=&quot;92.0&quot; r=&quot;20.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;line x1=&quot;16.0&quot; y1=&quot;92.0&quot; x2=&quot;305.1&quot; y2=&quot;92.0&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;96.0&quot; y1=&quot;133.6&quot; x2=&quot;198.0&quot; y2=&quot;74.7&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;96.0&quot; y1=&quot;50.4&quot; x2=&quot;198.0&quot; y2=&quot;109.3&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;81.9&quot; y1=&quot;139.0&quot; x2=&quot;305.1&quot; y2=&quot;92.0&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;81.9&quot; y1=&quot;45.0&quot; x2=&quot;305.1&quot; y2=&quot;92.0&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;72.0&quot; cy=&quot;92.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;208.0&quot; cy=&quot;92.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;168.0&quot; cy=&quot;92.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;305.1&quot; cy=&quot;92.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;64.0&quot; y=&quot;112.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;208.0&quot; y=&quot;84.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;2&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;162.0&quot; y=&quot;112.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;text x=&quot;305.1&quot; y=&quot;112.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;Q&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Two circles (centres C₁, C₂): transverse tangents meet at P, direct tangents meet at Q.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;25&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;The two &lt;b&gt;transverse (cross) common tangents&lt;/b&gt; meet at P between the circles; the two &lt;b&gt;direct common tangents&lt;/b&gt; meet at Q outside. By similar right triangles (tangent &amp;perp; radius):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;26&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{C_1P}{C_2P}=\dfrac{r_1}{r_2}\quad(\text{internal}),\qquad \dfrac{C_1Q}{C_2Q}=\dfrac{r_1}{r_2}\quad(\text{external})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;27&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;So &lt;b&gt;P and Q are harmonic conjugates of C&lt;sub&gt;1&lt;/sub&gt;, C&lt;sub&gt;2&lt;/sub&gt;&lt;/b&gt; (P divides C&lt;sub&gt;1&lt;/sub&gt;C&lt;sub&gt;2&lt;/sub&gt; internally and Q externally in the ratio \(r_1:r_2\)).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;28&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Direct common tangent length: }ST=\sqrt{d^2-(r_1-r_2)^2}\ \ (d=C_1C_2);\ \ \text{touching externally }(d=r_1+r_2):\ ST=2\sqrt{r_1r_2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;29&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Technique:&lt;/b&gt; through C&lt;sub&gt;2&lt;/sub&gt; draw a line parallel to the tangent; it cuts the radius C&lt;sub&gt;1&lt;/sub&gt;S at distance \(r_1-r_2\) from C&lt;sub&gt;1&lt;/sub&gt; (that is the \(SQ=r_1-r_2\) in the notes), and Pythagoras gives the tangent length.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;6. Centres of a triangle in coordinates &lt;span class=&quot;pg&quot;&gt;pp. 103-106&lt;/span&gt;&lt;/h2&gt;

&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;31&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle D=\Big(\dfrac{x_2+x_3}2,\dfrac{y_2+y_3}2\Big),\quad G=\dfrac{2D+A}{3}\ \Rightarrow\ G=\Big(\dfrac{x_1+x_2+x_3}3,\ \dfrac{y_1+y_2+y_3}3\Big)\)&lt;/span&gt;&lt;/div&gt;

nt-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;I&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;108.4&quot; y=&quot;177.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;110.6&quot; y=&quot;151.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;a&lt;/text&gt;&lt;text x=&quot;157.2&quot; y=&quot;92.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;b&lt;/text&gt;&lt;text x=&quot;45.3&quot; y=&quot;92.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;c&lt;/text&gt;&lt;text x=&quot;66.4&quot; y=&quot;154.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;c&lt;/text&gt;&lt;text x=&quot;154.4&quot; y=&quot;154.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;b&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Incentre I and the excentre I₁ opposite A lie on the bisector AD.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;32&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle D=\Big(\dfrac{bx_2+cx_3}{b+c},\ \dfrac{by_2+cy_3}{b+c}\Big)\quad(BD:DC=c:b),\qquad \dfrac{AI}{ID}=\dfrac{b+c}{a}\ (\text{internal}),\quad \dfrac{AI_1}{I_1D}=\dfrac{b+c}{a}\ (\text{external})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;33&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle I=\Big(\dfrac{ax_1+bx_2+cx_3}{a+b+c},\ \dfrac{ay_1+by_2+cy_3}{a+b+c}\Big)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;34&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle I_1=\dfrac{(b+c)D-aA}{b+c-a}=\Big(\dfrac{-ax_1+bx_2+cx_3}{-a+b+c},\ \dfrac{-ay_1+by_2+cy_3}{-a+b+c}\Big)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;35&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle I_2=\Big(\dfrac{ax_1-bx_2+cx_3}{a-b+c},\ \dfrac{ay_1-by_2+cy_3}{a-b+c}\Big),\qquad I_3=\Big(\dfrac{ax_1+bx_2-cx_3}{a+b-c},\ \dfrac{ay_1+by_2-cy_3}{a+b-c}\Big)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;36&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Pattern:&lt;/b&gt; the excentre opposite a vertex is the incentre formula with the weight of that vertex made negative.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 250 192&quot; style=&quot;width:100%;max-width:250px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;91.2,28.8 28.8,163.2 220.8,163.2&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;91.2&quot; y=&quot;19.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;18.7&quot; y=&quot;177.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;233.5&quot; y=&quot;174.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;line x1=&quot;91.2&quot; y1=&quot;28.8&quot; x2=&quot;91.2&quot; y2=&quot;163.2&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;28.8&quot; y1=&quot;163.2&quot; x2=&quot;128.3&quot; y2=&quot;67.3&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;91.2,155.2 99.2,155.2 99.2,163.2&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;polyline points=&quot;122.5,72.8 117.0,67.1 122.7,61.5&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;91.2&quot; cy=&quot;103.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;82.0&quot; y=&quot;98.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;H&lt;/text&gt;&lt;text x=&quot;91.2&quot; y=&quot;182.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;138.4&quot; y=&quot;62.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;E&lt;/text&gt;&lt;text x=&quot;60.0&quot; y=&quot;185.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;c cos B&lt;/text&gt;&lt;text x=&quot;162.0&quot; y=&quot;185.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;b cos C&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Altitude AD: BD = c cos B, DC = b cos C; H is the orthocentre.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;37&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle H=\Big(\dfrac{x_1\tan A+x_2\tan B+x_3\tan C}{\tan A+\tan B+\tan C},\ \dfrac{y_1\tan A+y_2\tan B+y_3\tan C}{\tan A+\tan B+\tan C}\Big)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;38&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle D=\Big(\dfrac{b\cos C\,x_2+c\cos B\,x_3}{a},\ \dots\Big)\ (\text{foot of altitude from }A),\qquad \dfrac{AH}{HD}=\dfrac{\cos A}{\cos B\cos C}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;39&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof route:&lt;/b&gt; \(H=\dfrac{HD\cdot A+AH\cdot D}{AH+HD}\) with the ratio above; \(\cos A+\cos B\cos C=\sin B\sin C\) (as \(-\cos(B+C)=\sin B\sin C-\cos B\cos C\)), then \(b=2R\sin B\), etc. turns everything into tangents.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 250 202&quot; style=&quot;width:100%;max-width:250px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;100.8,28.8 28.8,172.8 220.8,172.8&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2.0&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;text x=&quot;97.6&quot; y=&quot;20.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;16.0&quot; y=&quot;183.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;233.6&quot; y=&quot;183.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;line x1=&quot;124.8&quot; y1=&quot;130.8&quot; x2=&quot;100.8&quot; y2=&quot;28.8&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;124.8&quot; y1=&quot;130.8&quot; x2=&quot;28.8&quot; y2=&quot;172.8&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;124.8&quot; y1=&quot;130.8&quot; x2=&quot;220.8&quot; y2=&quot;172.8&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;124.8&quot; y1=&quot;130.8&quot; x2=&quot;134.7&quot; y2=&quot;172.8&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;124.8&quot; cy=&quot;130.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;134.7&quot; cy=&quot;172.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;116.3&quot; y=&quot;127.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;O&lt;/text&gt;&lt;text x=&quot;137.9&quot; y=&quot;191.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;path d=&quot;M111.1,136.8 A15,15 0 0 0 128.2,145.4&quot; fill=&quot;none&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;110.0&quot; y=&quot;165.3&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;10&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;π−2C&lt;/text&gt;&lt;path d=&quot;M138.5,136.8 A15,15 0 0 1 128.2,145.4&quot; fill=&quot;none&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;145.9&quot; y=&quot;161.2&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;10&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;π−2B&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;AO meets BC at D: ∠BOD = π − 2C and ∠COD = π − 2B.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;40&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{BD}{DC}=\dfrac{[BOD]}{[COD]}=\dfrac{\tfrac12R\cdot OD\sin(\pi-2C)}{\tfrac12R\cdot OD\sin(\pi-2B)}=\dfrac{\sin2C}{\sin2B}\ \Rightarrow\ D=\Big(\dfrac{x_2\sin2B+x_3\sin2C}{\sin2B+\sin2C},\ \dots\Big)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;41&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{OA}{OD}=\dfrac{[AOB]+[AOC]}{[BOC]}=\dfrac{\sin2C+\sin2B}{\sin2A}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;42&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle O=\Big(\dfrac{x_1\sin2A+x_2\sin2B+x_3\sin2C}{\sin2A+\sin2B+\sin2C},\ \dfrac{y_1\sin2A+y_2\sin2B+y_3\sin2C}{\sin2A+\sin2B+\sin2C}\Big)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;43&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Euler line:&lt;/b&gt; H, G, O lie on one line and &lt;b&gt;G divides HO in the ratio 2 : 1&lt;/b&gt; (HG : GO = 2 : 1), i.e. \(H+2O=3G=A+B+C\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;7. Determinants &lt;span class=&quot;pg&quot;&gt;pp. 106-110&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;44&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Definition.&lt;/b&gt; A determinant is a collection of numbers in a &lt;u&gt;square&lt;/u&gt; form (n rows, n columns; a non-square array is not a determinant). Order = n &amp;times; n; \(D_4\) = determinant of order 4; \(a_{ij}\) is in row i, column j.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;45&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Minor&lt;/b&gt; \(M_{ij}\) of an element: delete its row and column; what remains has order \(n-1\) (e.g. \(M_{23}\) removes row 2, column 3).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;46&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Cofactor: }C_{ij}=(-1)^{i+j}M_{ij}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;47&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle D=a_{i1}C_{i1}+a_{i2}C_{i2}+\dots+a_{in}C_{in}=a_{1j}C_{1j}+\dots+a_{nj}C_{nj}\qquad(\text{any one row or column})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Examples:&lt;/b&gt; for \(\begin{vmatrix}a&amp;b\\c&amp;d\end{vmatrix}\): cofactor of \(a\) is \(C_{11}=M_{11}(-1)^2=d\); cofactor of \(b\) is \(C_{12}=M_{12}(-1)^3=-c\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;49&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \begin{vmatrix}a&amp;b\\c&amp;d\end{vmatrix}=ad-bc\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;50&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \begin{vmatrix}a_1&amp;a_2&amp;a_3\\b_1&amp;b_2&amp;b_3\\c_1&amp;c_2&amp;c_3\end{vmatrix}=a_1(b_2c_3-b_3c_2)-a_2(b_1c_3-b_3c_1)+a_3(b_1c_2-b_2c_1)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;51&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Properties of determinants&lt;/b&gt; (numbered as in the notes):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;52&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;1.&lt;/b&gt; If every element of a row (or column) is zero, the determinant is 0.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;53&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;2.&lt;/b&gt; If two rows (or two columns) are identical, the determinant is 0.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;54&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;3.&lt;/b&gt; Interchanging rows and columns (transpose) does not change the value.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;55&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{4. Scalar: }\begin{vmatrix}ka_1&amp;ka_2&amp;ka_3\\b_1&amp;b_2&amp;b_3\\c_1&amp;c_2&amp;c_3\end{vmatrix}=k\Delta\quad(\text{multiply any \emph{one} row or column by }k)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;56&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{5. Sum: }\begin{vmatrix}a_1+d_1&amp;a_2+d_2&amp;a_3+d_3\\b_1&amp;b_2&amp;b_3\\c_1&amp;c_2&amp;c_3\end{vmatrix}=\begin{vmatrix}a_1&amp;a_2&amp;a_3\\b_1&amp;b_2&amp;b_3\\c_1&amp;c_2&amp;c_3\end{vmatrix}+\begin{vmatrix}d_1&amp;d_2&amp;d_3\\b_1&amp;b_2&amp;b_3\\c_1&amp;c_2&amp;c_3\end{vmatrix}\quad(\text{one row or column split})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;57&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;6.&lt;/b&gt; Interchanging two rows (or two columns) changes the sign: \(\Delta&#x27;=-\Delta\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;58&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{7. Row/column operation: }R_1\to R_1+k_2R_2+k_3R_3\ \text{ leaves }\Delta\text{ unchanged}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;59&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;The row being changed must keep &lt;b&gt;coefficient 1&lt;/b&gt; (it must itself appear with coefficient 1 in the new row).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;60&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Two rows can be changed at a time, e.g. \(R_2\to R_2-R_1,\ R_3\to R_3-R_2\) (coefficient of the changed row stays 1).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;61&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{If the coefficient is not 1: }R_1\to k_1R_1+k_2R_2+k_3R_3\ \Rightarrow\ \text{new determinant}=k_1\Delta\ \ (\text{so write }\tfrac1{k_1}\times)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;62&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \begin{vmatrix}1&amp;x&amp;x^2\\1&amp;y&amp;y^2\\1&amp;z&amp;z^2\end{vmatrix}=(y-x)(z-x)(z-y)\qquad(R_2\to R_2-R_1,\ R_3\to R_3-R_1,\ \text{take out }(y-x),(z-x))\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;63&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Technique (simplify a numeric determinant):&lt;/b&gt; pull out a common factor from a row/column (e.g. 11 from \(66,55,143\)), then look for a relation between columns, such as \(C_1=2C_2+C_3\), which makes it 0.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;64&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \begin{vmatrix}1+a&amp;1&amp;1\\1&amp;1+b&amp;1\\1&amp;1&amp;1+c\end{vmatrix}=abc\Big(1+\dfrac1a+\dfrac1b+\dfrac1c\Big)=abc+ab+bc+ca\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;8. Area, collinearity, distance and locus &lt;span class=&quot;pg&quot;&gt;pp. 111-113&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 373 225&quot; style=&quot;width:100%;max-width:330px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;46.0&quot; y1=&quot;188.6&quot; x2=&quot;326.6&quot; y2=&quot;188.6&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;115.0&quot; y1=&quot;87.4&quot; x2=&quot;115.0&quot; y2=&quot;188.6&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;3 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;197.8&quot; y1=&quot;124.2&quot; x2=&quot;197.8&quot; y2=&quot;188.6&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;3 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;266.8&quot; y1=&quot;46.0&quot; x2=&quot;266.8&quot; y2=&quot;188.6&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;3 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polygon points=&quot;115.0,87.4 266.8,46.0 197.8,124.2&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;circle cx=&quot;115.0&quot; cy=&quot;87.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;85.0&quot; y=&quot;77.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A (x&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;, y&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;)&lt;/text&gt;&lt;circle cx=&quot;266.8&quot; cy=&quot;46.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;288.8&quot; y=&quot;38.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B (x&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;2&lt;/tspan&gt;, y&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;2&lt;/tspan&gt;)&lt;/text&gt;&lt;circle cx=&quot;197.8&quot; cy=&quot;124.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;215.8&quot; y=&quot;152.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C (x&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;3&lt;/tspan&gt;, y&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;3&lt;/tspan&gt;)&lt;/text&gt;&lt;circle cx=&quot;115.0&quot; cy=&quot;188.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;115.0&quot; y=&quot;210.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;circle cx=&quot;197.8&quot; cy=&quot;188.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;197.8&quot; y=&quot;210.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;E&lt;/text&gt;&lt;circle cx=&quot;266.8&quot; cy=&quot;188.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;266.8&quot; y=&quot;210.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;F&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Δ ABC = trapezium ABFD − trapezium ADEC − trapezium CEFB.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;65&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \Delta ABC=\tfrac12\Big|(y_1+y_2)(x_2-x_1)-(y_1+y_3)(x_3-x_1)-(y_3+y_2)(x_2-x_3)\Big|=\tfrac12\left|\begin{vmatrix}x_1&amp;y_1&amp;1\\x_2&amp;y_2&amp;1\\x_3&amp;y_3&amp;1\end{vmatrix}\right|\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;66&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Three points collinear}\iff\begin{vmatrix}x_1&amp;y_1&amp;1\\x_2&amp;y_2&amp;1\\x_3&amp;y_3&amp;1\end{vmatrix}=0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;67&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Distance between }(x_1,y_1),(x_2,y_2):\ \ D=\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}\quad(\text{Pythagoras})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;68&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Locus:&lt;/b&gt; the curve formed by joining the positions of a point P that moves under a given set of conditions.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;69&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Locus of }P(h,k)\text{ at distance 1 from }C(2,3):\ \ (h-2)^2+(k-3)^2=1\ \Rightarrow\ (x-2)^2+(y-3)^2=1\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;70&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Technique (locus):&lt;/b&gt; take the moving point as \((h,k)\), write the given condition as an equation in \(h,k\), then replace \((h,k)\) by \((x,y)\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;71&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Midpoints of the sides given &amp;rArr; vertices:&lt;/b&gt; the triangle formed by the midpoints makes parallelograms with the original triangle (diagonals bisect each other). With midpoints \(M_1,M_2,M_3\), the vertex opposite \(M_1\) is \(M_2+M_3-M_1\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;72&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Midpoint of BC from H and O:&lt;/b&gt; \(H+2O=A+B+C\) &amp;rArr; midpoint of BC \(=\dfrac{H+2O-A}{2}\) (that is \(O+\tfrac12\overrightarrow{AH}\)).&lt;/span&gt;&lt;/div&gt;

&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;197.8&quot; cy=&quot;130.5&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;185.8&quot; y=&quot;122.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;path d=&quot;M216.0,112.0 A26,26 0 0 1 215.7,149.3&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;235.8&quot; y=&quot;135.8&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;α&lt;/text&gt;&lt;text x=&quot;247.2&quot; y=&quot;93.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;29.6&quot; y=&quot;42.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;2&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Angle between two curves = angle α between their tangents at the common point.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;73&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Angle between curves&lt;/b&gt; = angle between the tangents at the point of intersection = angle between the normals (a &lt;b&gt;normal&lt;/b&gt; is the line &amp;perp; to the tangent at that point).&lt;/span&gt;&lt;/div&gt;

&lt;section&gt;&lt;h2&gt;9. Straight line: forms of equation &lt;span class=&quot;pg&quot;&gt;pp. 113-120&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;74&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Straight line:&lt;/b&gt; a curve such that any two points on it, joined by a segment, define a unique direction (the same direction wherever you pick the points).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;75&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Point–slope form: }y-y_1=m(x-x_1)\qquad(\text{given slope or inclination, and a point})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;76&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Two-point form: }y-y_1=\dfrac{y_2-y_1}{x_2-x_1}(x-x_1)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;77&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Intercept form: }\dfrac xa+\dfrac yb=1\qquad(x\text{-intercept }a,\ y\text{-intercept }b)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 222 264&quot; style=&quot;width:100%;max-width:222px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;25.0&quot; y1=&quot;219.3&quot; x2=&quot;197.1&quot; y2=&quot;219.3&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;50.0&quot; y1=&quot;239.3&quot; x2=&quot;50.0&quot; y2=&quot;25.0&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;text x=&quot;195.1&quot; y=&quot;237.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;x&lt;/text&gt;&lt;text x=&quot;60.0&quot; y=&quot;31.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;y&lt;/text&gt;&lt;line x1=&quot;172.1&quot; y1=&quot;219.3&quot; x2=&quot;50.0&quot; y2=&quot;45.0&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;50.0&quot; y1=&quot;219.3&quot; x2=&quot;131.9&quot; y2=&quot;162.0&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;125.4,166.6 130.0,173.1 136.5,168.5&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;circle cx=&quot;131.9&quot; cy=&quot;162.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;172.1&quot; cy=&quot;219.3&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;50.0&quot; cy=&quot;45.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;87.0&quot; y=&quot;184.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;p&lt;/text&gt;&lt;path d=&quot;M76.0,219.3 A26,26 0 0 0 71.3,204.4&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;86.2&quot; y=&quot;212.9&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;α&lt;/text&gt;&lt;text x=&quot;172.1&quot; y=&quot;241.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;p/cos α&lt;/text&gt;&lt;text x=&quot;16.0&quot; y=&quot;49.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;p/sin α&lt;/text&gt;&lt;text x=&quot;143.9&quot; y=&quot;156.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;N&lt;/text&gt;&lt;text x=&quot;40.0&quot; y=&quot;237.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;O&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Normal form: p = length of the perpendicular ON from the origin; α = its inclination.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;78&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Normal form: }x\cos\alpha+y\sin\alpha=p\qquad(p=\perp\text{ distance of the line from the origin},\ \alpha=\text{inclination of that }\perp)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;79&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Derivation:&lt;/b&gt; the intercepts are \(\dfrac p{\cos\alpha}\) and \(\dfrac p{\sin\alpha}\); put them in \(\dfrac xa+\dfrac yb=1\). If an intercept is negative the formula still holds (for \(\alpha\) in other quadrants).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;80&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;To convert \(ax+by+c=0\) into normal form:&lt;/b&gt; move \(c\) to the right side so that it is positive, then divide by \(\sqrt{a^2+b^2}\). Example: \(2x+3y+7=0\Rightarrow -\dfrac{2}{\sqrt{13}}x-\dfrac{3}{\sqrt{13}}y=\dfrac7{\sqrt{13}}\), so \(p=\dfrac7{\sqrt{13}}\), \(\cos\alpha=-\dfrac2{\sqrt{13}}\), \(\sin\alpha=-\dfrac3{\sqrt{13}}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;81&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{General form: }ax+by+c=0,\qquad a,b,c\in\mathbb R,\ a^2+b^2\ne0\ (\text{$a$ and $b$ never both }0)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;82&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Slope }m=-\dfrac ab=-\dfrac{\text{coeff. of }x}{\text{coeff. of }y}\qquad(b\ne0)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;83&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;If \(b=0\) the line is vertical (\(x=\) const) and its slope does not exist.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;84&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Parallel lines: }m_1=m_2;\qquad\text{perpendicular lines: }m_1m_2=-1\ \ (\text{if both slopes exist})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;div class=&quot;figrow&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 229 185&quot; style=&quot;width:100%;max-width:229px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;17.6&quot; y1=&quot;105.6&quot; x2=&quot;211.2&quot; y2=&quot;105.6&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;26.7&quot; y1=&quot;146.5&quot; x2=&quot;202.1&quot; y2=&quot;64.7&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;142.3&quot; y1=&quot;165.4&quot; x2=&quot;79.1&quot; y2=&quot;29.8&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;path d=&quot;M140.4,105.6 A26,26 0 0 0 138.0,94.6&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;151.5&quot; y=&quot;102.4&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;&lt;/text&gt;&lt;path d=&quot;M150.4,105.6 A36,36 0 0 0 99.2,73.0&quot; fill=&quot;none&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;140.2&quot; y=&quot;70.1&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;2&lt;/tspan&gt;&lt;/text&gt;&lt;polyline points=&quot;121.7,102.2 118.3,95.0 111.0,98.3&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;/svg&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 229 150&quot; style=&quot;width:100%;max-width:229px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;17.6&quot; y1=&quot;114.4&quot; x2=&quot;211.2&quot; y2=&quot;114.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;100.3&quot; y1=&quot;131.3&quot; x2=&quot;179.5&quot; y2=&quot;36.9&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;128.5&quot; y1=&quot;131.3&quot; x2=&quot;49.3&quot; y2=&quot;36.9&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;path d=&quot;M138.4,114.4 A24,24 0 0 0 129.8,96.0&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;147.0&quot; y=&quot;104.2&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;/text&gt;&lt;path d=&quot;M90.4,114.4 A24,24 0 0 1 99.0,96.0&quot; fill=&quot;none&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;81.8&quot; y=&quot;104.2&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#1b7a45&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;/text&gt;&lt;text x=&quot;189.5&quot; y=&quot;40.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;m&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;&lt;/text&gt;&lt;text x=&quot;39.3&quot; y=&quot;40.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;m&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;2&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;Left: θ₂ = θ₁ + π/2 for perpendicular lines. Right: lines equally inclined to the x-axis.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;85&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof of \(m_1m_2=-1\):&lt;/b&gt; \(\theta_2=\theta_1+\tfrac\pi2\Rightarrow\tan\theta_2=\tan(\theta_1+\tfrac\pi2)=-\cot\theta_1\Rightarrow\tan\theta_1\tan\theta_2=-1\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;86&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Two non-parallel lines equally inclined to the }x\text{-axis}\ (\theta,\ \pi-\theta):\ \ m_1+m_2=0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;87&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Equal non-zero intercepts on the axes}\Rightarrow m=-1;\qquad \text{equal lengths of non-zero intercepts}\Rightarrow m=\pm1\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;88&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Line parallel to&lt;/b&gt; \(2x+3y+7=0\): same coefficients of \(x,y\), only the constant changes: \(2x+3y=C\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;89&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Line perpendicular to&lt;/b&gt; \(2x+3y+7=0\): interchange the coefficients and change the sign of one: \(3x-2y=C\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;90&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Determinant form (line through }(x_1,y_1),(x_2,y_2)):\ \begin{vmatrix}x&amp;y&amp;1\\x_1&amp;y_1&amp;1\\x_2&amp;y_2&amp;1\end{vmatrix}=0\quad(\text{collinearity of }(x,y)\text{ with the two points})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 356 189&quot; style=&quot;width:100%;max-width:330px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;33.0&quot; y1=&quot;112.2&quot; x2=&quot;270.6&quot; y2=&quot;112.2&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.0&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;54.1&quot; y1=&quot;165.2&quot; x2=&quot;237.9&quot; y2=&quot;36.5&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.9&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;129.8&quot; cy=&quot;112.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;223.5&quot; cy=&quot;46.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;64.9&quot; cy=&quot;157.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;155.8&quot; y=&quot;138.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;(x&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;, y&lt;tspan font-size=&#x27;10&#x27; dy=&#x27;4&#x27;&gt;1&lt;/tspan&gt;)&lt;/text&gt;&lt;text x=&quot;233.5&quot; y=&quot;38.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;start&quot;&gt;(x, y)  r = l&lt;/text&gt;&lt;text x=&quot;58.9&quot; y=&quot;179.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;end&quot;&gt;r = −l&lt;/text&gt;&lt;path d=&quot;M159.8,112.2 A30,30 0 0 0 154.4,95.0&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;169.9&quot; y=&quot;104.6&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Parametric (distance) form: r = signed distance of (x, y) from (x₁, y₁).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;91&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Parametric form: }\dfrac{x-x_1}{\cos\theta}=\dfrac{y-y_1}{\sin\theta}=r\ \Longleftrightarrow\ x=x_1+r\cos\theta,\ \ y=y_1+r\sin\theta,\ \ r\in\mathbb R\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;92&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;r is the algebraic (signed) distance&lt;/b&gt; between \((x,y)\) and \((x_1,y_1)\): \(r=\pm l\) where \(l\) is the length. A point &lt;b&gt;above&lt;/b&gt; \((x_1,y_1)\) has \(r=l\); a point &lt;b&gt;below&lt;/b&gt; has \(r=-l\) (with \(0&amp;lt;\theta&amp;lt;\pi\)).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;93&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Technique:&lt;/b&gt; to meet a given line at a given distance \(l\) from a point, substitute \(x=x_1+l\cos\theta,\ y=y_1+l\sin\theta\) into the line and solve for \(\theta\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;94&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Equation of the external bisector of \(\angle A\)&lt;/b&gt; in \(\triangle ABC\): the external bisector meets BC at \(E=\Big(\dfrac{bx_2-cx_3}{b-c},\dfrac{by_2-cy_3}{b-c}\Big)\) (external division in the ratio \(c:b\)), then use the determinant form of line AE and split the last row \(\to\) b&amp;middot;B &amp;minus; c&amp;middot;C:&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;95&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle b\begin{vmatrix}x&amp;y&amp;1\\x_1&amp;y_1&amp;1\\x_2&amp;y_2&amp;1\end{vmatrix}-c\begin{vmatrix}x&amp;y&amp;1\\x_1&amp;y_1&amp;1\\x_3&amp;y_3&amp;1\end{vmatrix}=0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;96&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Technique for trisection / dividing points on a line:&lt;/b&gt; use the intercepts of the line to get the end points, the section formula for the points, then the two-point form.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;97&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \theta=\theta_1-\theta_2\ \Rightarrow\ \tan\theta=\dfrac{m_1-m_2}{1+m_1m_2}\ ;\qquad \text{acute angle: }\tan\theta=\left|\dfrac{m_1-m_2}{1+m_1m_2}\right|\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;98&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Either of \(m_1,m_2\) may be the larger one; the modulus gives the acute angle. For \(m_1m_2=-1\) the lines are perpendicular.&lt;/span&gt;&lt;/div&gt;
