oke-width=&quot;1.8&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;110.4&quot; cy=&quot;87.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;257.6&quot; cy=&quot;170.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;248.4&quot; cy=&quot;50.6&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;100.4&quot; y=&quot;109.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;end&quot;&gt;A (0, −c/b)&lt;/text&gt;&lt;text x=&quot;261.6&quot; y=&quot;194.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B (−c/a, 0)&lt;/text&gt;&lt;text x=&quot;256.4&quot; y=&quot;44.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;start&quot;&gt;P (x₁, y₁)&lt;/text&gt;&lt;text x=&quot;234.0&quot; y=&quot;98.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;h&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;h = perpendicular distance of P(x₁, y₁) from the line ax + by + c = 0.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;99&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Perpendicular distance of }(x_1,y_1)\text{ from }ax+by+c=0:\qquad h=\left|\dfrac{ax_1+by_1+c}{\sqrt{a^2+b^2}}\right|\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;100&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof:&lt;/b&gt; area of \(\triangle PAB\) in two ways, with \(A\big(0,-\tfrac cb\big)\), \(B\big(-\tfrac ca,0\big)\), \(AB=\dfrac{|c|\sqrt{a^2+b^2}}{|ab|}\): \(\tfrac12\left|\det\right|=\tfrac12\cdot h\cdot AB\) &amp;rArr; \(h=\dfrac{|ax_1+by_1+c|}{\sqrt{a^2+b^2}}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 368 204&quot; style=&quot;width:100%;max-width:330px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;99.9&quot; y1=&quot;174.3&quot; x2=&quot;303.2&quot; y2=&quot;62.5&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;74.8&quot; y1=&quot;128.7&quot; x2=&quot;278.1&quot; y2=&quot;16.9&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;184.0&quot; y1=&quot;128.0&quot; x2=&quot;158.9&quot; y2=&quot;82.4&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;polyline points=&quot;180.1,121.0 187.2,117.1 191.0,124.1&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;polyline points=&quot;162.8,89.4 169.8,85.6 165.9,78.6&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;text x=&quot;181.5&quot; y=&quot;109.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;l&lt;/text&gt;&lt;text x=&quot;279.6&quot; y=&quot;101.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;end&quot;&gt;ax + by + c₁ = 0&lt;/text&gt;&lt;text x=&quot;70.8&quot; y=&quot;122.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;end&quot;&gt;ax + by + c₂ = 0&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Distance l between two parallel lines.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;101&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Distance between parallel lines }ax+by+c_1=0,\ ax+by+c_2=0:\qquad l=\dfrac{|c_1-c_2|}{\sqrt{a^2+b^2}}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;102&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Caution:&lt;/b&gt; first make the coefficients of \(x\) and \(y\) &lt;u&gt;identical&lt;/u&gt; in the two equations.&lt;/span&gt;&lt;/div&gt;

n&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;end&quot;&gt;ax+by+c=0&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Foot of the perpendicular F and image P′ of the point P in the line.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;103&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Foot of the }\perp\text{ from }(\alpha,\beta):\qquad \dfrac{x_1-\alpha}{a}=\dfrac{y_1-\beta}{b}=-\dfrac{a\alpha+b\beta+c}{a^2+b^2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;104&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Derivation:&lt;/b&gt; the &amp;perp; from \((\alpha,\beta)\) has slope \(\tfrac ba\), so \(\dfrac{x_1-\alpha}a=\dfrac{y_1-\beta}b=t\) (say); substituting in \(ax_1+by_1+c=0\) gives \(t=-\dfrac{a\alpha+b\beta+c}{a^2+b^2}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;105&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Image of }(\alpha,\beta)\text{ in the line:}\qquad \dfrac{\alpha&#x27;-\alpha}{a}=\dfrac{\beta&#x27;-\beta}{b}=-2\,\dfrac{a\alpha+b\beta+c}{a^2+b^2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;106&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Derivation:&lt;/b&gt; the foot is the midpoint \(\Big(\dfrac{\alpha+\alpha&#x27;}2,\dfrac{\beta+\beta&#x27;}2\Big)\) of P and its image, and it satisfies the line; the factor 2 comes from this.&lt;/span&gt;&lt;/div&gt;

normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P, Q same side: product &gt; 0&lt;/text&gt;&lt;text x=&quot;134.4&quot; y=&quot;207.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;10.5&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P, R opposite: product &lt; 0&lt;/text&gt;&lt;/svg&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 269 185&quot; style=&quot;width:100%;max-width:269px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;21.2&quot; y1=&quot;140.6&quot; x2=&quot;247.6&quot; y2=&quot;86.2&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;134.4&quot; cy=&quot;46.2&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;134.4&quot; cy=&quot;113.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;line x1=&quot;134.4&quot; y1=&quot;46.2&quot; x2=&quot;134.4&quot; y2=&quot;113.4&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.4&quot; stroke-dasharray=&quot;3 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;text x=&quot;144.4&quot; y=&quot;46.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;start&quot;&gt;(α, β)&lt;/text&gt;&lt;text x=&quot;140.4&quot; y=&quot;139.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;(α, −(c+aα)/b)&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;Position of points relative to a line.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;107&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Position of a point w.r.t. a line:&lt;/b&gt; the point on the line vertically below \((\alpha,\beta)\) is \(\Big(\alpha,\dfrac{-c-a\alpha}b\Big)\). \(P\) lies above the line if \(\beta&gt;\dfrac{-c-a\alpha}b\), which simplifies to:&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;108&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle b\,(a\alpha+b\beta+c)&gt;0\ \Rightarrow\ P\text{ lies above the line};\qquad b\,(a\alpha+b\beta+c)&amp;lt;0\ \Rightarrow\ P\text{ lies below}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;109&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Two points }(x_1,y_1),(x_2,y_2):\ \ (ax_1+by_1+c)(ax_2+by_2+c)&gt;0\Rightarrow\text{same side};\ \ &amp;lt;0\Rightarrow\text{opposite sides}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;110&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Technique (point between two parallel lines / inside a triangle):&lt;/b&gt; a point is inside the region if it is on the same side of each line as a reference point (a vertex or point already known to be inside); each line gives one inequality, then intersect the solution sets.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;11. Intersection and concurrency of lines &lt;span class=&quot;pg&quot;&gt;p. 124&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 238 194&quot; style=&quot;width:100%;max-width:238px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;27.8&quot; y1=&quot;129.9&quot; x2=&quot;209.8&quot; y2=&quot;63.7&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;93.7&quot; y1=&quot;190.3&quot; x2=&quot;143.9&quot; y2=&quot;3.3&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;193.0&quot; y1=&quot;159.0&quot; x2=&quot;44.6&quot; y2=&quot;34.6&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;118.8&quot; cy=&quot;96.8&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;142.8&quot; y=&quot;122.8&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;(α, β)&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Three concurrent lines meet at (α, β).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;111&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Intersection of }a_1x+b_1y+c_1=0,\ a_2x+b_2y+c_2=0:\ \ \dfrac{x}{b_1c_2-b_2c_1}=\dfrac{y}{c_1a_2-c_2a_1}=\dfrac1{a_1b_2-a_2b_1}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;112&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Concurrency of }a_ix+b_iy+c_i=0\ (i=1,2,3):\qquad \begin{vmatrix}a_1&amp;b_1&amp;c_1\\a_2&amp;b_2&amp;c_2\\a_3&amp;b_3&amp;c_3\end{vmatrix}=0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;113&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Derivation:&lt;/b&gt; substitute the intersection point of \(L_1,L_2\) into \(L_3\); the result is this determinant expanded along the third row.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;114&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Exception:&lt;/b&gt; three &lt;u&gt;parallel&lt;/u&gt; lines also give determinant 0 (no common point), so check that the lines are not parallel.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;12. Family of lines through an intersection &lt;span class=&quot;pg&quot;&gt;pp. 130-134&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 252 185&quot; style=&quot;width:100%;max-width:252px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;24.6&quot; y1=&quot;119.6&quot; x2=&quot;227.4&quot; y2=&quot;65.2&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;185.4&quot; y1=&quot;163.2&quot; x2=&quot;66.6&quot; y2=&quot;21.6&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;66.6&quot; y1=&quot;163.2&quot; x2=&quot;185.4&quot; y2=&quot;21.6&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.0&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;102.1&quot; y1=&quot;181.7&quot; x2=&quot;149.9&quot; y2=&quot;3.1&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.0&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;142.0&quot; y1=&quot;183.4&quot; x2=&quot;110.0&quot; y2=&quot;1.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.0&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;215.3&quot; y1=&quot;116.3&quot; x2=&quot;36.7&quot; y2=&quot;68.5&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.0&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;217.0&quot; y1=&quot;76.4&quot; x2=&quot;35.0&quot; y2=&quot;108.4&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.0&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;126.0&quot; cy=&quot;92.4&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;223.4&quot; y=&quot;59.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;end&quot;&gt;L₁ = 0&lt;/text&gt;&lt;text x=&quot;74.6&quot; y=&quot;17.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;start&quot;&gt;L₂ = 0&lt;/text&gt;&lt;text x=&quot;148.0&quot; y=&quot;120.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;(α, β)&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;All lines through the intersection of L₁ = 0 and L₂ = 0.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;115&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle y-\beta=m(x-\alpha)\ (m\in\mathbb R)\ \ \text{misses the vertical line }x=\alpha;\qquad L_1+\lambda L_2=0\ (\lambda\in\mathbb R)\ \ \text{misses }L_2\text{ itself}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;116&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Family:&lt;/b&gt; \(a_1x+b_1y+c_1+\lambda(a_2x+b_2y+c_2)=0\) is every line through the point of intersection of \(L_1=0\) and \(L_2=0\), except \(L_2=0\). &lt;b&gt;Always check \(L_2\) separately&lt;/b&gt; (the &amp;lsquo;missing line&amp;rsquo;).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;117&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Technique:&lt;/b&gt; write the family, impose the extra condition to get \(\lambda\) (a point on it, a slope, a perpendicular, a distance), then test the missing line.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;118&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Tangent to a curve from the family:&lt;/b&gt; take the point of intersection, write \(y=m(x-x_0)+y_0\), equate with the curve, and put &lt;b&gt;discriminant \(=0\)&lt;/b&gt; (single root).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;119&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Maximum distance of a line through B from a point A:&lt;/b&gt; the distance is \(AC\le AB\) (AB is the hypotenuse), so the maximum is \(AB\), attained by the line through B &lt;b&gt;perpendicular to AB&lt;/b&gt;. (Algebraic alternative: maximise \(h^2=\dfrac{(\ldots)^2}{1+m^2}\) by differentiation.)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 360 244&quot; style=&quot;width:100%;max-width:330px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;158.4&quot; y1=&quot;251.2&quot; x2=&quot;9.6&quot; y2=&quot;52.8&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;51.4&quot; y1=&quot;185.8&quot; x2=&quot;245.7&quot; y2=&quot;108.1&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;256.0&quot; y1=&quot;48.0&quot; x2=&quot;96.0&quot; y2=&quot;168.0&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;256.0&quot; y1=&quot;48.0&quot; x2=&quot;275.3&quot; y2=&quot;96.3&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;3 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;256.0&quot; cy=&quot;48.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;96.0&quot; cy=&quot;168.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;circle cx=&quot;275.3&quot; cy=&quot;96.3&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;264.0&quot; y=&quot;44.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;start&quot;&gt;A (2, 3)&lt;/text&gt;&lt;text x=&quot;90.0&quot; y=&quot;192.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;end&quot;&gt;B (−2, 0)&lt;/text&gt;&lt;text x=&quot;285.3&quot; y=&quot;112.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;polyline points=&quot;102.4,163.2 97.6,156.8 91.2,161.6&quot; fill=&quot;none&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.3&quot;/&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;AC ≤ AB, so the farthest line through B is the one perpendicular to AB.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;120&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Fixed-point technique:&lt;/b&gt; if the coefficients \(a,b,c\) of \(ax+by+c=0\) satisfy a linear relation, read the relation as the statement that a particular point lies on the line. &lt;b&gt;Compare&lt;/b&gt; the relation with \(ax+by+c=0\):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;121&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a,b,c\text{ in A.P. }(a-2b+c=0)\ \Longrightarrow\ ax+by+c=0\text{ passes through the fixed point }(1,-2)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;122&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Quadratic relation:&lt;/b&gt; factor it into linear relations (e.g. a perfect square equal to a square, \((a-3b)^2=4c^2\Rightarrow a-3b=\pm2c\)); each gives its own fixed point.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;123&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Other method:&lt;/b&gt; rearrange into the form \(L_1+\lambda L_2=0\) (group the terms in \(a\) and \(c\) and divide), then the fixed point is \(L_1\cap L_2\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;124&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Lines through the intersection of two other lines (concurrency of constructed lines):&lt;/b&gt; write the lines in intercept form, e.g. \(\frac x3+\frac yc=1\), and express the line through the required point as a combination \(L+\mu L&#x27;=0\); put in the known point to get \(\mu\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;13. Angle bisectors of two lines &lt;span class=&quot;pg&quot;&gt;pp. 135-141&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;125&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Any point on an angle bisector is &lt;b&gt;equidistant&lt;/b&gt; from the two lines. Two lines have &lt;b&gt;two&lt;/b&gt; (mutually perpendicular) bisectors.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;126&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{|a_1x+b_1y+c_1|}{\sqrt{a_1^2+b_1^2}}=\dfrac{|a_2x+b_2y+c_2|}{\sqrt{a_2^2+b_2^2}}\ \Longrightarrow\ \dfrac{a_1x+b_1y+c_1}{\sqrt{a_1^2+b_1^2}}=\pm\dfrac{a_2x+b_2y+c_2}{\sqrt{a_2^2+b_2^2}}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 224 224&quot; style=&quot;width:100%;max-width:224px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;112.0,112.0 208.6,86.1 206.6,79.6 204.2,73.2 201.3,67.0 198.0,61.0 194.3,55.2 190.3,49.7 185.8,44.5 181.0,39.7 175.9,35.1 170.5,30.9 164.9,27.1 158.9,23.7&quot; fill=&quot;#dbe9f8&quot; stroke=&quot;none&quot;/&gt;&lt;polygon points=&quot;112.0,112.0 15.4,137.9 17.4,144.4 19.8,150.8 22.7,157.0 26.0,163.0 29.7,168.8 33.7,174.3 38.2,179.5 43.0,184.3 48.1,188.9 53.5,193.1 59.1,196.9 65.1,200.3&quot; fill=&quot;#dbe9f8&quot; stroke=&quot;none&quot;/&gt;&lt;line x1=&quot;15.4&quot; y1=&quot;137.9&quot; x2=&quot;208.6&quot; y2=&quot;86.1&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;65.1&quot; y1=&quot;200.3&quot; x2=&quot;158.9&quot; y2=&quot;23.7&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;33.7&quot; y1=&quot;174.3&quot; x2=&quot;190.3&quot; y2=&quot;49.7&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;5 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;174.3&quot; y1=&quot;190.3&quot; x2=&quot;49.7&quot; y2=&quot;33.7&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;5 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;text x=&quot;218.6&quot; y=&quot;94.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;L₁&lt;/text&gt;&lt;text x=&quot;166.9&quot; y=&quot;23.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;L₂&lt;/text&gt;&lt;text x=&quot;162.1&quot; y=&quot;76.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;14&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;&lt;/text&gt;&lt;text x=&quot;170.4&quot; y=&quot;54.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;B₁&lt;/text&gt;&lt;text x=&quot;44.0&quot; y=&quot;45.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;B₂&lt;/text&gt;&lt;circle cx=&quot;149.6&quot; cy=&quot;82.1&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;159.6&quot; y=&quot;100.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;O&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;The shaded pair of vertical angles is the region of bisector B₁; the other pair is the region of B₂.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;127&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Region of a bisector:&lt;/b&gt; the pair of vertical angles that the bisector lies in. If \(c_1c_2\ne0\), neither bisector passes through the origin.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;128&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Bisector whose region contains the origin.&lt;/b&gt; A point \((h,k)\) lies on it iff it is on the same side of each line as the origin (or on the opposite side of both): \(c_1c_2\,(a_1h+b_1k+c_1)(a_2h+b_2k+c_2)\ge0\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;129&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Make }c_1&gt;0,\ c_2&gt;0:\ \ \dfrac{a_1x+b_1y+c_1}{\sqrt{a_1^2+b_1^2}}=\dfrac{a_2x+b_2y+c_2}{\sqrt{a_2^2+b_2^2}}\ \text{ is the bisector containing }(0,0)\text{ in its region}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;130&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Bisector containing }(\alpha,\beta)\text{ in its region: points }(h,k)\text{ with }(a_1\alpha+b_1\beta+c_1)(a_2\alpha+b_2\beta+c_2)(a_1h+b_1k+c_1)(a_2h+b_2k+c_2)&gt;0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;131&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Quick rule:&lt;/b&gt; the bisector with the &lt;b&gt;&amp;lsquo;+&amp;rsquo; sign&lt;/b&gt; has, in its region, the points where the two expressions \(a_1x+b_1y+c_1\) and \(a_2x+b_2y+c_2\) have the &lt;u&gt;same&lt;/u&gt; sign; the &amp;lsquo;&amp;minus;&amp;rsquo; bisector has the points where they have &lt;u&gt;opposite&lt;/u&gt; signs.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 310 209&quot; style=&quot;width:100%;max-width:310px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;55.4&quot; y1=&quot;123.6&quot; x2=&quot;232.6&quot; y2=&quot;92.4&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;86.1&quot; y1=&quot;176.9&quot; x2=&quot;201.9&quot; y2=&quot;39.1&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;66.1&quot; y1=&quot;153.0&quot; x2=&quot;221.9&quot; y2=&quot;63.0&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;189.0&quot; y1=&quot;185.9&quot; x2=&quot;99.0&quot; y2=&quot;30.1&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.6&quot; stroke-dasharray=&quot;5 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;path d=&quot;M191.3,99.7 A48,48 0 0 0 185.6,84.0&quot; fill=&quot;none&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;200.4&quot; y=&quot;92.5&quot; font-family=&quot;Georgia,serif&quot; font-size=&quot;12&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;middle&quot;&gt;θ&lt;/text&gt;&lt;text x=&quot;242.6&quot; y=&quot;100.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;L₁&lt;/text&gt;&lt;text x=&quot;209.9&quot; y=&quot;39.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;13&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;L₂&lt;/text&gt;&lt;text x=&quot;229.9&quot; y=&quot;63.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;start&quot;&gt;acute bisector&lt;/text&gt;&lt;text x=&quot;93.0&quot; y=&quot;26.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#c2410c&quot; text-anchor=&quot;start&quot;&gt;obtuse bisector&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;θ = angle between L₁ and a bisector; tan θ &lt; 1 means the acute-angle bisector.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;132&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Acute and obtuse angle bisectors&lt;/b&gt; (lines not perpendicular). Let \(\theta\) = angle between line \(L_1\) and bisector \(B_1\):&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;133&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \tan\theta=\left|\dfrac{m_{B_1}-m_{L_1}}{1+m_{B_1}m_{L_1}}\right|&amp;lt;1\Rightarrow B_1\text{ is the acute-angle bisector};\qquad &gt;1\Rightarrow B_1\text{ is the obtuse-angle bisector}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;134&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Distance check:&lt;/b&gt; take a point on \(L_1\) and compare its distances \(P_1,P_2\) from the bisectors \(B_1,B_2\); the bisector that is &lt;u&gt;nearer&lt;/u&gt; is the acute-angle bisector (\(P_2&gt;P_1\Rightarrow B_2\) obtuse); \(P_1=P_2\) means the lines are &amp;perp;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;135&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Which region is acute?&lt;/b&gt; Write both lines with \(c_1&gt;0,\ c_2&gt;0\). The region containing the origin has inward normals \((a_1,b_1),(a_2,b_2)\); the wedge is acute iff the normals make an obtuse angle, i.e. \(a_1a_2+b_1b_2&amp;lt;0\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;136&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle c_1c_2\,(a_1a_2+b_1b_2)&amp;lt;0\ \Longrightarrow\ \text{the origin lies in the acute angle between the lines}\ \ (&gt;0:\ \text{obtuse})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;137&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle c_1,c_2&gt;0:\ \ a_1a_2+b_1b_2&amp;lt;0\Rightarrow\ \text{the }(+)\text{ bisector is acute};\quad a_1a_2+b_1b_2&gt;0\Rightarrow\ \text{the }(+)\text{ bisector is obtuse}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;138&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proof sketch:&lt;/b&gt; with \(c_1,c_2&gt;0\), \(\dfrac{c_i}{\sqrt{a_i^2+b_i^2}}=-\dfrac{a_ix+b_iy}{\sqrt{a_i^2+b_i^2}}\) (distance from the origin); the angle \(\theta_2-\theta_1\) between the normals is obtuse iff \(\cos(\theta_2-\theta_1)&amp;lt;0\), i.e. \(a_1a_2+b_1b_2&amp;lt;0\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;139&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Internal bisector of a triangle formed by three lines:&lt;/b&gt; for the angle between two of the lines, choose the sign so that the bisector runs through the wedge that contains the triangle (test with the centroid or the third vertex: same sign &amp;rArr; &amp;lsquo;+&amp;rsquo;, opposite &amp;rArr; &amp;lsquo;&amp;minus;&amp;rsquo;).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;14. Parallelogram diagonals, reflection, pair of lines, extremum problems &lt;span class=&quot;pg&quot;&gt;pp. 142-144&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 288 168&quot; style=&quot;width:100%;max-width:288px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;polygon points=&quot;24.0,144.0 184.0,144.0 264.0,24.0 104.0,24.0&quot; fill=&quot;none&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;1.8&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;line x1=&quot;24.0&quot; y1=&quot;144.0&quot; x2=&quot;264.0&quot; y2=&quot;24.0&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;184.0&quot; y1=&quot;144.0&quot; x2=&quot;104.0&quot; y2=&quot;24.0&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;text x=&quot;11.5&quot; y=&quot;155.3&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;A&lt;/text&gt;&lt;text x=&quot;191.8&quot; y=&quot;160.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;B&lt;/text&gt;&lt;text x=&quot;276.5&quot; y=&quot;22.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;C&lt;/text&gt;&lt;text x=&quot;96.2&quot; y=&quot;17.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;15&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;D&lt;/text&gt;&lt;text x=&quot;96.2&quot; y=&quot;160.6&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;L₁&lt;/text&gt;&lt;text x=&quot;239.0&quot; y=&quot;89.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;L₂&lt;/text&gt;&lt;text x=&quot;191.8&quot; y=&quot;17.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;L₃&lt;/text&gt;&lt;text x=&quot;49.0&quot; y=&quot;89.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;L₄&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Parallelogram bounded by L₁ = 0 (AB), L₂ = 0 (BC), L₃ = 0 (CD), L₄ = 0 (DA); L₁ ∥ L₃ and L₂ ∥ L₄.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;140&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Diagonal AC &amp;mdash; Method 1:&lt;/b&gt; A is on \(L_1,L_4\) and C is on \(L_2,L_3\): the line AC is \(L_1+\lambda L_4=0\) and also \(L_2+\mu L_3=0\); compare the two to find \(\lambda,\mu\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;141&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Method 2: }L_1L_2-L_3L_4=0\ \text{ is the line }AC\quad(\text{and }L_1L_4-L_2L_3=0\text{ is the line }BD)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;142&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Why:&lt;/b&gt; the \(x^2,xy,y^2\) terms cancel (the parallel sides have the same \(a,b\)), so the equation is linear; it vanishes at A (\(L_1=L_4=0\)) and at C (\(L_2=L_3=0\)). &lt;b&gt;Make sure the \(a,b\) of the parallel lines match exactly&lt;/b&gt; before subtracting.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;143&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Reflection of a ray in a mirror line:&lt;/b&gt; take the image \(P&#x27;\) of the source point \(P\) in the mirror; \(P&#x27;,\ O,\ Q\) are collinear (O = point of incidence, Q = the point the reflected ray passes through, \(\angle\)s at O are vertically opposite). The reflected ray is the line \(P&#x27;Q\); O is where it meets the mirror; the incident ray is line \(PO\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;144&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Homogeneous second-degree equation }ax^2+2hxy+by^2=0\ \text{ represents a pair of lines through the origin}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fig&quot;&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 246 176&quot; style=&quot;width:100%;max-width:246px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;17.6&quot; y1=&quot;88.0&quot; x2=&quot;228.8&quot; y2=&quot;88.0&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;123.2&quot; y1=&quot;158.4&quot; x2=&quot;123.2&quot; y2=&quot;17.6&quot; stroke=&quot;#6b7a8d&quot; stroke-width=&quot;1.1&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;31.5&quot; y1=&quot;130.8&quot; x2=&quot;214.9&quot; y2=&quot;45.2&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;210.8&quot; y1=&quot;138.6&quot; x2=&quot;35.6&quot; y2=&quot;37.4&quot; stroke=&quot;#1b7a45&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;123.2&quot; cy=&quot;88.0&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;149.2&quot; y=&quot;114.0&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;11&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;O (0, 0)&lt;/text&gt;&lt;text x=&quot;208.9&quot; y=&quot;41.2&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;end&quot;&gt;y = m₁x&lt;/text&gt;&lt;text x=&quot;43.6&quot; y=&quot;35.4&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;start&quot;&gt;y = m₂x&lt;/text&gt;&lt;/svg&gt;&lt;div class=&quot;cap&quot;&gt;Pair of lines through the origin.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;145&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Why:&lt;/b&gt; divide by \(x^2\): \(a+2h\dfrac yx+b\Big(\dfrac yx\Big)^2=0\), i.e. \(bm^2+2hm+a=0\) where \(m=\dfrac yx\) (a slope, not the earlier \(m\)). Each root gives a line \(y=mx\) through the origin.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;146&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \Delta=4(h^2-ab):\quad &gt;0\Rightarrow\text{two distinct real lines};\ \ =0\Rightarrow\text{coincident lines};\ \ &amp;lt;0\Rightarrow\text{two imaginary lines}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;147&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a_nx^n+a_{n-1}x^{n-1}y+a_{n-2}x^{n-2}y^2+\dots+a_1xy^{n-1}+a_0y^n=0\ \text{ represents }n\text{ lines through the origin}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;148&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Extremum problems with a point moving on a line&lt;/b&gt; (two fixed points \(P_1,P_2\), point P on a given line):&lt;/span&gt;&lt;/div&gt;

 font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P₂&lt;/text&gt;&lt;circle cx=&quot;32.3&quot; cy=&quot;141.1&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;28.3&quot; y=&quot;161.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;text x=&quot;103.7&quot; y=&quot;39.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;10.5&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;same side: max |PP₁−PP₂| = P₁P₂&lt;/text&gt;&lt;/svg&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 180 228&quot; style=&quot;width:100%;max-width:180px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;15.3&quot; y1=&quot;141.1&quot; x2=&quot;164.9&quot; y2=&quot;141.1&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;39.1&quot; y1=&quot;93.5&quot; x2=&quot;141.1&quot; y2=&quot;195.5&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;39.1&quot; cy=&quot;93.5&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;35.1&quot; y=&quot;88.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P₁&lt;/text&gt;&lt;circle cx=&quot;141.1&quot; cy=&quot;195.5&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;137.1&quot; y=&quot;215.5&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P₂&lt;/text&gt;&lt;circle cx=&quot;86.7&quot; cy=&quot;141.1&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;82.7&quot; y=&quot;161.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P&lt;/text&gt;&lt;text x=&quot;90.1&quot; y=&quot;39.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;10.5&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;opposite: min of PP₁+PP₂ = P₁P₂&lt;/text&gt;&lt;/svg&gt;&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 180 231&quot; style=&quot;width:100%;max-width:180px;height:auto;display:block;margin:0 auto&quot; role=&quot;img&quot;&gt;&lt;line x1=&quot;15.3&quot; y1=&quot;141.1&quot; x2=&quot;164.9&quot; y2=&quot;141.1&quot; stroke=&quot;#1a4f8b&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;39.1&quot; y1=&quot;175.1&quot; x2=&quot;134.3&quot; y2=&quot;198.9&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;4 3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;line x1=&quot;39.1&quot; y1=&quot;175.1&quot; x2=&quot;134.3&quot; y2=&quot;198.9&quot; stroke=&quot;#c2410c&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;39.1&quot; cy=&quot;107.1&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;35.1&quot; y=&quot;102.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P₁&lt;/text&gt;&lt;circle cx=&quot;134.3&quot; cy=&quot;198.9&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;130.3&quot; y=&quot;218.9&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P₂&lt;/text&gt;&lt;circle cx=&quot;39.1&quot; cy=&quot;175.1&quot; r=&quot;2.6&quot; fill=&quot;#1d2733&quot;/&gt;&lt;text x=&quot;35.1&quot; y=&quot;195.1&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;12&quot; font-style=&quot;italic&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;P₁′&lt;/text&gt;&lt;text x=&quot;90.1&quot; y=&quot;39.7&quot; font-family=&quot;Georgia,&#x27;Times New Roman&#x27;,serif&quot; font-size=&quot;10.5&quot; font-style=&quot;normal&quot; font-weight=&quot;normal&quot; fill=&quot;#1d2733&quot; text-anchor=&quot;middle&quot;&gt;opposite: reflect one point, max ≤ P₁′P₂&lt;/text&gt;&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;cap&quot;&gt;Reflection method for sums and differences of distances (the four cases of the notes).&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;149&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Case 1 &amp;mdash; P&lt;sub&gt;1&lt;/sub&gt;, P&lt;sub&gt;2&lt;/sub&gt; on the same side:&lt;/b&gt; (i) \(PP_1+PP_2\) has &lt;b&gt;no maximum&lt;/b&gt;; (ii) minimum of \(PP_1+PP_2\): take the image \(P_1&#x27;\) (any point of the line is equidistant from \(P_1,P_1&#x27;\)), so \(PP_1+PP_2=PP_1&#x27;+PP_2\ge P_1&#x27;P_2\), with equality when P is on \(P_1&#x27;P_2\); (iii) \(|PP_1-PP_2|\) has minimum 0 at the line&#x27;s meeting point with the &amp;perp; bisector of \(P_1P_2\) (does not exist if the line is &amp;perp; to \(P_1P_2\)); (iv) maximum of \(|PP_1-PP_2|\) is \(P_1P_2\) (triangle inequality), when P lies on the line \(P_1P_2\) extended.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;150&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Case 2 &amp;mdash; P&lt;sub&gt;1&lt;/sub&gt;, P&lt;sub&gt;2&lt;/sub&gt; on opposite sides:&lt;/b&gt; (i) \(PP_1+PP_2\) has no maximum; (ii) minimum of \(PP_1+PP_2\) is \(P_1P_2\) (P = intersection of \(P_1P_2\) with the line); (iii) \(|PP_1-PP_2|\ge0\) (minimum 0 at the &amp;perp; bisector); (iv) maximum of \(|PP_1-PP_2|\): take the image \(P_1&#x27;\) so both points are on the same side; \(|PP_1&#x27;-PP_2|\le P_1&#x27;P_2\), attained when P is on \(P_1&#x27;P_2\) extended.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;&lt;div class=&quot;notes&quot;&gt;&lt;b&gt;Small slips in the handwritten notes (as I read them) &amp;mdash; the sheet uses the corrected forms:&lt;/b&gt;&lt;ul&gt;&lt;li&gt;p.101 (section formula): the x-coordinate of P is written with &lt;i&gt;m x&lt;sub&gt;2&lt;/sub&gt; + m x&lt;sub&gt;1&lt;/sub&gt;&lt;/i&gt;; the sheet uses the correct \(mx_2+nx_1\).&lt;/li&gt;&lt;li&gt;p.113 (two-point form): the slope is written like (y&lt;sub&gt;1&lt;/sub&gt;&amp;minus;y&lt;sub&gt;2&lt;/sub&gt;)/(x&lt;sub&gt;1&lt;/sub&gt;&amp;minus;y&lt;sub&gt;2&lt;/sub&gt;); the sheet uses \(\frac{y_2-y_1}{x_2-x_1}\).&lt;/li&gt;&lt;li&gt;p.114 (normal form example): the last line reads 3y/&amp;radic;13 &amp;minus; 2x/&amp;radic;13 = 7/&amp;radic;13; the correct normal form of 2x+3y+7=0 is \(-\tfrac{2}{\sqrt{13}}x-\tfrac3{\sqrt{13}}y=\tfrac7{\sqrt{13}}\).&lt;/li&gt;&lt;li&gt;p.110 (Vandermonde): the last line reads (y&amp;minus;x)(z&amp;minus;x)(z&amp;minus;x); it should be (y&amp;minus;x)(z&amp;minus;x)(z&amp;minus;y).&lt;/li&gt;&lt;li&gt;p.123 (above/below): the working shows &lt;i&gt;a&amp;alpha; &amp;minus; b&amp;beta; + c&lt;/i&gt;; the correct expression is \(a\alpha+b\beta+c\), so the rule is \(b(a\alpha+b\beta+c)&gt;0\Rightarrow\) above.&lt;/li&gt;&lt;li&gt;p.100: for the trapezium the notes mark &amp;lsquo;h = n &amp;rArr; isosceles trapezium&amp;rsquo; where h is the left side; it means the two &lt;i&gt;legs&lt;/i&gt; are equal.&lt;/li&gt;&lt;li&gt;p.104: I&lt;sub&gt;2&lt;/sub&gt; and I&lt;sub&gt;3&lt;/sub&gt; were left blank in the notes; filled in here by the sign pattern.&lt;/li&gt;&lt;li&gt;p.131 (family example iii): the point is written (0, &amp;minus;2) once; the intersection point of the two lines is (&amp;minus;2, 0).&lt;/li&gt;&lt;li&gt;p.140: the second condition is written a&lt;sub&gt;1&lt;/sub&gt;a&lt;sub&gt;2&lt;/sub&gt;+b&lt;sub&gt;1&lt;/sub&gt;b&lt;sub&gt;2&lt;/sub&gt; &amp;lt; 0 twice; the obtuse case is &amp;gt; 0.&lt;/li&gt;&lt;li&gt;p.127 (example 5): the notes stop after finding B and C; the equation of BC is completed in the test.&lt;/li&gt;&lt;li&gt;p.128 (problem 8): the relation between the three terms is hard to read; I took it as (15/AB)² + (10/AC)² = (6/AD)², which gives the tan θ = −2/3 of the notes&#x27; working.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;

ot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle \\text{Lines }a_ix+b_iy+c_i=0\\ (i=1,2,3)\\text{ are concurrent}\\Rightarrow\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle \\begin{vmatrix}a_1&amp;a_2&amp;a_3\\\\b_1&amp;b_2&amp;b_3\\\\1&amp;1&amp;1\\end{vmatrix}=0\\)&quot;, &quot;\\(\\displaystyle \\begin{vmatrix}a_1&amp;b_1&amp;c_1\\\\a_2&amp;b_2&amp;c_2\\\\a_3&amp;b_3&amp;c_3\\end{vmatrix}=0\\)&quot;, &quot;\\(\\displaystyle a_1a_2a_3+b_1b_2b_3+c_1c_2c_3=0\\)&quot;, &quot;\\(\\displaystyle \\begin{vmatrix}a_1&amp;b_1&amp;c_1\\\\a_2&amp;b_2&amp;c_2\\\\a_3&amp;b_3&amp;c_3\\end{vmatrix}=1\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;\\(\\displaystyle \\text{Put the intersection of two lines into the third.}\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.124 Concurrency (exception)&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;The determinant condition for concurrency is also satisfied when&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle all c_i are equal\\)&quot;, &quot;\\(\\displaystyle the three lines form a triangle\\)&quot;, &quot;\\(\\displaystyle two of the lines coincide only\\)&quot;, &quot;\\(\\displaystyle the three lines are parallel — so check this case separately\\)&quot;], &quot;ans&quot;: 3, &quot;exp&quot;: &quot;Three parallel lines give determinant 0 but have no common point.&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.130 Family of lines&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle \\text{Lines through the intersection of }L_1=0,\\ L_2=0:\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle L_1L_2=\\lambda\\)&quot;, &quot;\\(\\displaystyle L_1-L_2=\\lambda\\)&quot;, &quot;\\(\\displaystyle L_1+\\lambda L_2=0,\\ \\lambda\\in\\mathbb R\\)&quot;, &quot;\\(\\displaystyle L_1+\\lambda L_2=1\\)&quot;], &quot;ans&quot;: 2, &quot;exp&quot;: &quot;\\(\\displaystyle \\text{Misses }L_2=0\\text{ itself (}\\lam {A point on a bisector is equidistant from the two lines.}\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.136 Bisector region&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;If c₁c₂ ≠ 0 (neither line passes through the origin), the origin lies on&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle neither bisector (it lies inside one of the four angular regions)\\)&quot;, &quot;\\(\\displaystyle the obtuse bisector only\\)&quot;, &quot;\\(\\displaystyle the acute bisector only\\)&quot;, &quot;\\(\\displaystyle both bisectors\\)&quot;], &quot;ans&quot;: 0, &quot;exp&quot;: &quot;The origin is inside one of the four regions; the bisector &amp;lsquo;containing the origin in its region&amp;rsquo; is the one running through that pair of vertical angles.&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.136 Bisector region&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle (h,k)\\text{ lies on the bisector whose region contains the origin}\\iff\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle c_1c_2(a_1h+b_1k+c_1)(a_2h+b_2k+c_2)\\ge0\\)&quot;, &quot;\\(\\displaystyle (a_1h+b_1k+c_1)(a_2h+b_2k+c_2)=0\\)&quot;, &quot;\\(\\displaystyle c_1c_2\\,(a_1a_2+b_1b_2)\\ge0\\)&quot;, &quot;\\(\\displaystyle c_1c_2(a_1h+b_1k+c_1)(a_2h+b_2k+c_2)\\le0\\)&quot;], &quot;ans&quot;: 0, &quot;exp&quot;: &quot;\\(\\displaystyle \\text{Same side of both lines as O, or opposite side of both: each factor }(a_ih+b_ik+c_i)c_i\\text{ has the same sign.}\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.137 Bisector region&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle \\text{With }c_1&gt;0,\\ c_2&gt;0,\\ \\text{the bisector containing the origin in its region is}\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle \\dfrac{a_1x+b_1y+c_1}{\\sqrt{a_1^2+b_1^2}}=+\\dfrac{a_2x+b_2y+c_2}{\\sqrt{a_2^2+b_2^2}}\\)&quot;, &quot;\\(\\displaystyle \\dfrac{a_1x+b_1y+ (\\sqrt{13^2-5^2}=12\\).&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.104 Incentre&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;The incentre of the triangle with vertices A(0, 0), B(4, 0), C(0, 3) is&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle (1, 4/3)\\)&quot;, &quot;\\(\\displaystyle (4/3, 1)\\)&quot;, &quot;\\(\\displaystyle (2, 3/2)\\)&quot;, &quot;\\(\\displaystyle (1, 1)\\)&quot;], &quot;ans&quot;: 3, &quot;exp&quot;: &quot;\\(a=BC=5,\\ b=CA=3,\\ c=AB=4\\); \\(I=\\dfrac{aA+bB+cC}{12}=\\Big(\\dfrac{3\\cdot4}{12},\\dfrac{4\\cdot3}{12}\\Big)=(1,1)\\).&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.104 Excentre&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;For the same triangle, the excentre opposite A is&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle (1, 1)\\)&quot;, &quot;\\(\\displaystyle (−6, 6)\\)&quot;, &quot;\\(\\displaystyle (3, 3)\\)&quot;, &quot;\\(\\displaystyle (6, 6)\\)&quot;], &quot;ans&quot;: 3, &quot;exp&quot;: &quot;\\(I_1=\\dfrac{-aA+bB+cC}{-a+b+c}=\\dfrac{(12,\\ 12)}{2}=(6,6)\\); check \\(r_1=\\Delta/(s-a)=6/1=6\\).&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.105 Orthocentre&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;&lt;div style=\&quot;margin:6px 0 10px\&quot;&gt;&lt;svg xmlns=\&quot;http://www.w3.org/2000/svg\&quot; viewBox=\&quot;0 0 250 192\&quot; style=\&quot;width:100%;max-width:250px;height:auto;display:block;margin:0 auto\&quot; role=\&quot;img\&quot;&gt;&lt;polygon points=\&quot;91.2,28.8 28.8,163.2 220.8,163.2\&quot; fill=\&quot;none\&quot; stroke=\&quot;#1a4f8b\&quot; stroke-width=\&quot;2.0\&quot; stroke-linejoin=\&quot;round\&quot;/&gt;&lt;text x=\&quot;91.2\&quot; y=\&quot;19.8\&quot; font-family=\&quot;Georgia,&#x27;Times New Roman&#x27;,serif\&quot; font-size=\&quot;15\&quot; font-style=\&quot;italic\&quot; fill=\&quot;#1d2733\&quot; text-anchor=\&quot;middle\&quot;&gt;A&lt;\/text&gt;&lt;text x=\ quot;p.126 Direction (distance on a line)&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;&lt;div style=\&quot;margin:6px 0 10px\&quot;&gt;&lt;svg xmlns=\&quot;http://www.w3.org/2000/svg\&quot; viewBox=\&quot;0 0 293 235\&quot; style=\&quot;width:100%;max-width:293px;height:auto;display:block;margin:0 auto\&quot; role=\&quot;img\&quot;&gt;&lt;line x1=\&quot;24.0\&quot; y1=\&quot;196.8\&quot; x2=\&quot;268.8\&quot; y2=\&quot;196.8\&quot; stroke=\&quot;#6b7a8d\&quot; stroke-width=\&quot;1.1\&quot; stroke-linecap=\&quot;round\&quot;/&gt;&lt;line x1=\&quot;48.0\&quot; y1=\&quot;211.2\&quot; x2=\&quot;48.0\&quot; y2=\&quot;24.0\&quot; stroke=\&quot;#6b7a8d\&quot; stroke-width=\&quot;1.1\&quot; stroke-linecap=\&quot;round\&quot;/&gt;&lt;text x=\&quot;266.8\&quot; y=\&quot;214.8\&quot; font-family=\&quot;Georgia,&#x27;Times New Roman&#x27;,serif\&quot; font-size=\&quot;12\&quot; font-style=\&quot;italic\&quot; font-weight=\&quot;normal\&quot; fill=\&quot;#1d2733\&quot; text-anchor=\&quot;middle\&quot;&gt;x&lt;\/text&gt;&lt;text x=\&quot;58.0\&quot; y=\&quot;30.0\&quot; font-family=\&quot;Georgia,&#x27;Times New Roman&#x27;,serif\&quot; font-size=\&quot;12\&quot; font-style=\&quot;italic\&quot; font-weight=\&quot;normal\&quot; fill=\&quot;#1d2733\&quot; text-anchor=\&quot;middle\&quot;&gt;y&lt;\/text&gt;&lt;line x1=\&quot;41.2\&quot; y1=\&quot;-2.0\&quot; x2=\&quot;250.2\&quot; y2=\&quot;207.0\&quot; stroke=\&quot;#1a4f8b\&quot; stroke-width=\&quot;2\&quot; stroke-linecap=\&quot;round\&quot;/&gt;&lt;circle cx=\&quot;96.0\&quot; cy=\&quot;100.8\&quot; r=\&quot;2.6\&quot; fill=\&quot;#1d2733\&quot;/&gt;&lt;text x=\&quot;90.0\&quot; y=\&quot;94.8\&quot; font-family=\&quot;Georgia,&#x27;Times New Roman&#x27;,serif\&quot; font-size=\&quot;12\&quot; font-style=\&quot;normal\&quot; font-weight=\&quot;normal\&quot; fill=\&quot;#1d2733\&quot; text-anchor=\&quot;end\&quot;&gt;A (1, 2)&lt;\/text&gt;&lt;line x1=\&quot;96.0\&quot; y1=\&quot;100.8\&quot; x2=\&quot;133.9\&quot; y2=\&quot;90.7\&quot; stroke=\&quot;#c2410c\&quot; stroke-width=\&quot;1.5\&quot; stroke-linecap=\&quot;round\&quot;/&gt;&lt;circle cx=\&quot;133.9\&quot; cy=\&quot;90.7\&quot; r=\&quot;2.6\&quot; fill=\&quot;#1d2733\&quot;/&gt;&lt;line x1=\&quot;96.0\&quot; y1=\&quot;100.8\&quot; x2=\&quot;106.1\&quot; y2=\&quot;62.9\&quot; stroke=\&quot;#c2410c\&quot; stroke-width=\&quot;1.5\&quot; stroke-linecap=\&quot;round\&quot;/&gt;&lt;circle cx=\&quot;106.1\&quot; cy=\&quot;62.9\&quot; r=\&quot;2.6\&quot; fill=\&quot;#1d2733\&quot;/&gt;&lt;text x=\&quot;236.0\&quot; y=\&quot;190.8\&quot; font-family=\&quot;Georgia,&#x27;Times New Roman&#x27;,serif\&quot; font-size=\&quot;12\&quot; font-style=\&quot;normal\&quot; font-weight=\&quot;normal\&quot; fill=\&quot;#1d2733\&quot; text-anchor=\&quot;middle\&quot;&gt;x+y=4&lt;\/text&gt;&lt;\/svg&gt;&lt;\/div&gt;A line through A(1, 2) meets x + y = 4 at P with AP = √6/3. The inclination of the line is&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle 45° only\\)&quot;, &quot;\\(\\displaystyle 15° or 105°\\)&quot;, &quot;\\(\\displaystyle 30° or 60°\\)&quot;, &quot;\\(\\displaystyle 15° or 75°\\)&quot;], &quot;ans&quot;: 3, &quot;exp&quot;: &quot;\\(1+\\tfrac{\\sqrt6}3\\cos\\theta+2+\\tfrac{\\sqrt6}3\\sin\\theta=4\\Rightarrow\\sin(\\theta+45^\\circ)=\\tfrac{\\sqrt3}2\\Rightarrow\\theta=15^\\circ,75^\\circ\\). (Geometry: \\(\\cos\\phi=\\tfrac{1/\\sqrt2}{\\sqrt6/3}=\\tfrac{\\sqrt3}2\\), \\(\\phi=30^\\circ\\); \\(45^\\circ\\mp30^\\circ\\).)&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.127 Perpendicular bisectors&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;&lt;div style=\&quot;margin:6px 0 10px\&quot;&gt;&lt;svg xmlns=\&quot;http://www.w3.org/2000/svg\&quot; viewBox=\&quot;0 0 298 264\&quot; style=\&quot;width:100%;max-width:298px;height:auto;display:block;margin:0 auto\&quot; role=\&quot;img\&quot;&gt;&lt;polygon points=\&quot;228.0,228.0 36.0,36.0 256.8,170.4\&quot; fill=\&quot;none\&quot; stroke=\&quot;#1a4f8b\&quot; stroke-width=\&quot;2\&quot; stroke-linejoin=\&quot;round\&quot;/&gt;&lt;circle cx=\&quot;228.0\&quot; cy=\&quot;228.0\&quot; r=\&quot;2.6\&quot; fill=\&quot;#1d2733\&quot;/&gt;&lt;circle cx=\&quot;36.0\&quot; cy=\&quot;36.0\&quot; r=\&quot;2.6\&quot; fill=\&quot;#1d2733\&quot;/&gt;&lt;circle cx=\&quot;256.8\&quot; cy=\&quot;170.4\&quot; r=\&quot;2.6\&quot; fill=\&quot;#1d2733\&quot;/&gt;&lt;text x=\&quot;232.0\&quot; y=\&quot;222.0\&quot; font-family=\&quot;Georgia,&#x27;Times New Roman&#x27;,serif\&quot; font-size=\&quot;12\&quot; font-style=\&quot;normal\&quot; font-weight=\&quot;normal\&quot; fill=\&quot;#1d2733\&quot; text-anchor=\&quot;middle\&quot;&gt;A (1, −2)&lt;\/text&gt;&lt;text x=\&quot;26.0\&quot; y=\&quot;46.0\&quot; font-family=\&quot;Georgia,&#x27;Times New Roman&#x27;,serif\&quot; font-size=\&quot;14\&quot; font-style=\&quot;italic\&quot; font-weight=\&quot;normal\&quot; fill=\&quot;#1d2733\&quot; text-anchor=\&quot;middle\&quot;&gt;B&lt;\/text&gt;&lt;text x=\&quot;268.8\&quot; y=\&quot;182.4\&quot; font-family=\&quot;Georgia,&#x27;Times New Roman&#x27;,serif\&quot; font-size=\&quot;14\&quot; font-style=\&quot;italic\&quot; font-weight=\&quot;normal\&quot; fill=\&quot;#1d2733\&quot; text-anchor=\&quot;middle\&quot;&gt;C&lt;\/text&gt;&lt;line x1=\&quot;182.9\&quot; y1=\&quot;81.1\&quot; x2=\&quot;81.1\&quot; y2=\&quot;182.9\&quot; stroke=\&quot;#c2410c\&quot; stroke-width=\&quot;1.3\&quot; stroke-dasharray=\&quot;4 3\&quot; stroke-linecap=\&quot;round\&quot;/&gt;&lt;circle cx=\&quot;132.0\&quot; cy=\&quot;132.0\&quot; r=\&quot;2.6\&quot; fill=\&quot;#c2410c\&quot;/&gt;&lt;line x1=\&quot;306.8\&quot; y1=\&quot;231.4\&quot; x2=\&quot;178.0\&quot; y2=\&quot;167.0\&quot; stroke=\&quot;#c2410c\&quot; stroke-width=\&quot;1.3\&quot; stroke-dasharray=\&quot;4 3\&quot; stroke-linecap=\&quot;round\&quot;/&gt;&lt;circle cx=\&quot;242.4\&quot; cy=\&quot;199.2\&quot; r=\&quot;2.6\&quot; fill=\&quot;#c2410c\&quot;/&gt;&lt;\/svg&gt;&lt;\/div&gt;The perpendicular bisectors of AB and AC of △ABC are x − y + 5 = 0 and x + 2y = 0, and A = (1, −2). The equation of BC is&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle 14x − 23y + 40 = 0\\)&quot;, &quot;\\(\\displaystyle 23x + 14y − 40 = 0\\)&quot;, &quot;\\(\\displaystyle 14x + 23y − 40 = 0\\)&quot;, &quot;\\(\\displaystyle 14x + 23y + 40 = 0\\)&quot;], &quot;ans&quot;: 2, &quot;exp&quot;: &quot;B = image of A in \\(x-y+5=0\\): \\(\\tfrac{x_B-1}1=\\tfrac{y_B+2}{-1}=-\\tfrac{2(1+2+5)}2=-8\\Rightarrow B(-7,6)\\). C = image of A in \\(x+2y=0\\): \\(C(\\tfrac{11}5,\\tfrac25)\\). Slope of BC \\(=-\\tfrac{14}{23}\\).&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.128 Between two lines&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;The point (a, a²) lies between the parallel lines x + y − 2 = 0 and 4x + 4y − 3 = 0 for&quot;, &quot;opts&quot;: [&quot;\\(a\\in(-\\tfrac32,\\tfrac12)\\)&quot;, &quot;\\(a\\in(-2,-\\tfrac32)\\cup(\\tfrac12,1)\\)&quot;, &quot;\\(a\\in(-2,-\\tfrac32)\\cup(1,\\infty)\\)&quot;, &quot;\\(a\\in(-2,1)\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;\\(a^2+a-2&amp;lt;0\\Rightarrow-2&amp;lt;a&amp;lt;1\\) and \\(4a^2+4a-3&gt;0\\Rightarrow a&amp;lt;-\\tfrac32\\) or \\(a&gt;\\tfrac12\\); intersect.&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.129 Concurrency&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;If px + by + c = 0, ax + qy + c = 0 and ax + by + r = 0 (p ≠ a, q ≠ b, r ≠ c) are concurrent, then p/(p−a) + q/(q−b) + r/(r−c) =&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle 2\\)&quot;, &quot;\\(\\displaystyle 0\\)&quot;, &quot;\\(\\displaystyle −2\\)&quot;, &quot;\\(\\displaystyle 1\\)&quot;], &quot;ans&quot;: 0, &quot;exp&quot;: &quot;Determinant \\(=0\\); \\(R_2\\to R_2-R_1\\), \\(R_3\\to R_3-R_1\\), expand and divide by \\((p-a)(q-b)(r-c)\\): \\(\\tfrac p{p-a}+\\tfrac b{q-b}+\\tfrac c{r-c}=0\\); then \\(\\tfrac b{q-b}=\\tfrac q{q-b}-1\\), etc.&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.129 Line through A(−5,−4)&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;A line through A(−5, −4) meets x + 3y + 2 = 0, 2x + y + 4 = 0 and x − y − 5 = 0 at B, C, D. If (15/AB)² + (10/AC)² = (6/AD)², the line is&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle 2x + 3y − 2 = 0\\)&quot;, &quot;\\(\\displaystyle 2x − 3y + 2 = 0\\)&quot;, &quot;\\(\\displaystyle 2x + 3y + 22 = 0\\)&quot;, &quot;\\(\\displaystyle 3x + 2y + 23 = 0\\)&quot;], &quot;ans&quot;: 2, &quot;exp&quot;: &quot;With \\(x=-5+r\\cos\\theta,\\ y=-4+r\\sin\\theta\\): \\(\\tfrac{15}{AB}=|\\cos\\theta+3\\sin\\theta|\\), \\(\\tfrac{10}{AC}=|2\\cos\\theta+\\sin\\theta|\\), \\(\\tfrac6{AD}=|\\cos\\theta-\\sin\\theta|\\). The relation reduces to \\((2\\cos\\theta+3\\sin\\theta)^2=0\\Rightarrow\\tan\\theta=-\\tfrac23\\).&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.130 Point inside a triangle&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;The point (α, α²) lies inside the triangle formed by 2x + 3y − 1 = 0, x + 2y − 3 = 0 and 5x − 6y − 1 = 0 for&quot;, &quot;opts&quot;: [&quot;\\(\\alpha\\in(-\\tfrac32,-1)\\cup(\\tfrac13,1)\\)&quot;, &quot;\\(\\alpha\\in(-1,\\tfrac12)\\)&quot;, &quot;\\(\\alpha\\in(-\\tfrac32,1)\\)&quot;, &quot;\\(\\alpha\\in(-\\tfrac32,-1)\\cup(\\tfrac12,1)\\)&quot;], &quot;ans&quot;: 3, &quot;exp&quot;: &quot;Same side of each line as the opposite vertex: \\(3\\alpha^2+2\\alpha-1&gt;0\\), \\(2\\alpha^2+\\alpha-3&amp;lt;0\\), \\(6\\alpha^2-5\\alpha+1&gt;0\\). Intersect: \\((-\\tfrac32,-1)\\cup(\\tfrac12,1)\\).&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.131 Family of lines (i)&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;The line through the intersection of 3x + 4y + 6 = 0 and x + y + 2 = 0 with y-intercept 3 is&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle 3x − 2y + 6 = 0\\)&quot;, &quot;\\(\\displaystyle 3x − 2y − 6 = 0\\)&quot;, &quot;\\(\\displaystyle 3x + 2y − 6 = 0\\)&quot;, &quot;\\(\\displaystyle 2x − 3y + 9 = 0\\)&quot;], &quot;ans&quot;: 0, &quot;exp&quot;: &quot;\\(3x+4y+6+\\lambda(x+y+2)=0\\) through \\((0,3)\\): \\(18+5\\lambda=0\\Rightarrow\\lambda=-\\tfrac{18}5\\); simplify to \\(3x-2y+6=0\\).&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.131 Family of lines (ii)&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;Among lines through the intersection of 3x + 4y + 6 = 0 and x + y + 2 = 0, the line with equal non-zero intercepts on both axes is&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle x + y + 2 = 0 (the ‘missing’ line, not given by any λ)\\)&quot;, &quot;\\(\\displaystyle no such line exists\\)&quot;, &quot;\\(\\displaystyle x + y + 3 = 0 (λ = 1)\\)&quot;, &quot;\\(\\displaystyle 3x + 4y + 6 = 0\\)&quot;], &quot;ans&quot;: 0, &quot;exp&quot;: &quot;Slope \\(-1\\): \\(-\\dfrac{3+\\lambda}{4+\\lambda}=-1\\) has no solution, so the line is the missing line \\(x+y+2=0\\) (intercepts \\(-2,-2\\)).&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.131 Family of lines (iii)&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;The line through the intersection of 3x + 4y + 6 = 0 and x + y + 2 = 0 that is perpendicular to 5x + 6y − 8 = 0 is&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle 6x − 5y − 12 = 0\\)&quot;, &quot;\\(\\displaystyle 6x + 5y + 12 = 0\\)&quot;, &quot;\\(\\displaystyle 5x + 6y + 10 = 0\\)&quot;, &quot;\\(\\displaystyle 6x − 5y + 12 = 0\\)&quot;], &quot;ans&quot;: 3, &quot;exp&quot;: &quot;Intersection is \\((-2,0)\\) (not \\((0,-2)\\)); required slope \\(\\tfrac65\\): \\(y=\\tfrac65(x+2)\\).&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.131 Family of lines (iv)&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;The tangent(s) to y = x² + 1 through the intersection point (−2, 0) of those two lines have slopes m satisfying&quot;, &quot;opts&quot;: [&quot;\\(m^2-8m ;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;For the same two lines, the bisector containing the point (13, −1) in its region is&quot;, &quot;opts&quot;: [&quot;\\(\\dfrac{x-7y+13}{\\sqrt{50}}=-\\dfrac{2x+5y-6}{\\sqrt{29}}\\)&quot;, &quot;\\(\\dfrac{x-7y+13}{\\sqrt{50}}=\\dfrac{2x+5y-6}{\\sqrt{29}}\\)&quot;, &quot;\\(x-7y+13=2x+5y-6\\)&quot;, &quot;\\(\\dfrac{x-7y+13}{\\sqrt{29}}=\\dfrac{2x+5y-6}{\\sqrt{50}}\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;At \\((13,-1)\\): \\(13+7+13=33&gt;0\\) and \\(26-5-6=15&gt;0\\) — same sign, so the \\((+)\\) bisector.&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.141 Bisectors&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;For the same two lines, the acute-angle bisector is (c₁c₂(a₁a₂ + b₁b₂) = 13·(−6)·(2 − 35) &gt; 0)&quot;, &quot;opts&quot;: [&quot;\\(\\text{neither: the lines are perpendicular}\\)&quot;, &quot;\\(\\text{the bisector through the origin}\\)&quot;, &quot;\\(\\dfrac{x-7y+13}{\\sqrt{50}}=-\\dfrac{2x+5y-6}{\\sqrt{29}}\\)&quot;, &quot;\\(\\dfrac{x-7y+13}{\\sqrt{50}}=\\dfrac{2x+5y-6}{\\sqrt{29}}\\)&quot;], &quot;ans&quot;: 3, &quot;exp&quot;: &quot;\\(c_1c_2(a_1a_2+b_1b_2)&gt;0\\Rightarrow\\) the origin lies in the &lt;b&gt;obtuse&lt;\/b&gt; region, so the bisector containing it is the obtuse one; the acute one is the other, the \\((+)\\) bisector. (The obtuse bisector is the \\((-)\\) one.)&quot;}, {&quot;sec&quot;: &quot;B&quot;, &quot;tag&quot;: &quot;p.141 Internal bisector of a triangle&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;For the triangle formed by x + y + 2 = 0, 5x − 6y + 1 = 0 and 2x + 7y − 8 = 0, the internal bisector of the angle between x + y + 2 = 0 and 2x + 7y − 8 = 0 is&quot;, &quot;opts&quot;: [&quot;\\(\\dfrac{x+y+2}{\\sqrt2}=-\\dfrac{2x+7y-8}{\\sqrt{53}}\\)&quot;, &quot;\\(\\dfrac{x+y+2}{\\sqrt2}=-\\dfrac{5x-6y+1}{\\sqrt{61}}\\)&quot;, &quot;\\(\\dfrac{2x+7y-8}{\\sqrt{53}}=\\dfrac{5x-6y+1}{\\sqrt{61}}\\)&quo function paintTimer(){ const t=$(&#x27;#tm&#x27;); if(!t) return; t.textContent=fmt(left); t.classList.toggle(&#x27;low&#x27;,left&lt;300); }

    &lt;div class=&quot;keys&quot;&gt;${[&#x27;7&#x27;,&#x27;8&#x27;,&#x27;9&#x27;,&#x27;4&#x27;,&#x27;5&#x27;,&#x27;6&#x27;,&#x27;1&#x27;,&#x27;2&#x27;,&#x27;3&#x27;,&#x27;0&#x27;,&#x27;.&#x27;,&#x27;-&#x27;].map(k=&gt;`&lt;button data-k=&quot;${k}&quot;&gt;${k}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;button data-k=&quot;bk&quot; style=&quot;grid-column:span 2&quot;&gt;&amp;larr; Backspace&lt;/button&gt;&lt;button data-k=&quot;cl&quot;&gt;Clear&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;

function correct(i){ const q=Qs[i],r=R[i]; if(!answered(i)) return null; if(q.kind===&#x27;mcq&#x27;) return r.sel===q.ans; const v=parseFloat(r.num); return isFinite(v) &amp;&amp; Math.abs(v-q.ans) &lt;= 0.01; }

  $(&#x27;#app&#x27;).innerHTML=h;
  const paint = f =&gt; {
    $(&#x27;#rl&#x27;).innerHTML = Qs.map((q,i)=&gt;{ const c=correct(i); const cls=c===null?&#x27;skip&#x27;:c?&#x27;ok&#x27;:&#x27;bad&#x27;; if(f!==&#x27;all&#x27;&amp;&amp;f!==cls) return &#x27;&#x27;;

      return `&lt;div class=&quot;rq ${cls}&quot;&gt;&lt;div class=&quot;meta&quot;&gt;Q${i+1} &amp;middot; Section ${q.sec} &amp;middot; ${q.tag} &amp;middot; time ${Math.round(R[i].t)} s &amp;middot; ${c===null?&#x27;Skipped&#x27;:c?&#x27;Correct&#x27;:&#x27;Wrong&#x27;}&lt;/div&gt;&lt;div class=&quot;stem&quot; style=&quot;font-size:17px;margin-bottom:6px&quot;&gt;${M(q.stem)}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Your answer:&lt;/b&gt; ${yours}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Correct answer:&lt;/b&gt; ${right}&lt;/div&gt;&lt;div class=&quot;exp&quot;&gt;${M(q.exp)}&lt;/div&gt;&lt;/div&gt;`; }).join(&#x27;&#x27;);
    typeset($(&#x27;#rl&#x27;));
