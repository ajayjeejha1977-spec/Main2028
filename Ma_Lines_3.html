const D=[],X=[];
E.split("\n").forEach(l=>{const[a,t,w,m,kk]=l.split("|");D.push([a,+t,m,kk,"Q"+a+" (book p. "+pg(+a)+")",ST[+a-1]]);X.push(w)});
let k=0,sc=0,tot=0,log=[];
function shuf(){const p=D.map((_,i)=>i);for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}const d=p.map(i=>D[i]),x=p.map(i=>X[i]);D.splice(0,D.length,...d);X.splice(0,X.length,...x)}
const $=id=>document.getElementById(id);
function renderP(){$("p1").innerHTML=P.map((p,i)=>`<div class="card"><h3>${i+1}. ${p.n}</h3><div class="cue">${p.cue}</div><p><b>Try first:</b> ${p.q}</p>
<details><summary>Hint</summary>${p.h}</details><details><summary>Answer</summary>${p.a}</details>
<details><summary>Worked twist</summary><div class="dis">${p.w||"See the disguises below."}</div></details>
<details><summary>Analysis: how it gets disguised</summary>${p.d.map(x=>`<div class="dis"><span class="tag">${x[0]}</span> ${x[1]}</div>`).join("")}</details></div>`).join("")}
function renderD(){const q=D[k];$("p2").innerHTML=`<div class="card"><div class="cue">Question ${k+1} of ${D.length} · Score ${sc}/${tot}. Read the gist below, open the full question in your book if needed, then choose the pattern.</div>
<p><b>${q[4]}</b><br>${q[5]}</p><div class="opts">${opts(q[1]).map(i=>[T[i],i]).map(([t,i])=>`<button data-i="${i}">${t}</button>`).join("")}</div><div id="fb"></div></div>
<div class="nav"><button id="pv">Previous</button><button id="nx">Next</button><button id="sh">Shuffle and restart</button></div>`;
document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
$("pv").onclick=()=>{k=(k+D.length-1)%D.length;renderD()};$("nx").onclick=()=>{k=(k+1)%D.length;renderD()};
$("sh").onclick=()=>{shuf();k=0;sc=0;tot=0;renderD()}}
function pick(i){const q=D[k],ok=i===q[1];tot++;if(ok)sc++;
document.querySelectorAll(".opts button").forEach(b=>b.disabled=true);
const a=ok?`<p class="ok">Correct.</p><p><b>Why it fits:</b> ${X[k]}.</p>`:`<p class="no">Not quite. You chose “${T[i]}”.</p><p><b>Why that does not fit:</b> that pattern ${S[i]} None of these cues appear here.</p><p><b>Why it is “${T[q[1]]}”:</b> ${X[k]}.</p><p><b>That pattern ${S[q[1]]}</b></p>`;
$("fb").innerHTML=a+`<p><b>First move:</b> ${q[2]}</p><p><b>Book key:</b> ${q[3]}</p><p><b>Log it. If you got this wrong or slowly, why?</b></p><div class="opts" id="why"><button data-w="Recognition">Did not spot the pattern</button><button data-w="Concept">Did not know the concept</button><button data-w="Calculation">Slip in calculation</button><button data-w="None">No problem</button></div>`;
log.push({l:"Q"+q[0],p:i,t:q[1],ok:ok,w:ok?"None":"Recognition"});
document.querySelectorAll("#why button").forEach(b=>b.onclick=()=>{log[log.length-1].w=b.dataset.w;document.querySelectorAll("#why button").forEach(x=>x.disabled=true);b.style.background="var(--bd)";renderLog()})}
function renderLog(){const c={Recognition:0,Concept:0,Calculation:0},m={};
log.forEach(e=>{if(c[e.w]!==undefined)c[e.w]++;if(!e.ok)m[e.t]=(m[e.t]||0)+1});
const top=Object.keys(m).sort((a,b)=>m[b]-m[a])[0];
$("p3").innerHTML=log.length?`<div class="card"><h3>Why marks are lost</h3><p>Recognition: <b>${c.Recognition}</b> · Concept: <b>${c.Concept}</b> · Calculation: <b>${c.Calculation}</b></p><p>Attempts: ${log.length}, tagged correctly: ${log.filter(e=>e.ok).length}.</p>${top!==undefined?`<p>Pattern missed most: <b>${T[top]}</b>. Redo its parent problem in tab 1.</p>`:`<p class="ok">No pattern missed yet.</p>`}</div><div class="card"><h3>History</h3>${log.map((e,j)=>`<div class="dis">${j+1}. ${e.l}: ${e.ok?"<span class=ok>tagged correctly</span>":"<span class=no>missed</span>"} · ${e.w}</div>`).join("")}</div>`:`<div class="card cue">Nothing logged yet. Attempt questions in tab 2 and tag why you lost marks.</div>`}
function tab(a){[1,2,3].forEach(n=>{$("p"+n).classList.toggle("hide",a!==n);$("t"+n).classList.toggle("on",a===n)});if(a===3)renderLog()}
t1.onclick=()=>tab(1);t2.onclick=()=>tab(2);t3.onclick=()=>tab(3);
shuf();renderP();renderD();renderLog();
</script></body></html>
