["Q26 · irrational terms in (7^(1/5) − 3^(1/10))⁶⁰",2,"Find the r values that make both exponents integers (r multiples of 10), then subtract from 61.","Option A: 54"],

"<b>Q5.</b> Coefficient of x⁷ in (ax² + 1/(bx))¹¹ equals coefficient of x⁻⁷ in (ax − 1/(bx²))¹¹. First: power 22 − 3r = 7, so r = 5, giving ¹¹C₅·a⁶/b⁵. Second: power 11 − 3r = −7, so r = 6, giving ¹¹C₆·a⁵/b⁶ (sign (−1)⁶ = +). Since ¹¹C₅ = ¹¹C₆, a⁶/b⁵ = a⁵/b⁶, so a = 1/b, i.e. <b>ab = 1</b>. Trap: using the same r in both.",

function esc(s){return s}
function renderP(){let h="";P.forEach((p,i)=>{h+=`<div class="card"><h3>${i+1}. ${p.n}</h3><div class="cue">${p.cue}</div>
<p><b>Try first:</b> ${p.q}</p>
<details><summary>Hint</summary>${p.h}</details>
<details><summary>Answer</summary>${p.a}</details>
<details><summary>Worked twist</summary><div class="dis">${W[i]}</div></details>
<details><summary>Analysis: how it gets disguised</summary>${p.d.map(x=>`<div class="dis"><span class="tag">${x[0]}</span> ${x[1]}</div>`).join("")}</details></div>`});
document.getElementById("p1").innerHTML=h}
let k=0,sc=0,tot=0,log=[];
function renderD(){const q=D[k];

<p><b>${q[0]}</b></p><div class="opts">${T.map((t,i)=>`<button data-i="${i}">${t}</button>`).join("")}</div>
<div id="fb"></div></div>
<div class="nav"><button id="pv">Previous</button><button id="nx">Next</button><button id="sh">Shuffle and restart</button></div>`;
document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
document.getElementById("pv").onclick=()=>{k=(k+D.length-1)%D.length;renderD()};
document.getElementById("nx").onclick=()=>{k=(k+1)%D.length;renderD()};

"fires on ‘consecutive terms’, ‘in the ratio’, ‘in A.P.’: neighbouring coefficients are compared, using ⁿCᵣ₊₁/ⁿCᵣ = (n−r)/(r+1).",
"fires on ‘sum of coefficients’, ‘even/odd powers’, ‘integral powers’: put x = 1 and x = −1 instead of expanding. It gives totals only, never one specific coefficient.",

"fires on a huge power with ‘remainder when divided by’: reduce the base mod the divisor, or write it as (multiple ± 1)ⁿ.",
"fires on a Σ of ⁿCᵣ with a weight (r, 1/(r+1), r², squares) or a half-range sum: use r·ⁿCᵣ = n·ⁿ⁻¹Cᵣ₋₁, symmetry, Vandermonde or 2ⁿ.",
"fires on an ugly base, a four-term base, or a sum that is secretly a G.P.: factorise, simplify or split it first, then do a short binomial step.","fires on ‘general term’, ‘independent of x’, ‘coefficient of x to a power’, middle term, term from the end: write T(r+1) and solve for r.","fires on a non-integer index or ‘x is so small that…’: use the infinite series 1 + nx + n(n−1)x²/2! + … or bound the terms.","fires on coefficients that are given, equal or zero with unknown m, n, p or a, b: turn each given coefficient into an equation.","fires on a foreign topic (logs, trig, limits, AM-GM, geometry, factorials) wrapped around a binomial step: do the binomial part, then switch topic."];
const X=[
["The question compares the coefficients of three neighbouring terms (rth, (r+1)th, (r+2)th) and says they are in A.P.",5,"It looks algebra-heavy, which can make you want to simplify first. But there is nothing to simplify: the A.P. condition itself is the first step."],
["The base has four terms, 1 − x − x² + x³, and it factorises as (1−x)(1−x²). Once factorised it becomes an ordinary coefficient hunt.",1,"Putting x = 1 or −1 gives totals only. This question asks for one specific coefficient (x⁷), so substitution cannot answer it."],
["‘Sum of coefficients of integral powers’ is a sum-by-parity question: √x makes odd r give non-integral powers, so only even r survive.",2,"√x invites rational/integral-term counting, but you are asked for a sum, not a count. Counting tells you which r qualify; the sum needs ½[f(1) + f(−1)]."],
["‘Irrational terms’ with two different roots (7^(1/5) and 3^(1/10)): find the r that make both exponents integers (multiples of 10) and subtract from the 61 terms.",1,"Both are about special terms, but nothing is being summed. You only count terms, so substitution of x = 1 never enters."],
["‘Remainder when divided by 9’ with huge powers. Reduce the bases: 8 ≡ −1 and 62 ≡ −1 (mod 9).",5,"62²ⁿ⁺¹ looks ugly, but nothing needs to be simplified algebraically. The modular reduction is the whole move."],
["Differences of sums of ²¹Cₖ and ¹⁰Cₖ over k = 1 to 10. The ²¹Cₖ half-range sum uses symmetry (giving 2²⁰ − 1), the ¹⁰Cₖ sum is 2¹⁰ − 1.",1,"‘Sum of coefficients’ sounds close, but only half of the range is used for ²¹Cₖ, so x = 1 gives the wrong total. Symmetry ⁿCᵣ = ⁿCₙ₋ᵣ is the key."],
["‘Mean of coefficients’ is a short binomial step (total 2ᵐ divided by the number of terms). The rest, the distance of a point from a line, is coordinate geometry.",1,"‘Mean of coefficients’ resembles ‘sum of coefficients’, which tempts x = 1. That is only the first line; most of the question is the distance formula, which is why it belongs to the cross-chapter family."],
["The base is a ratio of unfamiliar expressions. x^(2/3) − x^(1/3) + 1 is the second factor of a³ + b³ with a = x^(1/3), so the fraction collapses. Simplify first.",2,"Fractional powers make you think of rational terms, but you are asked for the term independent of x. The cleanup comes before any term-hunting."],
["‘Remainder when 3²⁰²² is divided by 5’ is the remainder family. Here the power cycle 3⁴ ≡ 1 does everything.",4,"A big power can tempt a binomial-sum idea, but there is no ⁿCᵣ sum here. It is a pure cycle of powers."],
["Σ(²⁰Cₖ)² is a sum of squares of coefficients. Vandermonde gives ⁴⁰C₂₀.",1,"Sum of coefficients would be Σ²⁰Cₖ = 2²⁰. Here every coefficient is squared, so x = 1 gives the wrong total."],
["‘Integral terms’ with 3^(1/2) and 5^(1/8): r must make both exponents integers (r a multiple of 8, n − r even). Count the valid r, then find the least n.",0,"‘Least value of n’ looks like solving for n from a ratio of coefficients, but no coefficients are compared. Only a count of valid r is given."],

function analysis(i,q){const x=X[k];

const bad=i===x[1]?x[2]:`That pattern ${S[i]} None of these cues appear here.`;
return `<p class="no">Not quite. You chose “${T[i]}”.</p><p><b>Why that does not fit:</b> ${bad}</p><p><b>Why it is “${T[q[1]]}”:</b> ${x[0]}</p><p><b>That pattern ${S[q[1]]}</b></p>`}
function renderLog(){const c={Recognition:0,Concept:0,Calculation:0},m={};
log.forEach(e=>{if(c[e.w]!==undefined)c[e.w]++;if(!e.ok)m[e.p]=(m[e.p]||0)+1});
let top=Object.keys(m).sort((a,b)=>m[b]-m[a])[0];

// reorder drill answer indices to match T
