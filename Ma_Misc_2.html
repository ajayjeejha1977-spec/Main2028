&lt;h1&gt;Logarithm and Graphs &amp;mdash; Must-Remember Rules&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;The circled, cloud-boxed and starred items from the class notes, plus the method rules written beside the worked problems &amp;middot; 51 items &amp;middot; page numbers are the notebook&#x27;s own&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;button onclick=&quot;window.print()&quot;&gt;Print / Save as PDF&lt;/button&gt;&lt;/div&gt;
&lt;section&gt;&lt;h2&gt;1. Definition and domain &lt;span class=&quot;pg&quot;&gt;pp. 70-71&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle N=a^x\ \Longleftrightarrow\ \log_aN=x,\qquad a&gt;0,\ a\ne1,\ N&gt;0\quad(\text{circled});\ \ a=\text{base},\ x=\text{power/exponent}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \log_ab=\text{the power to which base }a\text{ must be raised to get }b;\quad\text{let }\log_ab=x\text{ then }a^x=b\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Log is defined for a unique value (e.g. }15=2^x\Rightarrow3&lt;x&lt;4);\quad\log_11=x\Rightarrow x\in\mathbb R\ \text{(so base 1 is not allowed)}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Domain of }\log_af(x):\ f(x)&gt;0,\ a&gt;0,\ a\ne1;\ \ \text{e.g. }\log_{(3x-4)}(x^2-2x-3)\text{ needs }x^2-2x-3&gt;0,\ 3x-4&gt;0,\ 3x-4\ne1\Rightarrow x&gt;3\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Antilog: }\operatorname{antilog}_ab=a^b\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;2. Properties &lt;span class=&quot;pg&quot;&gt;pp. 71-74&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a^{\log_ab}=b,\qquad a&gt;0,\ a\ne1,\ b&gt;0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \log_am+\log_an=\log_a(mn);\qquad\log_am-\log_an=\log_a\!\left(\tfrac mn\right);\qquad\log_am^n=n\log_am\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \log_am_1+\log_am_2+\log_am_3=\log_a(m_1m_2m_3);\qquad n_1\log_am_1-n_2\log_am_2+n_3\log_am_3+n_4\log_am_4=\log_a\!\left(\tfrac{m_1^{n_1}m_3^{n_3}m_4^{n_4}}{m_2^{n_2}}\right)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Proof habit: let }\log_am=x,\ \log_an=y\Rightarrow a^x=m,\ a^y=n\Rightarrow mn=a^{x+y}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;3. Base change theorem and consequences &lt;span class=&quot;pg&quot;&gt;p. 73&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \log_ab=\dfrac{\log_cb}{\log_ca}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;11&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (\log_ab)(\log_ba)=1\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;12&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \log_{(a^m)}b=\dfrac1m\log_ab,\ m\ne0;\qquad\log_{(a^m)}b^n=\dfrac nm\log_ab,\ m\ne0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;13&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a^{\log_bc}=c^{\log_ba}\quad(\text{proof: }\log_bc=\tfrac{\log_ac}{\log_ab})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;14&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \log N=\log_eN=\ln N\ \text{(natural log)},\ e\approx2.7\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;4. Logarithmic equations: working rules &lt;span class=&quot;pg&quot;&gt;pp. 81-85&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;15&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Always use }x&gt;0\text{ (or the argument}&gt;0)\text{ and base}&gt;0,\ne1\text{ to reject roots; e.g. }x^2+7^{\log_7x}-2=0\Rightarrow x=1\ (\text{reject }-2)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;16&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Substitute }t=\log x\text{ (or }a=\log_2(x-1)):\ \ t^2-t-2=0\ \to\ t=2,-1;\ \ \text{then use }\log_ab=x\Leftrightarrow b=a^x\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;17&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Note: }\log_a(x^2)=2\log_a|x|\text{; the left side allows }x&lt;0,\ 2\log_ax\text{ needs }x&gt;0\ \ (\text{remember }x^2=|x|^2)\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;18&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Check: }a^b=a^c\Rightarrow b=c\text{ only if }a\ne0,\pm1\text{; test }a=1,-1,0\text{ separately}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;19&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{After squaring any equation, check the roots }(4^2=16\ \not\Rightarrow\ -4=4)\quad(\text{star})\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;5. Graphs and inequalities of log and exponential &lt;span class=&quot;pg&quot;&gt;pp. 86-88&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;20&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle y=\log_ax:\ D=(0,\infty),\ R=\mathbb R,\ \text{passes through }(1,0);\ \ a&gt;1\text{ increasing},\ 0&lt;a&lt;1\text{ decreasing}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;21&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \log_ab&gt;0\text{ if }a,b\text{ are on the same side of unity};\ \ \log_ab&lt;0\text{ if on opposite sides}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;22&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle y=a^x:\ D=\mathbb R,\ R=(0,\infty),\ \text{passes through }(0,1);\ \ a&gt;1\text{ increasing},\ 0&lt;a&lt;1\text{ decreasing}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;23&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \log_ax_1&gt;\log_ax_2\ \Rightarrow\ x_1&gt;x_2&gt;0\ [a&gt;1];\ \ 0&lt;x_1&lt;x_2\ [0&lt;a&lt;1]\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;24&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle a^{x_1}&gt;a^{x_2}\ \Rightarrow\ x_1&gt;x_2\ [a&gt;1];\ \ x_1&lt;x_2\ [0&lt;a&lt;1]\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;25&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Take care of the domain of every log first (e.g. }\log_{1/3}(\log_4(x^2-5))&gt;0\Rightarrow0&lt;\log_4(x^2-5)&lt;1)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;6. Characteristic and mantissa &lt;span class=&quot;pg&quot;&gt;pp. 90, 94&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;26&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \log_ab=\text{Integer}+\text{Number in }[0,1)\ =\ \text{characteristic}+\text{mantissa}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;27&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \log_ab=-8.8952=-9+0.1048=\overline{9}.1048;\qquad-9.815=-10+0.185=\overline{10}.185\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;28&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Characteristic of }\log_ax\text{ is }k\ \Rightarrow\ k\le\log_ax&lt;k+1\ \Rightarrow\ a^k\le x&lt;a^{k+1}\ (a&gt;1)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;7. Slope, derivative and continuity &lt;span class=&quot;pg&quot;&gt;pp. 95-97&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;29&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Slope}=\tan\theta,\ \ \theta=\text{inclination}\in[0,\pi);\qquad\tan\theta=\dfrac{y_2-y_1}{x_2-x_1}\quad(\text{circled})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;30&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f&#x27;(a)=\lim_{x\to a}\dfrac{f(x)-f(a)}{x-a}=\text{slope of the tangent at }x=a=\text{instantaneous rate of change}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;31&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \lim_{\Delta x\to0}\dfrac{\Delta y}{\Delta x}=\dfrac{dy}{dx};\qquad f(x)=x^9\Rightarrow f&#x27;(a)=9a^8\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;32&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Continuous: the graph can be drawn without lifting the pen. }\log_2x\text{ is continuous in its domain; }\tan x\text{ is not}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;33&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{IVT: }f\text{ continuous},\ f(x_1)=7,\ f(x_2)=13.5\Rightarrow\exists\,c\in(x_1,x_2):f(c)=8\ (\text{every value in between is taken})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;34&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f=g\pm h\ \text{or}\ g\cdot h\ \text{or}\ \tfrac gh\ \text{is continuous if }g,h\text{ are (for division }h(x)\ne0)\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;8. Increasing, decreasing and concavity &lt;span class=&quot;pg&quot;&gt;pp. 98-100&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;35&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \dfrac{dy}{dx}=f&#x27;(x)&gt;0\Rightarrow f\text{ is (strictly) increasing},\ \theta\in\left[0,\tfrac\pi2\right);\qquad f&#x27;(x)&lt;0\Rightarrow f\text{ is decreasing},\ \text{slope}\in\left[\tfrac\pi2,\pi\right]\quad(\text{clouds})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;36&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f&#x27;&#x27;(x)=\dfrac{d}{dx}[f&#x27;(x)]=\dfrac{d^2f}{dx^2}\quad(\text{cloud})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;37&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f&#x27;&#x27;(x)&gt;0\Rightarrow\text{concave upward},\ f&#x27;\text{ increasing}\ (\theta:0^\circ\to90^\circ\text{ or }90^\circ\to180^\circ,\ \tan\theta\uparrow);\ \ \text{chord lies above the graph}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;38&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f&#x27;&#x27;(x)&lt;0\Rightarrow\text{concave downward},\ f&#x27;\text{ decreasing};\qquad f&#x27;&#x27;(x)=0\ \text{(line): slope constant}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;9. Sketching, shift of origin and symmetry &lt;span class=&quot;pg&quot;&gt;pp. 100-109&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;39&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Steps for a sketch: }(i)\ \text{domain};\ (ii)\ \text{intervals of increase/decrease};\ (iii)\ \text{concavity}\ (\text{usually concavity does not matter})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;40&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \log_2x:\ D=(0,\infty),\ f&#x27;=\tfrac1{x\ln2}&gt;0,\ f&#x27;&#x27;=-\tfrac1{x^2\ln2}&lt;0;\qquad\sec x:\ T=2\pi,\ R=(-\infty,-1]\cup[1,\infty)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;41&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \csc x:\ D=\mathbb R-\{n\pi\},\ R=(-\infty,-1]\cup[1,\infty),\ T=2\pi;\qquad\cot x:\ D=\mathbb R-\{n\pi\},\ R=\mathbb R,\ T=\pi\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;42&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f(x)=x+\tfrac1x:\ D=\mathbb R-\{0\},\ f&#x27;=\tfrac{(x-1)(x+1)}{x^2};\ \text{increasing on }(-\infty,-1],[1,\infty);\ R=(-\infty,-2]\cup[2,\infty)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;43&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \textbf{Shift of origin to }(\alpha,\beta):\ \ \alpha+X=x\Rightarrow X=x-\alpha;\quad\beta+Y=y\Rightarrow Y=y-\beta\quad(\text{circled})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;44&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sin x+\sqrt3\cos x=2\sin\!\left(x+\tfrac\pi3\right)\ \to\ Y=2\sin X,\ X=x+\tfrac\pi3;\quad\sin x+\cos x=\sqrt2\sin\!\left(x+\tfrac\pi4\right)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;45&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle y=\dfrac{3x-5}{x+2}=3-\dfrac{11}{x+2}\Rightarrow Y=-\dfrac{11}X\ \text{about }(-2,3);\ D=\mathbb R-\{-2\},\ R=\mathbb R-\{3\}\ (\text{be careful for }x=0)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;46&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f(x)=x^n,\ x\ge0:\ n&gt;1\ \ f&#x27;&gt;0,\ f&#x27;&#x27;&gt;0,\ f&#x27;(0)=0;\quad0&lt;n&lt;1\ \ f&#x27;&gt;0,\ f&#x27;&#x27;&lt;0,\ f&#x27;\to\infty\text{ as }x\to0^+;\quad n&lt;0\ \ f&#x27;&lt;0,\ f&#x27;&#x27;&gt;0\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;47&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f(x)=f(-x)\ \forall x\in D_f\ \Rightarrow\ \text{symmetric about the }y\text{-axis (even)}\quad(\text{circled})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f(x)+f(-x)=0\ \forall x\in D_f\ \Rightarrow\ \text{symmetric about the origin (odd)}\quad(\text{circled})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;49&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f(\alpha+x)=f(\alpha-x)\ \forall x\in D_f\ \Rightarrow\ \text{symmetric about the line }x=\alpha\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;50&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle f(\alpha+x)+f(\alpha-x)=2\beta\ \forall x\in D_f\ \Rightarrow\ \text{symmetric about the point }(\alpha,\beta)\quad(\text{circled})\)&lt;/span&gt;&lt;/div&gt;

  h += `&lt;table class=&quot;sm&quot;&gt;&lt;tr&gt;&lt;th&gt;Section&lt;/th&gt;&lt;th&gt;Questions&lt;/th&gt;&lt;th&gt;Correct&lt;/th&gt;&lt;th&gt;Wrong&lt;/th&gt;&lt;th&gt;Skipped&lt;/th&gt;&lt;th&gt;Marks&lt;/th&gt;&lt;th&gt;Avg time / Q&lt;/th&gt;&lt;/tr&gt;${Object.keys(per).map(s=&gt;{const p=per[s];return `&lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;${s}. ${SEC[s].name}&lt;/td&gt;&lt;td&gt;${p.n}&lt;/td&gt;&lt;td&gt;${p.c}&lt;/td&gt;&lt;td&gt;${p.w}&lt;/td&gt;&lt;td&gt;${p.s}&lt;/td&gt;&lt;td&gt;${p.sc} / ${p.mx}&lt;/td&gt;&lt;td&gt;${Math.round(p.t/p.n)} s&lt;/td&gt;&lt;/tr&gt;`}).join(&#x27;&#x27;)}&lt;/table&gt;`;
  const wk=Object.keys(weak);
  h += `&lt;h3&gt;Formulas / topics to revise&lt;/h3&gt;` + (wk.length ? `&lt;div&gt;${wk.map(t=&gt;`&lt;span class=&quot;tagpill&quot;&gt;${t} &lt;small&gt;(Q ${weak[t].join(&#x27;, &#x27;)})&lt;/small&gt;&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;` : `&lt;p&gt;Nothing &amp;mdash; every question was correct. Excellent recall!&lt;/p&gt;`);
  h += `&lt;h3&gt;Question-wise review&lt;/h3&gt;&lt;div class=&quot;filters&quot;&gt;&lt;span class=&quot;chip on&quot; data-f=&quot;all&quot;&gt;All&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;bad&quot;&gt;Wrong&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;skip&quot;&gt;Skipped&lt;/span&gt;&lt;span class=&quot;chip&quot; data-f=&quot;ok&quot;&gt;Correct&lt;/span&gt;&lt;/div&gt;&lt;div id=&quot;rl&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
  $(&#x27;#app&#x27;).innerHTML=h;
  const paint = f =&gt; {
    $(&#x27;#rl&#x27;).innerHTML = Qs.map((q,i)=&gt;{ const c=correct(i); const cls=c===null?&#x27;skip&#x27;:c?&#x27;ok&#x27;:&#x27;bad&#x27;; if(f!==&#x27;all&#x27;&amp;&amp;f!==cls) return &#x27;&#x27;;
      const yours = c===null?&#x27;&lt;i&gt;not answered&lt;/i&gt;&#x27; : q.kind===&#x27;mcq&#x27; ? `${&#x27;ABCD&#x27;[R[i].sel]}. ${M(q.opts[R[i].sel])}` : R[i].num;
      const right = q.kind===&#x27;mcq&#x27; ? `${&#x27;ABCD&#x27;[q.ans]}. ${M(q.opts[q.ans])}` : q.ans;
      return `&lt;div class=&quot;rq ${cls}&quot;&gt;&lt;div class=&quot;meta&quot;&gt;Q${i+1} &amp;middot; Section ${q.sec} &amp;middot; ${q.tag} &amp;middot; time ${Math.round(R[i].t)} s &amp;middot; ${c===null?&#x27;Skipped&#x27;:c?&#x27;Correct&#x27;:&#x27;Wrong&#x27;}&lt;/div&gt;&lt;div class=&quot;stem&quot; style=&quot;font-size:17px;margin-bottom:6px&quot;&gt;${M(q.stem)}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Your answer:&lt;/b&gt; ${yours}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Correct answer:&lt;/b&gt; ${right}&lt;/div&gt;&lt;div class=&quot;exp&quot;&gt;${M(q.exp)}&lt;/div&gt;&lt;/div&gt;`; }).join(&#x27;&#x27;);
    typeset($(&#x27;#rl&#x27;));
  };
  paint(&#x27;all&#x27;);
  document.querySelectorAll(&#x27;.chip&#x27;).forEach(c=&gt;c.onclick=()=&gt;{ document.querySelectorAll(&#x27;.chip&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;)); c.classList.add(&#x27;on&#x27;); paint(c.dataset.f); });
  window.scrollTo(0,0);
}
startScreen();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;

<script>
function active(){try{return !!document.getElementById('f2').contentWindow.__active}catch(e){return false}}
function show(n){
  if(n===1&&active()){document.getElementById('lock').hidden=false;return}
  for(const i of [1,2]){document.getElementById('f'+i).hidden=i!==n;document.getElementById('b'+i).className=i===n?'on':''}
}
