var S="<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Trigonometric Equations - Must-Remember Rules (VG Sir notes)</title>\n<script>window.MathJax={tex:{inlineMath:[['\\\\(','\\\\)']]}};<\/script>\n<script async src=\"https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js\"><\/script>\n<style>\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;margin:0;color:#1d2733;background:#f3f6fa}\n.page{max-width:1000px;margin:0 auto;padding:18px 22px 40px;background:#fff}\nh1{margin:0 0 2px;font-size:24px;color:#1a4f8b}\n.sub{color:#5a6a7e;font-size:14px;margin-bottom:14px}\nsection{break-inside:avoid;margin:16px 0}\nh2{font-size:16px;margin:0 0 6px;padding:5px 10px;background:#e7f1fd;border-left:5px solid #2a6fb5;color:#1a4f8b}\nh2 .pg{float:right;font-weight:400;font-size:12.5px;color:#5a6a7e}\n.it{display:flex;gap:10px;align-items:center;padding:5px 6px;border-bottom:1px dotted #d3dbe6;font-size:15.5px;overflow-x:auto}\n.n{min-width:26px;color:#8a97a8;font-size:12px;text-align:right}\n.notes{background:#fff8e6;border:1px solid #efd48a;border-radius:6px;padding:10px 16px;margin-top:22px;font-size:14px}\n.notes li{margin:5px 0}\n.bar{margin:10px 0 0;font-size:13px}.bar button{padding:6px 12px;font-size:13px;cursor:pointer}\n@media print{.bar{display:none}.page{padding:0}body{background:#fff}.it{font-size:14px}}\n</style></head><body><div class=\"page\">\n<h1>Trigonometric Equations &mdash; Must-Remember Rules</h1>\n<div class=\"sub\">Everything circled / cloud-boxed or starred in the class notes (VG Sir, JEE Advanced) &middot; 23 rules &middot; page references are the notebook's own page numbers</div>\n<div class=\"bar\"><button onclick=\"window.print()\">Print / Save as PDF</button></div>\n\n<section><h2>1. Principal and general solution <span class=\"pg\">p. 17</span></h2>\n<div class=\"it\"><span class=\"n\">1</span><span class=\"f\">\\(\\displaystyle \\text{Principal solution: }\\theta\\in[0,2\\pi)\\qquad\\text{General solution: }\\text{all values of }\\theta\\)</span></div>\n<div class=\"it\"><span class=\"n\">2</span><span class=\"f\">\\(\\displaystyle \\sin\\theta=\\tfrac12:\\ \\text{principal }\\tfrac\\pi6,\\tfrac{5\\pi}6;\\ \\text{general }2n\\pi+\\tfrac\\pi6,\\ 2n\\pi+\\tfrac{5\\pi}6\\ \\ \\Longleftrightarrow\\ \\ \\theta=n\\pi+(-1)^n\\tfrac\\pi6\\)</span></div>\n</section>\n\n<section><h2>2. The cloud-boxed general-solution rules (n ∈ I) <span class=\"pg\">p. 17</span></h2>\n<div class=\"it\"><span class=\"n\">3</span><span class=\"f\">\\(\\displaystyle \\sin\\theta=\\sin\\alpha\\ (\\text{same for cosec})\\ \\Rightarrow\\ \\theta=n\\pi+(-1)^n\\alpha\\)</span></div>\n<div class=\"it\"><span class=\"n\">4</span><span class=\"f\">\\(\\displaystyle \\cos\\theta=\\cos\\alpha\\ (\\text{same for sec})\\ \\Rightarrow\\ \\theta=2n\\pi\\pm\\alpha\\)</span></div>\n<div class=\"it\"><span class=\"n\">5</span><span class=\"f\">\\(\\displaystyle \\tan\\theta=\\tan\\alpha\\ (\\text{same for cot})\\ \\Rightarrow\\ \\theta=n\\pi+\\alpha\\)</span></div>\n<div class=\"it\"><span class=\"n\">6</span><span class=\"f\">\\(\\displaystyle \\sin^2\\theta=\\sin^2\\alpha,\\ \\ \\cos^2\\theta=\\cos^2\\alpha,\\ \\ \\tan^2\\theta=\\tan^2\\alpha\\ \\Rightarrow\\ \\theta=n\\pi\\pm\\alpha\\)</span></div>\n</section>\n\n<section><h2>3. Handling equations <span class=\"pg\">pp. 18-20, 24, 27</span></h2>\n<div class=\"it\"><span class=\"n\">7</span><span class=\"f\">\\(\\displaystyle \\text{Two equations together: sin repeats after }2\\pi,\\ \\tan\\text{ after }\\pi\\Rightarrow\\text{find the answer in }[0,2\\pi)\\text{ and add }2n\\pi\\)</span></div>\n<div class=\"it\"><span class=\"n\">8</span><span class=\"f\">\\(\\displaystyle \\text{Sum of squares }=0\\ \\Rightarrow\\ \\text{each square }=0\\ \\ (\\text{complete the square first})\\)</span></div>\n<div class=\"it\"><span class=\"n\">9</span><span class=\"f\">\\(\\displaystyle \\text{Check the domain: }\\cos x=-1\\Rightarrow\\sin x=0\\Rightarrow\\cot x,\\operatorname{cosec}x\\text{ undefined, reject}\\)</span></div>\n<div class=\"it\"><span class=\"n\">10</span><span class=\"f\">\\(\\displaystyle \\sin x+\\cos x=\\sqrt2\\sin\\!\\left(x+\\tfrac\\pi4\\right)\\in[-\\sqrt2,\\sqrt2]\\ \\ (\\text{so }=\\tfrac32\\text{ has no solution})\\)</span></div>\n<div class=\"it\"><span class=\"n\">11</span><span class=\"f\">\\(\\displaystyle a\\cos x+b\\sin x=c:\\ \\text{write as }R\\cos(x-\\theta),\\ R=\\sqrt{a^2+b^2}\\)</span></div>\n<div class=\"it\"><span class=\"n\">12</span><span class=\"f\">\\(\\displaystyle \\text{After squaring (esp. with a square root), put each root back; reject those making the LHS negative}\\)</span></div>\n<div class=\"it\"><span class=\"n\">13</span><span class=\"f\">\\(\\displaystyle \\cos x\\cos y=p,\\ \\sin x\\sin y=q\\Rightarrow\\cos(x-y)=p+q,\\ \\cos(x+y)=p-q\\)</span></div>\n<div class=\"it\"><span class=\"n\">14</span><span class=\"f\">\\(\\displaystyle \\cot t=\\tan\\!\\left(\\tfrac\\pi2-t\\right)\\ \\ (\\text{to turn }\\tan=\\cot\\text{ into }\\tan=\\tan)\\)</span></div>\n</section>\n\n<section><h2>4. Periodicity and counting (starred) <span class=\"pg\">pp. 22-24</span></h2>\n<div class=\"it\"><span class=\"n\">15</span><span class=\"f\">\\(\\displaystyle y=f(x)\\text{ has period }T\\ \\Rightarrow\\ y=f(ax+b)\\text{ has period }\\dfrac{T}{|a|}\\)</span></div>\n<div class=\"it\"><span class=\"n\">16</span><span class=\"f\">\\(\\displaystyle f=f_1+f_2+f_3\\text{ with periods }T_1,T_2,T_3\\ \\Rightarrow\\ \\text{common (lowest) repetition length }=\\operatorname{LCM}(T_1,T_2,T_3)\\)</span></div>\n<div class=\"it\"><span class=\"n\">17</span><span class=\"f\">\\(\\displaystyle \\text{Then find solutions in }[0,\\operatorname{LCM})\\text{ and add multiples of the LCM}\\)</span></div>\n<div class=\"it\"><span class=\"n\">18</span><span class=\"f\">\\(\\displaystyle \\cos x+\\cos2x+\\cos3x=3\\ \\Rightarrow\\ \\text{all three }=1\\ \\ (\\text{each}\\le1)\\)</span></div>\n<div class=\"it\"><span class=\"n\">19</span><span class=\"f\">\\(\\displaystyle \\sin\\alpha+\\cos\\alpha=c,\\ |c|<\\sqrt2:\\ 2\\text{ solutions in }[0,2\\pi)\\)</span></div>\n<div class=\"it\"><span class=\"n\">20</span><span class=\"f\">\\(\\displaystyle \\sin\\theta=\\pm c:\\ \\alpha,\\ \\pi-\\alpha,\\ \\pi+\\alpha,\\ 2\\pi-\\alpha\\ \\Rightarrow\\ \\text{sum }4\\pi\\)</span></div>\n</section>\n\n<section><h2>5. Identities used in the worked problems (not circled) <span class=\"pg\">pp. 20-25</span></h2>\n<div class=\"it\"><span class=\"n\">21</span><span class=\"f\">\\(\\displaystyle \\sin3\\theta=\\sin\\theta(3-4\\sin^2\\theta),\\quad3-4\\sin^2\\theta=1+2\\cos2\\theta\\)</span></div>\n<div class=\"it\"><span class=\"n\">22</span><span class=\"f\">\\(\\displaystyle 2\\sin A\\sin B=\\cos(A-B)-\\cos(A+B),\\quad2\\sin A\\cos B=\\sin(A+B)+\\sin(A-B)\\)</span></div>\n<div class=\"it\"><span class=\"n\">23</span><span class=\"f\">\\(\\displaystyle \\sin C+\\sin D=2\\sin\\tfrac{C+D}2\\cos\\tfrac{C-D}2,\\quad 2\\sin^2t=1-\\cos2t,\\quad\\sec^2t=1+\\tan^2t\\)</span></div>\n</section>\n<div class=\"notes\"><b>Small slips in the handwritten notes (as I read them) &mdash; the sheet above uses the corrected forms:</b>\n<ul>\n<li>p. 17: the first page carries no number; I counted it as 17 because the next page is 18.</li>\n<li>p. 20 Q6: the working ends with &ldquo;x = 2n&pi; &plusmn; 2&theta;&rdquo; (&theta; = 22.5&deg;). From x &minus; &theta; = 2n&pi; &plusmn; &theta; the solutions are <b>x = 2n&pi;</b> and <b>x = 2n&pi; + &pi;/4</b>.</li>\n<li>p. 24 Q5: I read the equation as <b>1 &minus; cos x = sin x</b> (the note's answer 2n&pi;, 2n&pi; + &pi;/2 only fits that). The case labels are also swapped: cos x = 1 gives x = 2n&pi;; cos x = 0 gives only 2n&pi; + &pi;/2 (3&pi;/2 fails because sin x must be 1).</li>\n<li>p. 25 Q6: the first line shows &ldquo;8 sin(3x + &pi;/4)&rdquo;; the working squares it as 2 sin, so I used <b>2 sin(3x + &pi;/4)</b>.</li>\n<li>p. 27 Q4: the note gives y = (m&minus;n)&pi; &#8723; &pi;/6. Checking x = y = &pi;/6 shows the sign must match x: <b>y = (m&minus;n)&pi; &plusmn; &pi;/6</b>.</li>\n<li>p. 21 Q8 (count in [0, &pi;]): the working stops at &ldquo;6 values&rdquo;; adding the 2 solutions from sin&theta; = 0 gives <b>8</b>.</li>\n</ul></div>\n</div></body></html>",C="<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Trigonometric Equations Recall CBT - VG Sir Notes</title>\n<script>\nwindow.MathJax = { tex: { inlineMath: [['\\\\(', '\\\\)']] }, options: { skipHtmlTags: ['script','noscript','style','textarea'] } };\n<\/script>\n<script async src=\"https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js\"><\/script>\n<style>\n:root{--blue:#1a4f8b;--blue2:#2a6fb5;--ink:#1d2733;--line:#cfd8e3;--bg:#eef2f7;--green:#2e9e4f;--red:#d9453d;--purple:#7a4bb8;--grey:#b9c3cf;--amber:#e0a100}\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:16px}\nheader{background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;gap:12px;flex-wrap:wrap}\nheader h1{font-size:17px;margin:0;font-weight:600}\n.timer{background:#fff;color:var(--blue);font-weight:700;padding:4px 12px;border-radius:4px;font-variant-numeric:tabular-nums;font-size:18px}\n.timer.low{color:var(--red)}\n.wrap{display:flex;gap:12px;padding:12px;align-items:flex-start}\n.main{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:6px}\n.side{width:290px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;position:sticky;top:8px}\n.tabs{display:flex;border-bottom:1px solid var(--line);flex-wrap:wrap}\n.tab{padding:9px 14px;cursor:pointer;font-size:14px;border-right:1px solid var(--line);background:#f6f8fb}\n.tab.on{background:var(--blue2);color:#fff;font-w ext{ pairs.}\"},{\"sec\":\"C\",\"tag\":\"p.18 Q1 smallest root\",\"kind\":\"num\",\"stem\":\"\\\\text{Smallest positive }\\\\theta\\\\text{ with }\\\\sin\\\\theta=-\\\\tfrac12\\\\text{ and }\\\\tan\\\\theta=\\\\tfrac1{\\\\sqrt3}\\\\text{ is }\\\\dfrac{k\\\\pi}6.\\\\ \\\\text{Find }k.\",\"ans\":7,\"exp\":\"\\\\theta=\\\\dfrac{7\\\\pi}6\\\\Rightarrow k=7.\"}];\nconst SEC = {A:{name:'Rules Recall',budget:60,pos:4,neg:1}, B:{name:'Class Problems (MCQ)',budget:150,pos:4,neg:1}, C:{name:'Class Problems (Numerical)',budget:180,pos:4,neg:0}};\nconst $ = s => document.querySelector(s);\nconst M = s => '\\\\(' + s + '\\\\)';\nfunction typeset(el,n){ n=n||0; if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise(el?[el]:undefined).catch(()=>{}); } else if(n<40){ setTimeout(()=>typeset(el,n+1),400); } else if(!window.__mjWarn){ window.__mjWarn=1; alert('Formula rendering (MathJax) could not load. Please connect to the internet and reload this page.'); } }\nconst fmt = s => { s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); };\n\nlet Qs=[], R=[], cur=0, secActive='A', total=0, left=0, tick=null, qStart=0, name='', mode='full';\n\nfunction startScreen(){\n  const cnt = k => DATA.filter(q=>q.sec===k).length;\n  const mins = ks => Math.round(DATA.filter(q=>ks.includes(q.sec)).reduce((s,q)=>s+SEC[q.sec].budget,0)/60);\n  $('#app').innerHTML = `\n  <header><h1>Trig. Equations Recall Test &middot; from VG Sir's class notes</h1></header>\n  <div class=\"start\">\n    <h2>Trigonometric Equations &mdash; Rules Recall &amp; Class Problems</h2>\n    <p><b>Name:</b> <input type=\"text\" id=\"nm\" placeholder=\"Candidate name\"></p>\n    <p><b>Choose test:</b></p>\n    <label class=\"m\"><input type=\"radio\" name=\"md\" value=\"full\" checked> <b>Full test</b> &mdash; ${DATA.length} questions &middot; ${mins(['A','B','C'])} min</label>\n    <label class=\"m\"><input type=\"radio\" name=\"md\" value=\"A\"> <b>Part 1: Formula Recall only</b> (the circled / boxed identities) &mdash; ${cnt('A')} questions &middot; ${mins(['A'])} min</label>\n    <label class=\"m\"><input type=\"radio\" name=\"md\" value=\"BC\"> <b>Part 2: Class Problems only</b> &mdash; ${cnt('B')} MCQ + ${cnt('C')} numerical &middot; ${mins(['B','C'])} min</label>\n    <ul>\n      <li>Section A &amp; B: single correct, <b>+4</b> correct, <b>&minus;1</b> wrong, 0 if unanswered.</li>\n      <li>Section C: type a number (tolerance &plusmn;0.01), <b>+4</b> correct, no negative marking.</li>\n      <li>Timer auto-submits. You can mark questions for review and jump through the palette.</li>\n      <li>After submitting you get a per-question review with the page reference in the notebook, and a <b>\"formulas to revise\"</b> list built from your wrong / skipped answers.</li>\n      <li>Needs internet once for MathJax (formula rendering).</li>\n    </ul>\n    <button class=\"b p\" id=\"go\" style=\"font-size:16px;padding:11px 26px\">Start Test</button>\n  </div>`;\n  $('#go').onclick = () => {\n    name = $('#nm').value.trim(); mode = document.querySelector('input[name=md]:checked').value;\n    const keep = mode==='full'?['A','B','C']:mode==='A'?['A']:['B','C'];\n    Qs = DATA.filter(q=>keep.includes(q.sec));\n    R = Qs.map(()=>({sel:null,num:'',vis:false,mark:false,t:0}));\n    total = Qs.reduce((s,q)=>s+SEC[q.sec].budget,0); left = total; cur = 0; secActive = Qs[0].sec;\n    renderExam(); go(0, true);\n    qStart = Date.now();\n    tick = setInterval(()=>{ left--; paintTimer(); if(left<=0) submit(true); },1000);\n  };\n}\nfunction paintTimer(){ const t=$('#tm'); if(!t) return; t.textContent=fmt(left); t.classList.toggle('low',left<300); }\nfunction answered(i){ const q=Qs[i],r=R[i]; return q.kind==='mcq' ? r.sel!==null : r.num.trim()!==''; }\nfunction status(i){ const r=R[i]; if(!r.vis) return ''; const a=answered(i); if(r.mark) return a?'am':'mk'; return a?'an':'na'; }\nfunction renderExam(){\n  const secs = [...new Set(Qs.map(q=>q.sec))];\n  $('#app').innerHTML = `\n  <header><h1>Trig. Equations Recall Test${name?' &middot; '+name:''}</h1><div>Time left: <span class=\"timer\" id=\"tm\">${fmt(left)}</span></div></header>\n  <div class=\"wrap\">\n    <div class=\"main\">\n      <div class=\"tabs\" id=\"tabs\">${secs.map(s=>`<div class=\"tab\" data-s=\"${s}\">${s}. ${SEC[s].name}</div>`).join('')}</div>\n      <div class=\"qhead\" id=\"qh\"></div>\n      <div class=\"qbody\" id=\"qb\"></div>\n      <div class=\"bar\">\n        <button class=\"b p\" id=\"sn\">Save &amp; Next</button>\n        <button class=\"b\" id=\"mn\" style=\"color:var(--purple);border-color:var(--purple)\">Mark for Review &amp; Next</button>\n        <button class=\"b\" id=\"cl\">Clear Response</button>\n        <span style=\"flex:1\"></span>\n        <button class=\"b\" id=\"pv\">&laquo; Back</button>\n        <button class=\"b\" id=\"nx\">Next &raquo;</button>\n      </div>\n    </div>\n    <div class=\"side\">\n      <div class=\"secsum\" id=\"ss\"></div>\n      <div class=\"pal\" id=\"pal\"></div>\n      <div class=\"legend\">\n        <span><i style=\"background:var(--grey)\">&nbsp;</i>Not visited</span><span><i style=\"background:var(--red)\">&nbsp;</i>Not answered</span>\n        <span><i style=\"background:var(--green)\">&nbsp;</i>Answered</span><span><i style=\"background:var(--purple)\">&nbsp;</i>Marked</span>\n      </div>\n      <p style=\"text-align:center;margin:14px 0 4px\"><button class=\"b g\" id=\"sub\" style=\"width:100%;padding:11px\">Submit Test</button></p>\n    </div>\n  </div>`;\n  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ const i=Qs.findIndex(q=>q.sec===t.dataset.s); go(i); });\n  $('#sn').onclick=()=>{ nextAfter(); };\n  $('#mn').onclick=()=>{ R[cur].mark=true; nextAfter(true); };\n  $('#cl').onclick=()=>{ R[cur].sel=null; R[cur].num=''; paintQ(); paintPal(); };\n  $('#pv').onclick=()=>go(Math.max(0,cur-1));\n  $('#nx').onclick=()=>go(Math.min(Qs.length-1,cur+1));\n  $('#sub').onclick=confirmSubmit;\n}\nfunction nextAfter(){ if(cur<Qs.length-1) go(cur+1); else { paintQ(); paintPal(); } }\nfunction go(i, first){\n  if(!first){ R[cur].t += (Date.now()-qStart)/1000; }\n  cur=i; qStart=Date.now(); R[cur].vis=true; secActive=Qs[cur].sec; paintQ(); paintPal();\n}\nfunction paintQ(){\n  const q=Qs[cur], r=R[cur], S=SEC[q.sec];\n  const idxInSec = Qs.filter(x=>x.sec===q.sec).indexOf(q)+1, nSec = Qs.filter(x=>x.sec===q.sec).length;\n  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.s===q.sec));\n  $('#qh').innerHTML = `<span><b>Question ${cur+1}</b> of ${Qs.length} &nbsp;|&nbsp; ${q.sec}${idxInSec}/${nSec}</span><span>Marks: <b style=\"color:var(--green)\">+${S.pos}</b> / <b style=\"color:var(--red)\">&minus;${S.neg}</b></span>`;\n  let h = `<div class=\"stem\">${M(q.stem)}</div>`;\n  if(q.kind==='mcq'){\n    h += q.opts.map((o,k)=>`<div class=\"opt ${r.sel===k?'sel':''}\" data-k=\"${k}\"><span class=\"L\">${'ABCD'[k]}.</span><span>${M(o)}</span></div>`).join('');\n  } else {\n    h += `<div class=\"numbox\"><div><input class=\"numin\" id=\"ni\" value=\"${r.num}\" inputmode=\"decimal\" placeholder=\"Enter answer\"><div style=\"font-size:12px;color:#667;margin-top:4px\">Type the numerical value (e.g. 16 or 0.5)</div></div>\n    <div class=\"keys\">${['7','8','9','4','5','6','1','2','3','0','.','-'].map(k=>`<button data-k=\"${k}\">${k}</button>`).join('')}<button data-k=\"bk\" style=\"grid-column:span 2\">&larr; Backspace</button><button data-k=\"cl\">Clear</button></div></div>`;\n  }\n  $('#qb').innerHTML = h;\n  if(q.kind==='mcq') document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ r.sel=(r.sel===+o.dataset.k)?null:+o.dataset.k; paintQ(); paintPal(); });\n  else {\n    const ni=$('#ni'); ni.oninput=()=>{ r.num=ni.value; paintPal(); };\n    document.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(k==='bk') r.num=r.num.slice(0,-1); else if(k==='cl') r.num=''; else r.num+=k; ni.value=r.num; paintPal(); });\n  }\n  $('#pv').disabled = cur===0; $('#nx').disabled = cur===Qs.length-1;\n  typeset($('#qb'));\n}\nfunction paintPal(){\n  const secs=[...new Set(Qs.map(q=>q.sec))];\n  $('#ss').innerHTML = secs.map(s=>{ const ids=Qs.map((q,i)=>q.sec===s?i:-1).filter(i=>i>=0); return `<b>${s}</b>: ${ids.filter(answered).length}/${ids.length} answered`; }).join(' &middot; ');\n  const ids = Qs.map((q,i)=>i).filter(i=>Qs[i].sec===secActive);\n  let n=0, base = Qs.findIndex(q=>q.sec===secActive);\n  $('#pal').innerHTML = ids.map((i,j)=>`<button class=\"${status(i)} ${i===cur?'cur':''}\" data-i=\"${i}\">${j+1}</button>`).join('');\n  document.querySelectorAll('#pal button').forEach(b=>b.onclick=()=>go(+b.dataset.i));\n}\nfunction confirmSubmit(){\n  const secs=[...new Set(Qs.map(q=>q.sec))];\n  const rows = secs.map(s=>{ const ids=Qs.map((q,i)=>q.sec===s?i:-1).filter(i=>i>=0); const a=ids.filter(answered).length, mk=ids.filter(i=>R[i].mark).length; return `<tr><td>${s}</td><td>${ids.length}</td><td>${a}</td><td>${ids.length-a}</td><td>${mk}</td></tr>`; }).join('');\n  const d=document.createElement('div'); d.className='modal'; d.innerHTML=`<div class=\"box\"><h3 style=\"margin-top:0\">Submit test?</h3>\n  <table class=\"sm\"><tr><th>Section</th><th>Questions</th><th>Answered</th><th>Not answered</th><th>Marked</th></tr>${rows}</table>\n  <p style=\"font-size:14px\">Time left: <b>${fmt(left)}</b>. You cannot change answers after submitting.</p>\n  <div style=\"display:flex;gap:10px;justify-content:flex-end\"><button class=\"b\" id=\"no\">Go back</button><button class=\"b g\" id=\"yes\">Yes, submit</button></div></div>`;\n  document.body.appendChild(d); $('#no').onclick=()=>d.remove(); $('#yes').onclick=()=>{ d.remove(); submit(false); };\n}\nfunction correct(i){ const q=Qs[i],r=R[i]; if(!answered(i)) return null; if(q.kind==='mcq') return r.sel===q.ans; const v=parseFloat(r.num); return isFinite(v) && Math.abs(v-q.ans) <= 0.01; }\nfunction submit(auto){\n  clearInterval(tick); R[cur].t += (Date.now()-qStart)/1000;\n  const used = total-left;\n  const per = {}; let score=0, max=0, cor=0, wr=0, sk=0;\n  Qs.forEach((q,i)=>{ const S=SEC[q.sec]; per[q.sec]=per[q.sec]||{n:0,c:0,w:0,s:0,sc:0,mx:0,t:0}; const p=per[q.sec]; p.n++; p.mx+=S.pos; max+=S.pos; p.t+=R[i].t;\n    const c=correct(i); if(c===null){p.s++;sk++;} else if(c){p.c++;cor++;p.sc+=S.pos;score+=S.pos;} else {p.w++;wr++;p.sc-=S.neg;score-=S.neg;} });\n  const attempted=cor+wr;\n  const weak = {}; Qs.forEach((q,i)=>{ if(correct(i)!==true){ (weak[q.tag]=weak[q.tag]||[]).push(i+1); } });\n  let h = `<header><h1>Result &middot; Trig. Equations Recall Test${name?' &middot; '+name:''}</h1><div class=\"noprint\"><button class=\"b\" onclick=\"window.print()\">Print / Save PDF</button> <button class=\"b\" onclick=\"location.reload()\">Take again</button></div></header><div class=\"res\">`;\n  h += `<div class=\"cards\"><div class=\"card\"><div>Score</div><div class=\"v\">${score} / ${max}</div></div><div class=\"card\"><div>Accuracy</div><div class=\"v\">${attempted?Math.round(100*cor/attempted):0}%</div><div style=\"font-size:12px\">${cor} correct of ${attempted} attempted</div></div><div class=\"card\"><div>Correct / Wrong / Skipped</div><div class=\"v\"><span style=\"color:var(--green)\">${cor}</span> / <span style=\"color:var(--red)\">${wr}</span> / <span style=\"color:var(--amber)\">${sk}</span></div></div><div class=\"card\"><div>Time used</div><div class=\"v\">${fmt(used)}</div>${auto?'<div style=\"font-size:12px\">auto-submitted</div>':''}</div></div>`;\n  h += `<table class=\"sm\"><tr><th>Section</th><th>Questions</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Marks</th><th>Avg time / Q</th></tr>${Object.keys(per).map(s=>{const p=per[s];return `<tr><td style=\"text-align:left\">${s}. ${SEC[s].name}</td><td>${p.n}</td><td>${p.c}</td><td>${p.w}</td><td>${p.s}</td><td>${p.sc} / ${p.mx}</td><td>${Math.round(p.t/p.n)} s</td></tr>`}).join('')}</table>`;\n  const wk=Object.keys(weak);\n  h += `<h3>Formulas / topics to revise</h3>` + (wk.length ? `<div>${wk.map(t=>`<span class=\"tagpill\">${t} <small>(Q ${weak[t].join(', ')})</small></span>`).join('')}</div>` : `<p>Nothing &mdash; every question was correct. Excellent recall!</p>`);\n  h += `<h3>Question-wise review</h3><div class=\"filters\"><span class=\"chip on\" data-f=\"all\">All</span><span class=\"chip\" data-f=\"bad\">Wrong</span><span class=\"chip\" data-f=\"skip\">Skipped</span><span class=\"chip\" data-f=\"ok\">Correct</span></div><div id=\"rl\"></div></div>`;\n  $('#app').innerHTML=h;\n  const paint = f => {\n    $('#rl').innerHTML = Qs.map((q,i)=>{ const c=correct(i); const cls=c===null?'skip':c?'ok':'bad'; if(f!=='all'&&f!==cls) return '';\n      const yours = c===null?'<i>not answered</i>' : q.kind==='mcq' ? `${'ABCD'[R[i].sel]}. ${M(q.opts[R[i].sel])}` : R[i].num;\n      const right = q.kind==='mcq' ? `${'ABCD'[q.ans]}. ${M(q.opts[q.ans])}` : q.ans;\n      return `<div class=\"rq ${cls}\"><div class=\"meta\">Q${i+1} &middot; Section ${q.sec} &middot; ${q.tag} &middot; time ${Math.round(R[i].t)} s &middot; ${c===null?'Skipped':c?'Correct':'Wrong'}</div><div class=\"stem\" style=\"font-size:17px;margin-bottom:6px\">${M(q.stem)}</div><div class=\"ans\"><b>Your answer:</b> ${yours}</div><div class=\"ans\"><b>Correct answer:</b> ${right}</div><div class=\"exp\">${M(q.exp)}</div></div>`; }).join('');\n    typeset($('#rl'));\n  };\n  paint('all');\n  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on'); paint(c.dataset.f); });\n  window.scrollTo(0,0);\n}\nstartScreen();\n<\/script>\n</body>\n</html>\n";
document.getElementById('f1').srcdoc=S;document.getElementById('f2').srcdoc=C;
function sw(a){['1','2'].forEach(function(k){document.getElementById('b'+k).classList.toggle('on',k==a);document.getElementById('f'+k).classList.toggle('on',k==a);});}
