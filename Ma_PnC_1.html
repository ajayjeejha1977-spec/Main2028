&lt;h1&gt;Permutation &amp;amp; Combination &amp;mdash; Must-Remember Sheet&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;Every formula, concept and technique from the class notes &amp;middot; 136 points in 23 topics &amp;middot; page references are the notebook&#x27;s own page numbers (pp. 7&amp;ndash;53)&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;button onclick=&quot;window.print()&quot;&gt;Print / Save as PDF&lt;/button&gt;&lt;/div&gt;
&lt;section&gt;&lt;h2&gt;1. Fundamental principle of counting &lt;span class=&quot;pg&quot;&gt;pp. 7-9&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle w_1:\ m\text{ ways},\ w_2:\ n\text{ ways}\ \Rightarrow\ \text{both in a definite order}=m\times n\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Both works in any order}=(w_1,w_2)+(w_2,w_1)=mn+nm=2mn\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;AND &amp;rarr; multiply&lt;/b&gt; &amp;nbsp;|&amp;nbsp; &lt;b&gt;OR &amp;rarr; add&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{3 events }A,B,C\ (m_1,m_2,m_3\text{ ways}):\ \text{definite order}=m_1m_2m_3;\ \ \text{any order}=3!\,m_1m_2m_3=6m_1m_2m_3\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle n\text{ events}\ (m_1,\dots,m_n):\ \text{definite order}=m_1m_2\cdots m_n;\ \ \text{any order}=n!\,(m_1m_2\cdots m_n)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Number of orders of }n\text{ events}=n(n-1)(n-2)\cdots2\cdot1=n!\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Doors: any door \(5\times5\); different doors \(5\times4\); restricted (enter via 3 doors, exit via 2) \(3\times2\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Transport A&amp;rarr;B&amp;rarr;C, &lt;b&gt;any mode&lt;/b&gt;: add the modes on each leg, then multiply: \((5+4+4)(4+3+2)=13\times9\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Different modes&lt;/b&gt; on the two legs: \(5(3+2)+4(4+2)+4(4+3)=77\) (fix leg-1 mode, then leg-2 modes except the same one). Round trip A&amp;rarr;C&amp;rarr;A with different modes in each direction: \(77\times77\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle 10\text{ True/False questions}=2\cdot2\cdots2=2^{10};\qquad r\text{ different letters into }b\text{ boxes}=b^{r}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;11&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Technique (pp. 12):&lt;/b&gt; always think with respect to &lt;i&gt;what is limited&lt;/i&gt; (letters are limited &amp;rArr; each letter has 3 box-choices; for &#x27;G always included&#x27; the positions are limited &amp;rArr; G has 4 positions).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;2. Words, rank in dictionary, position conditions &lt;span class=&quot;pg&quot;&gt;pp. 10-12&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;12&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Words using all letters of an }n\text{-letter word with distinct letters}=n!\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;13&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Rank technique:&lt;/b&gt; write letters alphabetically (E F I K N). Words starting with each smaller letter: \(3\times4!=72\) (E, F, I); then fix K: KE, KF, KI \(=3\times3!=18\); then KN: KNE, KNF \(=2\times2!=4\); then KNIE.. \(=1\). Words before KNIFE \(=95\) &amp;rArr; &lt;b&gt;rank \(=96\)&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;14&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Vowels in specified positions: MACHINE (7 letters, vowels A, I, E): &lt;b&gt;odd positions&lt;/b&gt; \(4\cdot3\cdot2\cdot4!\); &lt;b&gt;even positions&lt;/b&gt; \(3\cdot2\cdot1\cdot4!\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;15&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;4-letter words from DAUGHTER with G always included: \(4\times7\cdot6\cdot5=840\). &lt;b&gt;M-2 (complement):&lt;/b&gt; no condition \(8\cdot7\cdot6\cdot5\) &amp;minus; not containing G \(7\cdot6\cdot5\cdot4\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;3. Exponent of a prime in N! &lt;span class=&quot;pg&quot;&gt;p. 13&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;16&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle N!=p_1^{a_1}p_2^{a_2}\cdots p_m^{a_m},\quad a_i=\left[\tfrac{N}{p_i}\right]+\left[\tfrac{N}{p_i^2}\right]+\left[\tfrac{N}{p_i^3}\right]+\cdots\ \ (\text{till it becomes }0;\ [\,]=\text{greatest integer})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;17&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle 100!=2^{m_1}3^{m_2}\cdots:\ m_1=50+25+12+6+3+1=97\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;18&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;303! = \(9^m K\):&lt;/b&gt; exponent of 3 \(=101+33+11+3+1=149\); \(3^{149}K=3^{148}\cdot3K=9^{74}\cdot(3K)\) and \(3K\) is also a natural number &amp;rArr; largest \(m=74\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;4. Permutation (order matters) &lt;span class=&quot;pg&quot;&gt;pp. 14-15&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;19&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle {}^nP_n=P(n,n)=n!\ \ (n\text{ boys in }n\text{ seats: }n\cdot(n-1)\cdots2\cdot1)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;20&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle {}^nP_r=P(n,r)=\dfrac{n!}{(n-r)!},\quad 0\le r\le n\ \ (r\text{ seats},\ n\text{ boys: }n(n-1)\cdots(n-r+1))\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;21&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r\text{ seats},\ n\text{ boys},\ r\gt n:\ {}^rP_n=\dfrac{r!}{(r-n)!}\ \ (n\text{ is limited})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;22&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Think with respect to the seat as if it is limited (fill each seat, &#x27;AND&#x27; &amp;rarr; multiply).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;5. Combination (order does not matter) &lt;span class=&quot;pg&quot;&gt;pp. 15-17&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;23&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Combination = number of collections / selections of objects (alike or distinct), taken some or all at a time; &lt;b&gt;order of occurrence is insignificant&lt;/b&gt; (B&lt;sub&gt;1&lt;/sub&gt;B&lt;sub&gt;2&lt;/sub&gt;B&lt;sub&gt;3&lt;/sub&gt; and B&lt;sub&gt;1&lt;/sub&gt;B&lt;sub&gt;3&lt;/sub&gt;B&lt;sub&gt;2&lt;/sub&gt; are the same group).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;24&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle {}^nC_r=C(n,r)=\dfrac{n!}{r!\,(n-r)!},\quad 0\le r\le n;\qquad {}^nC_n=1\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;25&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r!\;{}^nC_r={}^nP_r=\dfrac{n!}{(n-r)!}\ \ (\text{select, then arrange the }r\text{ chosen in }r!\text{ ways})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;26&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle {}^8C_4=\dfrac{8!}{4!\,4!}=70\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;27&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Pascal&#x27;s mirror: }{}^nC_r={}^nC_{n-r}\quad(\text{selecting }r\text{ boys}\equiv\text{leaving }n-r\text{ out})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;28&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Pascal&#x27;s triangle: }{}^nC_r={}^{n-1}C_r+{}^{n-1}C_{r-1}\quad(B_1\text{ not there / }B_1\text{ is there})\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;6. Counting with geometry (collinear points) &lt;span class=&quot;pg&quot;&gt;pp. 17, 23&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;29&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;10 points on a semicircle: 4 on the diameter (collinear), 6 on the arc. &lt;b&gt;Lines:&lt;/b&gt; \(^{10}C_2-{}^4C_2+1=40\) (collinear points give just 1 line). M-2: \(1+{}^4C_1{}^6C_1+{}^6C_2\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;30&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Triangles:&lt;/b&gt; \(^{10}C_3-{}^4C_3=116\). M-2: \(^4C_2{}^6C_1+{}^4C_1{}^6C_2+{}^6C_3\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;31&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Quadrilaterals:&lt;/b&gt; \(^{10}C_4-1-{}^4C_3\cdot{}^6C_1=185\) (remove 4-collinear and 3-from-line cases). M-2: \(^4C_2{}^6C_2+{}^4C_1{}^6C_3+{}^6C_4\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;32&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Maximum intersections&lt;/b&gt; of 8 lines and 6 circles (every two circles meet in 2 points, circle&amp;ndash;line 2 points, two lines 1 point): \(^6C_2\cdot2+{}^8C_1{}^6C_1\cdot2+{}^8C_2\cdot1=154\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;7. Together / separated &amp;mdash; glue and gap method &lt;span class=&quot;pg&quot;&gt;pp. 17-19&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;33&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Together:&lt;/b&gt; glue the objects into one block, arrange blocks, then arrange inside the block. &lt;b&gt;Never together:&lt;/b&gt; Total &amp;minus; (ways they are together).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;34&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;7 colours of rainbow, blue &amp;amp; green not together: \(7!-6!\times2!=3600\) (treat BG as 1 &amp;rArr; 6 objects; BG or GB). &lt;i&gt;If in doubt, think about 3 objects.&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;35&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Gap method&lt;/b&gt; (use when objects must be separated): arrange the others first (\(5!\)), the gaps are for B &amp;amp; G: select 2 of 6 gaps and arrange them: \(5!\;{}^6C_2\times2!=3600\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;36&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Together: }n\text{ objects, }k\text{ of them together}\Rightarrow(n-k+1)!\;k!\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;8. Selection followed by arrangement &lt;span class=&quot;pg&quot;&gt;pp. 18-19&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;37&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Words with 3 consonants and 2 vowels beginning with a consonant, from 10 different consonants &amp;amp; 4 different vowels: select \(^{10}C_3\,{}^4C_2\), fill the first place with a selected consonant (3 ways), arrange the other 4: \(^{10}C_3{}^4C_2\times3\times4!=51840\). &lt;b&gt;M-2:&lt;/b&gt; \(10\times{}^9C_2\,{}^4C_2\times4!\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;38&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Grandfather with 7 grandchildren, 3 at a time, never the same 3 again: grandfather goes \(^7C_3=35\) times; each child goes \(^6C_2=15\) times (fix the child, select 2 more of the other 6).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;9. Boys and girls in a line &lt;span class=&quot;pg&quot;&gt;pp. 19-21&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;39&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;4 boys + 4 girls in a line. &lt;b&gt;(i) No two girls together:&lt;/b&gt; arrange boys \(4!\), girls in the 5 gaps \(^5C_4\cdot4!\) &amp;rArr; \(4!\times{}^5C_4\times4!=2880\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;40&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(ii) Not all girls together:&lt;/b&gt; \(8!-5!\times4!=37440\) (all girls together: treat as 1 object &amp;rArr; 5 objects, girls arranged \(4!\)).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;41&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(iii) Alternate:&lt;/b&gt; \((4!\times4!)\times2=1152\) (2 ways: boy first / girl first).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;42&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(iv) Alternate and a particular boy &amp;amp; girl never adjacent:&lt;/b&gt; \(2\cdot4!\,4!-(2\cdot3!\,3!)\times7=648\) (make the rest alternate, the pair B&lt;sub&gt;3&lt;/sub&gt;G&lt;sub&gt;2&lt;/sub&gt; can sit together in 7 ways; its order is decided by the alternation).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;43&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(v) 4 married couples, each couple together:&lt;/b&gt; 1 couple = 1 object &amp;rArr; \(4!\,(2!)^4=384\) (each pair can interchange).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;10. Non-consecutive selection, order restrictions &lt;span class=&quot;pg&quot;&gt;p. 21&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;44&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Train with 12 stations, stop at 4, no two stopping stations consecutive: 8 non-stopping stations create 9 gaps; choose 4: \(^9C_4=126\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;45&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Choose }k\text{ non-adjacent from }n\text{ in a row}={}^{n-k+1}C_k\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;46&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Cricket (11 players): A bats before J and J bats after G &amp;rArr; G, A before J: select 3 places \(^{11}C_3\), arrange in 2 ways (J last of the three), others \(8!\): \(^{11}C_3\times2\times8!=13305600\). &lt;b&gt;M-2 (unitary):&lt;/b&gt; \(\dfrac{11!}{3!}\times2\) (3! orders reduced to 2).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;47&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle k\text{ particular persons in a fixed relative order}\Rightarrow\dfrac{n!}{k!}\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;11. n persons in r seats (r &amp;lt; n) &lt;span class=&quot;pg&quot;&gt;pp. 22-23&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;48&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{(i) } s\text{ particular persons always present: }{}^{n-s}C_{r-s}\;r!\quad\text{or}\quad{}^rP_s\times{}^{n-s}P_{r-s}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;49&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{(ii) } s\text{ particular persons together: }{}^{n-s}C_{r-s}\,(r-s+1)!\;s!\ \ (\text{treat }P_1P_2\cdots P_s\text{ as one person})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;50&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{(iii) } s\text{ together in a definite order: }{}^{n-s}C_{r-s}\,(r-s+1)!\ \ (\text{no need of arrangement of }s)\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;12. Group formation (dividing distinct objects) &lt;span class=&quot;pg&quot;&gt;pp. 23-25&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;51&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle m+n\text{ distinct objects into groups of }m\text{ and }n\ (m\ne n)={}^{m+n}C_m=\dfrac{(m+n)!}{m!\,n!}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;52&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle 2m\text{ distinct objects into 2 equal groups}=\dfrac{{}^{2m}C_m}{2}=\dfrac{(2m)!}{2\,m!\,m!}\ \ (T_1..T_m\,|\,T_{m+1}..T_{2m}\text{ and its swap are the same})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;53&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle m+n+p\text{ distinct (all different) into groups }m,n,p=\dfrac{(m+n+p)!}{m!\,n!\,p!}\ \ \text{(also true if }m=n+p)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;54&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{General: }m_1\ne m_2\ne\cdots\ne m_k\Rightarrow\dfrac{(m_1+\cdots+m_k)!}{m_1!\,m_2!\cdots m_k!}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;55&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle 3m\text{ distinct objects into 3 equal groups}=\dfrac{(3m)!}{3!\,(m!)^3}\ \ (\text{same groups counted }3!=6\text{ times})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;56&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Equal-size groups &amp;rArr; divide by (number of such groups)!&lt;/b&gt; to stop interchange. 16 objects as 3,3,2,2,2,4: \(\dfrac{16!}{3!3!\,2!2!2!\,4!\;\cdot\,2!\,3!}=252252000\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;57&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Divide, then give to named persons &amp;rArr; multiply by (groups)!&lt;/b&gt; 22 people into India/Pakistan teams of 11: \(\dfrac{22!}{11!11!2!}\times2!=\dfrac{22!}{11!11!}\). 10 distinct chocolates equally to 5 boys: \(\dfrac{10!}{(2!)^55!}\times5!=\dfrac{10!}{(2!)^5}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;58&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Matches: 6 men, every pair plays every other pair: 1 match = 2 pairs = 4 people \(^6C_4\times3=45\) (4 people give 3 matches). M-2: pairs \(\dfrac{6!}{(2!)^33!}=15\), choose 2 pairs: \(^3C_2\) matches each.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;13. Inclusion&amp;ndash;Exclusion Principle (V. Imp.) &lt;span class=&quot;pg&quot;&gt;pp. 25-26&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;59&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle n(A\cup B)=n(A)+n(B)-n(A\cap B)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;60&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle n(A\cup B\cup C)=n(A)+n(B)+n(C)-[n(A\cap B)+n(B\cap C)+n(C\cap A)]+n(A\cap B\cap C)\quad(\text{Venn diagram})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;61&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle n(A_1\cup A_2\cup\cdots\cup A_m)=S_1-S_2+S_3-S_4+\cdots+(-1)^{m-1}S_m\quad(\text{elements belonging to at least one set})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;62&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle S_1=\sum n(A_i),\ \ S_2=\sum_{i\lt j}n(A_i\cap A_j)\ (\text{gives }{}^mC_2\text{ terms}),\ \ S_3=\sum_{i\lt j\lt k}n(A_i\cap A_j\cap A_k),\ \dots\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;63&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Use:&lt;/b&gt; &#x27;at least one / none of the conditions&#x27; &amp;rArr; Total &amp;minus; n(A &amp;cup; B &amp;cup; ...) where A, B, ... are the &lt;i&gt;bad&lt;/i&gt; events.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;14. Distribution of distinct objects &lt;span class=&quot;pg&quot;&gt;pp. 27-28&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;64&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;6 different books among 3 boys, each at least one: cases (4,1,1), (3,2,1), (2,2,2): \(\dfrac{6!}{1!1!4!2!}\times3!+\dfrac{6!}{1!2!3!}\times3!+\dfrac{6!}{(2!)^33!}\times3!=90+360+90=540\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;65&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;M-2 (inclusion&amp;ndash;exclusion):&lt;/b&gt; \(3^6-n(A\cup B\cup C)\), A = boy 1 gets none: \(S_1={}^3C_1\,2^6\), \(S_2={}^3C_2\,1^6\), \(n(A\cap B\cap C)=0\) &amp;rArr; \(729-192+3=540\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;66&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle n\text{ distinct objects to 3 persons, each at least one}=3^n-3\cdot2^n+3\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;67&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Wrong concept (M-3):&lt;/b&gt; \(^6P_3\times3^3\) (give 3 books first, then distribute the rest) is &lt;u&gt;wrong&lt;/u&gt;: the first 3 books are chosen in order, so the same distribution is counted many times.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;15. Card distribution &lt;span class=&quot;pg&quot;&gt;p. 28&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;68&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;13 cards to each of 4 players from 52. &lt;b&gt;(i) A, K, Q, J of the same suit:&lt;/b&gt; give the 4 same-suit sets to 4 players \(4!\), distribute remaining 36 \(\dfrac{36!}{(9!)^4}\): \(4!\times\dfrac{36!}{(9!)^44!}\times4!=4!\,\dfrac{36!}{(9!)^4}\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;69&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(ii) A, K, Q, J of any suit&lt;/b&gt; (each player gets one of each): \((4!)^4\times\dfrac{36!}{(9!)^4}\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;16. Permutation of alike objects (all at a time) &lt;span class=&quot;pg&quot;&gt;pp. 29-33&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;70&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Arrangements of }n\text{ objects, }p\text{ alike of one kind, }q\text{ of another, }r\text{ of another}=\dfrac{n!}{p!\,q!\,r!}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;71&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Reason (DADDY): \(D_1AD_2D_3Y\), \(D_1AD_3D_2Y\)... are different when treated as distinct &amp;rArr; every word counted \(3!\) times &amp;rArr; \(\dfrac{5!}{3!}=20\). ABBA \(=\dfrac{4!}{2!2!}=6\). MAHABHARAT \(=\dfrac{10!}{4!\,2!}=75600\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;72&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Alike objects separated (gap method):&lt;/b&gt; 21 white &amp;amp; 19 black balls, black never together: place white (1 way), 22 gaps, select 19: \(^{22}C_{19}\times1=1540\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;73&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;ASSASSINATION&lt;/b&gt; (A&amp;times;3, S&amp;times;4, I&amp;times;2, N&amp;times;2, T, O; 13 letters): &lt;b&gt;(i) no two vowels consecutive:&lt;/b&gt; consonants \(\dfrac{7!}{4!2!}\) &amp;times; 8 gaps \(^8C_6\) &amp;times; vowels \(\dfrac{6!}{3!2!}\) \(=176400\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;74&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(ii) S&#x27;s separated:&lt;/b&gt; other 9 letters \(\dfrac{9!}{3!2!2!}\) &amp;times; 10 gaps \(^{10}C_4\) \(=3175200\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;75&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(iii) order of vowels unchanged (AAIAIO):&lt;/b&gt; select 6 places \(^{13}C_6\times1\times\dfrac{7!}{4!2!}=180180\). &lt;b&gt;M-2:&lt;/b&gt; \(\dfrac{13!}{6!\,4!\,2!}\) (vowels treated like alike: interchange not allowed, just like the 4 S&#x27;s).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;76&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(iv) at least one S separated from the rest:&lt;/b&gt; Total &amp;minus; all S together \(=\dfrac{13!}{3!\,4!\,2!\,2!}-\dfrac{10!}{3!\,2!\,2!}=10659600\) (4 S&#x27;s = 1 object).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;77&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(v) positions of each vowel fixed:&lt;/b&gt; just arrange consonants \(\dfrac{7!}{4!2!}=105\). &lt;b&gt;(vi) relative order of vowels and consonants unchanged&lt;/b&gt; (a vowel place always holds some vowel): \(\dfrac{6!}{3!2!}\times\dfrac{7!}{4!2!}=6300\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;78&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Digits &amp;amp; divisibility by 5:&lt;/b&gt; 7-digit numbers from 2,3,0,3,4,2,5: total \(6\times\dfrac{6!}{2!2!}=1080\) (0 not first). Divisible by 5: ends with 0: \(\dfrac{6!}{2!2!}=180\); ends with 5: \(5\times\dfrac{5!}{2!2!}=150\) (worry for 0 at first) &amp;rArr; \(330\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;79&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;HONOLULU&lt;/b&gt; (O,U,L twice; H,N once) no two alike letters together: Total \(\dfrac{8!}{2!2!2!}\) &amp;minus; \(n(A\cup B\cup C)\) (A=OO together, ...): \(S_1=\dfrac{7!}{2!2!}{}^3C_1\), \(S_2=\dfrac{6!}{2!}{}^3C_2\), \(S_3=5!\) &amp;rArr; \(5040-(3780-1080+120)=2220\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;80&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;7-digit numbers with digit sum 59:&lt;/b&gt; seven 9&#x27;s = 63, so at most six 9&#x27;s. Cases (deficit 4): 9&lt;sup&gt;6&lt;/sup&gt;5 \(\to\dfrac{7!}{6!}\); 9&lt;sup&gt;5&lt;/sup&gt;86 \(\to\dfrac{7!}{5!}\); 9&lt;sup&gt;5&lt;/sup&gt;77 \(\to\dfrac{7!}{5!2!}\); 9&lt;sup&gt;4&lt;/sup&gt;887 \(\to\dfrac{7!}{4!2!}\); 9&lt;sup&gt;3&lt;/sup&gt;8&lt;sup&gt;4&lt;/sup&gt; \(\to\dfrac{7!}{3!4!}\) &amp;rArr; \(7+42+21+105+35=210\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;81&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Divisible by 11 (odd-place sum &amp;minus; even-place sum = multiple of 11):&lt;/b&gt; 59 = O + E, O &amp;minus; E = 11 &amp;rArr; O = 35 (4 places), E = 24 (3 places). Check each case: 99999 86 (even {9,9,6}) \(\to\dfrac{4!}{3!}\cdot\dfrac{3!}{2!}=12\); 9&lt;sup&gt;4&lt;/sup&gt;887 (even {9,8,7}) \(\to\dfrac{4!}{3!}\cdot3!=24\); 9&lt;sup&gt;3&lt;/sup&gt;8&lt;sup&gt;4&lt;/sup&gt; (even {8,8,8}) \(\to\dfrac{4!}{3!}\cdot1=4\) &amp;rArr; \(40\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;17. Alike objects, taken some at a time &lt;span class=&quot;pg&quot;&gt;pp. 34-36&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;82&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Method:&lt;/b&gt; split into cases by the pattern of alike/different letters; for each case first &lt;i&gt;select&lt;/i&gt;, then &lt;i&gt;arrange&lt;/i&gt; (&amp;divide; factorials of repeats).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;83&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;INDEPENDENCE&lt;/b&gt; (I, N&amp;times;3, D&amp;times;2, E&amp;times;4, P, C), 5 letters. Cases (selection | arrangement): 4 alike+1 diff \(1\cdot{}^5C_1\,|\,5\cdot\tfrac{5!}{4!}\); 3 alike+2 other alike \(2\cdot2\,|\,\tfrac{5!}{3!2!}\); 3 alike+2 diff \(2\cdot{}^5C_2\,|\,\tfrac{5!}{3!}\); 2 alike+2 other alike+1 diff \(^3C_2\cdot{}^4C_1\,|\,\tfrac{5!}{2!2!}\); 2 alike+3 diff \(^3C_1{}^5C_3\,|\,\tfrac{5!}{2!}\); 5 diff \(^6C_5\,|\,5!\). Totals: &lt;b&gt;77 selections, 3345 words&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;84&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;MISSISSIPPI&lt;/b&gt; (M, I&amp;times;4, S&amp;times;4, P&amp;times;2), 5 letters: cases 4A+1D, 3A+2 other A (none: only two types have &amp;ge;3 ... check), 3A+2D, 2A+2A+1D, 2A+3D, ... Totals: &lt;b&gt;25 selections, 550 words&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;85&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;4-digit numbers from digits 1,1,2,3,4,0: case 2 alike + 2 diff: \(1\times{}^4C_2\times\tfrac{4!}{2!}\) minus those beginning with 0 \(1\times{}^3C_1\times\tfrac{3!}{2!}\); plus other cases (all 4 different: 5 digits, 0 not first) &amp;rArr; &lt;b&gt;159&lt;/b&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;86&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;INTEGRATION&lt;/b&gt; (I&amp;times;2, N&amp;times;2, T&amp;times;2, E, G, R, A, O): 6-letter words with 3 vowels &amp;amp; 3 consonants: vowels (I,I,E,A,O) in 3 places \(=9+24=33\); consonants (N,N,T,T,G,R) in 3 places \(=18+24=42\); interleave \(^6C_3\) &amp;rArr; \(42\times33\times{}^6C_3=27720\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;87&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;6-digit numbers where each digit appears at least twice&lt;/b&gt; (pp. 36, 43): cases 6 alike \(\to9\); 4+2: \(^{10}C_1{}^9C_1\tfrac{6!}{4!2!}-\big({}^9C_1\tfrac{5!}{3!2!}+{}^9C_1\tfrac{5!}{4!}\big)\); 3+3: \(^{10}C_2\tfrac{6!}{3!3!}-{}^9C_1\tfrac{5!}{2!3!}\); 2+2+2: \(^{10}C_3\tfrac{6!}{2!2!2!}-{}^9C_2\tfrac{5!}{2!2!}\) (subtract numbers starting with 0). Total \(9+1215+810+9720=11754\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;18. Circular permutations &lt;span class=&quot;pg&quot;&gt;pp. 36-39&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;88&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle n\text{ distinct objects, all at a time: clockwise}\ne\text{anticlockwise}\Rightarrow(n-1)!;\ \ \text{not distinguished (garland, necklace)}\Rightarrow\dfrac{(n-1)!}{2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;89&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r\text{ out of }n\text{ at a time: distinguishing }{}^nC_r\,(r-1)!;\ \ \text{not distinguishing }\dfrac{{}^nC_r\,(r-1)!}{2}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;90&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Reason: seat the first person (1 way, all seats then become identifiable) &amp;rArr; &lt;b&gt;1 &amp;times; (n&amp;minus;1)!&lt;/b&gt;. Mirror arrangements (1-2-3-4 clockwise vs anticlockwise) are two different answers in (n&amp;minus;1)!, hence the &amp;divide;2.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;91&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;7 Americans &amp;amp; 7 Britishers on a round table, no two Americans consecutive: Britishers \(6!\), 7 gaps for Americans \(7!\) &amp;rArr; \(6!\times7!=3628800\) (clockwise &amp;ne; anticlockwise).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;92&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;8 persons on a round table, no two arrangements with the same neighbours: not distinguishing \(\dfrac{7!}{2}=2520\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;93&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Garlands of 6 flowers from 10 different colours: \(\dfrac{{}^{10}C_6\times5!}{2}=12600\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;94&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;5 boys &amp;amp; 5 girls alternately on a circle, particular boy &amp;amp; girl never adjacent: Total \(4!\times5!-4!\times2\times4!\) (B&lt;sub&gt;1&lt;/sub&gt;G&lt;sub&gt;1&lt;/sub&gt; together) or \(4!\times3\times4!=1728\) (G&lt;sub&gt;1&lt;/sub&gt; has 3 allowed seats, remaining girls \(4!\)).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;95&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Select 3 of n people on a circle, no two consecutive:&lt;/b&gt; \(^nC_3-n-n(n-4)=\dfrac{n(n-4)(n-5)}{6}\) (3 consecutive: n, exactly 2 consecutive: \(n(n-4)\)).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;96&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;M-2:&lt;/b&gt; select 1 person (\(n\)), then 2 from the \(n-3\) remaining, not consecutive (gap method): \(^{n-4}C_2\); each selection counted 3 times &amp;rArr; \(\dfrac{n\cdot{}^{n-4}C_2}{3}\). &lt;b&gt;M-1:&lt;/b&gt; treat circle as a row: \(^{n-2}C_3-{}^{n-4}C_1\) (if positions 1 and n are both selected they are neighbours in the circle).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;97&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Hexagons from a 15-gon with none of its sides on the polygon:&lt;/b&gt; pick 1 vertex \(^{15}C_1\), 5 more using the 8 gaps \(^8C_5\), divide by 6 &amp;rArr; \(\dfrac{15\times{}^8C_5}{6}=140\). &lt;b&gt;M-2:&lt;/b&gt; \(^{10}C_6-{}^8C_4\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;98&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Same nationality separated on a circle&lt;/b&gt; (2 American, 2 British, 2 Chinese, Dutch, Egyptian, French, German = 10 people): \(9!-n(A\cup B\cup C)\); AA together: 9 objects \(\to8!\,2!\); AA &amp;amp; BB: \(7!\,2!2!\); all three: \(6!\,2!2!2!\) &amp;rArr; \(9!-(3\cdot8!\,2!-3\cdot7!\,2!2!+6!\,2!2!2!)=175680\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;19. Divisors of N &lt;span class=&quot;pg&quot;&gt;pp. 40-43&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;99&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;N = 75600 = \(2^4\,3^3\,5^2\,7\). Divisor \(=2^a3^b5^c7^d\): \(a\in0..4,\ b\in0..3,\ c\in0..2,\ d\in0..1\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;100&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle N=p_1^{a_1}\cdots p_m^{a_m}:\ \text{number of divisors}=(a_1+1)(a_2+1)\cdots(a_m+1)=5\cdot4\cdot3\cdot2=120\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;101&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Proper divisors&lt;/b&gt; (excluding N, as in the note) \(=120-1=119\). &lt;b&gt;Odd divisors:&lt;/b&gt; \(1\times4\times3\times2=24\) (only \(2^0\)). &lt;b&gt;Even divisors:&lt;/b&gt; \(4\times4\times3\times2=96\) (exclude \(2^0\)). &lt;b&gt;Divisible by 10:&lt;/b&gt; \(4\times4\times2\times2=64\) (exclude \(2^0\) and \(5^0\)).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;102&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Sum of all divisors}=(2^0+\cdots+2^4)(3^0+\cdots+3^3)(5^0+5^1+5^2)(7^0+7^1)=31\times40\times31\times8=307520\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;103&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Sum of proper divisors \(=307520-75600\). Odd divisors sum \(=(3^0+..+3^3)(5^0+5^1+5^2)(7^0+7^1)=9920\). Even \(=(2^1+..+2^4)(\cdots)\). Divisible by 10: \((2+4+8+16)(1+3+9+27)(5+25)(1+7)=288000\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;104&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;N as a product of two divisors&lt;/b&gt; (N = d &amp;times; N/d): every answer counted twice &amp;rArr; \(\dfrac{120}{2}=60\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;105&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle N\text{ not a perfect square: }\dfrac{(a_1+1)\cdots(a_m+1)}{2};\qquad N\text{ perfect square: }\dfrac{(a_1+1)\cdots(a_m+1)+1}{2}\ \ (\sqrt N\times\sqrt N\text{ counted once})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;106&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;In a perfect square every power is even &amp;rArr; number of divisors is odd; if not a perfect square some power is odd &amp;rArr; number of divisors is even.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;107&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Two divisors that are relatively prime (HCF}=1):\ \dfrac{2^m}{2}=2^{m-1}\ \ (\text{each prime power goes wholly to one divisor});\ 75600:\ \dfrac{2^4}{2}=8\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;20. Sum of numbers formed by digits &lt;span class=&quot;pg&quot;&gt;pp. 44-46&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;108&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Write \(a_5a_4a_3a_2a_1=a_5\!\cdot\!10^4+a_4\!\cdot\!10^3+\cdots+a_1\!\cdot\!10^0\). Target one place: each digit appears in that place \(4!\) times.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;109&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{All 5-digit numbers from 5 distinct digits (all used):}\ (\Sigma\text{digits})\cdot4!\cdot(10^0+10^1+10^2+10^3+10^4)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;110&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Digits 1,3,5,7,9: \(25\times24\times11111=6666600\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;111&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Digits include 0:&lt;/b&gt; do not bother about 0: \(x=(0+2+4+6+8)\,4!\,(11111)\); then subtract numbers beginning with 0: \(y=(2+4+6+8)\,3!\,(1111)\); answer \(x-y=5199960\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;112&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Sum of distinct 4-digit numbers from digits 1&amp;ndash;5 (each at most once):&lt;/b&gt; each digit appears in each place \(^4C_3\times3!\) times \(=24\): \(4\,(1+2+3+4+5)\,3!\,(1111)=399960\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;113&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Sum of numbers using all of 2,3,3,4,4,4:&lt;/b&gt; per place: digit 2 appears \(\tfrac{5!}{2!3!}\), digit 3 \(\tfrac{5!}{3!}\) (each), digit 4 \(\tfrac{5!}{2!2!}\): \(\big(3\cdot\tfrac{5!}{3!}+2\cdot\tfrac{5!}{2!3!}+4\cdot\tfrac{5!}{2!2!}\big)=200\); sum \(=200\times111111=22222200\).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;21. Derangements &lt;span class=&quot;pg&quot;&gt;pp. 46-48&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;114&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;To place n letters in n addressed envelopes so that &lt;b&gt;every&lt;/b&gt; letter is wrongly placed: Total &amp;minus; at least one correct. A&lt;sub&gt;i&lt;/sub&gt; = L&lt;sub&gt;i&lt;/sub&gt; correctly placed; need n(A&lt;sub&gt;1&lt;/sub&gt; &amp;cup; ... &amp;cup; A&lt;sub&gt;n&lt;/sub&gt;) &amp;mdash; inclusion&amp;ndash;exclusion.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;115&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle D_n=n!-\Big[(n-1)!\,{}^nC_1-(n-2)!\,{}^nC_2+(n-3)!\,{}^nC_3-\cdots\Big]=n!\Big[\dfrac1{2!}-\dfrac1{3!}+\dfrac1{4!}-\dfrac1{5!}+\cdots+\dfrac{(-1)^n}{n!}\Big]\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;116&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle D_2=1,\ D_3=2,\ D_4=9,\ D_5=44,\ D_6=265\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;117&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \text{Exactly }r\text{ correct among }n:\ {}^nC_r\,D_{n-r}\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;118&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Match the column (6 to 6): &lt;b&gt;(i) at least 4 wrong:&lt;/b&gt; \(^6C_4D_4+{}^6C_5D_5\cdot1\text{(5 wrong: one correct, }{}^6C_1D_5)+D_6\); the note writes \(^6C_4D_4+{}^6C_5D_5+D_6=135+264+265=664\). &lt;b&gt;M-2:&lt;/b&gt; \(6!-(0\text{ wrong}+1+2+3\text{ wrong})=720-(1+0+15+40)=664\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;119&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;(ii) at most 4 correct:&lt;/b&gt; \(6!-(5\text{ correct}+6\text{ correct})=720-(0+1)=719\) (5 correct is impossible).&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;22. Grid paths (shortest route) &lt;span class=&quot;pg&quot;&gt;p. 48&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;120&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle (0,0)\to(a,b)\text{ moving only right/up: }{}^{a+b}C_a;\ \ (0,0)\to(6,6):\ {}^{12}C_6=924\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;121&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Blocked points&lt;/b&gt; A(4,2) and B(4,4): \(924-n(A\cup B)\); \(n(A)={}^6C_2\cdot{}^6C_2\) (2H 4V after A), \(n(B)={}^8C_4\cdot{}^4C_2\), \(n(A\cap B)={}^6C_2\cdot1\cdot{}^4C_2\) &amp;rArr; \(924-(225+420-90)=369\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;122&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Shortest path = never turn back, always go forward; the path consists of H and V steps arranged in a row.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;23. Distribution of alike objects (stars and bars) &lt;span class=&quot;pg&quot;&gt;pp. 49-53&lt;/span&gt;&lt;/h2&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;123&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle n\text{ alike objects over }p\text{ persons (any may get none)}={}^{n+p-1}C_{p-1}\quad(\text{add }p-1\text{ identical sticks})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;124&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle x_1+x_2+x_3=6,\ x_i\ge0:\ {}^{6+2}C_2=28\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;125&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle n\text{ alike over }p\text{ persons, each at least 1}={}^{(n-p)+(p-1)}C_{p-1}={}^{n-1}C_{p-1}\ \ (\text{gap method: }n-1\text{ gaps, select }p-1)\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;126&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;30 marks to 8 questions, at least 2 each: \(30-16+7\) &amp;rArr; \(^{21}C_7=116280\). Natural-number solutions of \(x+y+z=102\): \(^{101}C_2=5050\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;127&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Inequality \(x+y+z+t\le30\)&lt;/b&gt; (non-negative): introduce slack \(w\): \(x+y+z+t+w=30\Rightarrow{}^{30+4}C_4={}^{34}C_4=46376\). Or add \(\sum_{s=0}^{30}{}^{s+3}C_3\) using Pascal (hockey stick).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;128&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;\(21\lt x+y+z+t\le30\):&lt;/b&gt; \(\sum_{s=22}^{30}{}^{s+3}C_3={}^{34}C_4-{}^{25}C_4=33726\). M-2: \((\le30)-(\le21)\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;129&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle \sum_{s=0}^{n}{}^{s+k}C_k={}^{n+k+1}C_{k+1}\quad(\text{Pascal / hockey stick})\)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;130&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Unlimited red, white, blue, green balls: select 10: \(^{10+3}C_3=286\); all 4 colours at least one: \(^{(10-4)+3}C_3=84\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;131&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;10 varieties of ice-cream (identical within a variety), choose 4: any \(^{4+9}C_9=715\); at least 2 of the same variety \(^{13}C_9-{}^{10}C_4=505\). &lt;b&gt;M-2 cases:&lt;/b&gt; 4A \(^{10}C_1\); 3A+1D \(^{10}C_1{}^9C_1\); 2A+2A \(^{10}C_2\); 2A+2D \(^{10}C_1{}^9C_2\); 4D \(^{10}C_4\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;132&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;2 apples, 3 oranges, 4 mangoes to 3 children (none/one/more, same fruit alike): \(^{2+2}C_2\times{}^{3+2}C_2\times{}^{4+2}C_2=6\times10\times15=900\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;133&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;Triplets \((x,y,z)\) natural with \(x+y+z=30\) and \(x\lt y\lt z\): total \(^{30-3+2}C_2=406\); subtract all equal (1) and exactly two equal (13 cases &amp;times; 3 positions \(=39\)); each remaining counted \(3!\) times: \(\dfrac{406-1-39}{3!}=61\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;134&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;4 alike apples &amp;amp; 4 alike bananas to 6 children, each at least one fruit: (3,1,1,1,1,1) and (2,2,1,1,1,1) patterns, treat children as places. &lt;b&gt;Inclusion&amp;ndash;exclusion:&lt;/b&gt; \(^{4+5}C_5{}^2-[\ ^6C_1(^{4+4}C_4)^2-{}^6C_2(^{4+3}C_3)^2+\cdots]=720\). Case count: \(180+540=720\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;135&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;&lt;b&gt;Combination with repetition:&lt;/b&gt; choose 6 stars from 8 brands: 6 stars + 7 walls = 13 places, choose positions of the stars \(^{13}C_6=1716\).&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;n&quot;&gt;136&lt;/span&gt;&lt;span class=&quot;f&quot;&gt;\(\displaystyle r\text{ objects from }n\text{ varieties (repetition allowed)}={}^{n+r-1}C_r\)&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;&lt;div class=&quot;notes&quot;&gt;&lt;b&gt;Small slips / conventions in the handwritten notes (as I read them) &amp;mdash; the sheet above uses the corrected forms:&lt;/b&gt;&lt;ul&gt;&lt;li&gt;p. 11 (MACHINE): the first answers 540 / 80 are crossed out; the working that stands is &lt;b&gt;4&amp;middot;3&amp;middot;2&amp;middot;4! = 576&lt;/b&gt; (odd) and &lt;b&gt;3&amp;middot;2&amp;middot;1&amp;middot;4! = 144&lt;/b&gt; (even).&lt;/li&gt;&lt;li&gt;p. 30 ASSASSINATION (ii): the 9 other letters are A&amp;times;3, I&amp;times;2, N&amp;times;2, so the denominator is &lt;b&gt;3!&amp;middot;2!&amp;middot;2!&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;p. 41: the &#x27;even divisors&#x27; and &#x27;divisible by 10&#x27; sums show a 2&lt;sup&gt;5&lt;/sup&gt; term; the powers of 2 stop at &lt;b&gt;2&lt;sup&gt;4&lt;/sup&gt;&lt;/b&gt; (75600 = 2&lt;sup&gt;4&lt;/sup&gt;&amp;middot;3&lt;sup&gt;3&lt;/sup&gt;&amp;middot;5&lt;sup&gt;2&lt;/sup&gt;&amp;middot;7).&lt;/li&gt;&lt;li&gt;p. 50-51: &#x27;C&lt;sub&gt;4&lt;/sub&gt;&#x27; with 84 on top reads as &lt;b&gt;&lt;sup&gt;34&lt;/sup&gt;C&lt;sub&gt;4&lt;/sub&gt; &amp;minus; &lt;sup&gt;25&lt;/sup&gt;C&lt;sub&gt;4&lt;/sub&gt;&lt;/b&gt; (set up as x+y+z+t+w = 30).&lt;/li&gt;&lt;li&gt;p. 40: &#x27;proper divisors = 120 &amp;minus; 1&#x27; follows the note&#x27;s convention (exclude N only); many books also exclude 1, giving 118.&lt;/li&gt;&lt;li&gt;p. 25: in the 16-object grouping the final &#x27;&amp;times;2!&amp;times;3!&#x27; belongs in the &lt;b&gt;denominator&lt;/b&gt; (stop interchange of equal-size groups).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>

.wrap{display:flex;gap:12px;padding:12px;align-items:flex-start}
.main{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:6px}
.side{width:290px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;position:sticky;top:8px}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:9px 14px;cursor:pointer;font-size:14px;border-right:1px solid var(--line);background:#f6f8fb}
.tab.on{background:var(--blue2);color:#fff;font-weight:600}
.qhead{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;color:#46566a;flex-wrap:wrap;gap:6px}
.qhead b{color:var(--ink)}
.qbody{padding:18px 20px;min-height:260px}
.stem{font-size:19px;line-height:1.9;margin-bottom:16px;overflow-x:auto}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin:8px 0;cursor:pointer;font-size:18px;overflow-x:auto}
.opt:hover{background:#f3f8ff}
.opt.sel{border-color:var(--blue2);background:#e7f1fd}
.opt .L{font-weight:700;min-width:22px;color:var(--blue)}
.numbox{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.numin{font-size:22px;padding:8px 10px;width:210px;border:2px solid var(--blue2);border-radius:6px;text-align:right}
.keys{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
.keys button{height:44px;font-size:18px;border:1px solid var(--line);background:#f6f8fb;border-radius:5px;cursor:pointer}
.keys button:hover{background:#e7f1fd}
.bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;background:#fafbfd}
button.b{padding:9px 14px;border:1px solid var(--blue2);background:#fff;color:var(--blue);border-radius:5px;cursor:pointer;font-size:14px;font-weight:600}
button.b.p{background:var(--blue2);color:#fff}
button.b.g{background:var(--green);border-color:var(--green);color:#fff}
button.b.r{background:var(--red);border-color:var(--red);color:#fff}
button.b:disabled{opacity:.45;cursor:default}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0;max-height:46vh;overflow:auto;padding:2px}
.pal button{height:38px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;background:var(--grey);position:relative}
.pal button.na{background:var(--red)} .pal button.an{background:var(--green)} .pal button.mk{background:var(--purple)} .pal button.am{background:var(--purple)}
.pal button.am::after{content:&quot;&quot;;position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;background:#5ee07e;border:1px solid #fff}
.pal button.cur{outline:3px solid var(--amber)}
.legend{font-size:12.5px;display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;margin-top:6px}
.legend span i{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:5px;color:#fff;font-style:normal;margin-right:5px;font-size:12px}
.secsum{font-size:13px;color:#46566a;margin:4px 0 6px}
.start{max-width:760px;margin:26px auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px 28px}
.start h2{margin-top:0;color:var(--blue)}
.start label.m{display:block;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0;cursor:pointer}
.start label.m:has(input:checked){border-color:var(--blue2);background:#e7f1fd}
.start input[type=text]{padding:8px 10px;font-size:16px;border:1px solid var(--line);border-radius:5px;width:260px}
.start ul{line-height:1.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
.modal .box{background:#fff;border-radius:8px;padding:20px 24px;max-width:480px;width:92%}
table.sm{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
table.sm th,table.sm td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.sm th{background:#f1f5fa}
.res{max-width:1000px;margin:14px auto;padding:0 12px 40px}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.card{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card .v{font-size:26px;font-weight:700;color:var(--blue)}
.rq{background:#fff;border:1px solid var(--line);border-left:6px solid var(--grey);border-radius:6px;padding:12px 16px;margin:10px 0}
.rq.ok{border-left-color:var(--green)} .rq.bad{border-left-color:var(--red)} .rq.skip{border-left-color:var(--amber)}
.rq .meta{font-size:12.5px;color:#5a6a7e;margin-bottom:4px}
.rq .ans{font-size:15px;margin:6px 0}
.rq .exp{background:#f4f8fd;border-radius:5px;padding:8px 10px;font-size:15px;margin-top:6px;overflow-x:auto}
.filters{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.chip{padding:6px 12px;border:1px solid var(--blue2);border-radius:20px;cursor:pointer;font-size:14px;color:var(--blue);background:#fff}
.chip.on{background:var(--blue2);color:#fff}
.tagpill{display:inline-block;background:#fff3d6;border:1px solid #efd48a;border-radius:14px;padding:3px 10px;margin:3px;font-size:13.5px}
@media (max-width:860px){.wrap{flex-direction:column}.side{width:100%;position:static}}
@media print{header,.filters,.noprint{display:none!important}.rq{break-inside:avoid}}

m_3\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;\\(\\displaystyle 3!=6\\text{ orders.}\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.8 n events&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle n\\text{ events in }m_1,\\dots,m_n\\text{ ways, in any order}=\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle n\\,(m_1m_2\\cdots m_n)\\)&quot;, &quot;\\(\\displaystyle (n-1)!\\,(m_1m_2\\cdots m_n)\\)&quot;, &quot;\\(\\displaystyle m_1m_2\\cdots m_n\\)&quot;, &quot;\\(\\displaystyle n!\\,(m_1m_2\\cdots m_n)\\)&quot;], &quot;ans&quot;: 3, &quot;exp&quot;: &quot;\\(\\displaystyle \\text{Number of orders}=n!\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.14 Permutation&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle {}^nP_n=\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle n^n\\)&quot;, &quot;\\(\\displaystyle n!\\)&quot;, &quot;\\(\\displaystyle n\\)&quot;, &quot;\\(\\displaystyle (n-1)!\\)&quot;], &quot;ans&quot;: 1, &quot;exp&quot;: &quot;\\(\\displaystyle n(n-1)\\cdots2\\cdot1\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.14 Permutation&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle {}^nP_r=\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle \\dfrac{n!}{(n-r)!}\\)&quot;, &quot;\\(\\displaystyle \\dfrac{(n-r)!}{n!}\\)&quot;, &quot;\\(\\displaystyle \\dfrac{n!}{r!}\\)&quot;, &quot;\\(\\displaystyle \\dfrac{n!}{r!(n-r)!}\\)&quot;], &quot;ans&quot;: 0, &quot;exp&quot;: &quot;\\(\\displaystyle n(n-1)\\cdots(n-r+1)=\\dfrac{n!}{(n-r)!}\\)&quot;}, {&quot;sec&quot;: &quot;A&quot;, &quot;tag&quot;: &quot;p.15 Permutation&quot;, &quot;kind&quot;: &quot;mcq&quot;, &quot;stem&quot;: &quot;\\(\\displaystyle r\\text{ seats, }n\\text{ boys, }r\\gt n:\\ {}^rP_n=\\)&quot;, &quot;opts&quot;: [&quot;\\(\\displaystyle \\dfrac{r!}{(n-r)!}\\)&quot;, &quot;\\(\\displaystyle \\dfrac{n!}{(r-n)!}\\)&quot;, &q function paintTimer(){ const t=$(&#x27;#tm&#x27;); if(!t) return; t.textContent=fmt(left); t.classList.toggle(&#x27;low&#x27;,left&lt;300); }

function status(i){ const r=R[i]; if(!r.vis) return &#x27;&#x27;; const a=answered(i); if(r.mark) return a?&#x27;am&#x27;:&#x27;mk&#x27;; return a?&#x27;an&#x27;:&#x27;na&#x27;; }

function nextAfter(){ if(cur&lt;Qs.length-1) go(cur+1); else { paintQ(); paintPal(); } }
function go(i, first){

function paintQ(){

  } else {

    &lt;div class=&quot;keys&quot;&gt;${[&#x27;7&#x27;,&#x27;8&#x27;,&#x27;9&#x27;,&#x27;4&#x27;,&#x27;5&#x27;,&#x27;6&#x27;,&#x27;1&#x27;,&#x27;2&#x27;,&#x27;3&#x27;,&#x27;0&#x27;,&#x27;.&#x27;,&#x27;-&#x27;].map(k=&gt;`&lt;button data-k=&quot;${k}&quot;&gt;${k}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;button data-k=&quot;bk&quot; style=&quot;grid-column:span 2&quot;&gt;&amp;larr; Backspace&lt;/button&gt;&lt;button data-k=&quot;cl&quot;&gt;Clear&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;

function correct(i){ const q=Qs[i],r=R[i]; if(!answered(i)) return null; if(q.kind===&#x27;mcq&#x27;) return r.sel===q.ans; const v=parseFloat(r.num); return isFinite(v) &amp;&amp; Math.abs(v-q.ans) &lt;= 0.01; }

  const paint = f =&gt; {
    $(&#x27;#rl&#x27;).innerHTML = Qs.map((q,i)=&gt;{ const c=correct(i); const cls=c===null?&#x27;skip&#x27;:c?&#x27;ok&#x27;:&#x27;bad&#x27;; if(f!==&#x27;all&#x27;&amp;&amp;f!==cls) return &#x27;&#x27;;

      return `&lt;div class=&quot;rq ${cls}&quot;&gt;&lt;div class=&quot;meta&quot;&gt;Q${i+1} &amp;middot; Section ${q.sec} &amp;middot; ${q.tag} &amp;middot; time ${Math.round(R[i].t)} s &amp;middot; ${c===null?&#x27;Skipped&#x27;:c?&#x27;Correct&#x27;:&#x27;Wrong&#x27;}&lt;/div&gt;&lt;div class=&quot;stem&quot; style=&quot;font-size:17px;margin-bottom:6px&quot;&gt;${M(q.stem)}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Your answer:&lt;/b&gt; ${yours}&lt;/div&gt;&lt;div class=&quot;ans&quot;&gt;&lt;b&gt;Correct answer:&lt;/b&gt; ${right}&lt;/div&gt;&lt;div class=&quot;exp&quot;&gt;${M(q.exp)}&lt;/div&gt;&lt;/div&gt;`; }).join(&#x27;&#x27;);
    typeset($(&#x27;#rl&#x27;));
